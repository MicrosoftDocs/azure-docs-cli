### YamlMime:AzureCLIGroup
uid: az_koreai_artemis_organization_workspace_saas
name: az koreai artemis organization workspace saas
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **koreai-artemis** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az koreai artemis organization workspace saas** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage SaaS marketplace resources linked to a Kore.ai Artemis workspace.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'az koreai artemis organization workspace' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_koreai_artemis_organization_workspace_saas_link
  name: az koreai artemis organization workspace saas link
  summary: |-
    Links SaaS resources to the workspace. Accepts the full list of SaaS assets to be linked.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'az koreai artemis organization workspace saas' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az koreai artemis organization workspace saas link --saas-resource-ids
                                                       [--acquire-policy-token]
                                                       [--change-reference]
                                                       [--ids]
                                                       [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                                       [--organization-name]
                                                       [--resource-group]
                                                       [--subscription]
                                                       [--workspace-name]
  examples:
  - summary: |-
      Workspaces_LinkSaaS
    syntax: az koreai artemis organization workspace saas link --resource-group contoso-rg --organization-name contoso-org --workspace-name contoso-prod --saas-resource-ids "[/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/contoso-rg/providers/Microsoft.SaaS/resources/kore-ai-saas-1,/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/contoso-rg/providers/Microsoft.SaaS/resources/kore-ai-saas-2]"
  requiredParameters:
  - isRequired: true
    name: --saas-resource-ids
    summary: |-
      ARM resource IDs of the Microsoft.SaaS marketplace resources to link to this Workspace.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Body Arguments
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --ids
    summary: |-
      One or more resource IDs (space-delimited). It should be a complete resource ID containing all information of 'Resource Id' arguments. You should provide either --ids or other 'Resource Id' arguments.
    groupName: Resource Id Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --organization-name
    summary: |-
      Name of the Organization.
    groupName: Resource Id Arguments
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
    groupName: Resource Id Arguments
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
    groupName: Resource Id Arguments
  - name: --workspace-name
    summary: |-
      Name of the Workspace.
    groupName: Resource Id Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_koreai_artemis_organization_workspace_saas_list
  name: az koreai artemis organization workspace saas list
  summary: |-
    Returns the list of SaaS resources linked to the workspace.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'az koreai artemis organization workspace saas' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az koreai artemis organization workspace saas list --organization-name
                                                       --resource-group
                                                       --workspace-name
  examples:
  - summary: |-
      Workspaces_ListLinkedSaaS
    syntax: az koreai artemis organization workspace saas list --resource-group contoso-rg --organization-name contoso-org --workspace-name contoso-prod
  requiredParameters:
  - isRequired: true
    name: --organization-name
    summary: |-
      Name of the Organization.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --workspace-name
    summary: |-
      Name of the Workspace.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_koreai_artemis_organization_workspace_saas_link
- az_koreai_artemis_organization_workspace_saas_list
metadata:
  description: Manage SaaS marketplace resources linked to a Kore.ai Artemis workspace.
