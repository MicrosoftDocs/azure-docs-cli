### YamlMime:AzureCLIGroup
uid: az_koreai_artemis_organization_workspace
name: az koreai artemis organization workspace
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **koreai-artemis** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az koreai artemis organization workspace** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Kore.ai Artemis workspaces.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'az koreai artemis organization' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_koreai_artemis_organization_workspace_create
  name: az koreai artemis organization workspace create
  summary: |-
    Create a Workspace under an Organization (long-running).
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'az koreai artemis organization workspace' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az koreai artemis organization workspace create --name --workspace-name
                                                    --organization-name
                                                    --resource-group
                                                    [--acquire-policy-token]
                                                    [--change-reference]
                                                    [--marketplace-details]
                                                    [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                                    [--partner-properties]
                                                    [--product {aiforservice, aiforwork}]
  examples:
  - summary: |-
      Workspaces_CreateOrUpdate
    syntax: az koreai artemis organization workspace create --resource-group contoso-rg --organization-name contoso-org --workspace-name contoso-prod --product aiforwork --partner-properties "{name:'Contoso Production',owner-email:owner@contoso.com}" --marketplace-details "[{offer-details:{offer-id:kore-ai-platform,plan-id:business-monthly,publisher-id:kore-ai,plan-name:'Business Monthly',term-id:1m,term-unit:P1M},saas-resource-id:/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/contoso-rg/providers/Microsoft.SaaS/resources/kore-ai-saas}]"
  requiredParameters:
  - isRequired: true
    name: --name --workspace-name -n
    summary: |-
      Name of the Workspace.
  - isRequired: true
    name: --organization-name
    summary: |-
      Name of the Organization.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --marketplace-details
    summary: |-
      Azure Marketplace SaaS subscriptions linked to this Workspace. At least one entry is required. Mutable to support Marketplace-driven plan changes.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --partner-properties
    summary: |-
      Partner-specific (Kore) Workspace properties.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --product
    acceptedValues: aiforservice, aiforwork
    summary: |-
      Marketplace product selected for this Workspace.
    groupName: Properties Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
