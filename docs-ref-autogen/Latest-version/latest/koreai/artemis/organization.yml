uid: az_koreai_artemis_organization
name: az koreai artemis organization
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **koreai-artemis** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az koreai artemis organization** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Kore.ai Artemis organizations.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'az koreai artemis' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
