directCommands:
- uid: az_koreai_artemis_organization_create
  name: az koreai artemis organization create
  summary: |-
    Create an Organization (long-running).
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'az koreai artemis organization' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az koreai artemis organization create --name --organization-name
                                          --resource-group
                                          [--acquire-policy-token]
                                          [--change-reference]
                                          [--company-details]
                                          [--location]
                                          [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                          [--partner-properties]
                                          [--tags]
                                          [--user]
  examples:
  - summary: |-
      Organizations_Create
    syntax: az koreai artemis organization create --resource-group contoso-rg --organization-name contoso-org --location eastus2euap --tags "{environment:production}" --partner-properties "{organization-name:'Contoso AI Platform',billing-email:billing@contoso.com,owner-email:admin@contoso.com,default-workspace:{name:'my first workspace',product:aiforwork,marketplace-details:[{offer-details:{offer-id:kore-ai-platform,plan-id:business-monthly,publisher-id:kore-ai,plan-name:'Business Monthly',term-id:1m,term-unit:P1M},saas-resource-id:/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/contoso-rg/providers/Microsoft.SaaS/resources/kore-ai-saas}]}}" --user "{first-name:Jane,last-name:Doe,email-address:jane.doe@contoso.com,upn:jane.doe@contoso.onmicrosoft.com,phone-number:+1-425-555-0100}" --company-details "{company-name:'Contoso Ltd.',country:US,domain:contoso.com,business-type:Technology,number-of-employees:500}"
  requiredParameters:
  - isRequired: true
    name: --name --organization-name -n
    summary: |-
      Name of the Organization.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --company-details
    summary: |-
      Organization-tier company metadata.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --location -l
    summary: |-
      The geo-location where the resource lives  When not specified, the location of the resource group will be used.
    groupName: Resource Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --partner-properties
    summary: |-
      Partner-specific (Kore) Organization properties.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --tags
    summary: |-
      Resource tags.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Resource Arguments
  - name: --user
    summary: |-
      Azure customer profile metadata used by the partner for JIT provisioning.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_koreai_artemis_organization_delete
  name: az koreai artemis organization delete
  summary: |-
    Delete a Kore.ai organization.
  description: |-
