### YamlMime:AzureCLIGroup
uid: az_koreai_artemis_saas
name: az koreai artemis saas
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **koreai-artemis** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az koreai artemis saas** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Kore.ai Artemis SaaS marketplace resources.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'az koreai artemis' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_koreai_artemis_saas_activate
  name: az koreai artemis saas activate
  summary: |-
    Activate a Kore.ai SaaS marketplace resource.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'az koreai artemis saas' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az koreai artemis saas activate --publisher-id
                                    --saas-guid
                                    [--acquire-policy-token]
                                    [--change-reference]
                                    [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
  examples:
  - summary: |-
      SaaSOperationGroup_ActivateResource
    syntax: az koreai artemis saas activate --saas-guid 12345678-1234-1234-1234-123456789012 --publisher-id kore-ai
  requiredParameters:
  - isRequired: true
    name: --publisher-id
    summary: |-
      Publisher Id for the marketplace offer.
    groupName: Body Arguments
  - isRequired: true
    name: --saas-guid
    summary: |-
      SaaS subscription identifier (GUID) issued by the Azure Marketplace fulfillment API.
    groupName: Body Arguments
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_koreai_artemis_saas_activate
metadata:
  description: Manage Kore.ai Artemis SaaS marketplace resources.
