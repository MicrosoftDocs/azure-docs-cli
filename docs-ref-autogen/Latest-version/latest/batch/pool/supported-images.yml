### YamlMime:AzureCLIGroup
uid: az_batch_pool_supported-images
name: az batch pool supported-images
summary: |-
  Query information on VM images supported by Azure Batch service.
status: GA
sourceType: Core
directCommands:
- uid: az_batch_pool_supported-images_list
  name: az batch pool supported-images list
  summary: |-
    Lists all Virtual Machine Images supported by the Azure Batch service.
  description: |-
    This command needs a Batch account. Select one with 'az batch account login', or pass --account-name and --account-endpoint (and --account-key for Shared Key authentication).
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/batch/_help.py
  syntax: >-
    az batch pool supported-images list [--account-endpoint]
                                        [--account-key]
                                        [--account-name]
                                        [--filter]
  examples:
  - summary: |-
      List the images supported by the Batch account selected with 'az batch account login'.
    syntax: az batch pool supported-images list
  - summary: |-
      List the images supported by a Batch account, using your 'az login' credentials (Microsoft Entra ID).
    syntax: az batch pool supported-images list --account-name mybatchaccount --account-endpoint https://mybatchaccount.eastus.batch.azure.com
  optionalParameters:
  - name: --account-endpoint
    summary: |-
      Batch service endpoint. Alternatively, set by environment variable: AZURE_BATCH_ENDPOINT.
    groupName: Batch Account Arguments
  - name: --account-key
    summary: |-
      Batch account key. Alternatively, set by environment variable: AZURE_BATCH_ACCESS_KEY.
    groupName: Batch Account Arguments
  - name: --account-name
    summary: |-
      Batch account name. Alternatively, set by environment variable: AZURE_BATCH_ACCOUNT.
    groupName: Batch Account Arguments
  - name: --filter
    summary: |-
      An OData $filter clause. For more information on constructing this filter,see https://learn.microsoft.com/rest/api/batchservice/odata-filters-in-batch.
    groupName: Pre-condition and Query Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_batch_pool_supported-images_list
metadata:
  ms.date: 11/19/2026
  description: Query information on VM images supported by Azure Batch service.
