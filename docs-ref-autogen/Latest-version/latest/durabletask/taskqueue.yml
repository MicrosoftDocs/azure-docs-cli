### YamlMime:AzureCLIGroup
uid: az_durabletask_taskqueue
name: az durabletask taskqueue
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **durabletask** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az durabletask taskqueue** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Task Queue.
status: GA
sourceType: Extension
directCommands:
- uid: az_durabletask_taskqueue_create
  name: az durabletask taskqueue create
  summary: |-
    Create a Task Queue.
  status: GA
  sourceType: Extension
  syntax: >-
    az durabletask taskqueue create --name --taskqueue-name
                                    --resource-group
                                    --scheduler-name
                                    --taskhub-name
                                    [--acquire-policy-token]
                                    [--actions-per-second]
                                    [--change-reference]
                                    [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
  examples:
  - summary: |-
      Create a task queue with a throughput of 100 actions per second
    syntax: az durabletask taskqueue create --resource-group myResourceGroup --scheduler-name myScheduler --taskhub-name myTaskHub --name myTaskQueue --actions-per-second 100
  requiredParameters:
  - isRequired: true
    name: --name --taskqueue-name -n
    summary: |-
      The name of the TaskQueue.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --scheduler-name -s
    summary: |-
      The name of the Scheduler.
  - isRequired: true
    name: --taskhub-name -t
    summary: |-
      The name of the TaskHub.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --actions-per-second
    summary: |-
      The rate of work-item handouts per second.
    groupName: Throughput Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
