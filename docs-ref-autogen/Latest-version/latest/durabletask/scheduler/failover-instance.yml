### YamlMime:AzureCLIGroup
uid: az_durabletask_scheduler_failover-instance
name: az durabletask scheduler failover-instance
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **durabletask** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az durabletask scheduler failover-instance** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Failover Instance.
status: GA
sourceType: Extension
directCommands:
- uid: az_durabletask_scheduler_failover-instance_create
  name: az durabletask scheduler failover-instance create
  summary: |-
    Create a Failover Instance.
  status: GA
  sourceType: Extension
  syntax: >-
    az durabletask scheduler failover-instance create --resource-group
                                                      --scheduler-name
                                                      [--acquire-policy-token]
                                                      [--change-reference]
                                                      [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                                      [--partner-scheduler-resource-id --pid]
  examples:
  - summary: |-
      Create a failover instance with a partner scheduler
    syntax: az durabletask scheduler failover-instance create --resource-group myResourceGroup --scheduler-name myScheduler --partner-scheduler-resource-id /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/myPartnerResourceGroup/providers/Microsoft.DurableTask/schedulers/myPartnerScheduler
  requiredParameters:
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --scheduler-name -s
    summary: |-
      The name of the Scheduler.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --partner-scheduler-resource-id --pid
    summary: |-
      The resource ID of the partner scheduler in the failover configuration.
    groupName: Properties Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
