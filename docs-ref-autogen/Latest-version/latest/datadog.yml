### YamlMime:AzureCLIGroup
uid: az_datadog
name: az datadog
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **datadog** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az datadog** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Datadog.
status: Preview
isPreview: true
previewOrExperimentalInfo: 'This command group is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus'
sourceType: Extension
directCommands:
- uid: az_datadog_activate-saas
  name: az datadog activate-saas
  summary: |-
    Resolve the token to get the SaaS resource ID and activate the SaaS resource.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'az datadog' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az datadog activate-saas --saas-resource-id
                             [--acquire-policy-token]
                             [--change-reference]
                             [--datadog-organization-properties]
                             [--user-info]
  examples:
  - summary: |-
      SaaS_ActivateResource
    syntax: az datadog activate-saas --saas-resource-id "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/myResourceGroup/providers/Microsoft.SaaS/resources/mySaaSResource" --user-info name="Alice" email-address="alice@microsoft.com" phone-number="123-456-7890"
  requiredParameters:
  - isRequired: true
    name: --saas-resource-id
    summary: |-
      SaaS resource id of marketplace saas subscription to be activated.
    groupName: Body Arguments
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --datadog-organization-properties
    summary: |-
      Datadog organization properties to link the Saas resource to.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Body Arguments
  - name: --user-info
    summary: |-
      User information of the person activating the SaaS resource.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Body Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
