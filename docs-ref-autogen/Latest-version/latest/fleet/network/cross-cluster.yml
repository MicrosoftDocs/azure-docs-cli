### YamlMime:AzureCLIGroup
uid: az_fleet_network_cross-cluster
name: az fleet network cross-cluster
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **fleet** extension for the Azure CLI (version 2.61.0 or higher). The extension will automatically install the first time you run an **az fleet network cross-cluster** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Commands to manage cross-cluster networks.
status: GA
sourceType: Extension
directCommands:
- uid: az_fleet_network_cross-cluster_apply
  name: az fleet network cross-cluster apply
  summary: |-
    Apply the cross-cluster network to selected fleet members.
  status: GA
  sourceType: Extension
  syntax: >-
    az fleet network cross-cluster apply --fleet-name
                                         --name
                                         --resource-group
                                         [--acquire-policy-token]
                                         [--change-reference]
                                         [--no-wait]
                                         [--what-if]
  examples:
  - summary: |-
      Apply a cross-cluster network.
    syntax: az fleet network cross-cluster apply -g MyFleetResourceGroup -f MyFleetName -n MyCrossClusterNetwork
  - summary: |-
      Preview what changes would be made without actually applying.
    syntax: az fleet network cross-cluster apply -g MyFleetResourceGroup -f MyFleetName -n MyCrossClusterNetwork --what-if --output table
  requiredParameters:
  - isRequired: true
    name: --fleet-name -f
    summary: |-
      Specify the fleet name.
  - isRequired: true
    name: --name -n
    summary: |-
      Specify name for the cluster mesh profile.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --what-if
    defaultValue: "False"
    summary: |-
      Show what changes would be made by the apply operation without actually performing it.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_fleet_network_cross-cluster_create
  name: az fleet network cross-cluster create
  summary: |-
    Create or update a cross-cluster network.
  status: GA
  sourceType: Extension
  syntax: >-
    az fleet network cross-cluster create --fleet-name
                                          --name
                                          --resource-group
                                          [--acquire-policy-token]
                                          [--change-reference]
                                          [--member-selector --selector]
                                          [--no-wait]
  examples:
  - summary: |-
      Create a cross-cluster network with a label selector.
    syntax: az fleet network cross-cluster create -g MyFleetResourceGroup -f MyFleetName -n MyCrossClusterNetwork --selector "env=production"
  - summary: |-
      Create a cross-cluster network without a selector (no members selected initially).
    syntax: az fleet network cross-cluster create -g MyFleetResourceGroup -f MyFleetName -n MyCrossClusterNetwork
  requiredParameters:
  - isRequired: true
    name: --fleet-name -f
    summary: |-
      Specify the fleet name.
  - isRequired: true
    name: --name -n
    summary: |-
      Specify name for the cluster mesh profile.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --member-selector --selector -s
    summary: |-
      Kubernetes-style label selector for selecting Fleet members, e.g. 'env=production'.
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
