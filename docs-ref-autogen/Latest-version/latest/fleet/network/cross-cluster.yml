- uid: az_fleet_network_cross-cluster_list-members
  name: az fleet network cross-cluster list-members
  summary: |-
    List fleet members for a cross-cluster network.
  description: |-
    Without --selector, lists members currently applied to the network.
    With --selector, lists members that would match the network's label selector (i.e. candidates for the next apply).
  status: GA
  sourceType: Extension
  syntax: >-
    az fleet network cross-cluster list-members --fleet-name
                                                --name
                                                --resource-group
                                                [--acquire-policy-token]
                                                [--change-reference]
                                                [--selector]
  examples:
  - summary: |-
      List members currently applied to the network.
    syntax: az fleet network cross-cluster list-members -g MyFleetResourceGroup -f MyFleetName -n MyCrossClusterNetwork
  - summary: |-
      List members that would match the network's selector.
    syntax: az fleet network cross-cluster list-members -g MyFleetResourceGroup -f MyFleetName -n MyCrossClusterNetwork --selector
  requiredParameters:
  - isRequired: true
    name: --fleet-name -f
    summary: |-
      Specify the fleet name.
  - isRequired: true
    name: --name -n
    summary: |-
      Specify name for the cluster mesh profile.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --selector
    defaultValue: "False"
    summary: |-
      Filter by the profile's label selector (members that would match after apply) instead of currently applied members.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
