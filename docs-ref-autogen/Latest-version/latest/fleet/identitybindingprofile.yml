- uid: az_fleet_identitybindingprofile_list-members
  name: az fleet identitybindingprofile list-members
  summary: |-
    List fleet members for an identity binding profile.
  description: |-
    Without --selector, lists members the profile is currently applied to.
    With --selector, lists members that would match the profile's label selector (i.e. candidates for the next apply).
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'fleet identitybindingprofile' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az fleet identitybindingprofile list-members --fleet-name
                                                 --name
                                                 --resource-group
                                                 [--acquire-policy-token]
                                                 [--change-reference]
                                                 [--selector]
  examples:
  - summary: |-
      List members the profile is currently applied to.
    syntax: az fleet identitybindingprofile list-members -g MyFleetResourceGroup -f MyFleetName -n MyIdentityBindingProfile
  - summary: |-
      List members that would match the profile's selector.
    syntax: az fleet identitybindingprofile list-members -g MyFleetResourceGroup -f MyFleetName -n MyIdentityBindingProfile --selector
  requiredParameters:
  - isRequired: true
    name: --fleet-name -f
    summary: |-
      Specify the fleet name.
  - isRequired: true
    name: --name -n
    summary: |-
      Specify name for the identity binding profile.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
