- uid: az_fleet_identitybindingprofile_apply
  name: az fleet identitybindingprofile apply
  summary: |-
    Apply the identity binding profile to selected fleet members.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'fleet identitybindingprofile' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az fleet identitybindingprofile apply --fleet-name
                                          --name
                                          --resource-group
                                          [--acquire-policy-token]
                                          [--change-reference]
                                          [--no-wait]
                                          [--what-if]
  examples:
  - summary: |-
      Apply an identity binding profile.
    syntax: az fleet identitybindingprofile apply -g MyFleetResourceGroup -f MyFleetName -n MyIdentityBindingProfile
  - summary: |-
      Preview what changes would be made without actually applying.
    syntax: az fleet identitybindingprofile apply -g MyFleetResourceGroup -f MyFleetName -n MyIdentityBindingProfile --what-if --output table
  requiredParameters:
  - isRequired: true
    name: --fleet-name -f
    summary: |-
      Specify the fleet name.
  - isRequired: true
    name: --name -n
    summary: |-
      Specify name for the identity binding profile.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --what-if
    defaultValue: "False"
    summary: |-
      Show what changes would be made by the apply operation without actually performing it.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_fleet_identitybindingprofile_create
  name: az fleet identitybindingprofile create
  summary: |-
    Create or update an identity binding profile.
  description: |-
    Running create against an existing profile replaces the whole profile. Any optional
    argument that is omitted is cleared, including --allowed-subjects-from-file, which
    removes existing subject restrictions. Pass every setting you want to keep.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'fleet identitybindingprofile' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az fleet identitybindingprofile create --fleet-name
                                           --managed-identity-resource-id
                                           --name
                                           --resource-group
                                           [--acquire-policy-token]
                                           [--allowed-subjects-from-file]
                                           [--change-reference]
                                           [--member-selector --selector]
                                           [--no-wait]
  examples:
  - summary: |-
      Create an identity binding profile for members labelled env=production.
    syntax: >-
      az fleet identitybindingprofile create -g MyFleetResourceGroup -f MyFleetName -n MyIdentityBindingProfile \
        --selector "env=production" \
        --managed-identity-resource-id "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/MyRG/providers/Microsoft.ManagedIdentity/userAssignedIdentities/MyIdentity"
  - summary: |-
      Create an identity binding profile restricted to specific subjects.
    syntax: >-
      az fleet identitybindingprofile create -g MyFleetResourceGroup -f MyFleetName -n MyIdentityBindingProfile \
        --selector "env=production" \
        --managed-identity-resource-id "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/MyRG/providers/Microsoft.ManagedIdentity/userAssignedIdentities/MyIdentity" \
        --allowed-subjects-from-file allowed-subjects.json
  requiredParameters:
  - isRequired: true
    name: --fleet-name -f
    summary: |-
      Specify the fleet name.
  - isRequired: true
    name: --managed-identity-resource-id
    summary: |-
      The resource ID of the managed identity to use.
  - isRequired: true
    name: --name -n
    summary: |-
      Specify name for the identity binding profile.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --allowed-subjects-from-file
    summary: |-
      Path to a JSON file with the list of subjects authorized to use this identity binding for token exchange.
    description: |-
      The file must contain a JSON array (max 100 entries). Each entry has a required
      'namespaceSelector' and an optional 'serviceAccountSelector', each a Kubernetes label
      selector supporting 'matchLabels' (an array of "key=value" strings) and/or
      'matchExpressions'. Use the built-in 'kubernetes.io/metadata.name' label to target
      specific namespaces by name. When omitted, authorization falls back to
      ClusterRole/ClusterRoleBinding evaluation on the member clusters, and any subjects
      already set on an existing profile are removed.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --member-selector --selector -s
    summary: |-
      Kubernetes-style label selector for selecting Fleet members, e.g. 'env=production'.
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
