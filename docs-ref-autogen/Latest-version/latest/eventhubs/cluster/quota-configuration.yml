### YamlMime:AzureCLIGroup
uid: az_eventhubs_cluster_quota-configuration
name: az eventhubs cluster quota-configuration
summary: |-
  Manage quota and settings configuration of an Event Hubs Dedicated Cluster.
status: GA
sourceType: Core
directCommands:
- uid: az_eventhubs_cluster_quota-configuration_show
  name: az eventhubs cluster quota-configuration show
  summary: |-
    Get all Event Hubs Cluster settings - a collection of key/value pairs which represent the quotas and settings imposed on the cluster.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/eventhubs/_help.py
  syntax: >-
    az eventhubs cluster quota-configuration show [--cluster-name]
                                                  [--ids]
                                                  [--resource-group]
                                                  [--subscription]
  examples:
  - summary: |-
      ClustersQuotasConfigurationGet
    syntax: az eventhubs cluster quota-configuration show --resource-group myResourceGroup --cluster-name testCluster
  optionalParameters:
  - name: --cluster-name
    summary: |-
      The name of the Event Hubs Cluster.
    groupName: Resource Id Arguments
  - name: --ids
    summary: |-
      One or more resource IDs (space-delimited). It should be a complete resource ID containing all information of 'Resource Id' arguments. You should provide either --ids or other 'Resource Id' arguments.
    groupName: Resource Id Arguments
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
    groupName: Resource Id Arguments
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
    groupName: Resource Id Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_eventhubs_cluster_quota-configuration_update
  name: az eventhubs cluster quota-configuration update
  summary: |-
    Update all specified Event Hubs Cluster settings with those contained in the request body. Leaves the settings not specified in the request body unmodified.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/eventhubs/_help.py
  syntax: >-
    az eventhubs cluster quota-configuration update [--acquire-policy-token]
                                                    [--change-reference]
                                                    [--cluster-name]
                                                    [--ids]
                                                    [--resource-group]
                                                    [--settings]
                                                    [--subscription]
  examples:
  - summary: |-
      ClustersQuotasConfigurationPatch
    syntax: az eventhubs cluster quota-configuration update --resource-group ArunMonocle --cluster-name testCluster --settings "{eventhub-per-namespace-quota:20,namespaces-per-cluster-quota:200}"
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --cluster-name
    summary: |-
      The name of the Event Hubs Cluster.
    groupName: Resource Id Arguments
  - name: --ids
    summary: |-
      One or more resource IDs (space-delimited). It should be a complete resource ID containing all information of 'Resource Id' arguments. You should provide either --ids or other 'Resource Id' arguments.
    groupName: Resource Id Arguments
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
    groupName: Resource Id Arguments
  - name: --settings
    summary: |-
      All possible Cluster settings - a collection of key/value paired settings which apply to quotas and configurations imposed on the cluster.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Parameters Arguments
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
    groupName: Resource Id Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_eventhubs_cluster_quota-configuration_show
- az_eventhubs_cluster_quota-configuration_update
metadata:
  ms.date: 11/12/2024
  description: Manage quota and settings configuration of an Event Hubs Dedicated Cluster.
