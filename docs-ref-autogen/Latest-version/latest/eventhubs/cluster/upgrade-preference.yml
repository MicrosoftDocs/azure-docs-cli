  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/eventhubs/_help.py
  syntax: >-
    az eventhubs cluster upgrade-preference upgrade-now [--acquire-policy-token]
                                                        [--change-reference]
                                                        [--cluster-name]
                                                        [--ids]
                                                        [--resource-group]
                                                        [--subscription]
  examples:
  - summary: |-
      Start an upgrade immediately
    syntax: az eventhubs cluster upgrade-preference upgrade-now --resource-group contoso-rg --cluster-name contoso-cluster
  optionalParameters:
