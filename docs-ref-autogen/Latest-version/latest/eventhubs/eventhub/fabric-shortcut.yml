### YamlMime:AzureCLIGroup
uid: az_eventhubs_eventhub_fabric-shortcut
name: az eventhubs eventhub fabric-shortcut
summary: |-
  Manage Fabric Shortcut.
status: GA
sourceType: Core
directCommands:
- uid: az_eventhubs_eventhub_fabric-shortcut_approve
  name: az eventhubs eventhub fabric-shortcut approve
  summary: |-
    Approves a Microsoft Fabric shortcut.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/eventhubs/_help.py
  syntax: >-
    az eventhubs eventhub fabric-shortcut approve [--acquire-policy-token]
                                                  [--change-reference]
                                                  [--event-hub-name]
                                                  [--fabric-shortcut-name]
                                                  [--ids]
                                                  [--namespace-name]
                                                  [--resource-group]
                                                  [--subscription]
  examples:
  - summary: |-
      Approve a Fabric shortcut
    syntax: az eventhubs eventhub fabric-shortcut approve --resource-group contoso-rg --namespace-name contoso-eventhub --event-hub-name orders --fabric-shortcut-name orders-shortcut
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --event-hub-name
    summary: |-
      The Event Hub name.
    groupName: Resource Id Arguments
  - name: --fabric-shortcut-name
    summary: |-
      The Microsoft Fabric shortcut name.
    groupName: Resource Id Arguments
  - name: --ids
    summary: |-
      One or more resource IDs (space-delimited). It should be a complete resource ID containing all information of 'Resource Id' arguments. You should provide either --ids or other 'Resource Id' arguments.
    groupName: Resource Id Arguments
  - name: --namespace-name
    summary: |-
      The Namespace name.
    groupName: Resource Id Arguments
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
    groupName: Resource Id Arguments
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
    groupName: Resource Id Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_eventhubs_eventhub_fabric-shortcut_create
  name: az eventhubs eventhub fabric-shortcut create
  summary: |-
    Create a Microsoft Fabric shortcut.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/eventhubs/_help.py
  syntax: >-
    az eventhubs eventhub fabric-shortcut create --event-hub-name
                                                 --fabric-shortcut-name --name
                                                 --namespace-name
                                                 --resource-group
                                                 [--acquire-policy-token]
                                                 [--change-reference]
                                                 [--configuration]
                                                 [--shortcut-status {Approved, Pending, Rejected}]
                                                 [--shortcut-type {Entity, Network}]
  examples:
  - summary: |-
      Create or update a Fabric shortcut
    syntax: az eventhubs eventhub fabric-shortcut create --resource-group contoso-rg --namespace-name contoso-eventhub --event-hub-name orders --fabric-shortcut-name orders-shortcut --configuration "{artifact-id:33333333-3333-3333-3333-333333333333,artifact-name:orders-eventstream,premium-capacity-id:44444444-4444-4444-4444-444444444444,tenant-id:11111111-1111-1111-1111-111111111111,workspace-id:22222222-2222-2222-2222-222222222222,workspace-name:contoso-workspace}" --shortcut-status Pending --shortcut-type Entity
  requiredParameters:
  - isRequired: true
    name: --event-hub-name
    summary: |-
      The Event Hub name.
  - isRequired: true
    name: --fabric-shortcut-name --name -n
    summary: |-
      The Microsoft Fabric shortcut name.
  - isRequired: true
    name: --namespace-name
    summary: |-
      The Namespace name.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --configuration
    summary: |-
      Microsoft Fabric workspace and artifact configuration.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --shortcut-status
    acceptedValues: Approved, Pending, Rejected
    summary: |-
      The current shortcut status. Only Pending can be supplied on create or update.
    groupName: Properties Arguments
  - name: --shortcut-type
    acceptedValues: Entity, Network
    summary: |-
      The type of the shortcut.
    groupName: Properties Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
