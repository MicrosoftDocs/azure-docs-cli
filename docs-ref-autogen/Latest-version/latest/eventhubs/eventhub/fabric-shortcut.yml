- uid: az_eventhubs_eventhub_fabric-shortcut_update
  name: az eventhubs eventhub fabric-shortcut update
  summary: |-
    Update a Microsoft Fabric shortcut.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/eventhubs/_help.py
  syntax: >-
    az eventhubs eventhub fabric-shortcut update [--acquire-policy-token]
                                                 [--add]
                                                 [--change-reference]
                                                 [--configuration]
                                                 [--event-hub-name]
                                                 [--fabric-shortcut-name --name]
                                                 [--force-string {0, 1, f, false, n, no, t, true, y, yes}]
                                                 [--ids]
                                                 [--namespace-name]
                                                 [--remove]
                                                 [--resource-group]
                                                 [--set]
                                                 [--shortcut-status {Approved, Pending, Rejected}]
                                                 [--shortcut-type {Entity, Network}]
                                                 [--subscription]
  examples:
  - summary: |-
      Create or update a Fabric shortcut
    syntax: az eventhubs eventhub fabric-shortcut update --resource-group contoso-rg --namespace-name contoso-eventhub --event-hub-name orders --fabric-shortcut-name orders-shortcut
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --add
    summary: |-
      Add an object to a list of objects by specifying a path and key value pairs.  Example: `--add property.listProperty <key=value, string or JSON string>`.
    groupName: Generic Update Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --configuration
    summary: |-
      Microsoft Fabric workspace and artifact configuration.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
