### YamlMime:AzureCLIGroup
uid: az_networkcloud_accessbridge
name: az networkcloud accessbridge
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **networkcloud** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az networkcloud accessbridge** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Access Bridge.
status: GA
sourceType: Extension
directCommands:
- uid: az_networkcloud_accessbridge_create
  name: az networkcloud accessbridge create
  summary: |-
    Create a new access bridge or update the properties of the existing access bridge.
  status: GA
  sourceType: Extension
  syntax: >-
    az networkcloud accessbridge create --access-bridge-name --name {Bastion, PrivateVault, StorageDashboard}
                                        --extended-location
                                        --network-id
                                        --resource-group
                                        [--acquire-policy-token]
                                        [--change-reference]
                                        [--ipv4-connected-prefix]
                                        [--ipv6-connected-prefix]
                                        [--location]
                                        [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                        [--security-rules]
                                        [--tags]
  examples:
  - summary: |-
      Create or update access bridge
    syntax: az networkcloud accessbridge create --resource-group resourceGroupName --access-bridge-name Bastion --location location --tags "{key1:myvalue1,key2:myvalue2}" --extended-location "{type:CustomLocation,name:/subscriptions/123e4567-e89b-12d3-a456-426655440000/resourceGroups/resourceGroupName/providers/Microsoft.ExtendedLocation/customLocations/clusterExtendedLocationName}" --ipv4-connected-prefix 198.51.100.0/24 --ipv6-connected-prefix 2001:db8::/64 --network-id /subscriptions/123e4567-e89b-12d3-a456-426655440000/providers/Microsoft.ManagedNetworkFabric/l3IsolationDomains/l3IsolationDomainName/internalNetworks/internalNetworkName --security-rules "[{description:'Allow management plane egress',port:24562-24570,ipv4-addresses:[10.10.20.10-10.10.20.20],ipv6-addresses:['2001:db8:abcd:12::1000-2001:db8:abcd:12::1fff'],direction:Outbound}]"
  requiredParameters:
  - isRequired: true
    name: --access-bridge-name --name -n
    acceptedValues: Bastion, PrivateVault, StorageDashboard
    summary: |-
      The name of the access bridge.
  - isRequired: true
    name: --extended-location
    summary: |-
      The extended location of the cluster associated with the resource.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: AccessBridge Arguments
  - isRequired: true
    name: --network-id
    summary: |-
      The resource ID of the internal network in a layer 3 isolation domain containing the IP subnets to use.
    groupName: Properties Arguments
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --ipv4-connected-prefix
    summary: |-
      The IPv4 subnet from which the access bridge allocates an address. This subnet must be part of the internal network specified by networkId.
    groupName: Properties Arguments
  - name: --ipv6-connected-prefix
    summary: |-
      The IPv6 subnet from which the access bridge allocates an address. This subnet must be part of the internal network specified by networkId.
    groupName: Properties Arguments
  - name: --location -l
    summary: |-
      The geo-location where the resource lives  When not specified, the location of the resource group will be used.
    groupName: AccessBridge Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --security-rules
    summary: |-
      The list of security rules enforced by the access bridge.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --tags
    summary: |-
      Resource tags.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: AccessBridge Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_networkcloud_accessbridge_delete
  name: az networkcloud accessbridge delete
  summary: |-
    Delete the specified access bridge.
  status: GA
  sourceType: Extension
  syntax: >-
    az networkcloud accessbridge delete [--access-bridge-name --name {Bastion, PrivateVault, StorageDashboard}]
                                        [--acquire-policy-token]
                                        [--change-reference]
                                        [--ids]
                                        [--if-match]
                                        [--if-none-match]
                                        [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                        [--resource-group]
                                        [--subscription]
                                        [--yes]
  examples:
  - summary: |-
      Delete access bridge
    syntax: az networkcloud accessbridge delete --resource-group resourceGroupName --access-bridge-name Bastion
  optionalParameters:
  - name: --access-bridge-name --name -n
    acceptedValues: Bastion, PrivateVault, StorageDashboard
    summary: |-
      The name of the access bridge.
    groupName: Resource Id Arguments
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --ids
    summary: |-
      One or more resource IDs (space-delimited). It should be a complete resource ID containing all information of 'Resource Id' arguments. You should provide either --ids or other 'Resource Id' arguments.
    groupName: Resource Id Arguments
  - name: --if-match
    summary: |-
      The ETag of the transformation. Omit this value to always overwrite the current resource. Specify the last-seen ETag value to prevent accidentally overwriting concurrent changes.
  - name: --if-none-match
    summary: |-
      Set to '*' to allow a new record set to be created, but to prevent updating an existing resource. Other values will result in error from server as they are not supported.
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
    groupName: Resource Id Arguments
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
    groupName: Resource Id Arguments
  - name: --yes -y
    defaultValue: "False"
    summary: |-
      Do not prompt for confirmation.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
