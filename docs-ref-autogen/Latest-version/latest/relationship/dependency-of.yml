- uid: az_relationship_dependency-of_update
  name: az relationship dependency-of update
  summary: |-
    Update a DependencyOfRelationship.
  status: GA
  sourceType: Extension
  syntax: >-
    az relationship dependency-of update --name
                                         --resource-uri
                                         [--acquire-policy-token]
                                         [--add]
