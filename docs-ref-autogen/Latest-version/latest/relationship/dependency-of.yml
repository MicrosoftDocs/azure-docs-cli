### YamlMime:AzureCLIGroup
uid: az_relationship_dependency-of
name: az relationship dependency-of
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **relationship** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az relationship dependency-of** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage dependencyOf relationships at an Azure resource scope.
status: GA
sourceType: Extension
directCommands:
- uid: az_relationship_dependency-of_create
  name: az relationship dependency-of create
  summary: |-
    Create a DependencyOfRelationship.
  status: GA
  sourceType: Extension
  syntax: >-
    az relationship dependency-of create --name
                                         --resource-uri
                                         --target-id
                                         [--acquire-policy-token]
                                         [--change-reference]
                                         [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                         [--target-tenant]
  requiredParameters:
  - isRequired: true
    name: --name
    summary: |-
      Name of dependencyOf relationship.
  - isRequired: true
    name: --resource-uri
    summary: |-
      The fully qualified Azure Resource manager identifier of the resource.
  - isRequired: true
    name: --target-id
    summary: |-
      The relationship target resource id.
    groupName: Properties Arguments
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --target-tenant
    summary: |-
      The relationship target tenant id.
    groupName: Properties Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
