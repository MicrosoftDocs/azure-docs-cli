### YamlMime:AzureCLIGroup
uid: az_relationship_contains
name: az relationship contains
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **relationship** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az relationship contains** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  List system-discovered contains relationships.
status: GA
sourceType: Extension
directCommands:
- uid: az_relationship_contains_list
  name: az relationship contains list
  summary: |-
    List ContainsRelationship resources by subscription ID.
  status: GA
  sourceType: Extension
  syntax: >-
    az relationship contains list [--filter]
                                  [--max-items]
                                  [--next-token]
                                  [--resource-group]
  optionalParameters:
  - name: --filter
    summary: |-
      Filters the results by target resource type. Example: properties.metadata.targetType eq 'Microsoft.Compute/virtualMachines'.
  - name: --max-items
    summary: |-
      Total number of items to return in the command's output. If the total number of items available is more than the value specified, a token is provided in the command's output. To resume pagination, provide the token value in `--next-token` argument of a subsequent command.
    groupName: Pagination Arguments
  - name: --next-token
    summary: |-
      Token to specify where to start paginating. This is the token value from a previously truncated response.
    groupName: Pagination Arguments
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_relationship_contains_list
metadata:
  description: List system-discovered contains relationships.
