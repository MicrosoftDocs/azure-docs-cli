- uid: az_relationship_dependency-of-by-service-group_create
  name: az relationship dependency-of-by-service-group create
  summary: |-
    Create a DependencyOfRelationship.
  status: GA
  sourceType: Extension
  syntax: >-
    az relationship dependency-of-by-service-group create --name
                                                          --service-group-name
                                                          --target-id
                                                          [--acquire-policy-token]
                                                          [--change-reference]
                                                          [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                                          [--target-tenant]
  examples:
  - summary: |-
      Create a dependency between Service Groups
    syntax: az relationship dependency-of-by-service-group create --service-group-name sourceSG --name myDependency --target-id "/providers/Microsoft.Management/serviceGroups/targetSG"
  requiredParameters:
  - isRequired: true
    name: --name
    summary: |-
      Name of dependencyOf relationship.
  - isRequired: true
    name: --service-group-name
    summary: |-
      The name of the service group.
  - isRequired: true
    name: --target-id
    summary: |-
      The relationship target resource id.
    groupName: Properties Arguments
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --target-tenant
    summary: |-
      The relationship target tenant id.
    groupName: Properties Arguments
  globalParameters:
