uid: az_relationship_dependency-of-by-service-group
name: az relationship dependency-of-by-service-group
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **relationship** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az relationship dependency-of-by-service-group** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
