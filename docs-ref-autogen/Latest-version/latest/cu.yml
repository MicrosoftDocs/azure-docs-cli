### YamlMime:AzureCLIGroup
uid: az_cu
name: az cu
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **content-understanding** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az cu** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage and use Azure Content Understanding.
status: Preview
isPreview: true
previewOrExperimentalInfo: 'This command group is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus'
sourceType: Extension
directCommands:
- uid: az_cu_analyze
  name: az cu analyze
  summary: |-
    Process local files or HTTPS URLs and return analyzer results.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'cu' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az cu analyze [--acquire-policy-token]
                  [--analyzer]
                  [--api-key]
                  [--api-version]
                  [--auth-mode {key, login}]
                  [--change-reference]
                  [--concurrency]
                  [--dry-run]
                  [--endpoint]
                  [--file]
                  [--inline]
                  [--llm-input]
                  [--on-existing {error, reanalyze, skip}]
                  [--output-dir]
                  [--output-file]
                  [--pattern]
                  [--profile]
                  [--recursive]
                  [--report-file]
                  [--source]
                  [--url]
                  [--usage]
                  [--yes]
  examples:
  - summary: |-
      Analyze an invoice with an explicit analyzer and endpoint.
    syntax: az cu analyze --file invoice.pdf --analyzer prebuilt-invoice --endpoint https://contoso.services.ai.azure.com/
  - summary: |-
      Analyze a file using defaults from the active CU profile.
    syntax: az cu analyze --file invoice.pdf
  - summary: |-
      Select extracted fields using JMESPath.
    syntax: az cu analyze --file invoice.pdf --query "contents[0].fields"
  - summary: |-
      Analyze an HTTPS or Azure Blob SAS URL.
    syntax: az cu analyze --url "https://storage.example/container/invoice.pdf?<sas>" --analyzer prebuilt-invoice
  - summary: |-
      Analyze a directory recursively and write results under one directory.
    syntax: az cu analyze --source documents --recursive --output-dir results --analyzer prebuilt-document --yes
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --analyzer -a
    summary: |-
      Analyzer name; defaults to the configured default analyzer.
  - name: --api-key
    summary: |-
      Microsoft Foundry resource API key.
  - name: --api-version
    summary: |-
      Content Understanding service API version.
  - name: --auth-mode
    acceptedValues: key, login
    summary: |-
      Authentication mode.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --concurrency -j
    defaultValue: "4"
    summary: |-
      Concurrent analysis jobs.
  - name: --dry-run
    defaultValue: "False"
    summary: |-
      Display the local execution plan without service calls or writes.
  - name: --endpoint
    summary: |-
      Microsoft Foundry resource endpoint for Content Understanding.
  - name: --file
    summary: |-
      Literal local file. Repeat for multiple files.
  - name: --inline -i
    defaultValue: "False"
    summary: |-
      Use preview synchronous analysis.
  - name: --llm-input
    defaultValue: "False"
    summary: |-
      Return the analyzer result formatted as generative AI model input.
  - name: --on-existing
    acceptedValues: error, reanalyze, skip
    summary: |-
      How to handle existing result files.
  - name: --output-dir -d
    summary: |-
      Write results under this directory, preserving source-relative paths.
  - name: --output-file
    summary: |-
      Write the primary payload for one selected file.
  - name: --pattern
    summary: |-
      Python fnmatch pattern applied to every --source.
  - name: --profile
    summary: |-
      CU CLI profile used to resolve endpoint and API-version defaults.
  - name: --recursive -r
    defaultValue: "False"
    summary: |-
      Recurse into selected directories.
  - name: --report-file
    summary: |-
      Write a standalone JSON status report.
  - name: --source
    summary: |-
      Local source directory. Repeat for multiple directories.
  - name: --url
    summary: |-
      HTTPS or Azure Blob SAS URL. Repeat for multiple URLs.
  - name: --usage
    defaultValue: "False"
    summary: |-
      Include service usage details.
  - name: --yes -y
    defaultValue: "False"
    summary: |-
      Skip discovery confirmation.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_cu_doctor
  name: az cu doctor
  summary: |-
    Verify a Microsoft Foundry resource connection and Content Understanding defaults.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'cu' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az cu doctor [--acquire-policy-token]
                 [--api-key]
                 [--api-version]
                 [--auth-mode {key, login}]
                 [--change-reference]
                 [--endpoint]
                 [--fix-defaults]
                 [--profile]
  examples:
  - summary: |-
      Check the active profile and resource defaults.
    syntax: az cu doctor --output table
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --api-key
    summary: |-
      Override the configured API key.
  - name: --api-version
    summary: |-
      Content Understanding API version. Known versions: 2025-11-01 (GA) and 2026-06-01-preview (preview); any YYYY-MM-DD-preview version is also accepted.
  - name: --auth-mode
    acceptedValues: key, login
    summary: |-
      Authentication mode; defaults to the selected CU CLI profile.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --endpoint
    summary: |-
      Override the configured Microsoft Foundry resource endpoint.
  - name: --fix-defaults
    defaultValue: "False"
    summary: |-
      Configure Content Understanding defaults from profile model mappings.
  - name: --profile -p
    summary: |-
      Named CU CLI profile to use.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
