- uid: az_cognitiveservices_account_deployment_update
  name: az cognitiveservices account deployment update
  summary: |-
    Update a Cognitive Services account deployment.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'az cognitiveservices' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az cognitiveservices account deployment update --deployment-name
                                                   --name
                                                   --resource-group
                                                   [--acquire-policy-token]
                                                   [--change-reference]
                                                   [--cost-control-ids]
  examples:
  - summary: |-
      Attach a cost control to an existing deployment
    syntax: az cognitiveservices account deployment update --name my-account --resource-group my-resource-group --deployment-name my-deployment --cost-control-ids /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/my-resource-group/providers/Microsoft.CognitiveServices/accounts/my-account/costControls/my-control
  - summary: |-
      Remove the cost-control attachment
    syntax: az cognitiveservices account deployment update --name my-account --resource-group my-resource-group --deployment-name my-deployment --cost-control-ids
  requiredParameters:
  - isRequired: true
    name: --deployment-name
    summary: |-
      Cognitive Services account deployment name.
  - isRequired: true
    name: --name -n
    summary: |-
      Cognitive service account name.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --cost-control-ids
    summary: |-
      Resource ID of the cost control attached to the deployment. Specify the option without a value to remove the attachment.
    groupName: Cost Control Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
