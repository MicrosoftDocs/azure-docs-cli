  sourceType: Extension
  syntax: >-
    az cognitiveservices account costcontrol update [--account-name]
                                                    [--acquire-policy-token]
                                                    [--add]
                                                    [--change-reference]
                                                    [--cost-control-name --name]
                                                    [--display-name]
                                                    [--force-string {0, 1, f, false, n, no, t, true, y, yes}]
                                                    [--ids]
                                                    [--if-match]
                                                    [--if-none-match]
                                                    [--remove]
                                                    [--resource-group]
                                                    [--rules]
                                                    [--set]
                                                    [--subscription]
