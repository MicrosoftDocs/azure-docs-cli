### YamlMime:AzureCLIGroup
uid: az_cognitiveservices_account_costcontrol
name: az cognitiveservices account costcontrol
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **foundry-cost-control** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az cognitiveservices account costcontrol** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Cost Control Policies in Foundry.
description: |-
  A set of commands to manage Cost Control Policies in Foundry. Supported commands are `create`, `delete`, `list`, `show` and `update`. Use those policies to set a threshold on the cost (in USD) per time period for token use by your account or deployment. You can also set alerts to get notified when this threshold approaches.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'az cognitiveservices' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_cognitiveservices_account_costcontrol_create
  name: az cognitiveservices account costcontrol create
  summary: |-
    Create a cost control.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'az cognitiveservices account costcontrol' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az cognitiveservices account costcontrol create --account-name
                                                    --cost-control-name --name
                                                    --resource-group
                                                    [--acquire-policy-token]
                                                    [--change-reference]
                                                    [--display-name]
                                                    [--if-match]
                                                    [--if-none-match]
                                                    [--rules]
  examples:
  - summary: |-
      Create a cost control with all settings
    syntax: az cognitive-services account cost-control create --resource-group foundry-resource-group --account-name foundry-account --cost-control-name production-agents --if-none-match * --display-name Production agent monthly budget --rules "[{name:monthly-agent-budget,counter-key:[{type:agent}],unit:usd,amount:1000,period:month,recurring:True,match:{foundry-caller-agent-id:[customer-support-agent,sales-assistant-agent],foundry-caller-identity-oid:[11111111-2222-3333-4444-555555555555],foundry-caller-session-id:[production-session],foundry-project-id:[/subscriptions/00000000-1111-2222-3333-444444444444/resourceGroups/foundry-resource-group/providers/Microsoft.CognitiveServices/accounts/foundry-account/projects/production]},thresholds:[{type:percentage,value:80,action:alert},{type:absolute,value:1000,action:audit}]},{name:daily-tenant-budget,counter-key:[{type:custom,attribute:x-tenant-id}],unit:usd,amount:100,period:day,recurring:True,thresholds:[{type:percentage,value:90,action:alert}]}]"
  requiredParameters:
  - isRequired: true
    name: --account-name
    summary: |-
      The name of Cognitive Services account.
  - isRequired: true
    name: --cost-control-name --name -n
    summary: |-
      The name of the CostControl.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --display-name
    summary: |-
      An optional human-readable name for the cost control.
    groupName: Properties Arguments
  - name: --if-match
    summary: |-
      Proceeds only when the current entity tag matches this value.
  - name: --if-none-match
    summary: |-
      Proceeds only when the current entity tag does not match this value.
  - name: --rules
    summary: |-
      The rules enforced by the cost control.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
