### YamlMime:AzureCLIGroup
uid: az_cognitiveservices_account_costcontrol
name: az cognitiveservices account costcontrol
summary: |-
  Manage Foundry account-owned Cost Controls.
status: Preview
isPreview: true
previewOrExperimentalInfo: 'This command group is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus'
sourceType: Core
directCommands:
- uid: az_cognitiveservices_account_costcontrol_create
  name: az cognitiveservices account costcontrol create
  summary: |-
    Create an account-owned cost control.
  description: |-
    Create an account-owned cost control. The definition may contain at most one notification, including disabled notifications, and one Block action. Exceeding either limit returns HTTP 400 without persisting the request.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'az cognitiveservices account costcontrol' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/cognitiveservices/_help.py
  syntax: >-
    az cognitiveservices account costcontrol create --account-name
                                                    --cost-control-name --name
                                                    --resource-group
                                                    [--acquire-policy-token]
                                                    [--amount]
                                                    [--category {Cost, Tokens}]
                                                    [--change-reference]
                                                    [--filter]
                                                    [--grouping]
                                                    [--if-match]
                                                    [--if-none-match]
                                                    [--notifications]
                                                    [--provider {Microsoft.CognitiveServices}]
                                                    [--provider-properties]
                                                    [--time-grain {Daily, Monthly, Weekly}]
                                                    [--time-period]
  examples:
  - summary: |-
      Create or replace an account cost budget
    syntax: az cognitiveservices account costcontrol create --resource-group foundry-resource-group --account-name foundry-account --cost-control-name production-agents --if-none-match * --grouping "[{name:agent,type:AdditionalInfoKey}]" --category Cost --amount 1000 --time-grain Monthly --time-period "{start-date:'2026-11-15T00:00:00Z',end-date:'2027-11-15T00:00:00Z'}" --filter "{and:[{additionalInfo:{name:project,operator:In,values:[production]}},{additionalInfo:{name:agent,operator:In,values:[customer-support,order-assistant]}},{additionalInfo:{name:deployment,operator:In,values:[customer-support-model]}}]}" --notifications "{usageAlert:{eventGridConnectionId:/subscriptions/00000000-1111-2222-3333-444444444444/resourceGroups/foundry-resource-group/providers/Microsoft.CognitiveServices/accounts/foundry-account/connections/budget-alerts,thresholdType:Percentage,threshold:80,enabled:True,operator:GreaterThanOrEqualTo}}" --provider-properties "{actions:{stopRequests:{type:Block,thresholdType:Percentage,threshold:100,operator:GreaterThanOrEqualTo}}}"
  requiredParameters:
  - isRequired: true
    name: --account-name
    summary: |-
      The name of Cognitive Services account.
  - isRequired: true
    name: --cost-control-name --name -n
    summary: |-
      The cost-control name. Names contain 1-63 ASCII letters, numbers, underscores, or hyphens, including a leading underscore or hyphen.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --amount
    summary: |-
      The positive budget amount, measured in United States dollars for the Cost category or in tokens for the Tokens category. Token amounts must be whole numbers.
    groupName: Properties Arguments
  - name: --category
    acceptedValues: Cost, Tokens
    summary: |-
      Whether the budget measures estimated cost in United States dollars or token consumption. This category cannot be changed after creation.
    groupName: Properties Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --filter
    summary: |-
      Optional traffic selection. Omission selects all eligible traffic within the owner's scope.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --grouping
    summary: |-
      Optional additional partitioning of consumption. Omission or an empty array uses one counter for the owning account or Foundry project. Responses omit owner-default grouping. A project-owned control cannot explicitly group by project.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --if-match
    summary: |-
      Proceeds only if the current entity tag matches this value.
  - name: --if-none-match
    summary: |-
      Proceeds only if the current entity tag does not match this value. Use * to create only if absent.
  - name: --notifications
    summary: |-
      Alert notifications keyed by nonempty, case-insensitively unique names.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --provider
    acceptedValues: Microsoft.CognitiveServices
    summary: |-
      The resource provider for this budget. Omission selects Microsoft.CognitiveServices; responses return that value.
    groupName: Properties Arguments
  - name: --provider-properties
    summary: |-
      Optional provider-specific enforcement settings. Omission creates no blocking actions.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --time-grain
    acceptedValues: Daily, Monthly, Weekly
    summary: |-
      The calendar-aligned UTC interval at which consumption counters renew within the validity window.
    groupName: Properties Arguments
  - name: --time-period
    summary: |-
      The finite UTC validity window during which the control applies.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
