- uid: az_cognitiveservices_account_costcontrol_update
  name: az cognitiveservices account costcontrol update
  summary: |-
    Update an account-owned cost control.
  description: |-
    Omitting properties preserves all existing cost control properties; setting properties to null or an empty object ({}) clears them all. A non-empty properties object updates selected fields, preserving omitted fields; a successful update that leaves the cost control unchanged retains its entity tag. The complete merged result may contain at most one notification, including disabled notifications, and one Block action. Exceeding either limit returns HTTP 400 without changing the stored definition.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'az cognitiveservices account costcontrol' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/cognitiveservices/_help.py
  syntax: >-
    az cognitiveservices account costcontrol update [--account-name]
                                                    [--acquire-policy-token]
                                                    [--add]
                                                    [--amount]
                                                    [--category {Cost, Tokens}]
                                                    [--change-reference]
                                                    [--cost-control-name --name]
                                                    [--filter]
                                                    [--force-string {0, 1, f, false, n, no, t, true, y, yes}]
                                                    [--grouping]
                                                    [--ids]
                                                    [--if-match]
                                                    [--if-none-match]
                                                    [--notifications]
                                                    [--provider {Microsoft.CognitiveServices}]
                                                    [--provider-properties]
                                                    [--remove]
                                                    [--resource-group]
                                                    [--set]
                                                    [--subscription]
                                                    [--time-grain {Daily, Monthly, Weekly}]
                                                    [--time-period]
  examples:
  - summary: |-
      Create or replace an account cost budget
    syntax: az cognitiveservices account costcontrol update --resource-group foundry-resource-group --account-name foundry-account --cost-control-name production-agents --if-none-match * --grouping "[{name:agent,type:AdditionalInfoKey}]" --category Cost --amount 1000 --time-grain Monthly --time-period "{start-date:'2026-11-15T00:00:00Z',end-date:'2027-11-15T00:00:00Z'}" --filter "{and:[{additionalInfo:{name:project,operator:In,values:[production]}},{additionalInfo:{name:agent,operator:In,values:[customer-support,order-assistant]}},{additionalInfo:{name:deployment,operator:In,values:[customer-support-model]}}]}" --notifications "{usageAlert:{eventGridConnectionId:/subscriptions/00000000-1111-2222-3333-444444444444/resourceGroups/foundry-resource-group/providers/Microsoft.CognitiveServices/accounts/foundry-account/connections/budget-alerts,thresholdType:Percentage,threshold:80,enabled:True,operator:GreaterThanOrEqualTo}}" --provider-properties "{actions:{stopRequests:{type:Block,thresholdType:Percentage,threshold:100,operator:GreaterThanOrEqualTo}}}"
  optionalParameters:
  - name: --account-name
    summary: |-
      The name of Cognitive Services account.
    groupName: Resource Id Arguments
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --add
    summary: |-
      Add an object to a list of objects by specifying a path and key value pairs.  Example: `--add property.listProperty <key=value, string or JSON string>`.
    groupName: Generic Update Arguments
  - name: --amount
    summary: |-
      Replaces the positive budget amount, measured in United States dollars for the Cost category or in whole tokens for the Tokens category.
    groupName: Properties Arguments
  - name: --category
    acceptedValues: Cost, Tokens
    summary: |-
      Whether the budget measures estimated cost in United States dollars or token consumption. This category cannot be changed after creation.
    groupName: Properties Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --cost-control-name --name -n
    summary: |-
      The cost-control name. Names contain 1-63 ASCII letters, numbers, underscores, or hyphens, including a leading underscore or hyphen.
    groupName: Resource Id Arguments
  - name: --filter
    summary: |-
      Optional traffic selection. Omission selects all eligible traffic within the owner's scope.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --force-string
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      When using 'set' or 'add', preserve string literals instead of attempting to convert to JSON.
    groupName: Generic Update Arguments
  - name: --grouping
    summary: |-
      Optional additional partitioning of consumption. Omission or an empty array uses one counter for the owning account or Foundry project. Responses omit owner-default grouping. A project-owned control cannot explicitly group by project.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --ids
    summary: |-
      One or more resource IDs (space-delimited). It should be a complete resource ID containing all information of 'Resource Id' arguments. You should provide either --ids or other 'Resource Id' arguments.
    groupName: Resource Id Arguments
  - name: --if-match
    summary: |-
      Proceeds only if the current entity tag matches this value.
  - name: --if-none-match
    summary: |-
      Proceeds only if the current entity tag does not match this value. Use * to create only if absent.
  - name: --notifications
    summary: |-
      Merges notifications by case-insensitive name, preserving existing name casing.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
