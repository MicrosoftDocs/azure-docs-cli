### YamlMime:AzureCLIGroup
uid: az_cognitiveservices_account_compute
name: az cognitiveservices account compute
summary: |-
  Manage compute resources for Azure Cognitive Services accounts.
status: Preview
isPreview: true
previewOrExperimentalInfo: 'This command group is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus'
sourceType: Core
directCommands:
- uid: az_cognitiveservices_account_compute_create
  name: az cognitiveservices account compute create
  summary: |-
    Create a compute resource for Azure Cognitive Services account.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'cognitiveservices account compute' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/cognitiveservices/_help.py
  syntax: >-
    az cognitiveservices account compute create --compute-name
                                                --instance-type
                                                --name
                                                --node-count
                                                --pool-name
                                                --resource-group
                                                [--acquire-policy-token]
                                                [--change-reference]
                                                [--location]
                                                [--no-wait]
                                                [--vm-priority {Regular, Spot}]
  examples:
  - summary: |-
      Create a compute resource.
    syntax: az cognitiveservices account compute create -g MyResourceGroup -n MyAccount --compute-name my-compute --location westus2 --pool-name my-pool --instance-type Standard_DS3_v2 --node-count 1
  - summary: |-
      Create a Spot compute resource without waiting for completion.
    syntax: az cognitiveservices account compute create -g MyResourceGroup -n MyAccount --compute-name my-compute --location westus2 --pool-name my-pool --instance-type Standard_DS3_v2 --node-count 1 --vm-priority Spot --no-wait
  requiredParameters:
  - isRequired: true
    name: --compute-name
    summary: |-
      Cognitive Services account compute name.
  - isRequired: true
    name: --instance-type
    summary: |-
      VM instance type for the pool (e.g. Standard_DS3_v2).
    groupName: Pool Arguments
  - isRequired: true
    name: --name -n
    summary: |-
      Cognitive service account name.
  - isRequired: true
    name: --node-count
    summary: |-
      Number of nodes in the pool.
    groupName: Pool Arguments
  - isRequired: true
    name: --pool-name
    summary: |-
      Name of the compute pool.
    groupName: Pool Arguments
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --location -l
    summary: |-
      Location for the compute resource. If omitted, uses the configured default location or the resource group location.
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --vm-priority
    acceptedValues: Regular, Spot
    summary: |-
      VM priority for the pool.
    groupName: Pool Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
