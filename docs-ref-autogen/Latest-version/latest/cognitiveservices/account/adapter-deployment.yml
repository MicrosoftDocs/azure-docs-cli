### YamlMime:AzureCLIGroup
uid: az_cognitiveservices_account_adapter-deployment
name: az cognitiveservices account adapter-deployment
summary: |-
  Manage LoRA adapter deployments for Azure Cognitive Services accounts.
description: |-
  An adapter deployment is a lightweight LoRA weight patch that attaches to an existing
  managed compute (parent) deployment. It owns no SKU, capacity, base model, or runtime
  - all inference resources come from the parent managed compute deployment referenced
  by --target-deployment-name.
status: Preview
isPreview: true
previewOrExperimentalInfo: 'This command group is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus'
sourceType: Core
directCommands:
- uid: az_cognitiveservices_account_adapter-deployment_create
  name: az cognitiveservices account adapter-deployment create
  summary: |-
    Create (or replace / re-target) a LoRA adapter deployment attached to a managed compute deployment.
  description: |-
    The adapter must reference a protected Foundry fine-tuning LoRA output as its source model.
    The target deployment is the name of an existing managed compute deployment in the same
    account. Re-issuing create with the same adapter name and a different --target-deployment-name
    re-targets the adapter; --source-model-id is immutable.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'cognitiveservices account adapter-deployment' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/cognitiveservices/_help.py
  syntax: >-
    az cognitiveservices account adapter-deployment create --adapter-deployment-name --adapter-name
                                                           --name
                                                           --resource-group
                                                           --source-model-id
                                                           --target-deployment-name
                                                           [--acquire-policy-token]
                                                           [--change-reference]
  examples:
  - summary: |-
      Create an adapter deployment attached to an existing managed compute deployment.
    syntax: az cognitiveservices account adapter-deployment create -g myResourceGroup -n myAccount --adapter-deployment-name my-lora-adapter --source-model-id "azureai://accounts/myAccount/projects/myProject/models/my-fine-tuned-lora/versions/1" --target-deployment-name gpt-oss-120b-gpu
  requiredParameters:
  - isRequired: true
    name: --adapter-deployment-name --adapter-name
    summary: |-
      Adapter deployment name.
  - isRequired: true
    name: --name -n
    summary: |-
      Cognitive service account name.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --source-model-id
    summary: |-
      Immutable Foundry fine-tuning LoRA output model URI (e.g., azureai://accounts/{account}/projects/{project}/models/{model}/versions/{version}).
  - isRequired: true
    name: --target-deployment-name
    summary: |-
      Name of the existing managed compute parent deployment (resolved within the same account) that will serve this adapter. Re-specify to re-target an existing adapter deployment.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
