  summary: |-
    Update a rule of a URL path map.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/network/_help.py
  syntax: >-
    az network application-gateway url-path-map rule update --gateway-name
                                                            --name
                                                            --path-map-name
                                                            --resource-group
                                                            [--acquire-policy-token]
                                                            [--add]
                                                            [--backend-address-pool]
                                                            [--backend-http-settings]
                                                            [--change-reference]
                                                            [--firewall-policy]
                                                            [--force-string {0, 1, f, false, n, no, t, true, y, yes}]
                                                            [--load-distribution-policy --load-policy]
                                                            [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                                            [--paths]
                                                            [--redirect-configuration]
                                                            [--remove]
                                                            [--rewrite-rule-set]
                                                            [--set]
  examples:
  - summary: |-
      Update the paths for a URL path map rule.
    syntax: az network application-gateway url-path-map rule update -g MyResourceGroup --gateway-name MyAppGateway --path-map-name MyUrlPathMap -n MyUrlPathMapRule --paths /mypath/*
  requiredParameters:
  - isRequired: true
    name: --gateway-name
    summary: |-
      Name of the application gateway.
  - isRequired: true
    name: --name -n
    summary: |-
      Name of the rule for a URL path map.
  - isRequired: true
    name: --path-map-name
    summary: |-
      Name of the URL path map.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --add
    summary: |-
      Add an object to a list of objects by specifying a path and key value pairs.  Example: `--add property.listProperty <key=value, string or JSON string>`.
    groupName: Generic Update Arguments
  - name: --backend-address-pool
    summary: |-
      Backend address pool resource of URL path map path rule.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
