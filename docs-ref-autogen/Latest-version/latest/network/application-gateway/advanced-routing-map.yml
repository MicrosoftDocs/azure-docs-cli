- uid: az_network_application-gateway_advanced-routing-map_update
  name: az network application-gateway advanced-routing-map update
  summary: |-
    Update an advanced routing map.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/network/_help.py
  syntax: >-
    az network application-gateway advanced-routing-map update --gateway-name
                                                               --name
                                                               --resource-group
                                                               [--acquire-policy-token]
                                                               [--add]
                                                               [--advanced-routing-rules]
                                                               [--change-reference]
                                                               [--default-address-pool]
                                                               [--default-auth-configs]
                                                               [--default-http-settings]
                                                               [--default-redirect-config]
                                                               [--default-rewrite-rule-set]
                                                               [--force-string {0, 1, f, false, n, no, t, true, y, yes}]
                                                               [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                                               [--remove]
                                                               [--set]
  examples:
  - summary: |-
      Update the default backend address pool of an advanced routing map.
    syntax: az network application-gateway advanced-routing-map update -g MyResourceGroup --gateway-name MyAppGateway -n MyAdvancedRoutingMap --default-address-pool MyNewAddressPool
  requiredParameters:
  - isRequired: true
    name: --gateway-name
    summary: |-
      Name of the application gateway.
  - isRequired: true
    name: --name -n
    summary: |-
      Name of the advanced routing map that is unique within an Application Gateway.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --add
    summary: |-
      Add an object to a list of objects by specifying a path and key value pairs.  Example: `--add property.listProperty <key=value, string or JSON string>`.
    groupName: Generic Update Arguments
  - name: --advanced-routing-rules
    summary: |-
      Advanced routing rules of the advanced routing map. Each rule must specify a priority that is unique within the map.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --default-address-pool
    summary: |-
      Name or ID of the default backend address pool. Required unless --default-redirect-config is specified.
    groupName: Properties Arguments
  - name: --default-auth-configs
    summary: |-
      Default authentication configuration bindings of the advanced routing map. Only one authentication configuration is supported. Authentication configuration names must be unique across the Application Gateway, and an Application Gateway can reference at most 100 distinct authentication policies. Authentication policies can only be bound to Application Gateways using the Standard_v2 or WAF_v2 SKU.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --default-http-settings
    summary: |-
      Name or ID of the default HTTP settings. Required unless --default-redirect-config is specified.
    groupName: Properties Arguments
  - name: --default-redirect-config
    summary: |-
      Name or ID of the default redirect configuration.
    groupName: Properties Arguments
  - name: --default-rewrite-rule-set
    summary: |-
      Name or ID of the default rewrite rule set.
    groupName: Properties Arguments
  - name: --force-string
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      When using 'set' or 'add', preserve string literals instead of attempting to convert to JSON.
    groupName: Generic Update Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --remove
    summary: |-
      Remove a property or an element from a list.  Example: `--remove property.list <indexToRemove>` OR `--remove propertyToRemove`.
    groupName: Generic Update Arguments
  - name: --set
    summary: |-
      Update an object by specifying a property path and value to set.  Example: `--set property1.property2=<value>`.
    groupName: Generic Update Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
