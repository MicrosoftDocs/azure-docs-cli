### YamlMime:AzureCLIGroup
uid: az_network_application-gateway_advanced-routing-map
name: az network application-gateway advanced-routing-map
summary: |-
  Manage advanced routing maps of an application gateway.
status: GA
sourceType: Core
directCommands:
- uid: az_network_application-gateway_advanced-routing-map_create
  name: az network application-gateway advanced-routing-map create
  summary: |-
    Create an advanced routing map.
  description: |-
    The map must be created with at least one rule. This command creates the first rule at the time the map is created.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/network/_help.py
  syntax: >-
    az network application-gateway advanced-routing-map create --condition-set
                                                               --gateway-name
                                                               --name
                                                               --priority
                                                               --resource-group
                                                               [--acquire-policy-token]
                                                               [--address-pool]
                                                               [--change-reference]
                                                               [--default-address-pool]
                                                               [--default-auth-configs]
                                                               [--default-http-settings]
                                                               [--default-redirect-config]
                                                               [--default-rewrite-rule-set]
                                                               [--http-settings]
                                                               [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                                               [--redirect-config]
                                                               [--rewrite-rule-set]
                                                               [--rule-name]
  examples:
  - summary: |-
      Create an advanced routing map whose first rule routes requests matching a condition set to a backend address pool.
    syntax: az network application-gateway advanced-routing-map create -g MyResourceGroup --gateway-name MyAppGateway -n MyAdvancedRoutingMap --default-address-pool MyAddressPool --default-http-settings MyHttpSettings --rule-name MyAdvancedRoutingRule --priority 10 --condition-set MyConditionSet --address-pool MyCanaryAddressPool --http-settings MyHttpSettings
  requiredParameters:
  - isRequired: true
    name: --condition-set
    summary: |-
      Name or ID of the advanced routing condition set of the first rule.
    groupName: First Rule Arguments
  - isRequired: true
    name: --gateway-name
    summary: |-
      Name of the application gateway.
  - isRequired: true
    name: --name -n
    summary: |-
      Name of the advanced routing map that is unique within an Application Gateway.
  - isRequired: true
    name: --priority
    summary: |-
      Priority of the first advanced routing rule. Rules are evaluated in ascending priority order.
    groupName: First Rule Arguments
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --address-pool
    summary: |-
      Name or ID of the backend address pool of the first rule.
    groupName: First Rule Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --default-address-pool
    summary: |-
      Name or ID of the default backend address pool. Required unless --default-redirect-config is specified.
    groupName: Properties Arguments
  - name: --default-auth-configs
    summary: |-
      Default authentication configuration bindings of the advanced routing map. Only one authentication configuration is supported. Authentication configuration names must be unique across the Application Gateway, and an Application Gateway can reference at most 100 distinct authentication policies. Authentication policies can only be bound to Application Gateways using the Standard_v2 or WAF_v2 SKU.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --default-http-settings
    summary: |-
      Name or ID of the default HTTP settings. Required unless --default-redirect-config is specified.
    groupName: Properties Arguments
  - name: --default-redirect-config
    summary: |-
      Name or ID of the default redirect configuration.
    groupName: Properties Arguments
  - name: --default-rewrite-rule-set
    summary: |-
      Name or ID of the default rewrite rule set.
    groupName: Properties Arguments
  - name: --http-settings
    summary: |-
      Name or ID of the HTTP settings of the first rule.
    groupName: First Rule Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --redirect-config
    summary: |-
      Name or ID of the redirect configuration of the first rule.
    groupName: First Rule Arguments
  - name: --rewrite-rule-set
    summary: |-
      Name or ID of the rewrite rule set of the first rule.
    groupName: First Rule Arguments
  - name: --rule-name
    defaultValue: rule1
    summary: |-
      Name of the first advanced routing rule.
    groupName: First Rule Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
