### YamlMime:AzureCLIGroup
uid: az_network_firewall_policy_kube-selector-group
name: az network firewall policy kube-selector-group
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **azure-firewall** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az network firewall policy kube-selector-group** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Kube Selector Group.
status: GA
sourceType: Extension
directCommands:
- uid: az_network_firewall_policy_kube-selector-group_create
  name: az network firewall policy kube-selector-group create
  summary: |-
    Create the specified FirewallPolicyKubeSelectorGroup.
  status: GA
  sourceType: Extension
  syntax: >-
    az network firewall policy kube-selector-group create --kube-selector-group-name --name
                                                          --policy-name
                                                          --resource-group
                                                          [--acquire-policy-token]
                                                          [--change-reference]
                                                          [--namespace-selector]
                                                          [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                                          [--pod-selector]
  examples:
  - summary: |-
      Create a Kubernetes selector group that matches pods by label and namespaces by expression.
    syntax: az network firewall policy kube-selector-group create -g MyResourceGroup --policy-name MyPolicy -n MySelectorGroup --pod-selector "{match-labels:{app:web}}" --namespace-selector "{match-expressions:[{key:env,operator:In,values:[prod,staging]}]}"
  requiredParameters:
  - isRequired: true
    name: --kube-selector-group-name --name -n
    summary: |-
      The name of the resource that is unique within a resource group. This name can be used to access the resource.
  - isRequired: true
    name: --policy-name
    summary: |-
      The name of the Firewall Policy.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --namespace-selector
    summary: |-
      Kubernetes Namespace selector for matching namespaces in the Kubernetes cluster.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --pod-selector
    summary: |-
      Kubernetes Pod selector for matching pods in the Kubernetes cluster.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
