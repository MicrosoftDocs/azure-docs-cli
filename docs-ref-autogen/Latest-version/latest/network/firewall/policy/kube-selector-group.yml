- uid: az_network_firewall_policy_kube-selector-group_update
  name: az network firewall policy kube-selector-group update
  summary: |-
    Update the specified FirewallPolicyKubeSelectorGroup.
  description: |-
    A selector that is not passed keeps its current value, pass null to clear one.
  status: GA
  sourceType: Extension
  syntax: >-
    az network firewall policy kube-selector-group update [--acquire-policy-token]
                                                          [--add]
                                                          [--change-reference]
                                                          [--force-string {0, 1, f, false, n, no, t, true, y, yes}]
                                                          [--ids]
                                                          [--kube-selector-group-name --name]
                                                          [--namespace-selector]
                                                          [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                                          [--pod-selector]
                                                          [--policy-name]
                                                          [--remove]
                                                          [--resource-group]
                                                          [--set]
                                                          [--subscription]
  examples:
  - summary: |-
      Replace the pod selector and clear the namespace selector.
    syntax: az network firewall policy kube-selector-group update -g MyResourceGroup --policy-name MyPolicy -n MySelectorGroup --pod-selector "{match-labels:{app:api}}" --namespace-selector null
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --add
    summary: |-
      Add an object to a list of objects by specifying a path and key value pairs.  Example: `--add property.listProperty <key=value, string or JSON string>`.
    groupName: Generic Update Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --force-string
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      When using 'set' or 'add', preserve string literals instead of attempting to convert to JSON.
    groupName: Generic Update Arguments
  - name: --ids
    summary: |-
      One or more resource IDs (space-delimited). It should be a complete resource ID containing all information of 'Resource Id' arguments. You should provide either --ids or other 'Resource Id' arguments.
    groupName: Resource Id Arguments
  - name: --kube-selector-group-name --name -n
    summary: |-
      The name of the resource that is unique within a resource group. This name can be used to access the resource.
    groupName: Resource Id Arguments
  - name: --namespace-selector
    summary: |-
      Kubernetes Namespace selector for matching namespaces in the Kubernetes cluster.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --pod-selector
    summary: |-
      Kubernetes Pod selector for matching pods in the Kubernetes cluster.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --policy-name
    summary: |-
      The name of the Firewall Policy.
    groupName: Resource Id Arguments
  - name: --remove
    summary: |-
      Remove a property or an element from a list.  Example: `--remove property.list <indexToRemove>` OR `--remove propertyToRemove`.
    groupName: Generic Update Arguments
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
    groupName: Resource Id Arguments
  - name: --set
    summary: |-
      Update an object by specifying a property path and value to set.  Example: `--set property1.property2=<value>`.
    groupName: Generic Update Arguments
  - name: --subscription
    summary: |-
