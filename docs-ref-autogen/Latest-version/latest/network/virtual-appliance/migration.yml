### YamlMime:AzureCLIGroup
uid: az_network_virtual-appliance_migration
name: az network virtual-appliance migration
summary: |-
  Manage the infrastructure migration of an Azure Network Virtual Appliance.
description: |-
  The migration workflow is executed in phases. Run `prepare` first, then `execute`, and finally
  `commit` to complete the migration or `abort` to roll it back.
status: GA
sourceType: Core
directCommands:
- uid: az_network_virtual-appliance_migration_abort
  name: az network virtual-appliance migration abort
  summary: |-
    Abort an in-progress migration of a Network Virtual Appliance.
  description: |-
    Aborting a migration discards any changes staged by the `prepare` or `execute` phases and restores
    the Network Virtual Appliance to its previous configuration. The migration type is inferred from the
    in-progress migration on the resource. This action cannot be run once the migration has been committed.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/network/_help.py
  syntax: >-
    az network virtual-appliance migration abort [--acquire-policy-token]
                                                 [--change-reference]
                                                 [--ids]
                                                 [--name --network-virtual-appliance-name]
                                                 [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                                 [--resource-group]
                                                 [--subscription]
                                                 [--yes]
  examples:
  - summary: |-
      Abort an in-progress Network Virtual Appliance migration.
    syntax: az network virtual-appliance migration abort -n MyName -g MyRG
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --ids
    summary: |-
      One or more resource IDs (space-delimited). It should be a complete resource ID containing all information of 'Resource Id' arguments. You should provide either --ids or other 'Resource Id' arguments.
    groupName: Resource Id Arguments
  - name: --name --network-virtual-appliance-name -n
    summary: |-
      The name of the Network Virtual Appliance.
    groupName: Resource Id Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
    groupName: Resource Id Arguments
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
    groupName: Resource Id Arguments
  - name: --yes -y
    defaultValue: "False"
    summary: |-
      Do not prompt for confirmation.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_network_virtual-appliance_migration_commit
  name: az network virtual-appliance migration commit
  summary: |-
    Commit the migration of a Network Virtual Appliance.
  description: |-
    This is the final phase of the migration workflow and must be run after `execute`. Committing a
    migration finalizes the new infrastructure and discards the previous configuration. This action
    cannot be reversed with `abort`.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/network/_help.py
  syntax: >-
    az network virtual-appliance migration commit --migration-type {MigrateToNewILBArchitecture, MigrateToNewOSVersion}
                                                  [--acquire-policy-token]
                                                  [--change-reference]
                                                  [--ids]
                                                  [--name --network-virtual-appliance-name]
                                                  [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                                  [--resource-group]
                                                  [--subscription]
  examples:
  - summary: |-
      Commit the migration of a Network Virtual Appliance to the new internal load balancer (ILB) architecture.
    syntax: az network virtual-appliance migration commit -n MyName -g MyRG --migration-type MigrateToNewILBArchitecture
  requiredParameters:
  - isRequired: true
    name: --migration-type
    acceptedValues: MigrateToNewILBArchitecture, MigrateToNewOSVersion
    summary: |-
      The type of migration workflow to commit for the Network Virtual Appliance. Must match the type used in the prepare and execute phases.
    groupName: Properties Arguments
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --ids
    summary: |-
      One or more resource IDs (space-delimited). It should be a complete resource ID containing all information of 'Resource Id' arguments. You should provide either --ids or other 'Resource Id' arguments.
    groupName: Resource Id Arguments
  - name: --name --network-virtual-appliance-name -n
    summary: |-
      The name of the Network Virtual Appliance.
    groupName: Resource Id Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
    groupName: Resource Id Arguments
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
    groupName: Resource Id Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_network_virtual-appliance_migration_execute
  name: az network virtual-appliance migration execute
  summary: |-
    Execute the migration of a Network Virtual Appliance.
  description: |-
    This is the second phase of the migration workflow and must be run after `prepare`. Executing a
    migration applies the new infrastructure to the Network Virtual Appliance. Once the execution
    completes, run `commit` to finalize the migration or `abort` to roll it back.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/network/_help.py
  syntax: >-
    az network virtual-appliance migration execute --migration-type {MigrateToNewILBArchitecture, MigrateToNewOSVersion}
                                                   [--acquire-policy-token]
                                                   [--change-reference]
                                                   [--ids]
                                                   [--name --network-virtual-appliance-name]
                                                   [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                                   [--resource-group]
                                                   [--subscription]
  examples:
  - summary: |-
      Execute the migration of a Network Virtual Appliance to the new internal load balancer (ILB) architecture.
    syntax: az network virtual-appliance migration execute -n MyName -g MyRG --migration-type MigrateToNewILBArchitecture
  requiredParameters:
  - isRequired: true
    name: --migration-type
    acceptedValues: MigrateToNewILBArchitecture, MigrateToNewOSVersion
    summary: |-
      The type of migration workflow to execute for the Network Virtual Appliance. Must match the type used in the prepare phase.
    groupName: Properties Arguments
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --ids
    summary: |-
      One or more resource IDs (space-delimited). It should be a complete resource ID containing all information of 'Resource Id' arguments. You should provide either --ids or other 'Resource Id' arguments.
    groupName: Resource Id Arguments
  - name: --name --network-virtual-appliance-name -n
    summary: |-
      The name of the Network Virtual Appliance.
    groupName: Resource Id Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
    groupName: Resource Id Arguments
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
    groupName: Resource Id Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_network_virtual-appliance_migration_prepare
  name: az network virtual-appliance migration prepare
  summary: |-
    Prepare a Network Virtual Appliance for an infrastructure migration.
  description: |-
    This is the first phase of the migration workflow and must be run before `execute`. Preparing a
    migration validates that the Network Virtual Appliance is eligible for the requested migration and
    stages the resources required to perform it.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/network/_help.py
  syntax: >-
    az network virtual-appliance migration prepare --migration-type {MigrateToNewILBArchitecture, MigrateToNewOSVersion}
                                                   [--acquire-policy-token]
                                                   [--change-reference]
                                                   [--ids]
                                                   [--marketplace-version]
                                                   [--name --network-virtual-appliance-name]
                                                   [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                                   [--resource-group]
                                                   [--subscription]
  examples:
  - summary: |-
      Prepare a Network Virtual Appliance for migration to the new internal load balancer (ILB) architecture.
    syntax: az network virtual-appliance migration prepare -n MyName -g MyRG --migration-type MigrateToNewILBArchitecture
  requiredParameters:
  - isRequired: true
    name: --migration-type
    acceptedValues: MigrateToNewILBArchitecture, MigrateToNewOSVersion
    summary: |-
      The type of migration workflow to prepare for the Network Virtual Appliance.
    groupName: Properties Arguments
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --ids
    summary: |-
      One or more resource IDs (space-delimited). It should be a complete resource ID containing all information of 'Resource Id' arguments. You should provide either --ids or other 'Resource Id' arguments.
    groupName: Resource Id Arguments
  - name: --marketplace-version
    summary: |-
      The marketplace version to migrate to. Only applicable when --migration-type is MigrateToNewOSVersion.
    groupName: Properties Arguments
  - name: --name --network-virtual-appliance-name -n
    summary: |-
      The name of the Network Virtual Appliance.
    groupName: Resource Id Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
    groupName: Resource Id Arguments
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
    groupName: Resource Id Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
