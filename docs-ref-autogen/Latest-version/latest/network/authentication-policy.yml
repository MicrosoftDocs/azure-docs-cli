- uid: az_network_authentication-policy_update
  name: az network authentication-policy update
  summary: |-
    Update an authentication policy with the specified name within a resource group.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/network/_help.py
  syntax: >-
    az network authentication-policy update [--acquire-policy-token]
                                            [--add]
                                            [--auth-props --authentication-properties]
                                            [--authentication-policy-name --name]
                                            [--change-reference]
                                            [--force-string {0, 1, f, false, n, no, t, true, y, yes}]
                                            [--ids]
                                            [--location]
                                            [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                            [--on-unauth-req --on-unauthenticated-request {allow, authenticate, deny}]
                                            [--remove]
                                            [--resource-group]
                                            [--set]
                                            [--subscription]
                                            [--tags]
                                            [--trust-provider-type --user-trust-provider-type {entra}]
  examples:
  - summary: |-
      Update the action to take on unauthenticated requests of an authentication policy.
    syntax: az network authentication-policy update -g MyResourceGroup -n MyAuthPolicy --on-unauth-req allow
  - summary: |-
      Update the tags of an authentication policy.
    syntax: az network authentication-policy update -g MyResourceGroup -n MyAuthPolicy --tags env=test
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --add
    summary: |-
      Add an object to a list of objects by specifying a path and key value pairs.  Example: `--add property.listProperty <key=value, string or JSON string>`.
    groupName: Generic Update Arguments
  - name: --auth-props --authentication-properties
