### YamlMime:AzureCLIGroup
uid: az_network_authentication-policy
name: az network authentication-policy
summary: |-
  Manage authentication policies for identity integration of Application Gateway.
status: GA
sourceType: Core
directCommands:
- uid: az_network_authentication-policy_create
  name: az network authentication-policy create
  summary: |-
    Create an authentication policy with the specified name within a resource group.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/network/_help.py
  syntax: >-
    az network authentication-policy create --auth-props --authentication-properties
                                            --authentication-policy-name --name
                                            --resource-group
                                            [--acquire-policy-token]
                                            [--change-reference]
                                            [--location]
                                            [--mi-user-assigned --user-assigned]
                                            [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                            [--on-unauth-req --on-unauthenticated-request {allow, authenticate, deny}]
                                            [--tags]
                                            [--trust-provider-type --user-trust-provider-type {entra}]
  examples:
  - summary: |-
      Create an authentication policy that validates JSON Web Tokens (JWTs) issued by Microsoft Entra ID.
    syntax: az network authentication-policy create -g MyResourceGroup -n MyAuthPolicy --auth-props "{issuer:'https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/',client-id:11111111-1111-1111-1111-111111111111,jwks-uri:'https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/discovery/v2.0/keys',audience:'api://11111111-1111-1111-1111-111111111111'}" --on-unauth-req deny
  - summary: |-
      Create a user sign-in authentication policy that reads its client secret from Key Vault by using a user-assigned managed identity.
    syntax: az network authentication-policy create -g MyResourceGroup -n MyAuthPolicy --auth-props "{issuer:'https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/',client-id:11111111-1111-1111-1111-111111111111,client-secret:'https://myvault.vault.azure.net/secrets/mysecret',scope:[openid,profile],session-timeout:'86400',session-cookie-name:MyAuthCookie}" --on-unauth-req authenticate --mi-user-assigned /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/MyResourceGroup/providers/Microsoft.ManagedIdentity/userAssignedIdentities/MyIdentity
  requiredParameters:
  - isRequired: true
    name: --auth-props --authentication-properties
    summary: |-
      The authentication provider configuration for the policy.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - isRequired: true
    name: --authentication-policy-name --name -n
    summary: |-
      The name of the authentication policy.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --location -l
    summary: |-
      Resource location.
    groupName: Resource Arguments
  - name: --mi-user-assigned --user-assigned
    summary: |-
      Set the user managed identities.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Identity Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --on-unauth-req --on-unauthenticated-request
    acceptedValues: allow, authenticate, deny
    summary: |-
      The action to take when a request is unauthenticated. When omitted, user sign-in policies default to `authenticate` and JWT validation policies default to `deny`.
    groupName: Properties Arguments
  - name: --tags
    summary: |-
      Resource tags.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Resource Arguments
  - name: --trust-provider-type --user-trust-provider-type
    defaultValue: entra
    acceptedValues: entra
    summary: |-
      The type of the user trust provider. Only Microsoft Entra (`entra`) is supported.
    groupName: Properties Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
