directCommands:
- uid: az_network_asg_address-prefix-set_create
  name: az network asg address-prefix-set create
  summary: |-
    Create an address prefix set in an application security group.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'az network asg address-prefix-set' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/network/_help.py
  syntax: >-
    az network asg address-prefix-set create --address-prefix-set-name --name
                                             --address-prefixes
                                             --application-security-group-name --asg-name
                                             --resource-group
                                             [--acquire-policy-token]
                                             [--change-reference]
                                             [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
  examples:
  - summary: |-
      Create an address prefix set.
    syntax: az network asg address-prefix-set create -g MyResourceGroup --asg-name MyAsg -n MyPrefixSet --address-prefixes 10.0.0.0/16 2001:db8::/32
  requiredParameters:
  - isRequired: true
    name: --address-prefix-set-name --name -n
    summary: |-
      Name of the address prefix set.
  - isRequired: true
    name: --address-prefixes
    summary: |-
      Space-separated list of IPv4 or IPv6 address prefixes in CIDR notation.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
  - isRequired: true
    name: --application-security-group-name --asg-name
    summary: |-
      Name of the application security group.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
