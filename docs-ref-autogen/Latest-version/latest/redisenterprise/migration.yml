    These commands apply only to migrations from the Basic, Standard, and Premium tiers of Azure Cache for Redis to Azure Managed Redis.
  status: GA
  sourceType: Extension
  syntax: >-
    az redisenterprise migration validate --source-resource-id
                                          [--acquire-policy-token]
                                          [--change-reference]
                                          [--cluster-name]
                                          [--ids]
                                          [--resource-group]
                                          [--skip-data-migration {0, 1, f, false, n, no, t, true, y, yes}]
                                          [--subscription]
  examples:
  - summary: |-
      Validate an OSS cache migration without transferring data
