### YamlMime:AzureCLIGroup
uid: az_redisenterprise_migration
name: az redisenterprise migration
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **redisenterprise** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az redisenterprise migration** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Migration.
status: GA
sourceType: Extension
directCommands:
- uid: az_redisenterprise_migration_list
  name: az redisenterprise migration list
  summary: |-
    List information about all migrations attempts in a Redis Enterprise cluster.
  status: GA
  sourceType: Extension
  syntax: >-
    az redisenterprise migration list --cluster-name
                                      --resource-group
                                      [--max-items]
                                      [--next-token]
  requiredParameters:
  - isRequired: true
    name: --cluster-name
    summary: |-
      The name of the Redis Enterprise cluster. Name must be 1-60 characters long. Allowed characters(A-Z, a-z, 0-9) and hyphen(-). There can be no leading nor trailing nor consecutive hyphens.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --max-items
    summary: |-
      Total number of items to return in the command's output. If the total number of items available is more than the value specified, a token is provided in the command's output. To resume pagination, provide the token value in `--next-token` argument of a subsequent command.
    groupName: Pagination Arguments
  - name: --next-token
    summary: |-
      Token to specify where to start paginating. This is the token value from a previously truncated response.
    groupName: Pagination Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
