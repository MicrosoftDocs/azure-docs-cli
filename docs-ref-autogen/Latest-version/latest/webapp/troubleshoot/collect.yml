### YamlMime:AzureCLIGroup
uid: az_webapp_troubleshoot_collect
name: az webapp troubleshoot collect
summary: |-
  Collect diagnostic artifacts from a Linux web app.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'webapp troubleshoot' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Core
directCommands:
- uid: az_webapp_troubleshoot_collect_network-capture
  name: az webapp troubleshoot collect network-capture
  summary: |-
    Collect and analyze a packet capture from a Linux web app container.
  description: |-
    Runs a bounded tcpdump capture in one app container instance and analyzes it in Kudu.
    The command does not download files locally; it returns authenticated Kudu links for
    viewing the analysis report and downloading the raw pcap. Network captures can contain
    credentials, cookies, request bodies, and other sensitive application data.

      Use --collect-only to show only the raw packet capture link. Kudu still performs the
      processing required to finalize the capture, but the analysis report link is omitted.

      This command supports Linux web apps on dedicated App Service plans. Captures are
      limited to one worker instance per command invocation. When --instance is omitted,
      an interactive terminal prompts you to select from the app's current workers. Scripts
      and other non-interactive callers must specify --instance. Capture duration defaults
      to 60 seconds and can be changed with --duration.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'webapp troubleshoot collect' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Core
  syntax: >-
    az webapp troubleshoot collect network-capture --name
                                                   --resource-group
                                                   [--acquire-policy-token]
                                                   [--change-reference]
                                                   [--collect-only {false, true}]
                                                   [--duration]
                                                   [--instance]
                                                   [--slot]
  examples:
  - summary: |-
      Capture and analyze traffic for the default 60 seconds
    syntax: az webapp troubleshoot collect network-capture -g MyResourceGroup -n MyWebApp
  - summary: |-
      Capture traffic for 30 seconds from a specific worker
    syntax: az webapp troubleshoot collect network-capture -g MyResourceGroup -n MyWebApp --instance 7c2d9 --duration 30
  - summary: |-
      Show only the raw packet capture link
    syntax: az webapp troubleshoot collect network-capture -g MyResourceGroup -n MyWebApp --collect-only
  requiredParameters:
  - isRequired: true
    name: --name -n
    summary: |-
      Name of the web app. If left unspecified, a name will be randomly generated. You can configure the default using `az configure --defaults web=<name>`.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --collect-only
    defaultValue: "False"
    acceptedValues: false, true
    summary: |-
      Show only the raw packet capture link. Kudu still finalizes the capture internally, but the analysis report link is omitted.
  - name: --duration
    defaultValue: "60"
    summary: |-
      Capture duration in seconds. Valid range: 1-300.
  - name: --instance -i
    summary: |-
      Worker instance to capture. When omitted in an interactive terminal, you are prompted to select from the current instances. Specify this option for scripts and other non-interactive use. Only one instance can be captured at a time.
  - name: --slot -s
    summary: |-
      Name of the web app slot. Defaults to the production slot.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_webapp_troubleshoot_collect_network-capture
metadata:
  description: Collect diagnostic artifacts from a Linux web app.
