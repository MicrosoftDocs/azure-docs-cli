### YamlMime:AzureCLIGroup
uid: az_webapp_silo
name: az webapp silo
summary: |-
  Manage Active Backup silos for a web app.
status: Preview
isPreview: true
previewOrExperimentalInfo: 'This command group is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus'
sourceType: Core
directCommands:
- uid: az_webapp_silo_create
  name: az webapp silo create
  summary: |-
    Create a web app silo.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'az webapp silo' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Core
  syntax: >-
    az webapp silo create --name
                          --primary-location
                          --resource-group
                          --silo
                          [--acquire-policy-token]
                          [--change-reference]
                          [--endpoint-status]
                          [--follow-last-known-good {0, 1, f, false, n, no, t, true, y, yes}]
                          [--location]
                          [--networking-override]
                          [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                          [--primary-site-name]
                          [--silo-location]
                          [--tags]
                          [--traffic-mode {Active, Passive, Unknown}]
  examples:
  - summary: |-
      Create a web app silo after creating its backing plan silo.
    syntax: az webapp silo create -g rg -n app --silo backup --location westus2 --primary-location eastus
  requiredParameters:
  - isRequired: true
    name: --name -n
    summary: |-
      Name of the app.
  - isRequired: true
    name: --primary-location
    summary: |-
      Region of the primary site.
    groupName: Properties Arguments
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --silo
    summary: |-
      The name of the SiteSilo.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --endpoint-status
    summary: |-
      Status of the silo traffic endpoint.
    groupName: Properties Arguments
  - name: --follow-last-known-good
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Whether the silo should follow the last known good revision.
    groupName: Properties Arguments
  - name: --location -l
    summary: |-
      The geo-location where the resource lives  When not specified, the location of the resource group will be used.
    groupName: Resource Arguments
  - name: --networking-override
    summary: |-
      Networking overrides for the silo.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --primary-site-name
    summary: |-
      Name of the primary site.
    groupName: Properties Arguments
  - name: --silo-location
    summary: |-
      Azure region of the site silo, retained for compatibility. When supplied, it must identify the same region as the required root location.
    groupName: Properties Arguments
  - name: --tags
    summary: |-
      Resource tags.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Resource Arguments
  - name: --traffic-mode
    acceptedValues: Active, Passive, Unknown
    summary: |-
      Traffic mode for the site silo's Traffic Manager profile.
    groupName: Properties Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
