### YamlMime:AzureCLIGroup
uid: az_webapp_config_egress
name: az webapp config egress
summary: |-
  Manage virtualized backend connections for a web app.
status: Preview
isPreview: true
previewOrExperimentalInfo: 'This command group is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus'
sourceType: Core
directCommands:
- uid: az_webapp_config_egress_set
  name: az webapp config egress set
  summary: |-
    Set the enabled state of a web app's egress configuration.
  description: |-
    Read the existing egress configuration, update its enabled state, and write it back while
    preserving all connections and their settings, identities, and credential injection configuration.
    --enabled is required. Use --enabled true to enable virtual connections or --enabled false to disable them.
    Add at least one connection with "az webapp config egress connection add" before enabling or disabling egress.
    Manage individual connections with "az webapp config egress connection add" and
    "az webapp config egress connection remove".
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'webapp config egress' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Core
  syntax: >-
    az webapp config egress set --enabled {false, true}
                                [--acquire-policy-token]
                                [--change-reference]
                                [--ids]
                                [--name]
                                [--resource-group]
                                [--slot]
                                [--subscription]
  examples:
  - summary: |-
      Enable virtual connections without modifying any connection definitions.
    syntax: az webapp config egress set --resource-group MyRG --name MyApp --enabled true
  - summary: |-
      Disable virtual connections for a deployment slot while preserving its connections.
    syntax: az webapp config egress set --resource-group MyRG --name MyApp --slot staging --enabled false
  - summary: |-
      Enable virtual connections using the flag without a value.
    syntax: az webapp config egress set --resource-group MyRG --name MyApp --enabled
  requiredParameters:
  - isRequired: true
    name: --enabled
    acceptedValues: false, true
    summary: |-
      Enable virtual connections with true or disable them with false.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --ids
    summary: |-
      One or more resource IDs (space-delimited). It should be a complete resource ID containing all information of 'Resource Id' arguments. You should provide either --ids or other 'Resource Id' arguments.
    groupName: Resource Id Arguments
  - name: --name -n
    summary: |-
      Name of the web app. If left unspecified, a name will be randomly generated. You can configure the default using `az configure --defaults web=<name>`.
    groupName: Resource Id Arguments
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
    groupName: Resource Id Arguments
  - name: --slot -s
    summary: |-
      The name of the slot. Default to the productions slot if not specified.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
    groupName: Resource Id Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_webapp_config_egress_show
  name: az webapp config egress show
  summary: |-
    Show the egress configuration for a web app.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'webapp config egress' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Core
  syntax: >-
    az webapp config egress show [--ids]
                                 [--name]
                                 [--resource-group]
                                 [--slot]
                                 [--subscription]
  examples:
  - summary: |-
      Show the enabled state and all connections.
    syntax: az webapp config egress show --resource-group MyRG --name MyApp
  - summary: |-
      Show only the connections for a deployment slot.
    syntax: az webapp config egress show --resource-group MyRG --name MyApp --slot staging --query properties.connections
  optionalParameters:
  - name: --ids
    summary: |-
      One or more resource IDs (space-delimited). It should be a complete resource ID containing all information of 'Resource Id' arguments. You should provide either --ids or other 'Resource Id' arguments.
    groupName: Resource Id Arguments
  - name: --name -n
    summary: |-
      Name of the web app. If left unspecified, a name will be randomly generated. You can configure the default using `az configure --defaults web=<name>`.
    groupName: Resource Id Arguments
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
    groupName: Resource Id Arguments
  - name: --slot -s
    summary: |-
      The name of the slot. Default to the productions slot if not specified.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
    groupName: Resource Id Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
