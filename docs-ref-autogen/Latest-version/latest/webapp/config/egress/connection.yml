  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'webapp config egress connection' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Core
  syntax: >-
    az webapp config egress connection show --connection-name
                                            [--ids]
                                            [--name]
                                            [--resource-group]
                                            [--slot]
                                            [--subscription]
  examples:
  - summary: |-
      Show the orders database connection.
    syntax: az webapp config egress connection show --resource-group MyRG --name MyApp --connection-name orders-db
  - summary: |-
      Show the setting roles for a connection in a deployment slot.
    syntax: az webapp config egress connection show --resource-group MyRG --name MyApp --slot staging --connection-name cache --query settings
  requiredParameters:
