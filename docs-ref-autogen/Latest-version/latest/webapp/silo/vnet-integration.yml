### YamlMime:AzureCLIGroup
uid: az_webapp_silo_vnet-integration
name: az webapp silo vnet-integration
summary: |-
  Manage a web app silo's virtual network connection.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'az webapp silo' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Core
directCommands:
- uid: az_webapp_silo_vnet-integration_add
  name: az webapp silo vnet-integration add
  summary: |-
    Add a virtual network connection to a web app silo.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'az webapp silo vnet-integration' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Core
  syntax: >-
    az webapp silo vnet-integration add --name
                                        --resource-group
                                        --silo
                                        [--acquire-policy-token]
                                        [--change-reference]
                                        [--kind]
                                        [--subnet]
                                        [--swift-supported {0, 1, f, false, n, no, t, true, y, yes}]
  requiredParameters:
  - isRequired: true
    name: --name -n
    summary: |-
      Name of the app.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --silo
    summary: |-
      Name of the silo.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --kind
    summary: |-
      Kind of resource.
    groupName: Resource Arguments
  - name: --subnet
    summary: |-
      The Virtual Network subnet's resource ID. This is the subnet that this Web App will join. This subnet must have a delegation to Microsoft.Web/serverFarms defined first.
    groupName: Properties Arguments
  - name: --swift-supported
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      A flag that specifies if the scale unit this Web App is on supports Swift integration.
    groupName: Properties Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
