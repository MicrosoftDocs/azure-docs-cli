uid: az_maintenance_scheduledevents
name: az maintenance scheduledevents
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **maintenance** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az maintenance scheduledevents** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Scheduled Events.
status: Preview
isPreview: true
previewOrExperimentalInfo: 'This command group is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus'
sourceType: Extension
directCommands:
- uid: az_maintenance_scheduledevents_acknowledge
  name: az maintenance scheduledevents acknowledge
  summary: |-
    Acknowledge a single ScheduledEvents Id.
  description: |-
    Approves the event on ScheduledEvents resource before timeout when it is safe to proceed. Supported resource types are VirtualMachines, VirtualMachineScaleSets, AvailabilitySets.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'az maintenance scheduledevents' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az maintenance scheduledevents acknowledge [--acquire-policy-token]
                                               [--change-reference]
                                               [--ids]
                                               [--name --resource-name]
                                               [--resource-group]
                                               [--resource-type]
                                               [--scheduled-events-id]
                                               [--subscription]
  examples:
  - summary: |-
      Acknowledge a single Scheduled Events on a VirtualMachines
    syntax: >-
      az maintenance scheduledevents acknowledge --resource-group {resourceGroupName} --resource-type "virtualMachines" --resource-name {VMname} --scheduled-events-id {scheduledEventsId} --subscription {subscriptionId}

      az maintenance scheduledevents acknowledge --ids /subscriptions/{subscriptionId}/resourcegroups/{resourceGroupName}/providers/microsoft.compute/virtualMachines/{resourceName}/providers/microsoft.maintenance/scheduledevents/{scheduledEventsId}
  - summary: |-
      Acknowledge a single Scheduled Events on a VirtualMachineScaleSets
    syntax: >-
      az maintenance scheduledevents acknowledge --resource-group {resourceGroup} --resource-type "virtualMachineScaleSets" --resource-name {VMSSname} --scheduled-events-id {scheduledEventsId} --subscription {subscriptionId}

      az maintenance scheduledevents acknowledge --ids /subscriptions/{subscriptionId}/resourcegroups/{resourceGroupName}/providers/microsoft.compute/virtualMachineScaleSets/{resourceName}/providers/microsoft.maintenance/scheduledevents/{scheduledEventsId}
  - summary: |-
      Acknowledge a single Scheduled Events on a AvailabilitySets
    syntax: >-
      az maintenance scheduledevents acknowledge--resource-group {resourceGroupName} --resource-type "availabilitySets"--resource-name {AVSetname} --scheduled-events-id {scheduledEventsId} --subscription {subscriptionId}

      az maintenance scheduledevents acknowledge --ids /subscriptions/{subscriptionId}/resourcegroups/{resourceGroupName}/providers/microsoft.compute/AvalabilitySets/{resourceName}/providers/microsoft.maintenance/scheduledevents/{scheduledEventsId}
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --ids
    summary: |-
      One or more resource IDs (space-delimited). It should be a complete resource ID containing all information of 'Resource Id' arguments. You should provide either --ids or other 'Resource Id' arguments.
    groupName: Resource Id Arguments
  - name: --name --resource-name -n
    summary: |-
      Resource Name.
    isPreview: true
    groupName: Resource Id Arguments
  - name: --resource-group -g
    summary: |-
      ResourceGroupName.
    isPreview: true
    groupName: Resource Id Arguments
  - name: --resource-type
    summary: |-
      Resource Type.
    isPreview: true
    groupName: Resource Id Arguments
  - name: --scheduled-events-id
    summary: |-
      ScheduledEvents Id. This is a GUID-formatted string (e.g. 00000000-0000-0000-0000-000000000000).
    isPreview: true
    groupName: Resource Id Arguments
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
    groupName: Resource Id Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_maintenance_scheduledevents_list-acknowledge
  name: az maintenance scheduledevents list-acknowledge
  summary: |-
    Acknowledge a list of ScheduledEvents Id.
  description: |-
    Approves list of events on ScheduledEvents resource before timeout when it is safe to procced. Supported resource types are VirtualMachines, VirtualMachineScaleSets, AvailabilitySets.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'az maintenance scheduledevents' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az maintenance scheduledevents list-acknowledge --value
                                                    [--acquire-policy-token]
                                                    [--change-reference]
                                                    [--ids]
                                                    [--name --resource-name]
                                                    [--resource-group]
                                                    [--resource-type]
                                                    [--subscription]
  examples:
  - summary: |-
      Acknowledge list of Scheduled Events on VirtualMachineScaleSets
    syntax: >-
      az maintenance scheduledevents list-acknowledge --resource-group {resourceGroupName} --resource-type "virtualMachineScaleSets" --resource-name {VMSSName} --subscription {subscriptionId} --value scheduledEventsId1 scheduledEventsId2 .... scheduledEventsIdN

      az maintenance scheduledevents list-acknowledge --resource-group {resourceGroupName} --resource-type "virtualMachineScaleSets" --resource-name {VMSSName} --subscription {subscriptionId} --value '["scheduledEventsId1","scheduledEventsId2",..,"scheduledEventsIdN"]'
  - summary: |-
      Acknowledge list of ScheduledEvents on AvailabilitySets
    syntax: >-
      az maintenance scheduledvents list-acknowledge --resource-group {resourceGroupName} --resource-type "availabilitySets"--resource-name {AvSetname} --value scheduledEventsId1 scheduledEventsId2 .... scheduledEventsIdN

      az maintenance scheduledvents list-acknowledge --resource-group {resourceGroupName} --resource-type "availabilitySets"--resource-name {AvSetname} --value '["scheduledEventsId1","scheduledEventsId2",..,"scheduledEventsIdN"]'
  - summary: |-
      Acknowledge a single Scheduled Events on VirtualMachines
    syntax: >-
      az maintenance scheduledevents list-acknowledge --resource-group {resourceGroupName} --resource-type "virtualMachines" --resource-name {VMname} --value scheduledEventsId1 scheduledEventsId2 .... scheduledEventsIdN

      az maintenance scheduledevents list-acknowledge --resource-group {resourceGroupName} --resource-type "virtualMachines" --resource-name {VMname} --value '["scheduledEventsId1","scheduledEventsId2",..,"scheduledEventsIdN"]'
  requiredParameters:
  - isRequired: true
    name: --value
    summary: |-
      The list of Scheduled Events Id  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    isPreview: true
