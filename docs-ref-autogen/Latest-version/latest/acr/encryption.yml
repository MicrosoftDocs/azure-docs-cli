### YamlMime:AzureCLIGroup
uid: az_acr_encryption
name: az acr encryption
summary: |-
  Manage customer-managed encryption for a container registry.
description: |-
  For more information, see http://aka.ms/acr/cmk.
status: GA
sourceType: Core
directCommands:
- uid: az_acr_encryption_rotate-key
  name: az acr encryption rotate-key
  summary: |-
    Rotate the customer-managed encryption key for a container registry.
  description: |-
    The registry must already have customer-managed key encryption enabled. The managed identity must have permission to use the new Azure Key Vault or Managed HSM key. For more information, see http://aka.ms/acr/cmk.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/acr/_help.py
  syntax: >-
    az acr encryption rotate-key --name
                                 [--acquire-policy-token]
                                 [--change-reference]
                                 [--identity]
                                 [--key-encryption-key]
                                 [--resource-group]
  examples:
  - summary: |-
      Rotate to a versionless Managed HSM key to enable automatic key rotation.
    syntax: az acr encryption rotate-key --name myregistry --resource-group MyResourceGroup --identity myidentity --key-encryption-key https://myhsm.managedhsm.azure.net/keys/mykey
  - summary: |-
      Rotate manually to a specific Azure Key Vault key version.
    syntax: az acr encryption rotate-key --name myregistry --resource-group MyResourceGroup --identity myidentity --key-encryption-key https://myvault.vault.azure.net/keys/mykey/00000000000000000000000000000000
  requiredParameters:
  - isRequired: true
    name: --name -n
    summary: |-
      The name of the container registry. It should be specified in lower case. You can configure the default registry name using `az configure --defaults acr=<registry name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --identity
    summary: |-
      Client id of managed identity, resource name or id of user assigned identity. Use '[system]' to refer to the system assigned identity.
  - name: --key-encryption-key
    summary: |-
      Azure Key Vault or Managed HSM key URI. To enable automated rotation, provide a versionless key URI. For manual rotation, provide a versioned key URI.
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_acr_encryption_show
  name: az acr encryption show
  summary: |-
    Show the container registry's encryption details.
