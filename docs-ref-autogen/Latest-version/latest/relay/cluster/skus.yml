### YamlMime:AzureCLIGroup
uid: az_relay_cluster_skus
name: az relay cluster skus
summary: |-
  Manage Skus.
status: GA
sourceType: Core
directCommands:
- uid: az_relay_cluster_skus_list
  name: az relay cluster skus list
  summary: |-
    List SKUs supported by a Relay cluster.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/relay/_help.py
  syntax: >-
    az relay cluster skus list --cluster-name
                               --resource-group
  examples:
  - summary: |-
      ClusterSkusGet
    syntax: az relay cluster skus list --resource-group myResourceGroup --cluster-name testCluster
  requiredParameters:
  - isRequired: true
    name: --cluster-name
    summary: |-
      The name of the Relay cluster.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_relay_cluster_skus_list
