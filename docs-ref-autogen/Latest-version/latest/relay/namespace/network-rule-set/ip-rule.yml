### YamlMime:AzureCLIGroup
uid: az_relay_namespace_network-rule-set_ip-rule
name: az relay namespace network-rule-set ip-rule
summary: |-
  Manage Azure Relay ip-rules in networkruleSet for namespace.
status: GA
sourceType: Core
directCommands:
- uid: az_relay_namespace_network-rule-set_ip-rule_add
  name: az relay namespace network-rule-set ip-rule add
  summary: |-
    Add an IP-Rule for network rule of namespace.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/relay/_help.py
  syntax: >-
    az relay namespace network-rule-set ip-rule add --name --namespace-name
                                                    --resource-group
                                                    [--acquire-policy-token]
                                                    [--change-reference]
                                                    [--ip-rule]
  examples:
  - summary: |-
      add an IP rule in NetworkruleSet for a namespace
    syntax: az relay namespace network-rule-set ip-rule add --resource-group myresourcegroup --namespace-name mynamespace --ip-rule ip-address=10.0.0.0/24 action=Allow
  requiredParameters:
  - isRequired: true
    name: --name --namespace-name -n
    summary: |-
      Name of the Namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --ip-rule
    summary: |-
      List of IP rules.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_relay_namespace_network-rule-set_ip-rule_remove
  name: az relay namespace network-rule-set ip-rule remove
  summary: |-
    Remove Ip-Rule from network rule of namespace.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/relay/_help.py
  syntax: >-
    az relay namespace network-rule-set ip-rule remove --name --namespace-name
                                                       --resource-group
                                                       [--acquire-policy-token]
                                                       [--change-reference]
                                                       [--ip-rule]
  examples:
  - summary: |-
      remove IP rule from NetworkruleSet for a namespace
    syntax: az relay namespace network-rule-set ip-rule remove --resource-group myresourcegroup --namespace-name mynamespace --ip-rule ip-address=10.0.0.0/24
  requiredParameters:
  - isRequired: true
    name: --name --namespace-name -n
    summary: |-
      Name of the Namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --ip-rule
    summary: |-
      List of IP rules.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
