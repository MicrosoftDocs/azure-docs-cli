### YamlMime:AzureCLIGroup
uid: az_relay_namespace
name: az relay namespace
summary: |-
  Manage Azure Relay Service Namespace.
status: GA
sourceType: Core
directCommands:
- uid: az_relay_namespace_create
  name: az relay namespace create
  summary: |-
    Create a Relay Service Namespace.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/relay/_help.py
  syntax: >-
    az relay namespace create --name
                              --resource-group
                              [--acquire-policy-token]
                              [--change-reference]
                              [--cluster-arm-id]
                              [--endpoint-connections --private-endpoint-connections]
                              [--location]
                              [--minimum-tls-version {1.2, 1.3}]
                              [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                              [--public-network-access {Disabled, Enabled, SecuredByPerimeter}]
                              [--sku {Standard}]
                              [--tags]
                              [--tier {Standard}]
  examples:
  - summary: |-
      Create a Relay Service Namespace.
    syntax: az relay namespace create --resource-group myresourcegroup --name mynamespace --location westus --tags tag1=value1 tag2=value2
  requiredParameters:
  - isRequired: true
    name: --name -n
    summary: |-
      Name of Namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --cluster-arm-id
    summary: |-
      Cluster ARM ID of the Namespace.
    groupName: Properties Arguments
  - name: --endpoint-connections --private-endpoint-connections
    summary: |-
      List of private endpoint connections.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --location -l
    summary: |-
      Location. Values from: `az account list-locations`. You can configure the default location using `az configure --defaults location=<location>`.  When not specified, the location of the resource group will be used.
  - name: --minimum-tls-version
    acceptedValues: 1.2, 1.3
    summary: |-
      The minimum TLS version for the namespace. Supported values are 1.2 and 1.3. The service defaults to 1.2 when the property is omitted. Existing namespaces configured with TLS 1.0 or 1.1 are reported as TLS 1.2.
    groupName: Properties Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --public-network-access
    defaultValue: Enabled
    acceptedValues: Disabled, Enabled, SecuredByPerimeter
    summary: |-
      This determines if traffic is allowed over public network. By default it is enabled.
    groupName: Properties Arguments
  - name: --sku
    acceptedValues: Standard
    summary: |-
      Name of this SKU.
    groupName: Sku Arguments
  - name: --tags
    summary: |-
      Space-separated tags: key[=value] [key[=value] ...]. Use "" to clear existing tags.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
  - name: --tier
    acceptedValues: Standard
    summary: |-
      The tier of this SKU.
    groupName: Sku Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
