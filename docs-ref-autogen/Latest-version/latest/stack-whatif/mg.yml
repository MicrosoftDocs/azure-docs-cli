### YamlMime:AzureCLIGroup
uid: az_stack-whatif_mg
name: az stack-whatif mg
summary: |-
  Manage Deployment stacks what-if results at management group scope.
status: GA
sourceType: Core
directCommands:
- uid: az_stack-whatif_mg_create
  name: az stack-whatif mg create
  summary: |-
    Create a deployment stack what-if result at management group scope.
  status: GA
  sourceType: Core
  syntax: >-
    az stack-whatif mg create --action-on-unmanage --aou {deleteAll, deleteResources, detachAll}
                              --deny-settings-mode --dm {denyDelete, denyWriteAndDelete, none}
                              --location
                              --management-group-id
                              --name
                              --retention-interval --ri
                              --stack-id
                              [--acquire-policy-token]
                              [--change-reference]
                              [--cs --deny-settings-apply-to-child-scopes]
                              [--deny-settings-excluded-actions --ea]
                              [--deny-settings-excluded-principals --ep]
                              [--deployment-subscription --ds]
                              [--description]
                              [--no-color]
                              [--no-pretty-print]
                              [--no-wait]
                              [--parameters]
                              [--query-string]
                              [--resources-without-delete-support --rwd {detach, fail}]
                              [--tags]
                              [--template-file]
                              [--template-spec]
                              [--template-uri]
                              [--validation-level --vl {Provider, ProviderNoRbac, Template}]
  examples:
  - summary: |-
      Perform a what-if on a deployment stack using template file and detach all unmanaged resources.
    syntax: az stack-whatif mg create --name StackName --management-group-id myMg --template-file simpleTemplate.json --parameters simpleTemplateParams.json --location westus2 --description description --deny-settings-mode None --action-on-unmanage detachAll --ri P5D --stack-id /providers/Microsoft.Management/myMg/providers/Microsoft.Resources/deploymentStacks/myMgStack
  - summary: |-
      Perform a what-if on a deployment stack with template spec.
    syntax: az stack-whatif mg create --name StackName --management-group-id myMg --template-spec TemplateSpecResourceIDWithVersion --location westus2 --description description --deny-settings-mode None --action-on-unmanage deleteResources --ri P5D --stack-id /providers/Microsoft.Management/myMg/providers/Microsoft.Resources/deploymentStacks/myMgStack
  - summary: |-
      Perform a what-if on a deployment stack using bicep file, delete all resources on unmanage, and remove color from the output.
    syntax: az stack-whatif mg create --name StackName --management-group-id myMg --no-color --action-on-unmanage deleteAll --template-file simple.bicep --location westus2 --description description --deny-settings-mode None --ri P5D --stack-id /providers/Microsoft.Management/myMg/providers/Microsoft.Resources/deploymentStacks/myMgStack
  - summary: |-
      Perform a what-if on a deployment stack using parameters from key/value pairs.
    syntax: az stack-whatif mg create --name StackName --management-group-id myMg --template-file simpleTemplate.json --location westus --description description --parameters simpleTemplateParams.json value1=foo value2=bar --deny-settings-mode None --action-on-unmanage deleteResources --ri P5D --stack-id /providers/Microsoft.Management/myMg/providers/Microsoft.Resources/deploymentStacks/myMgStack
  - summary: |-
      Perform a what-if on a deployment stack from a local template, using a parameter file, a remote parameter file, and selectively overriding key/value pairs.
    syntax: az stack-whatif mg create --name StackName --management-group-id myMg --template-file azuredeploy.json --parameters @params.json --parameters https://mysite/params.json --parameters MyValue=This MyArray=@array.json --location westus --deny-settings-mode None --action-on-unmanage deleteResources --ri P5D --stack-id /providers/Microsoft.Management/myMg/providers/Microsoft.Resources/deploymentStacks/myMgStack
  - summary: |-
      Perform a what-if on a deployment stack from a local template, using deny settings.
    syntax: az stack-whatif mg create --name StackName --management-group-id myMg --template-file azuredeploy.json --deny-settings-mode denyDelete --deny-settings-excluded-actions Microsoft.Compute/virtualMachines/write --deny-settings-excluded-principals "test1 test2" --location westus --action-on-unmanage deleteResources --ri P5D --stack-id /providers/Microsoft.Management/myMg/providers/Microsoft.Resources/deploymentStacks/myMgStack
  - summary: |-
      Perform a what-if on a deployment stack from a local template, apply deny settings to child scope.
    syntax: az stack-whatif mg create --name StackName --management-group-id myMg --template-file azuredeploy.json --deny-settings-mode denyDelete --deny-settings-excluded-actions Microsoft.Compute/virtualMachines/write --deny-settings-apply-to-child-scopes --location westus --action-on-unmanage deleteResources --ri P5D --stack-id /providers/Microsoft.Management/myMg/providers/Microsoft.Resources/deploymentStacks/myMgStack
  requiredParameters:
  - isRequired: true
    name: --action-on-unmanage --aou
    acceptedValues: deleteAll, deleteResources, detachAll
    summary: |-
      Defines what happens to resources that are no longer managed after the stack is updated or deleted.
  - isRequired: true
    name: --deny-settings-mode --dm
    acceptedValues: denyDelete, denyWriteAndDelete, none
    summary: |-
      Define which operations are denied on resources managed by the stack.
  - isRequired: true
    name: --location -l
    summary: |-
      The location to store the deployment stack what-if result.
  - isRequired: true
    name: --management-group-id -m
    summary: |-
      The management group ID to create a deployment stack what-if result in.
  - isRequired: true
    name: --name -n
    summary: |-
      The name of the deployment stack what-if result.
  - isRequired: true
    name: --retention-interval --ri
    summary: |-
      The retention interval for What-If results. The value must be in ISO 8601 format and between 1 day and 30 days.
  - isRequired: true
    name: --stack-id
    summary: |-
      The fully-qualified ID of the deployment stack to perform a what-if operation on.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --cs --deny-settings-apply-to-child-scopes
    defaultValue: "False"
    summary: |-
      DenySettings will be applied to child scopes.
  - name: --deny-settings-excluded-actions --ea
    summary: |-
      List of role-based management operations that are excluded from the denySettings. Up to 200 actions are permitted.
  - name: --deny-settings-excluded-principals --ep
    summary: |-
      List of AAD principal IDs excluded from the lock. Up to 5 principals are permitted.
  - name: --deployment-subscription --ds
    summary: |-
      The scope at which the initial deployment should be created. If a scope is not specified, it will default to the scope of the deployment stack.
  - name: --description
    summary: |-
      The description of deployment stack.
  - name: --no-color
    summary: |-
      Disable color in pretty-printed what-if results.
  - name: --no-pretty-print
    summary: |-
      Disable pretty-print for What-If results. When set, the output format type will be used.
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --parameters -p
    summary: |-
      Parameters may be supplied from a file using the `@{path}` syntax, a JSON string, or as `<KEY=VALUE>` pairs. Parameters are evaluated in order, so when a value is assigned twice, the latter value will be used. It is recommended that you supply your parameters file first, and then override selectively using KEY=VALUE syntax.
  - name: --query-string -q
    summary: |-
      The query string (a SAS token) to be used with the template-uri in the case of linked templates.
  - name: --resources-without-delete-support --rwd
    acceptedValues: detach, fail
    summary: |-
      Defines what happens to resources that do not support deletion when they are no longer managed by the stack.
  - name: --tags
    summary: |-
      Space-separated tags: key[=value] [key[=value] ...]. Use "" to clear existing tags.
  - name: --template-file -f
    summary: |-
      A path to a template file or Bicep file in the file system.
  - name: --template-spec -s
    summary: |-
      The template spec resource id.
  - name: --template-uri -u
    summary: |-
      A uri to a remote template file.
  - name: --validation-level --vl
    acceptedValues: Provider, ProviderNoRbac, Template
    summary: |-
      Validation level for the deployment stack. The default is 'Provider'.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_stack-whatif_mg_delete
  name: az stack-whatif mg delete
  summary: |-
    Delete a deployment stack what-if result from management group scope.
  status: GA
  sourceType: Core
  syntax: >-
    az stack-whatif mg delete --management-group-id
                              [--acquire-policy-token]
                              [--change-reference]
                              [--id]
                              [--name]
                              [--yes]
  examples:
  - summary: |-
      Delete a stack what-if result by name.
    syntax: az stack-whatif mg delete --name ResultName --management-group-id myMg
  - summary: |-
      Delete a stack what-if result by resource id.
    syntax: az stack-whatif mg delete --id /providers/Microsoft.Management/managementGroups/myMg/providers/Microsoft.Resources/deploymentStacksWhatIfResults/ResultName --management-group-id myMg
  requiredParameters:
  - isRequired: true
    name: --management-group-id -m
    summary: |-
      The management group ID to create a deployment stack what-if result in.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --id
    summary: |-
      The deployment stack what-if result resource ID.
  - name: --name -n
    summary: |-
      The name of the deployment stack what-if result.
  - name: --yes
    defaultValue: "False"
    summary: |-
      Do not prompt for confirmation.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_stack-whatif_mg_list
  name: az stack-whatif mg list
  summary: |-
    List all deployment stacks what-if results in a management group.
  status: GA
  sourceType: Core
  syntax: az stack-whatif mg list --management-group-id
  examples:
  - summary: |-
      List all stack what-if results in management group.
    syntax: az stack-whatif mg list --management-group-id myMg
  requiredParameters:
  - isRequired: true
    name: --management-group-id -m
    summary: |-
      The management group ID to create a deployment stack what-if result in.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_stack-whatif_mg_show
  name: az stack-whatif mg show
  summary: |-
    Get a deployment stack what-if result from management group scope.
  status: GA
  sourceType: Core
  syntax: >-
    az stack-whatif mg show --management-group-id
                            [--id]
                            [--name]
                            [--no-color]
                            [--no-pretty-print]
                            [--with-property-changes --wpc {false, true}]
  examples:
  - summary: |-
      Get a stack what-if result by name.
    syntax: az stack-whatif mg show --name ResultName --management-group-id myMg
  - summary: |-
      Get a stack what-if result by name without color.
    syntax: az stack-whatif mg show --name ResultName --management-group-id myMg --no-color
  - summary: |-
      Get JSON for a stack what-if result by name.
    syntax: az stack-whatif mg show --name ResultName --management-group-id myMg --no-pretty-print
  - summary: |-
      Get a stack what-if result by resource id.
    syntax: az stack-whatif mg show --id /providers/Microsoft.Management/managementGroups/myMg/providers/Microsoft.Resources/deploymentStacksWhatIfResults/ResultName --management-group-id myMg
  requiredParameters:
  - isRequired: true
    name: --management-group-id -m
    summary: |-
      The management group ID to create a deployment stack what-if result in.
  optionalParameters:
  - name: --id
    summary: |-
      The deployment stack what-if result resource ID.
  - name: --name -n
    summary: |-
      The name of the deployment stack what-if result.
  - name: --no-color
    summary: |-
      Disable color in pretty-printed what-if results.
  - name: --no-pretty-print
    summary: |-
      Disable pretty-print for What-If results. When set, the output format type will be used.
  - name: --with-property-changes --wpc
    acceptedValues: false, true
    summary: |-
      Flag to return the What-If results with resource property changes included.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
