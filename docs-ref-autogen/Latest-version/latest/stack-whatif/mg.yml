      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_stack-whatif_mg_create
- az_stack-whatif_mg_delete
- az_stack-whatif_mg_list
- az_stack-whatif_mg_show
metadata:
  description: Manage Deployment stacks what-if results at management group scope.
