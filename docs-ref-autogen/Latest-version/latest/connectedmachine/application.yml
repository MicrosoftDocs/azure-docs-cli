### YamlMime:AzureCLIGroup
uid: az_connectedmachine_application
name: az connectedmachine application
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **connectedmachine** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az connectedmachine application** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Application.
status: GA
sourceType: Extension
directCommands:
- uid: az_connectedmachine_application_add
  name: az connectedmachine application add
  summary: |-
    Create a VM application.
  status: GA
  sourceType: Extension
  syntax: >-
    az connectedmachine application add [--acquire-policy-token]
                                        [--application-name --name]
                                        [--change-reference]
                                        [--community-gallery-application-id --gallery-id]
                                        [--config-reference --configuration-reference]
                                        [--deployment-failure --treat-failure-as-deployment-failure {0, 1, f, false, n, no, t, true, y, yes}]
                                        [--ids]
                                        [--location]
                                        [--machine-name]
                                        [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                        [--order]
                                        [--package-id --package-reference-id]
                                        [--resource-group]
                                        [--shared-app-id --shared-gallery-application-id]
                                        [--subscription]
                                        [--tags]
  examples:
  - summary: |-
      Sample command for application add
    syntax: az connectedmachine application add --resource-group myResourceGroup --machine-name myMachine --application-name myApplication --location eastus2euap --tags "{environment:production}" --order 1 --package-reference-id /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/galleryResourceGroup/providers/Microsoft.Compute/galleries/myGallery/applications/myApplication/versions/1.0.0 --treat-failure-as-deployment-failure True
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --application-name --name -n
    summary: |-
      The name of the VM application. When creating the resource, this name must match the application name in the selected gallery reference.
    groupName: Resource Id Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --community-gallery-application-id --gallery-id
    summary: |-
      The identifier of a community gallery application version. Use `/communityGalleries/{communityGalleryPublicName}/applications/{applicationName}/versions/{versionName}`, where the version name can be `latest` or a specific version. This property is mutually exclusive with packageReferenceId and sharedGalleryApplicationId.
    groupName: Properties Arguments
  - name: --config-reference --configuration-reference
    summary: |-
      The URI of configuration data that replaces the package's default configuration.
    groupName: Properties Arguments
  - name: --deployment-failure --treat-failure-as-deployment-failure
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Indicates whether an application operation failure causes the deployment to fail.
    groupName: Properties Arguments
  - name: --ids
    summary: |-
      One or more resource IDs (space-delimited). It should be a complete resource ID containing all information of 'Resource Id' arguments. You should provide either --ids or other 'Resource Id' arguments.
    groupName: Resource Id Arguments
  - name: --location -l
    summary: |-
      The geo-location where the resource lives  When not specified, the location of the resource group will be used.
    groupName: Resource Arguments
  - name: --machine-name
    summary: |-
      The name of the hybrid machine.
    groupName: Resource Id Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --order
    summary: |-
      The order in which the application is installed.
    groupName: Properties Arguments
  - name: --package-id --package-reference-id
    summary: |-
      The resource ID of the gallery application version. The version name can be `latest` or a specific version. This property is mutually exclusive with sharedGalleryApplicationId and communityGalleryApplicationId.
    groupName: Properties Arguments
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
    groupName: Resource Id Arguments
  - name: --shared-app-id --shared-gallery-application-id
    summary: |-
      The identifier of a direct shared gallery application version. Use `/sharedGalleries/{sharedGalleryUniqueName}/applications/{applicationName}/versions/{versionName}`, where the version name can be `latest` or a specific version. This property is mutually exclusive with packageReferenceId and communityGalleryApplicationId.
    groupName: Properties Arguments
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
    groupName: Resource Id Arguments
  - name: --tags
    summary: |-
      Resource tags.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Resource Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
