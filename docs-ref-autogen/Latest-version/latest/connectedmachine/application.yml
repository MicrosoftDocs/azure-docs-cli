                                           [--force-string {0, 1, f, false, n, no, t, true, y, yes}]
                                           [--ids]
                                           [--machine-name]
                                           [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                           [--order]
                                           [--package-id --package-reference-id]
                                           [--remove]
                                           [--resource-group]
                                           [--set]
                                           [--shared-app-id --shared-gallery-application-id]
                                           [--subscription]
                                           [--tags]
  examples:
