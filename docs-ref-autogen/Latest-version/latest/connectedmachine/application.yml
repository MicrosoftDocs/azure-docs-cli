      Sample command for application update
    syntax: az connectedmachine application update --resource-group myResourceGroup --machine-name myMachine --application-name myApplication --tags "{environment:production}" --order 1 --package-reference-id /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/galleryResourceGroup/providers/Microsoft.Compute/galleries/myGallery/applications/myApplication/versions/1.0.0 --treat-failure-as-deployment-failure True
