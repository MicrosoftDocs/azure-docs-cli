### YamlMime:AzureCLIGroup
uid: az_connectedmachine_identity
name: az connectedmachine identity
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **connectedmachine** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az connectedmachine identity** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Identity.
status: GA
sourceType: Extension
directCommands:
- uid: az_connectedmachine_identity_assign
  name: az connectedmachine identity assign
  summary: |-
    Assign the user or system managed identities.
  status: GA
  sourceType: Extension
  syntax: >-
    az connectedmachine identity assign --machine-name --name
                                        --resource-group
                                        [--acquire-policy-token]
                                        [--change-reference]
                                        [--expand {instanceView}]
                                        [--mi-system-assigned --system-assigned]
                                        [--mi-user-assigned --user-assigned]
  examples:
  - summary: |-
      Sample command for connectedmachine identity assign
    syntax: az connectedmachine identity assign --resource-group myResourceGroup --machine-name myMachine --system-assigned --user-assigned /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/myResourceGroup/providers/Microsoft.ManagedIdentity/userAssignedIdentities/myIdentity
  requiredParameters:
  - isRequired: true
    name: --machine-name --name -n
    summary: |-
      The name of the hybrid machine.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --expand
    acceptedValues: instanceView
    summary: |-
      The expand expression to apply on the operation.
  - name: --mi-system-assigned --system-assigned
    summary: |-
      Set the system managed identity.
    groupName: Resource.identity Arguments
  - name: --mi-user-assigned --user-assigned
    summary: |-
      Set the user managed identities.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Resource.identity Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
