### YamlMime:AzureCLIGroup
uid: az_discovery_bookshelf
name: az discovery bookshelf
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **discovery** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az discovery bookshelf** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage bookshelves.
status: GA
sourceType: Extension
directCommands:
- uid: az_discovery_bookshelf_create
  name: az discovery bookshelf create
  summary: |-
    Create a Bookshelf.
  status: GA
  sourceType: Extension
  syntax: >-
    az discovery bookshelf create --bookshelf-name --name
                                  --resource-group
                                  [--acquire-policy-token]
                                  [--change-reference]
                                  [--customer-managed-keys {Disabled, Enabled}]
                                  [--key-vault-properties]
                                  [--la-cluster-id --log-analytics-cluster-id]
                                  [--location]
                                  [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                  [--pe-subnet-id --private-endpoint-subnet-id]
                                  [--public-network-access {Disabled, Enabled}]
                                  [--search-subnet-id]
                                  [--tags]
                                  [--workload-identities]
  examples:
  - summary: |-
      Create a bookshelf with private networking.
    syntax: az discovery bookshelf create --resource-group MyResourceGroup --name MyBookshelf --location eastus --pe-subnet-id /subscriptions/<subscription-id>/resourceGroups/MyNetworkRG/providers/Microsoft.Network/virtualNetworks/MyVnet/subnets/MyPrivateEndpointSubnet --search-subnet-id /subscriptions/<subscription-id>/resourceGroups/MyNetworkRG/providers/Microsoft.Network/virtualNetworks/MyVnet/subnets/MySearchSubnet --workload-identities "{'/subscriptions/<subscription-id>/resourceGroups/MyIdentityRG/providers/Microsoft.ManagedIdentity/userAssignedIdentities/MyUami':{}}" --tags SkipAssociateKeyVaultToNsp=True
  requiredParameters:
  - isRequired: true
    name: --bookshelf-name --name -n
    summary: |-
      The name of the Bookshelf.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --customer-managed-keys
    acceptedValues: Disabled, Enabled
    summary: |-
      Whether or not to use a customer managed key when encrypting data at rest.
    groupName: Properties Arguments
  - name: --key-vault-properties
    summary: |-
      The key to use for encrypting data at rest when customer managed keys are enabled. Required if Customer Managed Keys is enabled.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --la-cluster-id --log-analytics-cluster-id
    summary: |-
      The Log Analytics Cluster to use for debug logs. This is required when Customer Managed Keys are enabled.
    groupName: Properties Arguments
  - name: --location -l
    summary: |-
      The geo-location where the resource lives  When not specified, the location of the resource group will be used.
    groupName: Resource Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --pe-subnet-id --private-endpoint-subnet-id
    summary: |-
      Private Endpoint Subnet ID for private endpoint connections.
    groupName: Properties Arguments
  - name: --public-network-access
    acceptedValues: Disabled, Enabled
    summary: |-
      Whether or not public network access is allowed for this resource. For security reasons, it is recommended to disable it whenever possible.
    groupName: Properties Arguments
  - name: --search-subnet-id
    summary: |-
      Search Subnet ID for search resources.
    groupName: Properties Arguments
  - name: --tags
    summary: |-
      Resource tags.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Resource Arguments
  - name: --workload-identities
    summary: |-
      User assigned identity IDs to be used by knowledgebase workloads. The key value must be the resource ID of the identity resource.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
