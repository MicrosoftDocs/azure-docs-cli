### YamlMime:AzureCLIGroup
uid: az_discovery_supercomputer
name: az discovery supercomputer
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **discovery** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az discovery supercomputer** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage supercomputers and nodepools.
status: GA
sourceType: Extension
directCommands:
- uid: az_discovery_supercomputer_create
  name: az discovery supercomputer create
  summary: |-
    Create a Supercomputer.
  status: GA
  sourceType: Extension
  syntax: >-
    az discovery supercomputer create --name --supercomputer-name
                                      --resource-group
                                      [--acquire-policy-token]
                                      [--change-reference]
                                      [--customer-managed-keys {Disabled, Enabled}]
                                      [--disk-encryption-set-id]
                                      [--identities]
                                      [--identity]
                                      [--la-cluster-id --log-analytics-cluster-id]
                                      [--location]
                                      [--management-subnet-id]
                                      [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                      [--outbound-type {LoadBalancer, None}]
                                      [--subnet-id]
                                      [--system-sku {Standard_D4s_v4, Standard_D4s_v5, Standard_D4s_v6}]
                                      [--tags]
  examples:
  - summary: |-
      Create a supercomputer with user-assigned identities.
    syntax: az discovery supercomputer create --resource-group MyResourceGroup --name MySupercomputer --location eastus --subnet-id /subscriptions/<subscription-id>/resourceGroups/MyNetworkRG/providers/Microsoft.Network/virtualNetworks/MyVnet/subnets/MySupercomputerSubnet --identities "{cluster-identity:{id:'/subscriptions/<subscription-id>/resourceGroups/MyIdentityRG/providers/Microsoft.ManagedIdentity/userAssignedIdentities/MyUami'},kubelet-identity:{id:'/subscriptions/<subscription-id>/resourceGroups/MyIdentityRG/providers/Microsoft.ManagedIdentity/userAssignedIdentities/MyUami'},workload-identities:{'/subscriptions/<subscription-id>/resourceGroups/MyIdentityRG/providers/Microsoft.ManagedIdentity/userAssignedIdentities/MyUami':{}}}" --tags SkipAssociateKeyVaultToNsp=True
  requiredParameters:
  - isRequired: true
    name: --name --supercomputer-name -n
    summary: |-
      The name of the Supercomputer.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --customer-managed-keys
    acceptedValues: Disabled, Enabled
    summary: |-
      Whether or not to use a customer managed key when encrypting data at rest.
    groupName: Properties Arguments
  - name: --disk-encryption-set-id
    summary: |-
      Disk Encryption Set ID to use for Customer Managed Keys encryption. Required if Customer Managed Keys is enabled.
    groupName: Properties Arguments
  - name: --identities
    summary: |-
      Dictionary of identity properties.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --identity
    summary: |-
      The managed service identities assigned to this resource.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Resource Arguments
  - name: --la-cluster-id --log-analytics-cluster-id
    summary: |-
      The Log Analytics Cluster to use for debug logs. This is required when Customer Managed Keys are enabled.
    groupName: Properties Arguments
  - name: --location -l
    summary: |-
      The geo-location where the resource lives  When not specified, the location of the resource group will be used.
    groupName: Resource Arguments
  - name: --management-subnet-id
    summary: |-
      System Subnet ID associated with AKS apiserver. Must be delegated to Microsoft.ContainerService/managedClusters.     It should have connectivity to the system subnet and nodepool subnets.
    groupName: Properties Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --outbound-type
    defaultValue: LoadBalancer
    acceptedValues: LoadBalancer, None
    summary: |-
      Network egress type provisioned for the supercomputer workloads.     Defaults to LoadBalancer if not specified.     If None is specified, the customer is responsible for providing outbound connectivity for Supercomputer functionality.
    groupName: Properties Arguments
  - name: --subnet-id
    summary: |-
      System Subnet ID associated with managed NodePool for system resources.     It should have connectivity to the child NodePool subnets.
    groupName: Properties Arguments
  - name: --system-sku
    acceptedValues: Standard_D4s_v4, Standard_D4s_v5, Standard_D4s_v6
    summary: |-
      The SKU to use for the system node pool.
    groupName: Properties Arguments
  - name: --tags
    summary: |-
      Resource tags.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Resource Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
