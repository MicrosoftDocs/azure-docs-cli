### YamlMime:AzureCLIGroup
uid: az_discovery_workspace_private-endpoint-connection
name: az discovery workspace private-endpoint-connection
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **discovery** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az discovery workspace private-endpoint-connection** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Private Endpoint Connection.
status: GA
sourceType: Extension
directCommands:
- uid: az_discovery_workspace_private-endpoint-connection_create
  name: az discovery workspace private-endpoint-connection create
  summary: |-
    Create the specified private endpoint connection.
  status: GA
  sourceType: Extension
  syntax: >-
    az discovery workspace private-endpoint-connection create --name --private-endpoint-connection-name
                                                              --resource-group
                                                              --workspace-name
                                                              [--acquire-policy-token]
                                                              [--change-reference]
                                                              [--connection-state --private-link-service-connection-state]
                                                              [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
  examples:
  - summary: |-
      Approve a workspace private endpoint connection.
    syntax: az discovery workspace private-endpoint-connection create --resource-group MyResourceGroup --workspace-name MyWorkspace --name MyPrivateEndpointConnection --connection-state status=Approved description="Approved for private access"
  requiredParameters:
  - isRequired: true
    name: --name --private-endpoint-connection-name -n
    summary: |-
      The name of the private endpoint connection associated with the Azure resource.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --workspace-name
    summary: |-
      The name of the Workspace.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --connection-state --private-link-service-connection-state
    summary: |-
      A collection of information about the state of the connection between service consumer and provider.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
