### YamlMime:AzureCLIGroup
uid: az_discovery_supercomputer_node-pool
name: az discovery supercomputer node-pool
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **discovery** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az discovery supercomputer node-pool** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Node Pool.
status: GA
sourceType: Extension
directCommands:
- uid: az_discovery_supercomputer_node-pool_create
  name: az discovery supercomputer node-pool create
  summary: |-
    Create a NodePool.
  status: GA
  sourceType: Extension
  syntax: >-
    az discovery supercomputer node-pool create --name --node-pool-name
                                                --resource-group
                                                --supercomputer-name
                                                [--acquire-policy-token]
                                                [--change-reference]
                                                [--ic-lower-threshold --image-cache-lower-threshold]
                                                [--ic-upper-threshold --image-cache-upper-threshold]
                                                [--location]
                                                [--max-node-count]
                                                [--min-node-count]
                                                [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                                [--os-disk-size-gb]
                                                [--scale-set-priority {Regular, Spot}]
                                                [--subnet-id]
                                                [--tags]
                                                [--vm-size {Standard_NC16as_T4_v3, Standard_NC24ads_A100_v4, Standard_NC48ads_A100_v4, Standard_NC4as_T4_v3, Standard_NC64as_T4_v3, Standard_NC8as_T4_v3, Standard_NC96ads_A100_v4, Standard_ND40rs_v2, Standard_NV12ads_A10_v5, Standard_NV24ads_A10_v5, Standard_NV36adms_A10_v5, Standard_NV36ads_A10_v5, Standard_NV6ads_A10_v5, Standard_NV72ads_A10_v5}]
  examples:
  - summary: |-
      Create a GPU node pool for a supercomputer.
    syntax: az discovery supercomputer node-pool create --resource-group MyResourceGroup --supercomputer-name MySupercomputer --name MyNodePool --location eastus --subnet-id /subscriptions/<subscription-id>/resourceGroups/MyNetworkRG/providers/Microsoft.Network/virtualNetworks/MyVnet/subnets/MyNodePoolSubnet --vm-size Standard_NC4as_T4_v3 --min-node-count 1 --max-node-count 4
  requiredParameters:
  - isRequired: true
    name: --name --node-pool-name -n
    summary: |-
      The name of the NodePool.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --supercomputer-name
    summary: |-
      The name of the Supercomputer.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --ic-lower-threshold --image-cache-lower-threshold
    defaultValue: "40"
    summary: |-
      The percent of disk usage before which image garbage collection is never run. This cannot be set higher than imageCacheUpperThreshold. The default is 40%.
    groupName: Properties Arguments
  - name: --ic-upper-threshold --image-cache-upper-threshold
    defaultValue: "60"
    summary: |-
      The percent of disk usage after which image garbage collection is guaranteed to run. The default is 60%.
    groupName: Properties Arguments
  - name: --location -l
    summary: |-
      The geo-location where the resource lives  When not specified, the location of the resource group will be used.
    groupName: Resource Arguments
  - name: --max-node-count
    summary: |-
      The maximum number of nodes.
    groupName: Properties Arguments
  - name: --min-node-count
    defaultValue: "0"
    summary: |-
      The minimum number of nodes.
    groupName: Properties Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --os-disk-size-gb
    defaultValue: "120"
    summary: |-
      The size of the OS disk in GB. If not specified, the default is 120 GB.
    groupName: Properties Arguments
  - name: --scale-set-priority
    defaultValue: Regular
    acceptedValues: Regular, Spot
    summary: |-
      The Virtual Machine Scale Set priority. If not specified, the default is 'Regular'.
    groupName: Properties Arguments
  - name: --subnet-id
    summary: |-
      The node pool subnet.
    groupName: Properties Arguments
  - name: --tags
    summary: |-
      Resource tags.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Resource Arguments
  - name: --vm-size
    acceptedValues: Standard_NC16as_T4_v3, Standard_NC24ads_A100_v4, Standard_NC48ads_A100_v4, Standard_NC4as_T4_v3, Standard_NC64as_T4_v3, Standard_NC8as_T4_v3, Standard_NC96ads_A100_v4, Standard_ND40rs_v2, Standard_NV12ads_A10_v5, Standard_NV24ads_A10_v5, Standard_NV36adms_A10_v5, Standard_NV36ads_A10_v5, Standard_NV6ads_A10_v5, Standard_NV72ads_A10_v5
    summary: |-
      The size of the underlying Azure VM.
    groupName: Properties Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
