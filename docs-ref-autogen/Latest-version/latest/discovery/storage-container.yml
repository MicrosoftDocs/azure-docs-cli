### YamlMime:AzureCLIGroup
uid: az_discovery_storage-container
name: az discovery storage-container
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **discovery** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az discovery storage-container** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage storage containers and storage assets.
status: GA
sourceType: Extension
directCommands:
- uid: az_discovery_storage-container_create
  name: az discovery storage-container create
  summary: |-
    Create a StorageContainer.
  status: GA
  sourceType: Extension
  syntax: >-
    az discovery storage-container create --name --storage-container-name
                                          --resource-group
                                          [--acquire-policy-token]
                                          [--change-reference]
                                          [--location]
                                          [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                          [--storage-store]
                                          [--tags]
  examples:
  - summary: |-
      Create a storage container backed by Azure Storage Blob.
    syntax: az discovery storage-container create --resource-group MyResourceGroup --name MyStorageContainer --location eastus --storage-store azure-storage-blob="{storage-account-id:/subscriptions/<subscription-id>/resourceGroups/MyResourceGroup/providers/Microsoft.Storage/storageAccounts/MyStorageAccount}"
  requiredParameters:
  - isRequired: true
    name: --name --storage-container-name -n
    summary: |-
      The name of the StorageContainer.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --location -l
    summary: |-
      The geo-location where the resource lives  When not specified, the location of the resource group will be used.
    groupName: Resource Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --storage-store
    summary: |-
      Storage store properties  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --tags
    summary: |-
      Resource tags.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Resource Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
