### YamlMime:AzureCLIGroup
uid: az_discovery_workspace
name: az discovery workspace
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **discovery** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az discovery workspace** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage workspaces, projects, and chat model deployments.
status: GA
sourceType: Extension
directCommands:
- uid: az_discovery_workspace_create
  name: az discovery workspace create
  summary: |-
    Create a Workspace.
  status: GA
  sourceType: Extension
  syntax: >-
    az discovery workspace create --name --workspace-name
                                  --resource-group
                                  [--acquire-policy-token]
                                  [--agent-subnet-id]
                                  [--change-reference]
                                  [--customer-managed-keys {Disabled, Enabled}]
                                  [--key-vault-properties]
                                  [--la-cluster-id --log-analytics-cluster-id]
                                  [--location]
                                  [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                  [--pe-subnet-id --private-endpoint-subnet-id]
                                  [--public-network-access {Disabled, Enabled}]
                                  [--supercomputer-ids]
                                  [--tags]
                                  [--workspace-identity]
                                  [--workspace-subnet-id]
  examples:
  - summary: |-
      Create a workspace with dedicated subnets and a user-assigned identity.
    syntax: az discovery workspace create --resource-group MyResourceGroup --name MyWorkspace --location eastus --workspace-identity id=/subscriptions/<subscription-id>/resourceGroups/MyIdentityRG/providers/Microsoft.ManagedIdentity/userAssignedIdentities/MyWorkspaceIdentity --pe-subnet-id /subscriptions/<subscription-id>/resourceGroups/MyNetworkRG/providers/Microsoft.Network/virtualNetworks/MyVnet/subnets/MyPrivateEndpointSubnet --agent-subnet-id /subscriptions/<subscription-id>/resourceGroups/MyNetworkRG/providers/Microsoft.Network/virtualNetworks/MyVnet/subnets/MyAgentSubnet --workspace-subnet-id /subscriptions/<subscription-id>/resourceGroups/MyNetworkRG/providers/Microsoft.Network/virtualNetworks/MyVnet/subnets/MyWorkspaceSubnet --tags SkipAssociateKeyVaultToNsp=True networkIsolation=true
  requiredParameters:
  - isRequired: true
    name: --name --workspace-name -n
    summary: |-
      The name of the Workspace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --agent-subnet-id
    summary: |-
      Agent Subnet ID for agent resources.
    groupName: Properties Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --customer-managed-keys
    acceptedValues: Disabled, Enabled
    summary: |-
      Whether or not to use a customer managed key when encrypting data at rest.
    groupName: Properties Arguments
  - name: --key-vault-properties
    summary: |-
      The key to use for encrypting data at rest when customer managed keys are enabled.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --la-cluster-id --log-analytics-cluster-id
    summary: |-
      The Log Analytics Cluster to use for debug logs. This is required when Customer Managed Keys are enabled.
    groupName: Properties Arguments
  - name: --location -l
    summary: |-
      The geo-location where the resource lives  When not specified, the location of the resource group will be used.
    groupName: Resource Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --pe-subnet-id --private-endpoint-subnet-id
    summary: |-
      Private Endpoint Subnet ID for private endpoint connections.
    groupName: Properties Arguments
  - name: --public-network-access
    acceptedValues: Disabled, Enabled
    summary: |-
      Whether or not public network access is allowed for this resource. For security reasons, it is recommended to disable it whenever possible.
    groupName: Properties Arguments
  - name: --supercomputer-ids
    summary: |-
      List of linked SuperComputers.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --tags
    summary: |-
      Resource tags.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Resource Arguments
  - name: --workspace-identity
    summary: |-
      Identity IDs used for leveraging Workspace resources.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --workspace-subnet-id
    summary: |-
      Function Subnet ID for workspace resources.
    groupName: Properties Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
