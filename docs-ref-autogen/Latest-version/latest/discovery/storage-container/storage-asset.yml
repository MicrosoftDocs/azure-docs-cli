### YamlMime:AzureCLIGroup
uid: az_discovery_storage-container_storage-asset
name: az discovery storage-container storage-asset
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **discovery** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az discovery storage-container storage-asset** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Storage Asset.
status: GA
sourceType: Extension
directCommands:
- uid: az_discovery_storage-container_storage-asset_create
  name: az discovery storage-container storage-asset create
  summary: |-
    Create a StorageAsset.
  status: GA
  sourceType: Extension
  syntax: >-
    az discovery storage-container storage-asset create --name --storage-asset-name
                                                        --resource-group
                                                        --storage-container-name
                                                        [--acquire-policy-token]
                                                        [--change-reference]
                                                        [--description]
                                                        [--location]
                                                        [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                                        [--path]
                                                        [--tags]
  examples:
  - summary: |-
      Create a storage asset in a storage container.
    syntax: az discovery storage-container storage-asset create --resource-group MyResourceGroup --storage-container-name MyStorageContainer --name MyStorageAsset --location eastus --description "Curated genomics dataset" --path data/genomics
  requiredParameters:
  - isRequired: true
    name: --name --storage-asset-name -n
    summary: |-
      The name of the StorageAsset.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --storage-container-name
    summary: |-
      The name of the StorageContainer.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --description
    summary: |-
      The description.
    groupName: Properties Arguments
  - name: --location -l
    summary: |-
      The geo-location where the resource lives  When not specified, the location of the resource group will be used.
    groupName: Resource Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --path
    summary: |-
      The path to the data within its parent container. This should be relative to the root of the parent container.
    groupName: Properties Arguments
  - name: --tags
    summary: |-
      Resource tags.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Resource Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
