- uid: az_aimanager_get-credentials
  name: az aimanager get-credentials
  summary: |-
    Get access credentials for an AI Manager.
  description: |-
    Retrieves the Kubernetes configuration for an AI Manager and merges it into the local
    kubeconfig file (default ~/.kube/config), similar to 'az aks get-credentials'.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'aimanager' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az aimanager get-credentials --name
                                 --resource-group
                                 [--acquire-policy-token]
                                 [--aks-custom-headers]
                                 [--change-reference]
                                 [--context-name]
                                 [--file]
                                 [--overwrite-existing]
  examples:
  - summary: |-
      Get the credentials for an AI Manager and merge into the default kubeconfig
    syntax: az aimanager get-credentials --name my-ai-manager -g myrg
  - summary: |-
      Print the credentials to stdout
    syntax: az aimanager get-credentials --name my-ai-manager -g myrg -f -
  requiredParameters:
  - isRequired: true
    name: --name -n
    summary: |-
      The name of the AI Manager resource.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --aks-custom-headers
    summary: |-
      Comma-separated key=value pairs to specify custom headers.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --context-name
    summary: |-
      If specified, overwrite the default context name.
  - name: --file -f
    defaultValue: ~\.kube\config
    summary: |-
      Kubernetes configuration file to update. Use "-" to print YAML to stdout instead.
  - name: --overwrite-existing
    defaultValue: "False"
    summary: |-
      Overwrite any existing cluster entry with the same name.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
