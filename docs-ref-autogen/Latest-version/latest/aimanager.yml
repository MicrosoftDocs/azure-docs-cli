### YamlMime:AzureCLIGroup
uid: az_aimanager
name: az aimanager
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **aimanager** extension for the Azure CLI (version 2.61.0 or higher). The extension will automatically install the first time you run an **az aimanager** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage AI Manager resources for inference on AKS.
status: Preview
isPreview: true
previewOrExperimentalInfo: 'This command group is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus'
sourceType: Extension
directCommands:
- uid: az_aimanager_create
  name: az aimanager create
  summary: |-
    Create an AI Manager resource.
  description: |-
    Once creation succeeds the caller is granted the built-in 'Azure AIManager Contributor' and 'Azure AIManager and namespace RBAC Reader' roles on the new AI Manager (best-effort; requires Owner or User Access Administrator). Skipped with --no-wait.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'aimanager' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az aimanager create --name
                        --resource-group
                        [--acquire-policy-token]
                        [--aks-custom-headers]
                        [--change-reference]
                        [--delete-policy {Delete, Keep}]
                        [--location]
                        [--no-wait]
                        [--tags]
  examples:
  - summary: |-
      Create an AI Manager
    syntax: az aimanager create --name my-ai-manager -g myrg -l eastus2
  - summary: |-
      Create an AI Manager with the Keep delete policy
    syntax: az aimanager create --name my-ai-manager -g myrg -l eastus2 --delete-policy Keep
  requiredParameters:
  - isRequired: true
    name: --name -n
    summary: |-
      The name of the AI Manager resource.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --aks-custom-headers
    summary: |-
      Comma-separated key=value pairs to specify custom headers.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --delete-policy
    acceptedValues: Delete, Keep
    summary: |-
      Delete options of the AI Manager. Defaults to Delete.
  - name: --location -l
    summary: |-
      Location. Values from: `az account list-locations`. You can configure the default location using `az configure --defaults location=<location>`.
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --tags
    summary: |-
      The tags to set to the AI Manager.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
