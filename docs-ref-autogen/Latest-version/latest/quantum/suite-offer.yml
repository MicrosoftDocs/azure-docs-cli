### YamlMime:AzureCLIGroup
uid: az_quantum_suite-offer
name: az quantum suite-offer
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **quantum** extension for the Azure CLI (version 2.73.0 or higher). The extension will automatically install the first time you run an **az quantum suite-offer** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  View Azure Quantum suite offers available to the subscription.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'quantum' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_quantum_suite-offer_list
  name: az quantum suite-offer list
  summary: |-
    List the Azure Quantum suite offers available to the current subscription, including provider ID, name, company, and location.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'quantum' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: az quantum suite-offer list
  examples:
  - summary: |-
      List all suite offers available to the current subscription.
    syntax: az quantum suite-offer list -o table
  - summary: |-
      List the provider ID and location of each available suite offer.
    syntax: az quantum suite-offer list --query "[].{provider:properties.providerId, location:properties.location}" -o table
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_quantum_suite-offer_quotas
  name: az quantum suite-offer quotas
  summary: |-
    View quota allocations and their consumed usages for a suite offer in the current subscription.
  description: |-
    Returns the v2 quota allocations (limits) for each target of the suite offer together
    with the consumed usages. Each entry reports the allocated and used standard and high priority
    minutes. Table output converts these values to hours. Missing usage values are returned as 0.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'quantum' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az quantum suite-offer quotas --provider-id
                                  [--acquire-policy-token]
                                  [--change-reference]
  examples:
  - summary: |-
      View the quota usages for a suite offer.
    syntax: az quantum suite-offer quotas --provider-id MyProvider -o table
  - summary: |-
      View the raw quota usage details for a suite offer.
    syntax: az quantum suite-offer quotas -p MyProvider
  requiredParameters:
  - isRequired: true
    name: --provider-id -p
    summary: |-
      Identifier of an Azure Quantum provider.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_quantum_suite-offer_list
