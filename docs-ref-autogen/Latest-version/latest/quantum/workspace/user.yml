### YamlMime:AzureCLIGroup
uid: az_quantum_workspace_user
name: az quantum workspace user
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **quantum** extension for the Azure CLI (version 2.73.0 or higher). The extension will automatically install the first time you run an **az quantum workspace user** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage users of an Azure Quantum workspace.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'quantum' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_quantum_workspace_user_add
  name: az quantum workspace user add
  summary: |-
    Grant a user access to an Azure Quantum workspace.
  description: |-
    Assigns the 'Quantum Workspace Data Contributor' role at the scope of the given (or current) Azure Quantum workspace. If the user already has the 'Quantum Workspace Data Contributor' or 'Quantum Workspace Owner' role at the workspace, including access inherited from the resource group or subscription, the command returns an existing assignment without creating a new one.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'quantum' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az quantum workspace user add --email
                                  [--acquire-policy-token]
                                  [--change-reference]
                                  [--resource-group]
                                  [--workspace-name]
  examples:
  - summary: |-
      Grant a user access to a workspace using their email address.
    syntax: >-
      az quantum workspace user add -g MyResourceGroup -w MyWorkspace \
          --email user@contoso.com
  requiredParameters:
  - isRequired: true
    name: --email
    summary: |-
      The email address of the user to grant or remove access.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - name: --workspace-name -w
    summary: |-
      Name of the Quantum Workspace. You can configure the default workspace using `az quantum workspace set`.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_quantum_workspace_user_list
  name: az quantum workspace user list
  summary: |-
    List the users with access to an Azure Quantum workspace.
  description: |-
    Lists user principals (excluding groups and service principals) assigned the 'Quantum Workspace Owner' or 'Quantum Workspace Data Contributor' role for the given (or current) workspace. Each user's Name and Email are resolved from Microsoft Graph. By default this includes access inherited from the parent resource group and subscription; pass '--include-inherited false' to list only assignments scoped directly to the workspace.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'quantum' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az quantum workspace user list [--include-inherited {false, true}]
                                   [--resource-group]
                                   [--workspace-name]
  examples:
  - summary: |-
      List all users with access to a workspace.
    syntax: az quantum workspace user list -g MyResourceGroup -w MyWorkspace
  - summary: |-
      List only users assigned directly on the workspace (exclude inherited access).
    syntax: az quantum workspace user list -g MyResourceGroup -w MyWorkspace --include-inherited false
  optionalParameters:
  - name: --include-inherited
    defaultValue: "True"
    acceptedValues: false, true
    summary: |-
      Include role assignments inherited from the parent resource group and subscription. Enabled by default; use "--include-inherited false" to list only assignments scoped directly to the workspace.
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - name: --workspace-name -w
    summary: |-
      Name of the Quantum Workspace. You can configure the default workspace using `az quantum workspace set`.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_quantum_workspace_user_remove
  name: az quantum workspace user remove
  summary: |-
    Remove a user's access to an Azure Quantum workspace.
  description: |-
    Removes the 'Quantum Workspace Data Contributor' and 'Quantum Workspace Owner' role assignments scoped directly to the given (or current) Azure Quantum workspace. Role assignments inherited from the resource group or subscription must be removed at that scope.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'quantum' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az quantum workspace user remove --email
                                     [--acquire-policy-token]
                                     [--change-reference]
                                     [--resource-group]
                                     [--workspace-name]
                                     [--yes]
  examples:
  - summary: |-
      Remove a user's access to a workspace using their email address.
    syntax: >-
      az quantum workspace user remove -g MyResourceGroup -w MyWorkspace \
          --email user@contoso.com
  requiredParameters:
  - isRequired: true
    name: --email
    summary: |-
      The email address of the user to grant or remove access.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - name: --workspace-name -w
    summary: |-
      Name of the Quantum Workspace. You can configure the default workspace using `az quantum workspace set`.
  - name: --yes -y
    defaultValue: "False"
    summary: |-
      Do not prompt for confirmation.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
