### YamlMime:AzureCLIGroup
uid: az_quantum_job_file
name: az quantum job file
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **quantum** extension for the Azure CLI (version 2.73.0 or higher). The extension will automatically install the first time you run an **az quantum job file** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage a quantum job's associated files.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'quantum' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_quantum_job_file_download
  name: az quantum job file download
  summary: |-
    Download a file from a job's output storage container.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'quantum' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az quantum job file download --file-name
                                 --job-id
                                 --resource-group
                                 --workspace-name
                                 [--acquire-policy-token]
                                 [--change-reference]
                                 [--dest]
  examples:
  - summary: |-
      Download a file from an Azure Quantum job's output container.
    syntax: >-
      az quantum job file download -g MyResourceGroup -w MyWorkspace \
          -j yyyyyyyy-yyyy-yyyy-yyyy-yyyyyyyyyyyy -n rawOutputData
  - summary: |-
      Download a file to a specific directory.
    syntax: >-
      az quantum job file download -g MyResourceGroup -w MyWorkspace \
          -j yyyyyyyy-yyyy-yyyy-yyyy-yyyyyyyyyyyy -n rawOutputData --dest ./downloads
  requiredParameters:
  - isRequired: true
    name: --file-name -n
    summary: |-
      The name of the file (blob) in the job's output storage container.
  - isRequired: true
    name: --job-id -j
    summary: |-
      Job unique identifier in GUID format.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --workspace-name -w
    summary: |-
      Name of the Quantum Workspace. You can configure the default workspace using `az quantum workspace set`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --dest
    summary: |-
      Destination directory. The file is saved using its blob name in this directory (the current directory if omitted).
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_quantum_job_file_list
  name: az quantum job file list
  summary: |-
    List the files stored in a job's output storage container.
  description: |-
    Returns one entry per file, each reporting the file name, its size in bytes, and the last-modified time as an ISO 8601 timestamp. Use "-o table" for a condensed view.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'quantum' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az quantum job file list --job-id
                             --resource-group
                             --workspace-name
  examples:
  - summary: |-
      List the files in an Azure Quantum job's output container.
    syntax: >-
      az quantum job file list -g MyResourceGroup -w MyWorkspace \
          -j yyyyyyyy-yyyy-yyyy-yyyy-yyyyyyyyyyyy -o table
  requiredParameters:
  - isRequired: true
    name: --job-id -j
    summary: |-
      Job unique identifier in GUID format.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --workspace-name -w
    summary: |-
      Name of the Quantum Workspace. You can configure the default workspace using `az quantum workspace set`.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_quantum_job_file_download
- az_quantum_job_file_list
metadata:
  description: Manage a quantum job's associated files.
