### YamlMime:AzureCLIGroup
uid: az_quantum_suite-offer_target
name: az quantum suite-offer target
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **quantum** extension for the Azure CLI (version 2.73.0 or higher). The extension will automatically install the first time you run an **az quantum suite-offer target** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  List targets available through an Azure Quantum suite offer.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'quantum' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_quantum_suite-offer_target_list
  name: az quantum suite-offer target list
  summary: |-
    List the targets and their status available through a suite offer, without requiring a workspace.
  description: |-
    Returns each target exposed by the suite offer together with its current
    availability and overall average queue time. Standard- and High-priority average queue times
    are also returned when supplied by the provider. Data is resolved directly from the data plane
    without requiring an Azure Quantum workspace.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'quantum' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: az quantum suite-offer target list --provider-id
  examples:
  - summary: |-
      List the targets available in a suite offer.
    syntax: az quantum suite-offer target list --provider-id MyProvider -o table
  - summary: |-
      List the raw target status details for a suite offer.
    syntax: az quantum suite-offer target list -p MyProvider
  requiredParameters:
  - isRequired: true
    name: --provider-id -p
    summary: |-
      Identifier of an Azure Quantum provider.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_quantum_suite-offer_target_list
metadata:
  description: List targets available through an Azure Quantum suite offer.
