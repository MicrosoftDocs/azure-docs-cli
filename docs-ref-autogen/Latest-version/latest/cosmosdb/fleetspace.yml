- uid: az_cosmosdb_fleetspace_update
  name: az cosmosdb fleetspace update
  summary: |-
    Update an existing Cosmos DB Fleetspace.
  description: |-
    Both positive integer minThroughput and maxThroughput are required in throughputPoolConfiguration,
    with maxThroughput >= minThroughput. Additional constraints are service-configured.
    Partial updates and omitted, null or empty configurations are not supported by this CLI.
    serviceTier and dataRegions are creation settings; supplied update values cannot change them.
    Do not omit configuration in a raw service request to preserve pooling: omission can disable pooling.
    Fleetspaces use the NoSQL API; this command does not change the API kind.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/cosmosdb/_help.py
  syntax: >-
    az cosmosdb fleetspace update --body
                                  --fleet-name
                                  --fleetspace-name
                                  --resource-group
                                  [--acquire-policy-token]
                                  [--change-reference]
  examples:
  - summary: |-
      Update fleetspace throughput settings
    syntax: >-
      az cosmosdb fleetspace update \
        --resource-group MyResourceGroup \
        --fleet-name myfleet \
        --fleetspace-name myspace \
        --body '{"properties":{"throughputPoolConfiguration":{"minThroughput":100000,"maxThroughput":300000}}}'
  requiredParameters:
  - isRequired: true
    name: --body -b
    summary: |-
      Fleetspace JSON body requiring properties.throughputPoolConfiguration with both positive integer minThroughput and maxThroughput, with max >= min. Additional limits are service-configured. Partial updates and omitted/null/empty configurations are not supported. serviceTier and dataRegions are creation settings and cannot change existing settings. Use inline JSON or --body @fleetspace.json. Example: --body "{
          \"properties\": {
              \"throughputPoolConfiguration\": {
                  \"minThroughput\": 100000,
                  \"maxThroughput\": 300000
              }
          }
      }".
  - isRequired: true
    name: --fleet-name
    summary: |-
      Name of the Cosmos DB Fleet.
  - isRequired: true
    name: --fleetspace-name -n
    summary: |-
      Name of the Fleetspace resource.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
