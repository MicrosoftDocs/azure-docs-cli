### YamlMime:AzureCLIGroup
uid: az_cosmosdb_fleetspace
name: az cosmosdb fleetspace
importantNote: >-
  > [!NOTE]

  > This command group has commands that are defined in both Azure CLI and at least one extension. Install each extension to benefit from its extended capabilities. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Cosmos DB Fleetspace resources.
status: GA
sourceType: Core and Extension
directCommands:
- uid: az_cosmosdb_fleetspace_create
  name: az cosmosdb fleetspace create
  summary: |-
    Create a new Fleetspace under a Cosmos DB Fleet.
  description: |-
    Creates a NoSQL fleetspace. serviceTier and nonempty dataRegions are required creation settings.
    Omit throughputPoolConfiguration, or set it to null or {}, for non-pooled creation.
    Pooling requires both positive integer throughput bounds with maxThroughput >= minThroughput.
    Additional throughput constraints and supported tiers and regions are service-configured.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/cosmosdb/_help.py
  syntax: >-
    az cosmosdb fleetspace create --body
                                  --fleet-name
                                  --fleetspace-name
                                  --resource-group
                                  [--acquire-policy-token]
                                  [--change-reference]
  examples:
  - summary: |-
      Create a fleetspace
    syntax: >-
      az cosmosdb fleetspace create \
        --resource-group MyResourceGroup \
        --fleet-name myfleet \
        --fleetspace-name myspace \
        --body @fleetspace.json
  - summary: |-
      Create a non-pooled fleetspace
    syntax: >-
      az cosmosdb fleetspace create \
        --resource-group MyResourceGroup \
        --fleet-name myfleet \
        --fleetspace-name myspace \
        --body '{"properties":{"serviceTier":"GeneralPurpose","dataRegions":["West US 2"]}}'
  requiredParameters:
  - isRequired: true
    name: --body -b
    summary: |-
      NoSQL fleetspace JSON body with required properties.serviceTier and nonempty properties.dataRegions. Omit throughputPoolConfiguration, or use null or {}, for non-pooled creation. Pooled creation requires positive integer minThroughput and maxThroughput, with max >= min; additional limits are service-configured. Use inline JSON or --body @fleetspace.json. Example: --body "{
          \"properties\": {
              \"serviceTier\": \"GeneralPurpose\",
              \"dataRegions\": [\"West US 2\"],
              \"throughputPoolConfiguration\": {
                  \"minThroughput\": 100000,
                  \"maxThroughput\": 300000
              }
          }
      }".
  - isRequired: true
    name: --fleet-name
    summary: |-
      Name of the Cosmos DB Fleet.
  - isRequired: true
    name: --fleetspace-name -n
    summary: |-
      Name of the Fleetspace resource.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
