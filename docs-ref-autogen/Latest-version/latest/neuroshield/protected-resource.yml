### YamlMime:AzureCLIGroup
uid: az_neuroshield_protected-resource
name: az neuroshield protected-resource
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **neuroshield** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az neuroshield protected-resource** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Protected Resource.
status: GA
sourceType: Extension
directCommands:
- uid: az_neuroshield_protected-resource_create
  name: az neuroshield protected-resource create
  summary: |-
    Create a protected resource under a NeuroShield resource.
  status: GA
  sourceType: Extension
  syntax: >-
    az neuroshield protected-resource create --name --protected-resource-name
                                             --neuroshield-name
                                             --resource-group
                                             --target-resource-id
                                             [--acquire-policy-token]
                                             [--change-reference]
                                             [--if-match]
                                             [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                             [--target-identity]
  examples:
  - summary: |-
      Create or update protected resource with a system-assigned target identity
    syntax: az neuroshield protected-resource create --resource-group myResourceGroup --neuroshield-name myNeuroShield --protected-resource-name vm-01 --target-resource-id /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/myComputeRg/providers/Microsoft.Compute/virtualMachines/vm-01 --target-identity "{type:SystemAssigned,principal-id:11111111-1111-1111-1111-111111111111,tenant-id:22222222-2222-2222-2222-222222222222}"
  - summary: |-
      Create or update protected resource with a user-assigned target identity
    syntax: az neuroshield protected-resource create --resource-group myResourceGroup --neuroshield-name myNeuroShield --protected-resource-name vm-01 --target-resource-id /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/myComputeRg/providers/Microsoft.Compute/virtualMachines/vm-01 --target-identity "{type:UserAssigned,user-assigned-identities:{/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/myIdentityRg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/neuronIdentity:{principal-id:11111111-1111-1111-1111-111111111111,client-id:22222222-2222-2222-2222-222222222222}}}"
  - summary: |-
      Create or update protected resource with explicit None identity
    syntax: az neuroshield protected-resource create --resource-group myResourceGroup --neuroshield-name myNeuroShield --protected-resource-name vm-01 --target-resource-id /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/myComputeRg/providers/Microsoft.Compute/virtualMachines/vm-01 --target-identity "{type:None}"
  - summary: |-
      Create or update protected resource without an identity
    syntax: az neuroshield protected-resource create --resource-group myResourceGroup --neuroshield-name myNeuroShield --protected-resource-name vm-01 --target-resource-id /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/myComputeRg/providers/Microsoft.Compute/virtualMachines/vm-01
  requiredParameters:
  - isRequired: true
    name: --name --protected-resource-name -n
    summary: |-
      The name of the protected resource.
  - isRequired: true
    name: --neuroshield-name
    summary: |-
      The name of the NeuroShield resource.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --target-resource-id
    summary: |-
      Azure Resource Manager resource ID of the target virtual machine or virtual machine scale set.
    groupName: Properties Arguments
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --if-match
    summary: |-
      The entity tag that makes the request conditional.
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --target-identity
    summary: |-
      Caller-supplied identity of the target VM or VMSS. Omit if the target has no identity.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_neuroshield_protected-resource_delete
  name: az neuroshield protected-resource delete
  summary: |-
    Delete a protected resource under a NeuroShield resource.
