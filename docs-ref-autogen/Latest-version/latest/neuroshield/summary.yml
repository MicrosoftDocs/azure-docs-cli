### YamlMime:AzureCLIGroup
uid: az_neuroshield_summary
name: az neuroshield summary
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **neuroshield** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az neuroshield summary** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Summary.
status: GA
sourceType: Extension
directCommands:
- uid: az_neuroshield_summary_list
  name: az neuroshield summary list
  summary: |-
    List the aggregate fleet overview singleton for a NeuroShield resource.
  status: GA
  sourceType: Extension
  syntax: >-
    az neuroshield summary list --neuroshield-name
                                --resource-group
                                [--max-items]
                                [--next-token]
                                [--top]
  examples:
  - summary: |-
      List NeuroShield fleet summaries
    syntax: az neuroshield summary list --resource-group myResourceGroup --neuroshield-name myNeuroShield
  requiredParameters:
  - isRequired: true
    name: --neuroshield-name
    summary: |-
      The name of the NeuroShield resource.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --max-items
    summary: |-
      Total number of items to return in the command's output. If the total number of items available is more than the value specified, a token is provided in the command's output. To resume pagination, provide the token value in `--next-token` argument of a subsequent command.
    groupName: Pagination Arguments
  - name: --next-token
    summary: |-
      Token to specify where to start paginating. This is the token value from a previously truncated response.
    groupName: Pagination Arguments
  - name: --top
    summary: |-
      The maximum number of items to return.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_neuroshield_summary_show
  name: az neuroshield summary show
  summary: |-
    Get the aggregate fleet overview singleton for a NeuroShield resource.
  status: GA
  sourceType: Extension
  syntax: >-
    az neuroshield summary show [--ids]
                                [--neuroshield-name]
                                [--resource-group]
                                [--subscription]
  examples:
  - summary: |-
      Get a NeuroShield fleet summary
    syntax: az neuroshield summary show --resource-group myResourceGroup --neuroshield-name myNeuroShield
  optionalParameters:
  - name: --ids
    summary: |-
      One or more resource IDs (space-delimited). It should be a complete resource ID containing all information of 'Resource Id' arguments. You should provide either --ids or other 'Resource Id' arguments.
    groupName: Resource Id Arguments
  - name: --neuroshield-name
    summary: |-
      The name of the NeuroShield resource.
    groupName: Resource Id Arguments
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
    groupName: Resource Id Arguments
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
    groupName: Resource Id Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_neuroshield_summary_list
- az_neuroshield_summary_show
metadata:
  description: Manage Summary.
