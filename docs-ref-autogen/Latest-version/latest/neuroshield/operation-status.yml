### YamlMime:AzureCLIGroup
uid: az_neuroshield_operation-status
name: az neuroshield operation-status
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **neuroshield** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az neuroshield operation-status** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Neuro Shield Operation Status.
status: GA
sourceType: Extension
directCommands:
- uid: az_neuroshield_operation-status_show
  name: az neuroshield operation-status show
  summary: |-
    Get the status of an asynchronous NeuroShield operation.
  status: GA
  sourceType: Extension
  syntax: >-
    az neuroshield operation-status show [--ids]
                                         [--location]
                                         [--name --operation-id]
                                         [--subscription]
  examples:
  - summary: |-
      NeuroShieldOperationStatuses_Get
    syntax: az neuroshield operation-status show --location eastus2 --operation-id 00000000-0000-0000-0000-000000000001
  optionalParameters:
  - name: --ids
    summary: |-
      One or more resource IDs (space-delimited). It should be a complete resource ID containing all information of 'Resource Id' arguments. You should provide either --ids or other 'Resource Id' arguments.
    groupName: Resource Id Arguments
  - name: --location -l
    summary: |-
      Location. Values from: `az account list-locations`. You can configure the default location using `az configure --defaults location=<location>`.
    groupName: Resource Id Arguments
  - name: --name --operation-id -n
    summary: |-
      The ID of an ongoing async operation.
    groupName: Resource Id Arguments
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
    groupName: Resource Id Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_neuroshield_operation-status_show
metadata:
  description: Manage Neuro Shield Operation Status.
