- uid: az_networkfabric_bootstrapdevice_resync-password
  name: az networkfabric bootstrapdevice resync-password
  summary: |-
    Updates the Network Bootstrap Device to use the latest passwords. Does not generate new passwords. Allows network bootstrap devices missed during a previous password rotation to be brought back into sync.
  status: GA
  sourceType: Extension
  syntax: >-
    az networkfabric bootstrapdevice resync-password [--acquire-policy-token]
                                                     [--change-reference]
                                                     [--ids]
                                                     [--network-bootstrap-device-name --resource-name]
                                                     [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                                     [--resource-group]
                                                     [--subscription]
  examples:
  - summary: |-
      Resync the latest passwords to the Network Bootstrap Device
    syntax: az networkfabric bootstrapdevice resync-password --resource-group "example-rg" --resource-name "example-device"
