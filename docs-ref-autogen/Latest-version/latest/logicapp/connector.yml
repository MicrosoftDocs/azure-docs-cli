### YamlMime:AzureCLIGroup
uid: az_logicapp_connector
name: az logicapp connector
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **logicapp** extension for the Azure CLI (version 2.67.0 or higher). The extension will automatically install the first time you run an **az logicapp connector** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Inspect Logic Apps Standard connectors.
status: GA
sourceType: Extension
directCommands:
- uid: az_logicapp_connector_list
  name: az logicapp connector list
  summary: |-
    List connectors visible to a Logic Apps Standard runtime.
  description: |-
    The runtime route returns the whole catalog in one response and does not page, so --max-items and --next-token are applied by the CLI after the full response is received, not by the service.
  status: GA
  sourceType: Extension
  syntax: >-
    az logicapp connector list [--context]
                               [--continuation-token --next-token]
                               [--host-key]
                               [--local]
                               [--max-items]
                               [--name]
                               [--port]
                               [--resource-group]
                               [--workflow-kind {Stateful, Stateless}]
  examples:
  - summary: |-
      List connectors from a local runtime.
    syntax: az logicapp connector list --local --port 7071
  optionalParameters:
  - name: --context
    summary: |-
      Named Logic Apps CLI context used to resolve target coordinates.
  - name: --continuation-token --next-token
    summary: |-
      Token returned as nextContinuationToken by a previous call, to fetch the next page.
    groupName: Pagination Arguments
  - name: --host-key
    summary: |-
      Master key for a local host that requires one. Sent as an x-functions-key header.
  - name: --local
    defaultValue: "False"
    summary: |-
      Target a local Logic Apps runtime instead of a deployed app.
  - name: --max-items
    summary: |-
      Maximum number of connectors to return in this page.
    groupName: Pagination Arguments
  - name: --name -n
    summary: |-
      Name of the Logic App Standard site.
  - name: --port
    summary: |-
      Local runtime port. Requires --local when supplied on the command line.
  - name: --resource-group -g
    summary: |-
      Name of resource group containing the Logic App Standard site.
  - name: --workflow-kind
    acceptedValues: Stateful, Stateless
    summary: |-
      Filter by workflow kind if supported.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_logicapp_connector_show
  name: az logicapp connector show
  summary: |-
    Show one connector from a Logic Apps Standard runtime.
  status: GA
  sourceType: Extension
  syntax: >-
    az logicapp connector show --connector
                               [--context]
                               [--host-key]
                               [--local]
                               [--name]
                               [--port]
                               [--resource-group]
  examples:
  - summary: |-
      Show a connector from a local runtime.
    syntax: az logicapp connector show --local --port 7071 --connector /serviceProviders/acasession
  requiredParameters:
  - isRequired: true
    name: --connector
    summary: |-
      Connector id or name.
  optionalParameters:
  - name: --context
    summary: |-
      Named Logic Apps CLI context used to resolve target coordinates.
  - name: --host-key
    summary: |-
      Master key for a local host that requires one. Sent as an x-functions-key header.
  - name: --local
    defaultValue: "False"
    summary: |-
      Target a local Logic Apps runtime instead of a deployed app.
  - name: --name -n
    summary: |-
      Name of the Logic App Standard site.
  - name: --port
    summary: |-
      Local runtime port. Requires --local when supplied on the command line.
  - name: --resource-group -g
    summary: |-
      Name of resource group containing the Logic App Standard site.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_logicapp_connector_list
