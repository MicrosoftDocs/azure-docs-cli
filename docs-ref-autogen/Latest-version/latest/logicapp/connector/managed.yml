### YamlMime:AzureCLIGroup
uid: az_logicapp_connector_managed
name: az logicapp connector managed
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **logicapp** extension for the Azure CLI (version 2.67.0 or higher). The extension will automatically install the first time you run an **az logicapp connector managed** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Inspect Azure managed connectors from the ARM APIHub catalog.
status: GA
sourceType: Extension
directCommands:
- uid: az_logicapp_connector_managed_list
  name: az logicapp connector managed list
  summary: |-
    List Azure managed connectors from the ARM APIHub catalog.
  description: |-
    Queries ARM managedApis for one Azure location at api-version 2018-07-01-preview. This is the managed connector catalog, not the Logic Apps Standard site-runtime operationGroups catalog returned by az logicapp connector list.
  status: GA
  sourceType: Extension
  syntax: >-
    az logicapp connector managed list --location
                                       [--continuation-token --next-token]
                                       [--max-items]
                                       [--query-text --search]
  examples:
  - summary: |-
      List managed connectors in East US.
    syntax: az logicapp connector managed list --location eastus
  - summary: |-
      Search managed connectors client-side.
    syntax: az logicapp connector managed list --location eastus --search office
  requiredParameters:
  - isRequired: true
    name: --location -l
    summary: |-
      Azure location whose managed connector catalog is queried.
  optionalParameters:
  - name: --continuation-token --next-token
    summary: |-
      Token returned as nextContinuationToken by a previous call, to fetch the next page.
    groupName: Pagination Arguments
  - name: --max-items
    summary: |-
      Maximum number of connectors to return in this page.
    groupName: Pagination Arguments
  - name: --query-text --search
    summary: |-
      Client-side text filter over connector name and display metadata.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_logicapp_connector_managed_show
  name: az logicapp connector managed show
  summary: |-
    Show one Azure managed connector from ARM APIHub.
  status: GA
  sourceType: Extension
  syntax: >-
    az logicapp connector managed show --connector
                                       [--location]
  examples:
  - summary: |-
      Show the Office 365 managed connector.
    syntax: az logicapp connector managed show --location eastus --connector office365
  requiredParameters:
  - isRequired: true
    name: --connector
    summary: |-
      Managed API name or ARM managedApis id.
  optionalParameters:
  - name: --location -l
    summary: |-
      Azure location. Required when --connector is a name.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_logicapp_connector_managed_list
- az_logicapp_connector_managed_operation
- az_logicapp_connector_managed_operation_list
- az_logicapp_connector_managed_operation_show
- az_logicapp_connector_managed_show
metadata:
  description: Inspect Azure managed connectors from the ARM APIHub catalog.
