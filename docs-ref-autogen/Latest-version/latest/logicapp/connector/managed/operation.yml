### YamlMime:AzureCLIGroup
uid: az_logicapp_connector_managed_operation
name: az logicapp connector managed operation
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **logicapp** extension for the Azure CLI (version 2.67.0 or higher). The extension will automatically install the first time you run an **az logicapp connector managed operation** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Inspect operations exposed by an Azure managed connector.
status: GA
sourceType: Extension
directCommands:
- uid: az_logicapp_connector_managed_operation_list
  name: az logicapp connector managed operation list
  summary: |-
    List operations for one Azure managed connector.
  description: |-
    Queries the ARM managedApis apiOperations route. --search filters operations; it does not search for connector names.
  status: GA
  sourceType: Extension
  syntax: >-
    az logicapp connector managed operation list --connector
                                                 [--continuation-token --next-token]
                                                 [--kind {action, all, trigger}]
                                                 [--location]
                                                 [--max-items]
                                                 [--search]
  examples:
  - summary: |-
      List Office 365 actions.
    syntax: az logicapp connector managed operation list --location eastus --connector office365 --kind action
  - summary: |-
      Search Office 365 operations.
    syntax: az logicapp connector managed operation list --location eastus --connector office365 --search "send mail"
  requiredParameters:
  - isRequired: true
    name: --connector
    summary: |-
      Managed API name or ARM managedApis id.
  optionalParameters:
  - name: --continuation-token --next-token
    summary: |-
      Token returned as nextContinuationToken by a previous call, to fetch the next page.
    groupName: Pagination Arguments
  - name: --kind
    defaultValue: all
    acceptedValues: action, all, trigger
    summary: |-
      Filter operations by kind. Defaults to all.
  - name: --location -l
    summary: |-
      Azure location. Required when --connector is a name.
  - name: --max-items
    summary: |-
      Maximum number of operations to return in this page.
    groupName: Pagination Arguments
  - name: --search
    summary: |-
      Client-side text filter over operation name and display metadata.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_logicapp_connector_managed_operation_show
  name: az logicapp connector managed operation show
  summary: |-
    Show one operation for an Azure managed connector.
  status: GA
  sourceType: Extension
  syntax: >-
    az logicapp connector managed operation show --connector
                                                 --operation
                                                 [--location]
  examples:
  - summary: |-
      Show the Office 365 SendEmailV2 operation.
    syntax: az logicapp connector managed operation show --location eastus --connector office365 --operation SendEmailV2
  requiredParameters:
  - isRequired: true
    name: --connector
    summary: |-
      Managed API name or ARM managedApis id.
  - isRequired: true
    name: --operation
    summary: |-
      Operation name or id.
  optionalParameters:
  - name: --location -l
    summary: |-
      Azure location. Required when --connector is a name.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_logicapp_connector_managed_operation_list
- az_logicapp_connector_managed_operation_show
metadata:
  description: Inspect operations exposed by an Azure managed connector.
