### YamlMime:AzureCLIGroup
uid: az_logicapp_connector_operation
name: az logicapp connector operation
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **logicapp** extension for the Azure CLI (version 2.67.0 or higher). The extension will automatically install the first time you run an **az logicapp connector operation** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Inspect operations exposed by a built-in (service provider) connector.
status: GA
sourceType: Extension
directCommands:
- uid: az_logicapp_connector_operation_list
  name: az logicapp connector operation list
  summary: |-
    List operations exposed by a built-in (service provider) connector.
  description: |-
    Reads the site runtime operationGroups catalog, which is the built-in connector catalog, not the ARM managed connector catalog returned by az logicapp connector managed operation list. The runtime returns the whole operation list in one response and emits no continuation token, so --kind, --search, --max-items and --next-token are all applied by the CLI after the full response is received. Operations are classified as triggers using the runtime's own trigger field rather than inferred.
  status: GA
  sourceType: Extension
  syntax: >-
    az logicapp connector operation list --connector
                                         [--context]
                                         [--continuation-token --next-token]
                                         [--host-key]
                                         [--kind {action, all, trigger}]
                                         [--local]
                                         [--max-items]
                                         [--name]
                                         [--port]
                                         [--resource-group]
                                         [--search]
  examples:
  - summary: |-
      List every operation on a built-in connector.
    syntax: az logicapp connector operation list --local --port 7071 --connector /serviceProviders/serviceBus
  - summary: |-
      List only the triggers, accepting the id reported by connector list.
    syntax: az logicapp connector operation list --local --port 7071 --connector /serviceProviders/serviceBus --kind trigger
  - summary: |-
      Search operations on a deployed app.
    syntax: az logicapp connector operation list -g my-rg -n my-app --connector serviceBus --search "send message"
  requiredParameters:
  - isRequired: true
    name: --connector
    summary: |-
      Connector id or name.
  optionalParameters:
  - name: --context
    summary: |-
      Named Logic Apps CLI context used to resolve target coordinates.
  - name: --continuation-token --next-token
    summary: |-
      Token returned as nextContinuationToken by a previous call, to fetch the next page.
    groupName: Pagination Arguments
  - name: --host-key
    summary: |-
      Master key for a local host that requires one. Sent as an x-functions-key header.
  - name: --kind
    defaultValue: all
    acceptedValues: action, all, trigger
    summary: |-
      Filter operations by kind. Defaults to all.
  - name: --local
    defaultValue: "False"
    summary: |-
      Target a local Logic Apps runtime instead of a deployed app.
  - name: --max-items
    summary: |-
      Maximum number of operations to return in this page.
    groupName: Pagination Arguments
  - name: --name -n
    summary: |-
      Name of the Logic App Standard site.
  - name: --port
    summary: |-
      Local runtime port. Requires --local when supplied on the command line.
  - name: --resource-group -g
    summary: |-
      Name of resource group containing the Logic App Standard site.
  - name: --search
    summary: |-
      Client-side text filter over operation name, id, summary and description.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_logicapp_connector_operation_show
  name: az logicapp connector operation show
  summary: |-
    Show one operation exposed by a built-in (service provider) connector.
  description: |-
    --operation accepts either the bare operation name or the full operation id reported by az logicapp connector operation list.
  status: GA
  sourceType: Extension
  syntax: >-
    az logicapp connector operation show --connector
                                         --operation
                                         [--context]
                                         [--host-key]
                                         [--local]
                                         [--name]
                                         [--port]
                                         [--resource-group]
  examples:
  - summary: |-
      Show one operation on a local runtime.
    syntax: az logicapp connector operation show --local --port 7071 --connector /serviceProviders/serviceBus --operation sendMessage
  requiredParameters:
  - isRequired: true
    name: --connector
    summary: |-
      Connector id or name.
  - isRequired: true
    name: --operation
    summary: |-
      Operation id or name.
  optionalParameters:
  - name: --context
    summary: |-
      Named Logic Apps CLI context used to resolve target coordinates.
  - name: --host-key
    summary: |-
      Master key for a local host that requires one. Sent as an x-functions-key header.
  - name: --local
    defaultValue: "False"
    summary: |-
      Target a local Logic Apps runtime instead of a deployed app.
  - name: --name -n
    summary: |-
      Name of the Logic App Standard site.
  - name: --port
    summary: |-
      Local runtime port. Requires --local when supplied on the command line.
  - name: --resource-group -g
    summary: |-
      Name of resource group containing the Logic App Standard site.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_logicapp_connector_operation_list
- az_logicapp_connector_operation_show
metadata:
  description: Inspect operations exposed by a built-in (service provider) connector.
