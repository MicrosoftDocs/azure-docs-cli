### YamlMime:AzureCLIGroup
uid: az_logicapp_identity
name: az logicapp identity
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **logicapp** extension for the Azure CLI (version 2.67.0 or higher). The extension will automatically install the first time you run an **az logicapp identity** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage the managed identity of a deployed Logic App Standard site.
status: GA
sourceType: Extension
directCommands:
- uid: az_logicapp_identity_assign
  name: az logicapp identity assign
  summary: |-
    Assign a managed identity to a deployed Logic App.
  description: |-
    Additive: assigning a user-assigned identity leaves an existing system-assigned identity in place. Assigning an identity is only half of enabling an identity-based connection; the identity still needs a data-plane role assignment on the target resource.
  status: GA
  sourceType: Extension
  syntax: >-
    az logicapp identity assign --name
                                --resource-group
                                [--acquire-policy-token]
                                [--change-reference]
                                [--system-assigned]
                                [--user-assigned]
  examples:
  - summary: |-
      Enable the system-assigned identity.
    syntax: az logicapp identity assign --resource-group orders-rg --name orders-app --system-assigned
  - summary: |-
      Attach a user-assigned identity.
    syntax: az logicapp identity assign --resource-group orders-rg --name orders-app --user-assigned /subscriptions/0000/resourceGroups/orders-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/orders-identity
  requiredParameters:
  - isRequired: true
    name: --name -n
    summary: |-
      Name of the Logic App Standard site.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group containing the Logic App Standard site.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --system-assigned
    defaultValue: "False"
    summary: |-
      Apply the change to the system-assigned managed identity.
  - name: --user-assigned
    summary: |-
      One or more full resource ids of user-assigned managed identities. Repeatable.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_logicapp_identity_remove
  name: az logicapp identity remove
  summary: |-
    Remove a managed identity from a deployed Logic App.
  description: |-
    Removes only what is named, leaving other identities assigned. Workflows using an identity-based connection will start failing authentication once their identity is removed.
  status: GA
  sourceType: Extension
  syntax: >-
    az logicapp identity remove --name
                                --resource-group
                                [--acquire-policy-token]
                                [--change-reference]
                                [--system-assigned]
                                [--user-assigned]
  examples:
  - summary: |-
      Remove the system-assigned identity.
    syntax: az logicapp identity remove --resource-group orders-rg --name orders-app --system-assigned
  requiredParameters:
  - isRequired: true
    name: --name -n
    summary: |-
      Name of the Logic App Standard site.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group containing the Logic App Standard site.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --system-assigned
    defaultValue: "False"
    summary: |-
      Apply the change to the system-assigned managed identity.
  - name: --user-assigned
    summary: |-
      One or more full resource ids of user-assigned managed identities. Repeatable.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_logicapp_identity_show
  name: az logicapp identity show
  summary: |-
    Show the managed identity of a deployed Logic App.
  description: |-
    Reports type None when the app has no identity, rather than printing nothing.
  status: GA
  sourceType: Extension
  syntax: >-
    az logicapp identity show --name
                              --resource-group
  examples:
  - summary: |-
      Show the identity, including the principal id to grant roles to.
    syntax: az logicapp identity show --resource-group orders-rg --name orders-app
  requiredParameters:
  - isRequired: true
    name: --name -n
    summary: |-
      Name of the Logic App Standard site.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group containing the Logic App Standard site.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_logicapp_identity_assign
- az_logicapp_identity_remove
- az_logicapp_identity_show
metadata:
  description: Manage the managed identity of a deployed Logic App Standard site.
