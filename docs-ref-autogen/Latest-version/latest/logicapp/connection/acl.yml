- uid: az_logicapp_connection_acl_remove
  name: az logicapp connection acl remove
  summary: |-
    Remove an access policy from a managed API connection.
  description: |-
    The principal named by the policy immediately loses access to the connection, so workflows relying on it begin to fail. Prompts unless --yes is given.
  status: GA
  sourceType: Extension
  syntax: >-
    az logicapp connection acl remove --connection
                                      --policy
                                      --resource-group
                                      [--acquire-policy-token]
                                      [--change-reference]
                                      [--yes]
  examples:
  - summary: |-
      Remove an access policy without prompting.
    syntax: az logicapp connection acl remove -g rg-lacli-ri2bg8 --connection blobProd --policy la-cli-pilot-ri2bg8-00000000-0000-0000-0000-000000000000 --yes
  requiredParameters:
  - isRequired: true
    name: --connection
    summary: |-
      Managed API connection name.
  - isRequired: true
    name: --policy
    summary: |-
      Access policy name to remove.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Resource group containing the connection.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --yes -y
    defaultValue: "False"
    summary: |-
      Do not prompt for confirmation.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
