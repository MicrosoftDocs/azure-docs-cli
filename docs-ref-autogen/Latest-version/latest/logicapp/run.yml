- uid: az_logicapp_run_wait
  name: az logicapp run wait
  summary: |-
    Wait for a Stateful run to reach a terminal status within a deadline.
  description: |-
    Supports running local and deployed Standard apps and saved targets. Exit 0
    means observed Succeeded; 4 means a different terminal status; 2 means the CLI
    wait deadline expired (not workflow TimedOut); 1 means an observation error.
    Missing runs, authorization failures, malformed responses and unknown statuses
    fail promptly. No missing-run grace period, implicit cancellation or retry.
    JSON/table/query output is preserved before nonzero result exits. Responses
    omit inputs, outputs, provider errors and signed URLs. Each network request is
    bounded; an in-flight read may exceed the polling deadline by its 5-second
    read timeout. OS DNS resolution and CLI token acquisition are not forcibly
    interrupted by that network timeout.
  status: GA
  sourceType: Extension
  syntax: >-
    az logicapp run wait --run-id
                         --workflow
                         [--acquire-policy-token]
                         [--change-reference]
                         [--context]
                         [--host-key]
                         [--interval]
                         [--local]
                         [--name]
                         [--port]
                         [--resource-group]
                         [--timeout]
  examples:
  - summary: |-
      Wait up to a minute for a local Stateful run.
    syntax: az logicapp run wait --local --workflow hello --run-id RUN_ID --timeout 60 --interval 2
  requiredParameters:
  - isRequired: true
    name: --run-id
    summary: |-
      Workflow run id.
  - isRequired: true
    name: --workflow
    summary: |-
      Workflow name.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --context
    summary: |-
      Named Logic Apps CLI context used to resolve target coordinates.
  - name: --host-key
    summary: |-
      Master key for a local host that requires one. Sent as an x-functions-key header.
  - name: --interval
    defaultValue: "5"
    summary: |-
      Polling interval in seconds (1-300), no greater than timeout. Defaults to 5.
  - name: --local
    defaultValue: "False"
    summary: |-
      Target a local Logic Apps runtime instead of a deployed app.
  - name: --name -n
    summary: |-
      Name of the Logic App Standard site.
  - name: --port
    summary: |-
      Local runtime port. Requires --local when supplied on the command line.
  - name: --resource-group -g
    summary: |-
      Name of resource group containing the Logic App Standard site.
  - name: --timeout
    defaultValue: "300"
    summary: |-
      Observation deadline in seconds (1-86400). Timeout never cancels a run. Defaults to 300.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
