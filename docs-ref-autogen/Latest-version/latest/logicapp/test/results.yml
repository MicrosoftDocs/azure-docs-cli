### YamlMime:AzureCLIGroup
uid: az_logicapp_test_results
name: az logicapp test results
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **logicapp** extension for the Azure CLI (version 2.67.0 or higher). The extension will automatically install the first time you run an **az logicapp test results** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Inspect saved preflight or sanitized native test reports.
status: GA
sourceType: Extension
directCommands:
- uid: az_logicapp_test_results_show
  name: az logicapp test results show
  summary: |-
    Inspect a saved JSON test report without rerunning tests or following embedded paths.
  description: |-
    Accepts closed version 1.0 and 2.0 foundation preflight documents with notExecuted markers, preserving the recorded exit policy and source result. Validation is not a signature or provenance attestation. Exit 0 means inspection succeeded, never testsPassed; the source outcome and exit remain in inspection. Optional --workflow-file compares exact bytes and exits 5 on drift. Also accepts closed original execution reports from test run (logicapp-sdk-test schema 1.0). Native counts/outcomes are historical, retained under sourceOutcome/sourceExitCode, not new execution. Raw SDK/TRX files, unexpected fields and unknown producers are refused. Accepted JSON remains unauthenticated: schema validation is not proof of authorship.
  status: GA
  sourceType: Extension
  syntax: >-
    az logicapp test results show --result-file
                                  [--workflow-file]
  examples:
  - summary: |-
      Inspect a saved preflight report (no tests executed) and check the current definition identity.
    syntax: az logicapp test results show --result-file .\App\Reports\plan.json --workflow-file .\App\Orders\workflow.json
  requiredParameters:
  - isRequired: true
    name: --result-file
    summary: |-
      Saved foundation preflight or sanitized test run JSON report. Raw SDK/TRX files are not accepted. Embedded paths are never followed.
  optionalParameters:
  - name: --workflow-file
    summary: |-
      Optional explicit local workflow.json for byte identity comparison. No automatic report-path traversal or rerun.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_logicapp_test_results_show
metadata:
  description: Inspect saved preflight or sanitized native test reports.
