### YamlMime:AzureCLIGroup
uid: az_logicapp_project
name: az logicapp project
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **logicapp** extension for the Azure CLI (version 2.67.0 or higher). The extension will automatically install the first time you run an **az logicapp project** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage local Logic Apps Standard projects.
status: GA
sourceType: Extension
directCommands:
- uid: az_logicapp_project_create
  name: az logicapp project create
  summary: |-
    Create or adopt a local Logic Apps Standard project.
  status: GA
  sourceType: Extension
  syntax: >-
    az logicapp project create --path
                               [--acquire-policy-token]
                               [--adopt]
                               [--change-reference]
                               [--force]
                               [--workflow]
                               [--workflow-kind {Stateful, Stateless}]
  examples:
  - summary: |-
      Create a project with an initial workflow.
    syntax: az logicapp project create --path .\orders --workflow process-order
  requiredParameters:
  - isRequired: true
    name: --path
    summary: |-
      Directory to create or adopt.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --adopt
    defaultValue: "False"
    summary: |-
      Allow a non-empty unrecognized directory.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --force
    defaultValue: "False"
    summary: |-
      Overwrite command-owned files.
  - name: --workflow
    summary: |-
      Initial workflow name.
  - name: --workflow-kind
    defaultValue: Stateful
    acceptedValues: Stateful, Stateless
    summary: |-
      Kind for initial workflow. Defaults to Stateful.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_logicapp_project_create
metadata:
  description: Manage local Logic Apps Standard projects.
