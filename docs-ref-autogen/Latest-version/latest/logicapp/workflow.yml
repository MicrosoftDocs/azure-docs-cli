- uid: az_logicapp_workflow_show
  name: az logicapp workflow show
  summary: |-
    Read a workflow's metadata and authored workflow.json.
  description: |-
    Returns name, kind, state, health, etag, and workflow (the complete workflow.json object). Reads the runtime metadata and file plane with the same target and authentication. Does not resolve app settings or download connections, credentials, or other app files. Authored definitions can themselves contain sensitive literals. JSON output contains the definition; table output shows only name, kind, state and health. The etag can be passed to set/delete --if-match to guard an editing session.
  status: GA
  sourceType: Extension
  syntax: >-
    az logicapp workflow show --workflow
                              [--context]
                              [--host-key]
                              [--local]
                              [--name]
                              [--port]
                              [--resource-group]
  examples:
  - summary: |-
      Read one local workflow.
    syntax: az logicapp workflow show --local --workflow hello
  - summary: |-
      Read a workflow using a saved context.
    syntax: az logicapp workflow show --context dev --workflow hello
  requiredParameters:
  - isRequired: true
    name: --workflow
    summary: |-
      Workflow name.
  optionalParameters:
  - name: --context
    summary: |-
      Named Logic Apps CLI context used to resolve target coordinates.
  - name: --host-key
    summary: |-
      Master key for a local host that requires one. Sent as an x-functions-key header.
  - name: --local
    defaultValue: "False"
    summary: |-
      Target a local Logic Apps runtime instead of a deployed app.
  - name: --name -n
    summary: |-
      Name of the Logic App Standard site.
  - name: --port
    summary: |-
      Local runtime port. Requires --local when supplied on the command line.
  - name: --resource-group -g
    summary: |-
      Name of resource group containing the Logic App Standard site.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_logicapp_workflow_validate
  name: az logicapp workflow validate
  summary: |-
    Validate workflow definitions offline by default.
  description: |-
    Invalid workflow shapes, including non-object triggers, are returned as structured validation findings rather than unexpected exceptions. Static validation continues checking actions and references when triggers are invalid.
  status: GA
  sourceType: Extension
  syntax: >-
    az logicapp workflow validate [--acquire-policy-token]
                                  [--all]
                                  [--change-reference]
                                  [--context]
                                  [--fail-on-warning]
                                  [--host-key]
                                  [--local]
                                  [--name]
                                  [--path]
                                  [--port]
                                  [--resource-group]
                                  [--with-runtime]
                                  [--workflow]
  examples:
  - summary: |-
      Validate one workflow in a local project.
    syntax: az logicapp workflow validate --path .\orders --workflow process-order
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --all
    defaultValue: "False"
    summary: |-
      Validate every workflow.
  - name: --change-reference
    summary: |-
