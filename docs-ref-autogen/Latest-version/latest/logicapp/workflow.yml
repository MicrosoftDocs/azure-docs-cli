    summary: |-
      Target a local Logic Apps runtime instead of a deployed app.
  - name: --name -n
    summary: |-
      Name of the Logic App Standard site.
  - name: --path
    summary: |-
      Project root. Defaults to local context path or current directory.
  - name: --port
    summary: |-
      Local runtime port. Requires --local when supplied on the command line.
  - name: --resource-group -g
    summary: |-
      Name of resource group containing the Logic App Standard site.
  - name: --with-runtime
    defaultValue: "False"
    summary: |-
      Also run runtime-backed validation.
  - name: --workflow
    summary: |-
      Validate one workflow.
  globalParameters:
