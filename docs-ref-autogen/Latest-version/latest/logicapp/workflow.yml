### YamlMime:AzureCLIGroup
uid: az_logicapp_workflow
name: az logicapp workflow
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **logicapp** extension for the Azure CLI (version 2.67.0 or higher). The extension will automatically install the first time you run an **az logicapp workflow** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Logic Apps Standard workflows.
status: GA
sourceType: Extension
directCommands:
- uid: az_logicapp_workflow_create
  name: az logicapp workflow create
  summary: |-
    Add a workflow to an existing local Logic Apps Standard project.
  description: |-
    Authors locally only and makes no network call. Writes just the workflow's workflow.json, leaving host.json and local.settings.json untouched, so adding a second workflow is non-destructive. Not idempotent: it fails if the workflow already exists, so it is safe to retry only with --force.
  status: GA
  sourceType: Extension
  syntax: >-
    az logicapp workflow create --workflow
                                [--acquire-policy-token]
                                [--change-reference]
                                [--context]
                                [--file]
                                [--force]
                                [--kind {Stateful, Stateless}]
                                [--path]
  examples:
  - summary: |-
      Add a workflow using the starter template.
    syntax: az logicapp workflow create --path .\orders --workflow process-order
  - summary: |-
      Add a workflow from an authored definition.
    syntax: az logicapp workflow create --path .\orders --workflow send-message --file .\send.json
  requiredParameters:
  - isRequired: true
    name: --workflow
    summary: |-
      Name of the workflow to add.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --context
    summary: |-
      Named local project context. Cloud contexts are refused, not replaced by another local target.
  - name: --file
    summary: |-
      Existing workflow.json or bare definition to use instead of the starter template.
  - name: --force
    defaultValue: "False"
    summary: |-
      Replace the workflow if it already exists. Not safe to retry without it.
  - name: --kind
    acceptedValues: Stateful, Stateless
    summary: |-
      Workflow kind. Defaults to Stateful, or the kind in --file.
  - name: --path
    summary: |-
      Existing project root. Defaults to local context path or current directory.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_logicapp_workflow_delete
  name: az logicapp workflow delete
  summary: |-
    Remove one workflow.json while retaining shared and sibling files.
  description: |-
    Requires --allow-non-atomic to acknowledge the runtime's non-transactional VFS behavior. Reads and checks the existing supported workflow and exact revision, prompts unless --yes is supplied, rechecks after confirmation, and conditionally deletes only workflow.json. Verifies absence with a file-plane 404; unknown outcomes or a recreated file are errors, never silently retried. --if-match optionally binds deletion to an earlier show/export revision.

    Other workflow files and the workflow directory are retained, as are shared app settings, connections, artifacts and identities. Runtime removal is asynchronous; this does not cancel active runs, purge run history or delete the app resource. Export first for recovery. No wildcard/force revision bypass is supported.
  status: GA
  sourceType: Extension
  syntax: >-
    az logicapp workflow delete --workflow
                                [--acquire-policy-token]
                                [--allow-non-atomic]
                                [--change-reference]
                                [--context]
                                [--host-key]
                                [--if-match]
                                [--local]
                                [--name]
                                [--port]
                                [--resource-group]
                                [--yes]
  examples:
  - summary: |-
      Delete a workflow on a running local host.
    syntax: az logicapp workflow delete --local --workflow hello --allow-non-atomic --yes
  - summary: |-
      Delete one workflow using a saved target and confirmation.
    syntax: az logicapp workflow delete --context dev --workflow hello --allow-non-atomic
  requiredParameters:
  - isRequired: true
    name: --workflow
    summary: |-
      Workflow name.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --allow-non-atomic
    defaultValue: "False"
    summary: |-
      Required acknowledgement that VFS mutations are not transactional and cannot guarantee rollback or prevent every race.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --context
    summary: |-
      Named Logic Apps CLI context used to resolve target coordinates.
  - name: --host-key
    summary: |-
      Master key for a local host that requires one. Sent as an x-functions-key header.
  - name: --if-match
    summary: |-
      Exact ETag from workflow show/export. Refuse a stale edit. Wildcards and weak ETags are rejected; ETags are always checked even when omitted.
  - name: --local
    defaultValue: "False"
    summary: |-
      Target a local Logic Apps runtime instead of a deployed app.
  - name: --name -n
    summary: |-
      Name of the Logic App Standard site.
  - name: --port
    summary: |-
      Local runtime port. Requires --local when supplied on the command line.
  - name: --resource-group -g
    summary: |-
      Name of resource group containing the Logic App Standard site.
  - name: --yes -y
    defaultValue: "False"
    summary: |-
      Do not prompt for confirmation. Does not bypass revision checks or non-atomic acknowledgement.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_logicapp_workflow_disable
  name: az logicapp workflow disable
  summary: |-
    Configure one deployed Standard workflow as Disabled and observe runtime state.
  description: |-
    Supports deployed Stateful/Stateless workflows using -g/-n or a cloud context. Local runtime targets are rejected without requests, file edits or host restarts. Disabling stops new ordinary workflow instances/triggers after propagation; existing in-progress/pending runs continue. This does not cancel runs, purge history, reset triggers or stop the app resource. Requires --allow-non-atomic and confirmation unless --yes is supplied. App Service replaces the entire settings map; values are retained from a snapshot, but unrelated concurrent changes can be lost. There is no settings ETag/transaction guarantee. Settings updates can have hosting/reload effects. configuredState is verified by settings readback; runtimeState is a separate single observation. Pending/unknown results warn instead of claiming trigger quiescence. Already configured requests do not write or prompt. No automatic retry/rollback is attempted, and uncertain writes/readbacks return errors. Neither settings values nor raw provider errors appear in command results or this operation's REST debug logs.
  status: GA
  sourceType: Extension
  syntax: >-
    az logicapp workflow disable --workflow
                                 [--acquire-policy-token]
                                 [--allow-non-atomic]
                                 [--change-reference]
                                 [--context]
                                 [--host-key]
                                 [--local]
                                 [--name]
                                 [--port]
                                 [--resource-group]
                                 [--yes]
  examples:
  - summary: |-
      Disable only hello, without stopping its app or cancelling runs.
    syntax: az logicapp workflow disable -g my-rg -n my-app --workflow hello --allow-non-atomic
  - summary: |-
      Disable a workflow through a saved deployed target.
    syntax: az logicapp workflow disable --context production --workflow hello --allow-non-atomic --yes
  requiredParameters:
  - isRequired: true
    name: --workflow
    summary: |-
      Workflow name.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --allow-non-atomic
    defaultValue: "False"
    summary: |-
      Required acknowledgement that App Service replaces the complete app settings map. Concurrent unrelated changes can be lost despite preflight/readback.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --context
    summary: |-
      Named Logic Apps CLI context used to resolve target coordinates.
  - name: --host-key
    summary: |-
      Master key for a local host that requires one. Sent as an x-functions-key header.
  - name: --local
    defaultValue: "False"
    summary: |-
      Target a local Logic Apps runtime instead of a deployed app.
  - name: --name -n
    summary: |-
      Name of the Logic App Standard site.
  - name: --port
    summary: |-
      Local runtime port. Requires --local when supplied on the command line.
  - name: --resource-group -g
    summary: |-
      Name of resource group containing the Logic App Standard site.
  - name: --yes -y
    defaultValue: "False"
    summary: |-
      Do not prompt for confirmation. Does not bypass snapshot checks or non-atomic acknowledgement.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
