- uid: az_logicapp_workflow_list
  name: az logicapp workflow list
  summary: |-
    List workflows in a running local or deployed Logic Apps Standard app.
  description: |-
    Returns value and nextContinuationToken. Each item has name, kind, state and health. Fetches the entire service inventory before client-side paging, sorted by name. Tokens are offsets, not snapshots; inventory changes between calls can shift page boundaries. Unknown state or health is reported as null. Inventory traversal allows at most 100 service pages and 10000 accumulated entries, failing explicitly without partial results when either limit is exceeded.
  status: GA
  sourceType: Extension
  syntax: >-
    az logicapp workflow list [--context]
                              [--continuation-token --next-token]
                              [--host-key]
                              [--local]
                              [--max-items]
                              [--name]
                              [--port]
                              [--resource-group]
  examples:
  - summary: |-
      Discover workflows in a local runtime.
    syntax: az logicapp workflow list --local --port 7071 --output table
  - summary: |-
      Discover workflows in a deployed app.
    syntax: az logicapp workflow list --resource-group my-rg --name my-app
  optionalParameters:
  - name: --context
    summary: |-
      Named Logic Apps CLI context used to resolve target coordinates.
  - name: --continuation-token --next-token
    summary: |-
      Client-side offset token from nextContinuationToken. Inventory is read completely on each call before paging.
    groupName: Pagination Arguments
  - name: --host-key
    summary: |-
      Master key for a local host that requires one. Sent as an x-functions-key header.
  - name: --local
    defaultValue: "False"
    summary: |-
      Target a local Logic Apps runtime instead of a deployed app.
  - name: --max-items
    summary: |-
      Maximum number of workflows to return in this page.
    groupName: Pagination Arguments
  - name: --name -n
    summary: |-
      Name of the Logic App Standard site.
  - name: --port
    summary: |-
      Local runtime port. Requires --local when supplied on the command line.
  - name: --resource-group -g
    summary: |-
      Name of resource group containing the Logic App Standard site.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_logicapp_workflow_set
  name: az logicapp workflow set
  summary: |-
    Replace one existing workflow.json with revision checks and runtime preflight.
  description: |-
    Requires a complete --file with the same Stateful/Stateless kind. Performs static checks and target-runtime definition validation before writing. Reads the current file revision, confirms the target, rechecks after confirmation, writes with an exact If-Match, and verifies the write receipt and file bytes. --if-match can also bind the update to the revision from a previous show/export. No --force bypass is available. Identical input is validated but not written.

    Requires --allow-non-atomic: VFS is not transactional. ETag checks cannot prevent every race or partial upload, and a concurrently deleted file can be recreated. Export first and coordinate with other writers. Unexpected creation, ambiguous failures and unverified results fail explicitly. A mismatched owned revision is conditionally restored only when ownership can be verified; newer or missing files are not blindly overwritten. Guaranteed rollback is not available.

    Verification covers the authored file, not execution or completed runtime reload. This does not create a new workflow intentionally, convert its kind, change shared settings/connections, or cancel runs. Read-only/run-from-package targets may reject writes; use documented deployment commands instead.
  status: GA
  sourceType: Extension
  syntax: >-
    az logicapp workflow set --file
                             --workflow
                             [--acquire-policy-token]
                             [--allow-non-atomic]
                             [--change-reference]
                             [--context]
                             [--host-key]
                             [--if-match]
                             [--local]
                             [--name]
                             [--port]
                             [--resource-group]
                             [--yes]
  examples:
  - summary: |-
      Update a workflow on a running local host after retaining an export.
    syntax: az logicapp workflow set --local --workflow hello --file .\edited\workflow.json --allow-non-atomic --yes
  - summary: |-
      Guard a deployed update using the ETag obtained during export.
    syntax: az logicapp workflow set -g my-rg -n my-app --workflow hello --file .\edited\workflow.json --if-match saved-etag --allow-non-atomic
  requiredParameters:
  - isRequired: true
    name: --file
    summary: |-
      Complete authored workflow.json replacing the existing workflow, with the same Stateful/Stateless kind. Not a bare definition or partial patch.
  - isRequired: true
    name: --workflow
    summary: |-
      Workflow name.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --allow-non-atomic
    defaultValue: "False"
    summary: |-
      Required acknowledgement that VFS mutations are not transactional and cannot guarantee rollback or prevent every race.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --context
    summary: |-
      Named Logic Apps CLI context used to resolve target coordinates.
  - name: --host-key
    summary: |-
      Master key for a local host that requires one. Sent as an x-functions-key header.
  - name: --if-match
    summary: |-
      Exact ETag from workflow show/export. Refuse a stale edit. Wildcards and weak ETags are rejected; ETags are always checked even when omitted.
  - name: --local
    defaultValue: "False"
    summary: |-
      Target a local Logic Apps runtime instead of a deployed app.
  - name: --name -n
    summary: |-
      Name of the Logic App Standard site.
  - name: --port
    summary: |-
      Local runtime port. Requires --local when supplied on the command line.
  - name: --resource-group -g
    summary: |-
      Name of resource group containing the Logic App Standard site.
  - name: --yes -y
    defaultValue: "False"
    summary: |-
      Do not prompt for confirmation. Does not bypass revision checks or non-atomic acknowledgement.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
