- uid: az_logicapp_workflow_export
  name: az logicapp workflow export
  summary: |-
    Export one authored workflow.json without changing the app.
  description: |-
    Preserves the actual Stateful or Stateless kind and the complete authored workflow file, including expressions and runtime configuration. Requires a .json destination outside the filesystem root and --force to replace a file. Publishes the complete file atomically; directories and symbolic links are rejected. No full app download, connections or app credentials are included. Definitions can contain authored sensitive literals: protect the output file. The result includes the source file etag for a later --if-match guard.
  status: GA
  sourceType: Extension
  syntax: >-
    az logicapp workflow export --output-path
                                --workflow
                                [--acquire-policy-token]
                                [--change-reference]
                                [--context]
                                [--force]
                                [--host-key]
                                [--local]
                                [--name]
                                [--port]
                                [--resource-group]
  examples:
  - summary: |-
      Export one local workflow.
    syntax: az logicapp workflow export --local --workflow hello --output-path .\download\hello\workflow.json
  - summary: |-
      Export one deployed workflow.
    syntax: az logicapp workflow export -g my-rg -n my-app --workflow hello --output-path .\hello.json
  requiredParameters:
  - isRequired: true
    name: --output-path
    summary: |-
      Destination .json file for one workflow. Not a full app export. Definitions can contain authored secrets.
  - isRequired: true
    name: --workflow
    summary: |-
      Workflow name.
  optionalParameters:
  - name: --acquire-policy-token
