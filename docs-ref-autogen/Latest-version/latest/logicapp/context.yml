### YamlMime:AzureCLIGroup
uid: az_logicapp_context
name: az logicapp context
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **logicapp** extension for the Azure CLI (version 2.67.0 or higher). The extension will automatically install the first time you run an **az logicapp context** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage saved Logic Apps target shortcuts.
description: |-
  Contexts store local path/port or deployed resource group/app names only. They do not store credentials or bind subscription/tenant; Azure CLI login and account selection, including --subscription, remain inherited.
status: GA
sourceType: Extension
directCommands:
- uid: az_logicapp_context_create
  name: az logicapp context create
  summary: |-
    Create a named Logic Apps CLI context.
  status: GA
  sourceType: Extension
  syntax: >-
    az logicapp context create --name
                               [--acquire-policy-token]
                               [--change-reference]
                               [--logic-app-name]
                               [--path]
                               [--port]
                               [--resource-group]
                               [--use]
  examples:
  - summary: |-
      Create and activate a local context.
    syntax: az logicapp context create --name orders-local --path .\orders --use
  requiredParameters:
  - isRequired: true
    name: --name
    summary: |-
      Context name.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --logic-app-name
    summary: |-
      Deployed Logic App Standard site name.
  - name: --path
    summary: |-
      Local project directory.
  - name: --port
    summary: |-
      Local runtime port. Defaults to 7071 for local contexts.
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - name: --use
    defaultValue: "False"
    summary: |-
      Make context active.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_logicapp_context_delete
  name: az logicapp context delete
  summary: |-
    Delete one saved shortcut, never a project or Azure resource.
  description: |-
    Prompts unless --yes is supplied. Deleting the active shortcut clears the active selection without choosing a replacement; runtime commands then require an explicit target or a deliberate context use. Other shortcuts are preserved.
  status: GA
  sourceType: Extension
  syntax: >-
    az logicapp context delete --name
                               [--acquire-policy-token]
                               [--change-reference]
                               [--yes]
  examples:
  - summary: |-
      Remove a saved shortcut only.
    syntax: az logicapp context delete --name orders-local
  requiredParameters:
  - isRequired: true
    name: --name
    summary: |-
      Saved shortcut to delete; no project or Azure resource is deleted.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --yes -y
    defaultValue: "False"
    summary: |-
      Confirm shortcut deletion without prompting. Active deletion clears selection without choosing a replacement.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_logicapp_context_list
  name: az logicapp context list
  summary: |-
    List saved targets with their active selection.
  description: |-
    Read-only, name-sorted inventory. Does not create a missing context store.
  status: GA
  sourceType: Extension
  syntax: az logicapp context list
  examples:
  - summary: |-
      Inspect saved targets in a table.
    syntax: az logicapp context list --output table
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_logicapp_context_show
  name: az logicapp context show
  summary: |-
    Show a named saved target, or the active target.
  status: GA
  sourceType: Extension
  syntax: az logicapp context show [--name]
  examples:
  - summary: |-
      Inspect the active target.
    syntax: az logicapp context show
  - summary: |-
      Inspect a saved target without activating it.
    syntax: az logicapp context show --name orders-local
  optionalParameters:
  - name: --name
    summary: |-
      Saved context name. Defaults to the active context.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_logicapp_context_update
  name: az logicapp context update
  summary: |-
    Edit an existing saved target without changing its selection.
  description: |-
    Omitted fields are retained. Editing an active target prompts unless --yes is supplied. Switching kind requires --kind and complete new coordinates: path and port for local, resource group and logic-app-name for cloud. Old known coordinates are cleared. Does not create a missing context or contact Azure.
  status: GA
  sourceType: Extension
  syntax: >-
    az logicapp context update --name
                               [--acquire-policy-token]
                               [--change-reference]
                               [--kind {cloud, local}]
                               [--logic-app-name]
                               [--path]
                               [--port]
                               [--resource-group]
                               [--yes]
  examples:
  - summary: |-
      Edit the port of an existing local shortcut.
    syntax: az logicapp context update --name orders-local --port 7079
  - summary: |-
      Deliberately switch an existing shortcut to a deployed target.
    syntax: az logicapp context update --name dev --kind cloud -g my-rg --logic-app-name my-app --yes
  requiredParameters:
  - isRequired: true
    name: --name
    summary: |-
      Existing saved context name, not the Logic App name.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --kind
    acceptedValues: cloud, local
    summary: |-
      Target kind. Required for a local/cloud transition, together with complete new coordinates.
  - name: --logic-app-name
    summary: |-
      New deployed Logic App name. Required with --resource-group when switching to cloud.
  - name: --path
    summary: |-
      New local path; need not exist yet. Omitted fields are retained.
  - name: --port
    summary: |-
      New local port. Required with --path when switching from cloud to local.
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - name: --yes -y
    defaultValue: "False"
    summary: |-
      Confirm editing the active target without prompting. Does not bypass validation or concurrent-change checks.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_logicapp_context_use
  name: az logicapp context use
  summary: |-
    Select the active Logic Apps CLI context.
  status: GA
  sourceType: Extension
  syntax: >-
    az logicapp context use --name
                            [--acquire-policy-token]
                            [--change-reference]
  examples:
  - summary: |-
      Use a registered context.
    syntax: az logicapp context use --name orders-local
  requiredParameters:
  - isRequired: true
    name: --name
    summary: |-
      Registered context name.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_logicapp_context_create
- az_logicapp_context_delete
