  - name: --resource-group -g
    summary: |-
      Name of resource group containing the Logic App Standard site.
  - name: --show-content-urls
    defaultValue: "False"
    summary: |-
      Emit SAS-bearing content-link URIs. Default redacts URI values.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_logicapp_run_action_show-content
  name: az logicapp run action show-content
  summary: |-
    Download the recorded inputs or outputs of a run action.
  description: |-
    The platform stores action payloads out of band and returns only a link. This downloads the payload and prints it, so a connector's underlying error detail is visible without handling a SAS URI by hand. Defaults to outputs. Not every action records both payloads: an action that failed before it produced a response has no outputs at all, and its error text is on run action show instead.
  status: GA
  sourceType: Extension
  syntax: >-
    az logicapp run action show-content --action
                                        --run-id
                                        --workflow
                                        [--acquire-policy-token]
                                        [--change-reference]
                                        [--content {inputs, outputs}]
                                        [--context]
                                        [--host-key]
                                        [--local]
                                        [--max-bytes]
                                        [--name]
                                        [--port]
                                        [--resource-group]
  examples:
  - summary: |-
      Read why an action failed.
    syntax: az logicapp run action show-content --local --port 7071 --workflow process-order --run-id 08584129676611502966413873720CU00 --action Send_message
  - summary: |-
      Read the inputs an action was given, capped in size.
    syntax: az logicapp run action show-content --resource-group orders-rg --name orders-app --workflow process-order --run-id 08584129676611502966413873720CU00 --action Send_message --content inputs --max-bytes 4096
  requiredParameters:
  - isRequired: true
    name: --action
    summary: |-
      Name of the action inside the run, as it appears in the workflow definition.
  - isRequired: true
    name: --run-id
    summary: |-
      Workflow run id.
  - isRequired: true
    name: --workflow
    summary: |-
      Workflow name.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --content
    defaultValue: outputs
    acceptedValues: inputs, outputs
    summary: |-
      Which recorded payload to download. Defaults to outputs, which is where action failure detail appears.
  - name: --context
    summary: |-
      Named Logic Apps CLI context used to resolve target coordinates.
  - name: --host-key
    summary: |-
      Master key for a local host that requires one. Sent as an x-functions-key header.
  - name: --local
    defaultValue: "False"
    summary: |-
      Target a local Logic Apps runtime instead of a deployed app.
  - name: --max-bytes
    summary: |-
      Download at most this many bytes of the payload.
  - name: --name -n
    summary: |-
      Name of the Logic App Standard site.
  - name: --port
    summary: |-
      Local runtime port. Requires --local when supplied on the command line.
  - name: --resource-group -g
    summary: |-
      Name of resource group containing the Logic App Standard site.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_logicapp_run_action_list
- az_logicapp_run_action_show
- az_logicapp_run_action_show-content
metadata:
  description: Inspect the individual actions inside a workflow run.
