### YamlMime:AzureCLIGroup
uid: az_logicapp_run_action
name: az logicapp run action
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **logicapp** extension for the Azure CLI (version 2.67.0 or higher). The extension will automatically install the first time you run an **az logicapp run action** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Inspect the individual actions inside a workflow run.
status: GA
sourceType: Extension
directCommands:
- uid: az_logicapp_run_action_list
  name: az logicapp run action list
  summary: |-
    List the actions of a workflow run and their individual status.
  description: |-
    This is the first step in answering why a run failed. run show reports only that an action failed; this names which one. Content links are redacted by default because they carry a SAS token.
  status: GA
  sourceType: Extension
  syntax: >-
    az logicapp run action list --run-id
                                --workflow
                                [--context]
                                [--continuation-token --next-token]
                                [--host-key]
                                [--local]
                                [--max-items]
                                [--name]
                                [--port]
                                [--resource-group]
                                [--show-content-urls]
  examples:
  - summary: |-
      Find the failed action in a run.
    syntax: az logicapp run action list --local --port 7071 --workflow process-order --run-id 08584129676611502966413873720CU00 --query "value[?status=='Failed']"
  requiredParameters:
  - isRequired: true
    name: --run-id
    summary: |-
      Workflow run id.
  - isRequired: true
    name: --workflow
    summary: |-
      Workflow name.
  optionalParameters:
  - name: --context
    summary: |-
      Named Logic Apps CLI context used to resolve target coordinates.
  - name: --continuation-token --next-token
    summary: |-
      Token returned as nextContinuationToken by a previous call, to fetch the next page.
    groupName: Pagination Arguments
  - name: --host-key
    summary: |-
      Master key for a local host that requires one. Sent as an x-functions-key header.
  - name: --local
    defaultValue: "False"
    summary: |-
      Target a local Logic Apps runtime instead of a deployed app.
  - name: --max-items
    summary: |-
      Maximum number of actions to return in this page.
    groupName: Pagination Arguments
  - name: --name -n
    summary: |-
      Name of the Logic App Standard site.
  - name: --port
    summary: |-
      Local runtime port. Requires --local when supplied on the command line.
  - name: --resource-group -g
    summary: |-
      Name of resource group containing the Logic App Standard site.
  - name: --show-content-urls
    defaultValue: "False"
    summary: |-
      Emit SAS-bearing content-link URIs. Default redacts URI values.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_logicapp_run_action_show
