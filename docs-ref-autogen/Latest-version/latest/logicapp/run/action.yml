  summary: |-
    Show one action from a workflow run.
  status: GA
  sourceType: Extension
  syntax: >-
    az logicapp run action show --action
                                --run-id
                                --workflow
                                [--context]
                                [--host-key]
                                [--local]
                                [--name]
                                [--port]
                                [--resource-group]
                                [--show-content-urls]
  examples:
  - summary: |-
      Show a single action.
    syntax: az logicapp run action show --local --port 7071 --workflow process-order --run-id 08584129676611502966413873720CU00 --action Send_message
  requiredParameters:
  - isRequired: true
    name: --action
    summary: |-
      Name of the action inside the run, as it appears in the workflow definition.
  - isRequired: true
    name: --run-id
    summary: |-
      Workflow run id.
  - isRequired: true
    name: --workflow
    summary: |-
      Workflow name.
  optionalParameters:
  - name: --context
    summary: |-
      Named Logic Apps CLI context used to resolve target coordinates.
  - name: --host-key
    summary: |-
      Master key for a local host that requires one. Sent as an x-functions-key header.
  - name: --local
