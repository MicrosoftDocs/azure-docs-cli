    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_logicapp_runtime_start
  name: az logicapp runtime start
  summary: |-
    Start a local Logic Apps Standard runtime.
  description: |-
    When the project's local.settings.json sets AzureWebJobsStorage to UseDevelopmentStorage=true, the Azurite storage emulator is started automatically on ports 10000-10002 unless one is already serving there, in which case it is reused. Only an emulator this CLI started is ever stopped, and only once no CLI-started foreground or background runtime is still using it. Process ownership is checked using both PID and creation time on Windows, Linux, and macOS; an unverified or recycled PID is never stopped. Pass --no-azurite to manage the emulator yourself.
  status: GA
  sourceType: Extension
  syntax: >-
    az logicapp runtime start [--acquire-policy-token]
                              [--background]
                              [--change-reference]
                              [--no-azurite]
                              [--path]
                              [--port]
                              [--ready-timeout]
  examples:
  - summary: |-
      Start a project runtime in the background.
    syntax: az logicapp runtime start --path .\orders --port 7071 --background
  - summary: |-
      Start a runtime without touching the storage emulator.
    syntax: az logicapp runtime start --path .\orders --port 7071 --background --no-azurite
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --background
    defaultValue: "False"
    summary: |-
      Detach and record process identity for stop.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --no-azurite
    defaultValue: "False"
    summary: |-
      Do not start the Azurite storage emulator. By default it is started when the project uses development storage and nothing is already serving on port 10000.
  - name: --path
    summary: |-
      Project root to run.
  - name: --port
    summary: |-
      Listener port. Defaults to the saved local context port, otherwise 7071.
  - name: --ready-timeout
    defaultValue: "30"
    summary: |-
      Seconds to wait for the management endpoint to answer when running in the background. 0 returns immediately without waiting.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_logicapp_runtime_stop
  name: az logicapp runtime stop
  summary: |-
    Stop a local runtime started by this CLI.
  description: |-
    A retry can remove a cleanup-pending receipt once every recorded process and
    launch consumer has exited and the port is idle. It never signals a recycled or
    unverifiable PID. Confirmed exited Windows processes may still have open handles.
    Recovered receipts report result already-exited rather than terminated.
  status: GA
  sourceType: Extension
  syntax: >-
    az logicapp runtime stop [--acquire-policy-token]
                             [--all]
                             [--change-reference]
                             [--port]
  examples:
  - summary: |-
      Stop one CLI-started runtime.
    syntax: az logicapp runtime stop --port 7071
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --all
    defaultValue: "False"
    summary: |-
      Stop all runtimes previously started by this CLI.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --port
    summary: |-
      Stop CLI-started runtime on this port. Defaults to the saved local context port, otherwise 7071. Ignored with --all.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
