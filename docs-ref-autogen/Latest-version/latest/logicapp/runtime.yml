### YamlMime:AzureCLIGroup
uid: az_logicapp_runtime
name: az logicapp runtime
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **logicapp** extension for the Azure CLI (version 2.67.0 or higher). The extension will automatically install the first time you run an **az logicapp runtime** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage local Logic Apps Standard runtimes.
status: GA
sourceType: Extension
directCommands:
- uid: az_logicapp_runtime_doctor
  name: az logicapp runtime doctor
  summary: |-
    Diagnose a local project's runtime prerequisites without changing them.
  description: |-
    Reads project files, selected child-environment tool versions, cached bundle evidence and literal loopback ports. Never installs, downloads, starts, stops, repairs, decrypts settings, changes context, or contacts cloud storage. Configuration and upstream values are not printed. A stopped host is an optional skipped live probe, not an offline preflight failure. Unknown tool and bundle compatibility is not healthy. This is not a workflow business test. Exit 0 means no required blockers or unknown checks, 1 means a required failure, and 2 means a required unknown (or optional failed/warning/unknown with --strict). JSON and table findings are printed before a diagnostic nonzero exit. Exact tool/bundle compatibility remains required unknown, so an otherwise responsive project normally exits 2; unknown is not failure or healthy certification.
  status: GA
  sourceType: Extension
  syntax: >-
    az logicapp runtime doctor [--acquire-policy-token]
                               [--change-reference]
                               [--context]
                               [--path]
                               [--port]
                               [--probe-timeout]
                               [--strict]
  examples:
  - summary: |-
      Diagnose a local project and preserve JSON findings for CI.
    syntax: az logicapp runtime doctor --path .\orders --output json
  - summary: |-
      Inspect a saved local context in a human-readable table.
    syntax: az logicapp runtime doctor --context orders-local --output table
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --context
    summary: |-
      Named local context. Cannot combine with --path or --port.
  - name: --path
    summary: |-
      Local project root. Defaults to active local context or current directory.
  - name: --port
    summary: |-
      Local host port. Defaults to saved context port or 7071.
  - name: --probe-timeout
    defaultValue: "2"
    summary: |-
      Per-probe timeout in seconds, 1 to 10. No downloads or service starts.
  - name: --strict
    defaultValue: "False"
    summary: |-
      Also exit 2 for optional failed, warning or unknown checks.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
