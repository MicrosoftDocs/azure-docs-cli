### YamlMime:AzureCLIGroup
uid: az_logicapp_deployment
name: az logicapp deployment
importantNote: >-
  > [!NOTE]

  > This command group has commands that are defined in both Azure CLI and at least one extension. Install each extension to benefit from its extended capabilities. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage logic app deployments.
status: GA
sourceType: Core and Extension
directCommands:
- uid: az_logicapp_deployment_package
  name: az logicapp deployment package
  summary: |-
    Create a deterministic deployment package for a Logic Apps Standard project.
  description: |-
    Excludes directories containing the native scaffold Workflow.Tests.csproj or .logicapp-test-state, including custom in-project test locations, and raw TRX files. Test sources, fixtures, private caches and build outputs under those directories are not deployed. A test project/state sharing the deployment root or a workflow definition directory is refused, not silently omitted. Keep tests in dedicated directories. Ordinary runtime binaries remain eligible. Root .funcignore controls additional authored exclusions; .gitignore is not deployment policy. Arbitrary test code can write elsewhere, so inspect the manifest and exclude other private fixtures/artifacts explicitly.
  status: GA
  sourceType: Extension
  syntax: >-
    az logicapp deployment package --output-path
                                   [--acquire-policy-token]
                                   [--change-reference]
                                   [--force]
                                   [--manifest]
                                   [--path]
  examples:
  - summary: |-
      Package a project.
    syntax: az logicapp deployment package --path .\orders --output-path .\orders.zip
  requiredParameters:
  - isRequired: true
    name: --output-path
    summary: |-
      Destination zip path.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --force
    defaultValue: "False"
    summary: |-
      Overwrite archive and manifest.
  - name: --manifest
    summary: |-
      Manifest path.
  - name: --path
    summary: |-
      Project root.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_logicapp_deployment_package
- az_logicapp_deployment_source
- az_logicapp_deployment_source_config-zip
metadata:
  description: Manage logic app deployments.
