### YamlMime:AzureCLIGroup
uid: az_resiliency_goal-assignment_goal-resource
name: az resiliency goal-assignment goal-resource
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **resiliency** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az resiliency goal-assignment goal-resource** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Goal Resource.
status: GA
sourceType: Extension
directCommands:
- uid: az_resiliency_goal-assignment_goal-resource_list
  name: az resiliency goal-assignment goal-resource list
  summary: |-
    List goal resources under a goal assignment.
  status: GA
  sourceType: Extension
  syntax: >-
    az resiliency goal-assignment goal-resource list --goal-assignment-name
                                                     --service-group-name
                                                     [--max-items]
                                                     [--next-token]
                                                     [--skip-token]
                                                     [--top]
  examples:
  - summary: |-
      GoalResources_List_MaximumSet
    syntax: az resiliency goal-assignment goal-resource list --service-group-name production-sg --skip-token xntbyoswztnmvitj --top 69 --goal-assignment-name zonal-resiliency-goal
  requiredParameters:
  - isRequired: true
    name: --goal-assignment-name
    summary: |-
      The name of the goal assignment.
  - isRequired: true
    name: --service-group-name
    summary: |-
      The name of the service group.
  optionalParameters:
  - name: --max-items
    summary: |-
      Total number of items to return in the command's output. If the total number of items available is more than the value specified, a token is provided in the command's output. To resume pagination, provide the token value in `--next-token` argument of a subsequent command.
    groupName: Pagination Arguments
  - name: --next-token
    summary: |-
      Token to specify where to start paginating. This is the token value from a previously truncated response.
    groupName: Pagination Arguments
  - name: --skip-token
    summary: |-
      Skip over when retrieving results.
  - name: --top
    summary: |-
      Number of elements to return when retrieving results.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_resiliency_goal-assignment_goal-resource_show
  name: az resiliency goal-assignment goal-resource show
  summary: |-
    Get a goal resource.
  status: GA
  sourceType: Extension
  syntax: >-
    az resiliency goal-assignment goal-resource show --goal-assignment-name
                                                     --goal-resource-name
                                                     --service-group-name
  examples:
  - summary: |-
      Get a goal resource by the name returned by `az resiliency goal-assignment goal-resource list`
    syntax: az resiliency goal-assignment goal-resource show --service-group-name production-sg --goal-assignment-name zonal-resiliency-goal --goal-resource-name 3f2b8c1e-7d4a-4e6b-9a1c-5d8e2f7b4c90
  requiredParameters:
  - isRequired: true
    name: --goal-assignment-name
    summary: |-
      The name of the goal assignment.
  - isRequired: true
    name: --goal-resource-name
    summary: |-
      The name of the goal resource.
  - isRequired: true
    name: --service-group-name
    summary: |-
      The name of the service group.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_resiliency_goal-assignment_goal-resource_list
- az_resiliency_goal-assignment_goal-resource_show
metadata:
  description: Manage Goal Resource.
