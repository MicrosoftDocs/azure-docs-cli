### YamlMime:AzureCLIGroup
uid: az_resiliency_operation-status
name: az resiliency operation-status
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **resiliency** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az resiliency operation-status** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Operation Status.
status: GA
sourceType: Extension
directCommands:
- uid: az_resiliency_operation-status_show
  name: az resiliency operation-status show
  summary: |-
    Get the current status of an async operation.
  status: GA
  sourceType: Extension
  syntax: >-
    az resiliency operation-status show --location
                                        --operation-id
  examples:
  - summary: |-
      OperationStatus_Get_MaximumSet
    syntax: az resiliency operation-status show --location eastus --operation-id 12345678-1234-1234-1234-123456789012
  requiredParameters:
  - isRequired: true
    name: --location -l
    summary: |-
      Location. Values from: `az account list-locations`. You can configure the default location using `az configure --defaults location=<location>`.
  - isRequired: true
    name: --operation-id
    summary: |-
      The ID of an ongoing async operation.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_resiliency_operation-status_show
metadata:
  description: Manage Operation Status.
