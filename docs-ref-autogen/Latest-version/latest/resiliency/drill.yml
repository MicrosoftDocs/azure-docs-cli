### YamlMime:AzureCLIGroup
uid: az_resiliency_drill
name: az resiliency drill
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **resiliency** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az resiliency drill** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Drill.
status: GA
sourceType: Extension
directCommands:
- uid: az_resiliency_drill_add-or-update-resource
  name: az resiliency drill add-or-update-resource
  summary: |-
    This enables the user to include, exclude or update resources from their Drill.
  status: GA
  sourceType: Extension
  syntax: >-
    az resiliency drill add-or-update-resource --drill-name
                                               --fault-duration-in-min
                                               --operation-id
                                               --service-group-name
                                               [--acquire-policy-token]
                                               [--change-reference]
                                               [--force-inclusion-and-update --force-update {Disable, Enable}]
                                               [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                               [--resource-lists]
  examples:
  - summary: |-
      Add a virtual machine to a drill
    syntax: az resiliency drill add-or-update-resource --service-group-name sampleServiceGroupName --drill-name drill1 --operation-id 3f1c2a4b-5d6e-4f70-8a9b-0c1d2e3f4a5b --fault-duration-in-min 10 --resource-lists "{include-resources:[{id:/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg1/providers/Microsoft.Compute/virtualMachines/vm1}]}"
  - summary: |-
      Set the default fault of a resource in a drill
    syntax: az resiliency drill add-or-update-resource --service-group-name sampleServiceGroupName --drill-name drill1 --operation-id 3f1c2a4b-5d6e-4f70-8a9b-0c1d2e3f4a5b --fault-duration-in-min 10 --resource-lists "{update-resources:[{id:/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg1/providers/Microsoft.Compute/virtualMachines/vm1,fault-properties:{default-fault:{fault-name:VMShutdown,fault-urn:'urn:csci:microsoft:virtualMachine:shutdown/1.0',target-resource-id:/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg1/providers/Microsoft.Compute/virtualMachines/vm1}}}]}"
  requiredParameters:
  - isRequired: true
    name: --drill-name
    summary: |-
      The name of the Drill.
  - isRequired: true
    name: --fault-duration-in-min
    summary: |-
      Duration of faults.
    groupName: Body Arguments
  - isRequired: true
    name: --operation-id
    summary: |-
      A GUID that represents the Long Running OperationId.
  - isRequired: true
    name: --service-group-name
    summary: |-
      The name of the service group.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --force-inclusion-and-update --force-update
    acceptedValues: Disable, Enable
    summary: |-
      Whether to allow inclusion and update despite attention reasons.
    groupName: Body Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --resource-lists
    summary: |-
      Add, Update, Delete resource lists  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Body Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_resiliency_drill_create
  name: az resiliency drill create
  summary: |-
    Create a Drill.
  status: GA
  sourceType: Extension
  syntax: >-
    az resiliency drill create --drill-name
                               --service-group-name
                               [--acquire-policy-token]
                               [--change-reference]
                               [--chaos-properties --chaos-resource-properties]
                               [--drill-asset-properties]
                               [--goal-assignment-properties --goal-properties]
                               [--health-model-monitoring-properties --health-properties]
                               [--mi-system-assigned --system-assigned]
                               [--mi-user-assigned --user-assigned]
                               [--monitoring-properties]
                               [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                               [--rbac-setup-mode {AutomatedBuiltinRoles, AutomatedCustomRole, Manual}]
                               [--recovery-plan-properties --recovery-properties]
                               [--regional]
                               [--sli-monitoring-properties --sli-properties]
                               [--zonal]
  examples:
  - summary: |-
      Drills_Create_MaximumSet
    syntax: az resiliency drill create --service-group-name sampleServiceGroupName --drill-name drill1 --rbac-setup-mode AutomatedCustomRole --recovery-plan-properties "{identity:{type:UserAssigned,userAssignedIdentity:/subscriptions/4e88bed3-114f-443d-9975-28f64122ec5e/resourcegroups/resourceGroup1/providers/Microsoft.ManagedIdentity/userAssignedIdentities/uami1}}" --monitoring-properties "{identity:{type:UserAssigned,userAssignedIdentity:/subscriptions/4e88bed3-114f-443d-9975-28f64122ec5e/resourcegroups/resourceGroup1/providers/Microsoft.ManagedIdentity/userAssignedIdentities/uami1}}" --drill-asset-properties "{subscription:4e88bed3-114f-443d-9975-28f64122ec5e,region:eastus,resource-group:customDrillResourceGroup}" --chaos-resource-properties "{identity:{type:UserAssigned,userAssignedIdentity:/subscriptions/4e88bed3-114f-443d-9975-28f64122ec5e/resourcegroups/resourceGroup1/providers/Microsoft.ManagedIdentity/userAssignedIdentities/uami1},chaos-resource-identity-for-faults:{type:UserAssigned,userAssignedIdentity:/subscriptions/4e88bed3-114f-443d-9975-28f64122ec5e/resourcegroups/resourceGroup1/providers/Microsoft.ManagedIdentity/userAssignedIdentities/uami1}}" --health-model-monitoring-properties "{identity:{type:UserAssigned,userAssignedIdentity:/subscriptions/4e88bed3-114f-443d-9975-28f64122ec5e/resourcegroups/resourceGroup1/providers/Microsoft.ManagedIdentity/userAssignedIdentities/uami1},health-model-id:/subscriptions/4e88bed3-114f-443d-9975-28f64122ec5e/resourceGroups/contoso-health/providers/Microsoft.CloudHealth/healthmodels/contoso-payments-hm}" --sli-monitoring-properties "{identity:{type:UserAssigned,userAssignedIdentity:/subscriptions/4e88bed3-114f-443d-9975-28f64122ec5e/resourcegroups/resourceGroup1/providers/Microsoft.ManagedIdentity/userAssignedIdentities/uami1},slis:[{sli-id:/providers/Microsoft.Management/serviceGroups/sampleServiceGroupName/providers/Microsoft.Monitor/slis/checkout-availability,type:Availability},{sli-id:/providers/Microsoft.Management/serviceGroups/sampleServiceGroupName/providers/Microsoft.Monitor/slis/checkout-latency,type:Latency}]}" --goal-assignment-properties "{identity:{type:UserAssigned,userAssignedIdentity:/subscriptions/4e88bed3-114f-443d-9975-28f64122ec5e/resourcegroups/resourceGroup1/providers/Microsoft.ManagedIdentity/userAssignedIdentities/uami1}}"
  requiredParameters:
  - isRequired: true
    name: --drill-name
    summary: |-
      The name of the Drill.
  - isRequired: true
    name: --service-group-name
    summary: |-
      The name of the service group.
