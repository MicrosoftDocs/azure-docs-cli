- uid: az_resiliency_drill_drill-run_drill-run-resource_list
  name: az resiliency drill drill-run drill-run-resource list
  summary: |-
    List DrillRunResource resources by DrillRun.
  status: GA
  sourceType: Extension
  syntax: >-
    az resiliency drill drill-run drill-run-resource list --drill-name
                                                          --drill-run-name
                                                          --service-group-name
                                                          [--max-items]
                                                          [--next-token]
  examples:
  - summary: |-
      DrillRunResources_List_MaximumSet
    syntax: az resiliency drill drill-run drill-run-resource list --service-group-name sampleServiceGroupName --drill-name drill1 --drill-run-name ca92602e-53bf-43d2-ae62-d3fc940474b3
  requiredParameters:
  - isRequired: true
    name: --drill-name
    summary: |-
      The name of the Drill.
  - isRequired: true
    name: --drill-run-name
    summary: |-
      The name of the DrillRun (GUID).
  - isRequired: true
    name: --service-group-name
    summary: |-
      The name of the service group.
  optionalParameters:
  - name: --max-items
    summary: |-
      Total number of items to return in the command's output. If the total number of items available is more than the value specified, a token is provided in the command's output. To resume pagination, provide the token value in `--next-token` argument of a subsequent command.
    groupName: Pagination Arguments
  - name: --next-token
    summary: |-
      Token to specify where to start paginating. This is the token value from a previously truncated response.
    groupName: Pagination Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
