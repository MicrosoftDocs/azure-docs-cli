uid: az_resiliency_drill_drill-run
name: az resiliency drill drill-run
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **resiliency** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az resiliency drill drill-run** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Drill Run.
status: GA
sourceType: Extension
directCommands:
- uid: az_resiliency_drill_drill-run_add-note
  name: az resiliency drill drill-run add-note
  summary: |-
    This enables the user to add notes on this Drill Run.
  status: GA
  sourceType: Extension
  syntax: >-
    az resiliency drill drill-run add-note --drill-name
                                           --drill-run-name
                                           --operation-id
                                           --service-group-name
                                           [--acquire-policy-token]
                                           [--change-reference]
                                           [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                           [--notes]
  examples:
  - summary: |-
      DrillRuns_AddNotes_MaximumSet
    syntax: az resiliency drill drill-run add-note --service-group-name sampleServiceGroupName --operation-id qmn --drill-name drill1 --drill-run-name ca92602e-53bf-43d2-ae62-d3fc940474b3 --notes wubqjajveatmwcglo
  requiredParameters:
  - isRequired: true
    name: --drill-name
    summary: |-
      The name of the Drill.
  - isRequired: true
    name: --drill-run-name
    summary: |-
      The name of the DrillRun (GUID).
  - isRequired: true
    name: --operation-id
    summary: |-
      A GUID that represents the Long Running OperationId.
  - isRequired: true
    name: --service-group-name
    summary: |-
      The name of the service group.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --notes
    summary: |-
      The notes string.
    groupName: Body Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_resiliency_drill_drill-run_fail-over
  name: az resiliency drill drill-run fail-over
  summary: |-
    This initiates a new Failover operation on this Drill Run.
  status: GA
  sourceType: Extension
  syntax: >-
    az resiliency drill drill-run fail-over --drill-name
                                            --drill-run-name
                                            --operation-id
                                            --service-group-name
                                            [--acquire-policy-token]
                                            [--auto-failover {Disable, Enable}]
                                            [--change-reference]
                                            [--failover-properties]
                                            [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
  examples:
  - summary: |-
      DrillRuns_FailOver_MaximumSet
    syntax: az resiliency drill drill-run fail-over --service-group-name sampleServiceGroupName --operation-id qmn --drill-name drill1 --drill-run-name ca92602e-53bf-43d2-ae62-d3fc940474b3 --failover-properties "{failover-direction:FromSpecificLocations,failover-request-properties:{source-locations:[westus]}}" --auto-failover Enable
  requiredParameters:
  - isRequired: true
    name: --drill-name
    summary: |-
      The name of the Drill.
  - isRequired: true
    name: --drill-run-name
    summary: |-
      The name of the DrillRun (GUID).
  - isRequired: true
    name: --operation-id
    summary: |-
      A GUID that represents the Long Running OperationId.
  - isRequired: true
    name: --service-group-name
    summary: |-
      The name of the service group.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --auto-failover
    acceptedValues: Disable, Enable
    summary: |-
      AutoFailover - whether to pause between Fault and Failover for manual input.
    groupName: Body Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --failover-properties
    summary: |-
      The failover properties.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Body Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_resiliency_drill_drill-run_generate-report
  name: az resiliency drill drill-run generate-report
  summary: |-
    This generates, or regenerates, the report for this Drill Run. The action is idempotent and is safe to call at any time: a call that arrives while a generation is already running joins it, and a call made after a failed attempt retries it. A report that has been finalized is never regenerated.
  status: GA
  sourceType: Extension
  syntax: >-
    az resiliency drill drill-run generate-report --drill-name
                                                  --drill-run-name
                                                  --operation-id
                                                  --service-group-name
                                                  [--acquire-policy-token]
                                                  [--change-reference]
                                                  [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
  examples:
  - summary: |-
      DrillRuns_GenerateReport_MaximumSet
    syntax: az resiliency drill drill-run generate-report --service-group-name sampleServiceGroupName --operation-id qmn --drill-name drill1 --drill-run-name ca92602e-53bf-43d2-ae62-d3fc940474b3
  requiredParameters:
