### YamlMime:AzureCLIGroup
uid: az_resiliency_drill_drill-resource
name: az resiliency drill drill-resource
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **resiliency** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az resiliency drill drill-resource** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Drill Resource.
status: GA
sourceType: Extension
directCommands:
- uid: az_resiliency_drill_drill-resource_list
  name: az resiliency drill drill-resource list
  summary: |-
    List DrillResource resources by Drill.
  status: GA
  sourceType: Extension
  syntax: >-
    az resiliency drill drill-resource list --drill-name
                                            --service-group-name
                                            [--max-items]
                                            [--next-token]
                                            [--skip-token]
                                            [--top]
  examples:
  - summary: |-
      DrillResources_List_MaximumSet
    syntax: az resiliency drill drill-resource list --service-group-name sampleServiceGroupName --skip-token xntbyoswztnmvitj --top 69 --drill-name drill1
  requiredParameters:
  - isRequired: true
    name: --drill-name
    summary: |-
      The name of the Drill.
  - isRequired: true
    name: --service-group-name
    summary: |-
      The name of the service group.
  optionalParameters:
  - name: --max-items
    summary: |-
      Total number of items to return in the command's output. If the total number of items available is more than the value specified, a token is provided in the command's output. To resume pagination, provide the token value in `--next-token` argument of a subsequent command.
    groupName: Pagination Arguments
  - name: --next-token
    summary: |-
      Token to specify where to start paginating. This is the token value from a previously truncated response.
    groupName: Pagination Arguments
  - name: --skip-token
    summary: |-
      Skip over when retrieving results.
  - name: --top
    summary: |-
      Number of elements to return when retrieving results.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_resiliency_drill_drill-resource_show
  name: az resiliency drill drill-resource show
  summary: |-
    Get a DrillResource.
  status: GA
  sourceType: Extension
  syntax: >-
    az resiliency drill drill-resource show --drill-name
                                            --drill-resource-name
                                            --service-group-name
  examples:
  - summary: |-
      DrillResources_Get_MaximumSet
    syntax: az resiliency drill drill-resource show --service-group-name sampleServiceGroupName --drill-name drill1 --drill-resource-name b6378181-9dc0-4a43-8e09-97a8b08aabaa
  requiredParameters:
  - isRequired: true
    name: --drill-name
    summary: |-
      The name of the Drill.
  - isRequired: true
    name: --drill-resource-name
    summary: |-
      The name of the DrillResource (GUID).
  - isRequired: true
    name: --service-group-name
    summary: |-
      The name of the service group.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_resiliency_drill_drill-resource_list
- az_resiliency_drill_drill-resource_show
metadata:
  description: Manage Drill Resource.
