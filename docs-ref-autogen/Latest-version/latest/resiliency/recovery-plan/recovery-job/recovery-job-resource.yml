  sourceType: Extension
  syntax: >-
    az resiliency recovery-plan recovery-job recovery-job-resource list --recovery-job-name
                                                                        --recovery-plan-name
                                                                        --service-group-name
                                                                        [--max-items]
                                                                        [--next-token]
