### YamlMime:AzureCLIGroup
uid: az_resiliency_recovery-plan_recovery-job
name: az resiliency recovery-plan recovery-job
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **resiliency** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az resiliency recovery-plan recovery-job** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Recovery Job.
status: GA
sourceType: Extension
directCommands:
- uid: az_resiliency_recovery-plan_recovery-job_list
  name: az resiliency recovery-plan recovery-job list
  summary: |-
    List RecoveryJob resources by RecoveryPlan.
  status: GA
  sourceType: Extension
  syntax: >-
    az resiliency recovery-plan recovery-job list --recovery-plan-name
                                                  --service-group-name
                                                  [--max-items]
                                                  [--next-token]
  examples:
  - summary: |-
      RecoveryJobs_List_MaximumSet
    syntax: az resiliency recovery-plan recovery-job list --service-group-name sampleServiceGroupName --recovery-plan-name samplePlanName
  requiredParameters:
  - isRequired: true
    name: --recovery-plan-name
    summary: |-
      The name of the recovery orchestration plan.
  - isRequired: true
    name: --service-group-name
    summary: |-
      The name of the service group.
  optionalParameters:
  - name: --max-items
    summary: |-
      Total number of items to return in the command's output. If the total number of items available is more than the value specified, a token is provided in the command's output. To resume pagination, provide the token value in `--next-token` argument of a subsequent command.
    groupName: Pagination Arguments
  - name: --next-token
    summary: |-
      Token to specify where to start paginating. This is the token value from a previously truncated response.
    groupName: Pagination Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_resiliency_recovery-plan_recovery-job_resume
  name: az resiliency recovery-plan recovery-job resume
  summary: |-
    This action resumes the ongoing recovery orchestration job that was paused for required user intervention.
  status: GA
  sourceType: Extension
  syntax: >-
    az resiliency recovery-plan recovery-job resume --operation-id
                                                    --recovery-job-name
                                                    --recovery-plan-name
                                                    --service-group-name
                                                    [--acquire-policy-token]
                                                    [--change-reference]
                                                    [--description]
                                                    [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
  examples:
  - summary: |-
      RecoveryJobs_Resume_MaximumSet
    syntax: az resiliency recovery-plan recovery-job resume --service-group-name sampleServiceGroupName --operation-id qmn --recovery-plan-name samplePlanName --recovery-job-name c56888ef-9ced-4001-a6d4-7145a0309bdb --description "Resuming the recovery job after user verification"
  requiredParameters:
  - isRequired: true
    name: --operation-id
    summary: |-
      A GUID that represents the Long Running OperationId.
  - isRequired: true
    name: --recovery-job-name
    summary: |-
      The unique name (GUID) of the recovery job.
  - isRequired: true
    name: --recovery-plan-name
    summary: |-
      The name of the recovery orchestration plan.
  - isRequired: true
    name: --service-group-name
    summary: |-
      The name of the service group.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --description
    summary: |-
      User-provided input for the action.
    groupName: Body Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
