### YamlMime:AzureCLIGroup
uid: az_resiliency_recovery-plan_recovery-resource
name: az resiliency recovery-plan recovery-resource
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **resiliency** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az resiliency recovery-plan recovery-resource** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Recovery Resource.
status: GA
sourceType: Extension
directCommands:
- uid: az_resiliency_recovery-plan_recovery-resource_list
  name: az resiliency recovery-plan recovery-resource list
  summary: |-
    List RecoveryResource resources by RecoveryPlan.
  status: GA
  sourceType: Extension
  syntax: >-
    az resiliency recovery-plan recovery-resource list --recovery-plan-name
                                                       --service-group-name
                                                       [--max-items]
                                                       [--next-token]
  examples:
  - summary: |-
      RecoveryResources_List_MaximumSet
    syntax: az resiliency recovery-plan recovery-resource list --service-group-name sampleServiceGroupName --recovery-plan-name plan1
  requiredParameters:
  - isRequired: true
    name: --recovery-plan-name
    summary: |-
      The name of the recovery orchestration plan.
  - isRequired: true
    name: --service-group-name
    summary: |-
      The name of the service group.
  optionalParameters:
  - name: --max-items
    summary: |-
      Total number of items to return in the command's output. If the total number of items available is more than the value specified, a token is provided in the command's output. To resume pagination, provide the token value in `--next-token` argument of a subsequent command.
    groupName: Pagination Arguments
  - name: --next-token
    summary: |-
      Token to specify where to start paginating. This is the token value from a previously truncated response.
    groupName: Pagination Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_resiliency_recovery-plan_recovery-resource_show
  name: az resiliency recovery-plan recovery-resource show
  summary: |-
    Get a RecoveryResource.
  status: GA
  sourceType: Extension
  syntax: >-
    az resiliency recovery-plan recovery-resource show --recovery-plan-name
                                                       --recovery-resource-name
                                                       --service-group-name
  examples:
  - summary: |-
      RecoveryResources_Get_CrossZoneVMRecovery
    syntax: az resiliency recovery-plan recovery-resource show --service-group-name sampleServiceGroupName --recovery-plan-name samplePlanName --recovery-resource-name 12345678-9012-3456-7890-123456789012
  - summary: |-
      RecoveryResources_Get_MaximumSet
    syntax: az resiliency recovery-plan recovery-resource show --service-group-name sampleServiceGroupName --recovery-plan-name samplePlanName --recovery-resource-name 12345678-9012-3456-7890-123456789012 --service-group-name sampleServiceGroupName --recovery-plan-name samplePlanName --recovery-resource-name 12345678-9012-3456-7890-123456789012
  requiredParameters:
  - isRequired: true
    name: --recovery-plan-name
    summary: |-
      The name of the recovery orchestration plan.
  - isRequired: true
    name: --recovery-resource-name
    summary: |-
      The unique name (Guid) of the recovery resource.
  - isRequired: true
    name: --service-group-name
    summary: |-
      The name of the service group.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_resiliency_recovery-plan_recovery-resource_list
- az_resiliency_recovery-plan_recovery-resource_show
metadata:
  description: Manage Recovery Resource.
