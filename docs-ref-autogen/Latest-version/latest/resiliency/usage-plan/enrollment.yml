                                               [--change-reference]
                                               [--enrollment-name --name]
                                               [--force-string {0, 1, f, false, n, no, t, true, y, yes}]
                                               [--ids]
                                               [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                               [--remove]
                                               [--resource-group]
                                               [--service-group-id]
                                               [--set]
                                               [--subscription]
                                               [--usage-plan-name]
