### YamlMime:AzureCLIGroup
uid: az_resiliency_usage-plan_enrollment
name: az resiliency usage-plan enrollment
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **resiliency** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az resiliency usage-plan enrollment** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Enrollment.
status: GA
sourceType: Extension
directCommands:
- uid: az_resiliency_usage-plan_enrollment_create
  name: az resiliency usage-plan enrollment create
  summary: |-
    Create an Enrollment.
  status: GA
  sourceType: Extension
  syntax: >-
    az resiliency usage-plan enrollment create --enrollment-name --name
                                               --resource-group
                                               --usage-plan-name
                                               [--acquire-policy-token]
                                               [--change-reference]
                                               [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                               [--service-group-id]
  examples:
  - summary: |-
      Enrollments_CreateOrUpdate_MaximumSet
    syntax: az resiliency usage-plan enrollment create --resource-group MyResourceGroup --usage-plan-name myUsagePlan --enrollment-name sg1-enrollment --service-group-id /providers/Microsoft.Management/serviceGroups/sg1
  requiredParameters:
  - isRequired: true
    name: --enrollment-name --name -n
    summary: |-
      The name of the enrollment.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --usage-plan-name
    summary: |-
      The name of the usage plan.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --service-group-id
    summary: |-
      ARM resource identifier of the service group associated with this usage plan.
    groupName: Properties Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
