### YamlMime:AzureCLIGroup
uid: az_resiliency_goal-assignment
name: az resiliency goal-assignment
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **resiliency** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az resiliency goal-assignment** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Goal Assignment.
status: GA
sourceType: Extension
directCommands:
- uid: az_resiliency_goal-assignment_create
  name: az resiliency goal-assignment create
  summary: |-
    Create a goal assignment.
  status: GA
  sourceType: Extension
  syntax: >-
    az resiliency goal-assignment create --goal-assignment-name
                                         --service-group-name
                                         [--acquire-policy-token]
                                         [--change-reference]
                                         [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                         [--require-zonal --require-zonal-resiliency {0, 1, f, false, n, no, t, true, y, yes}]
                                         [--service-level-resources --service-resources --sli-resources]
  examples:
  - summary: |-
      Create a goal assignment that requires zonal resiliency
    syntax: az resiliency goal-assignment create --service-group-name production-sg --goal-assignment-name zonal-resiliency-goal --require-zonal-resiliency true
  - summary: |-
      Create a goal assignment for specific service level indicator resources
    syntax: az resiliency goal-assignment create --service-group-name production-sg --goal-assignment-name zonal-resiliency-goal --sli-resources "[{service-level-indicator-resource-id:/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg1/providers/Microsoft.Compute/virtualMachines/vm1}]" --require-zonal-resiliency true
  requiredParameters:
  - isRequired: true
    name: --goal-assignment-name
    summary: |-
      The name of the goal assignment.
  - isRequired: true
    name: --service-group-name
    summary: |-
      The name of the service group.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --require-zonal --require-zonal-resiliency
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Whether zonal resiliency is required for this goal assignment.
    groupName: Properties Arguments
  - name: --service-level-resources --service-resources --sli-resources
    summary: |-
      List of service level resources.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
