### YamlMime:AzureCLIGroup
uid: az_resiliency_recovery-plan
name: az resiliency recovery-plan
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **resiliency** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az resiliency recovery-plan** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Recovery Plan.
status: GA
sourceType: Extension
directCommands:
- uid: az_resiliency_recovery-plan_check-readiness
  name: az resiliency recovery-plan check-readiness
  summary: |-
    This action performs the necessary readiness check on the recovery orchestration plan to ensure it is in the desired state and eligible for all recovery actions, including all protected resources.
  status: GA
  sourceType: Extension
  syntax: >-
    az resiliency recovery-plan check-readiness --operation-id
                                                --recovery-plan-name
                                                --service-group-name
                                                [--acquire-policy-token]
                                                [--change-reference]
                                                [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
  examples:
  - summary: |-
      RecoveryPlanActions_CheckReadiness_MaximumSet
    syntax: az resiliency recovery-plan check-readiness --service-group-name sampleServiceGroupName --operation-id qmn --recovery-plan-name samplePlanName
  requiredParameters:
  - isRequired: true
    name: --operation-id
    summary: |-
      A GUID that represents the Long Running OperationId.
  - isRequired: true
    name: --recovery-plan-name
    summary: |-
      The name of the recovery orchestration plan.
  - isRequired: true
    name: --service-group-name
    summary: |-
      The name of the service group.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_resiliency_recovery-plan_create
  name: az resiliency recovery-plan create
  summary: |-
    Create a RecoveryPlan.
  status: GA
  sourceType: Extension
  syntax: >-
    az resiliency recovery-plan create --recovery-plan-name
                                       --service-group-name
                                       [--acquire-policy-token]
                                       [--change-reference]
                                       [--mi-system-assigned --system-assigned]
                                       [--mi-user-assigned --user-assigned]
                                       [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                       [--plan-description]
                                       [--plan-type {Regional, Zonal}]
                                       [--recovery-groups --recovery-groups-setting]
  examples:
  - summary: |-
      Create a zonal recovery plan with a system-assigned identity
    syntax: az resiliency recovery-plan create --service-group-name sampleServiceGroupName --recovery-plan-name samplePlanName --plan-type Zonal --plan-description "Sample plan" --recovery-groups "{default-group:{group-unique-id:b7e2a1c4-9f3b-4e2d-8c6a-2f7e4d1b5a9f,order-id:0,description:'Default recovery group'}}" --system-assigned
  requiredParameters:
  - isRequired: true
    name: --recovery-plan-name
    summary: |-
      The name of the recovery orchestration plan.
  - isRequired: true
    name: --service-group-name
    summary: |-
      The name of the service group.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --mi-system-assigned --system-assigned
    summary: |-
      Set the system managed identity.
    groupName: Identity Arguments
  - name: --mi-user-assigned --user-assigned
    summary: |-
      Set the user managed identities.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Identity Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --plan-description
    summary: |-
      A description of the recovery orchestration plan.
    groupName: Properties Arguments
  - name: --plan-type
