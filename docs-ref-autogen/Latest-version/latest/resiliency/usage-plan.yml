- uid: az_resiliency_usage-plan_update
  name: az resiliency usage-plan update
  summary: |-
    Update a UsagePlan.
  status: GA
  sourceType: Extension
  syntax: >-
    az resiliency usage-plan update [--acquire-policy-token]
                                    [--add]
                                    [--change-reference]
                                    [--force-string {0, 1, f, false, n, no, t, true, y, yes}]
                                    [--ids]
                                    [--name --usage-plan-name]
                                    [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                    [--plan-type {Standard}]
                                    [--remove]
                                    [--resource-group]
                                    [--set]
                                    [--subscription]
                                    [--tags]
  examples:
  - summary: |-
      UsagePlans_CreateOrUpdate_MaximumSet
    syntax: az resiliency usage-plan update --resource-group MyResourceGroup --usage-plan-name myUsagePlan --plan-type Standard --tags "{environment:production}"
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --add
    summary: |-
      Add an object to a list of objects by specifying a path and key value pairs.  Example: `--add property.listProperty <key=value, string or JSON string>`.
