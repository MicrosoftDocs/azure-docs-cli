uid: az_appservice_plan_silo_vnet-integration
name: az appservice plan silo vnet-integration
summary: |-
  Inspect an App Service plan silo's virtual network integrations.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'az appservice plan silo' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Core
directCommands:
- uid: az_appservice_plan_silo_vnet-integration_list
  name: az appservice plan silo vnet-integration list
  summary: |-
    Show the virtual network integrations of an App Service plan silo.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'az appservice plan silo vnet-integration' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/appservice/_help.py
  syntax: >-
    az appservice plan silo vnet-integration list --name
                                                  --resource-group
                                                  --silo
  requiredParameters:
  - isRequired: true
    name: --name -n
    summary: |-
      Name of the App Service plan.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --silo
    summary: |-
      The name of the ServerFarmSilo.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_appservice_plan_silo_vnet-integration_list
