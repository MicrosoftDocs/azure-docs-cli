directCommands:
- uid: az_appservice_plan_silo_create
  name: az appservice plan silo create
  summary: |-
    Create an App Service plan silo.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'az appservice plan silo' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/appservice/_help.py
  syntax: >-
    az appservice plan silo create --name
                                   --primary-location
                                   --resource-group
                                   --silo
                                   [--acquire-policy-token]
                                   [--change-reference]
                                   [--location]
                                   [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                   [--number-of-workers]
                                   [--primary-plan-name --primary-server-farm-name]
                                   [--silo-location]
                                   [--tags]
                                   [--zone-redundant {0, 1, f, false, n, no, t, true, y, yes}]
  examples:
  - summary: |-
      Create a plan silo in a secondary region.
    syntax: az appservice plan silo create -g rg -n plan --silo backup --location westus2 --primary-location eastus
  requiredParameters:
  - isRequired: true
    name: --name -n
    summary: |-
      Name of the App Service plan.
  - isRequired: true
    name: --primary-location
    summary: |-
      Region of the primary App Service plan.
    groupName: Properties Arguments
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --silo
    summary: |-
      The name of the ServerFarmSilo.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --location -l
    summary: |-
      The geo-location where the resource lives  When not specified, the location of the resource group will be used.
    groupName: Resource Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --number-of-workers
    summary: |-
      Instance number override for the silo.
    groupName: Properties Arguments
  - name: --primary-plan-name --primary-server-farm-name
    summary: |-
      Name of the primary App Service plan.
    groupName: Properties Arguments
  - name: --silo-location
    summary: |-
      Azure region of the App Service plan silo, retained for compatibility. When supplied, it must identify the same region as the required root location.
    groupName: Properties Arguments
  - name: --tags
    summary: |-
      Resource tags.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Resource Arguments
  - name: --zone-redundant
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Zone redundancy override for the silo.
    groupName: Properties Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
