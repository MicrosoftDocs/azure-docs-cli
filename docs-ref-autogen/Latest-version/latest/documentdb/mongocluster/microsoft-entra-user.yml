### YamlMime:AzureCLIGroup
uid: az_documentdb_mongocluster_microsoft-entra-user
name: az documentdb mongocluster microsoft-entra-user
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **documentdb** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az documentdb mongocluster microsoft-entra-user** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Microsoft Entra ID users on a mongo cluster.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'az documentdb mongocluster' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_documentdb_mongocluster_microsoft-entra-user_assign
  name: az documentdb mongocluster microsoft-entra-user assign
  summary: |-
    Grant a Microsoft Entra ID principal access to a mongo cluster by assigning it database roles.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'az documentdb mongocluster microsoft-entra-user' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az documentdb mongocluster microsoft-entra-user assign [--acquire-policy-token]
                                                           [--change-reference]
                                                           [--cluster-name]
                                                           [--ids]
                                                           [--name --object-id]
                                                           [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                                           [--resource-group]
                                                           [--role --roles]
                                                           [--subscription]
                                                           [--type {ServicePrincipal, User}]
  examples:
  - summary: |-
      Assign admin access to an Entra ID user (or service principal) by object ID.
    syntax: az documentdb mongocluster microsoft-entra-user assign --object-id 11111111-1111-1111-1111-111111111111 --cluster-name MyCluster -g MyResourceGroup --type User --role db=admin role=root
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --cluster-name
    summary: |-
      The name of the mongo cluster.
    groupName: Resource Id Arguments
  - name: --ids
    summary: |-
      One or more resource IDs (space-delimited). It should be a complete resource ID containing all information of 'Resource Id' arguments. You should provide either --ids or other 'Resource Id' arguments.
    groupName: Resource Id Arguments
  - name: --name --object-id -n
    summary: |-
      Object ID (client ID) of the Microsoft Entra principal. Provide the GUID of the service principal or user, not a friendly name or UPN.
    groupName: Resource Id Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
    groupName: Resource Id Arguments
  - name: --role --roles
    summary: |-
      Database roles that are assigned to the user. Usage: --role db=admin role=root. Multiple roles can be specified by using more than one --role argument.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.  Singular flags: `--role`.
    groupName: Properties Arguments
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
    groupName: Resource Id Arguments
  - name: --type -t
    acceptedValues: ServicePrincipal, User
    summary: |-
      The Microsoft Entra principal type of the user. Allowed values: User, ServicePrincipal. Example: --type User.
    groupName: Properties Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
