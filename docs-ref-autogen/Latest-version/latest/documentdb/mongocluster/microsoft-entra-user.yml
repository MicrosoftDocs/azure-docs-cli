- uid: az_documentdb_mongocluster_microsoft-entra-user_wait
  name: az documentdb mongocluster microsoft-entra-user wait
  summary: |-
    Place the CLI in a waiting state until a condition is met.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'az documentdb mongocluster microsoft-entra-user' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az documentdb mongocluster microsoft-entra-user wait [--acquire-policy-token]
                                                         [--change-reference]
                                                         [--cluster-name]
                                                         [--created]
                                                         [--custom]
                                                         [--deleted]
                                                         [--exists]
                                                         [--ids]
                                                         [--interval]
                                                         [--name --object-id]
                                                         [--resource-group]
                                                         [--subscription]
                                                         [--timeout]
                                                         [--updated]
  optionalParameters:
