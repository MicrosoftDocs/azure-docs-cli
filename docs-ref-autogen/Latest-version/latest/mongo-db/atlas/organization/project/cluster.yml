### YamlMime:AzureCLIGroup
uid: az_mongo-db_atlas_organization_project_cluster
name: az mongo-db atlas organization project cluster
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **mongo-db** extension for the Azure CLI (version 2.70.0 or higher). The extension will automatically install the first time you run an **az mongo-db atlas organization project cluster** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Cluster.
status: GA
sourceType: Extension
directCommands:
- uid: az_mongo-db_atlas_organization_project_cluster_create
  name: az mongo-db atlas organization project cluster create
  summary: |-
    Create a Cluster.
  status: GA
  sourceType: Extension
  syntax: >-
    az mongo-db atlas organization project cluster create --cluster-name --name
                                                          --organization-name
                                                          --project-name
                                                          --resource-group
                                                          [--acquire-policy-token]
                                                          [--change-reference]
                                                          [--cluster-tier {FLEX, FREE, M10, M30}]
                                                          [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                                          [--region-name]
  examples:
  - summary: |-
      Clusters_CreateOrUpdate_MaximumSet
    syntax: az mongo-db atlas organization project cluster create --resource-group rgopenapi --organization-name myOrganization --project-name myProject --cluster-name myCluster --cluster-tier FREE --region-name eastus2
  requiredParameters:
  - isRequired: true
    name: --cluster-name --name -n
    summary: |-
      Name of the MongoDB Atlas Cluster resource.
  - isRequired: true
    name: --organization-name
    summary: |-
      Name of the Organization resource.
  - isRequired: true
    name: --project-name
    summary: |-
      Name of the MongoDB Atlas Project resource.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --cluster-tier
    acceptedValues: FLEX, FREE, M10, M30
    summary: |-
      Cluster tier (FREE, FLEX, M10, M30).
    groupName: Properties Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --region-name
    summary: |-
      Azure region where the cluster is deployed.
    groupName: Properties Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
