- uid: az_mongo-db_atlas_organization_project_cluster_update
  name: az mongo-db atlas organization project cluster update
  summary: |-
    Update a Cluster.
  status: GA
  sourceType: Extension
  syntax: >-
    az mongo-db atlas organization project cluster update [--acquire-policy-token]
                                                          [--add]
                                                          [--change-reference]
                                                          [--cluster-name --name]
                                                          [--force-string {0, 1, f, false, n, no, t, true, y, yes}]
                                                          [--ids]
                                                          [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                                          [--organization-name]
                                                          [--project-name]
                                                          [--remove]
                                                          [--resource-group]
                                                          [--set]
                                                          [--subscription]
  examples:
  - summary: |-
      Clusters_CreateOrUpdate_MaximumSet
    syntax: az mongo-db atlas organization project cluster update --resource-group rgopenapi --organization-name myOrganization --project-name myProject --cluster-name myCluster
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --add
    summary: |-
      Add an object to a list of objects by specifying a path and key value pairs.  Example: `--add property.listProperty <key=value, string or JSON string>`.
    groupName: Generic Update Arguments
