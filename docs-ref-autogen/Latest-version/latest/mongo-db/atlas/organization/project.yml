    List available regions by cluster tier for the project.
  status: GA
  sourceType: Extension
  syntax: >-
    az mongo-db atlas organization project cluster-tier-region [--acquire-policy-token]
                                                               [--change-reference]
                                                               [--ids]
                                                               [--organization-name]
                                                               [--project-name]
                                                               [--resource-group]
                                                               [--subscription]
  examples:
  - summary: |-
      Projects_ListClusterTierRegions_MaximumSet
    syntax: az mongo-db atlas organization project cluster-tier-region --resource-group rgopenapi --organization-name myOrganization --project-name myProject
  optionalParameters:
  - name: --acquire-policy-token
