### YamlMime:AzureCLIGroup
uid: az_interconnect-block
name: az interconnect-block
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **interconnect** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az interconnect-block** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Interconnect Block.
status: GA
sourceType: Extension
directCommands:
- uid: az_interconnect-block_create
  name: az interconnect-block create
  summary: |-
    Create an Interconnect Block. When updating an Interconnect Block, only tags and sku-capacity may be modified.
  status: GA
  sourceType: Extension
  syntax: >-
    az interconnect-block create --interconnect-block-name --name
                                 --resource-group
                                 [--acquire-policy-token]
                                 [--change-reference]
                                 [--exclude-zones --placement-exclude-zones]
                                 [--group-id --interconnect-group-id]
                                 [--include-zones --placement-include-zones]
                                 [--location]
                                 [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                 [--placement-policy --zone-placement-policy {Any, Auto}]
                                 [--sku-capacity]
                                 [--sku-name]
                                 [--sku-tier]
                                 [--tags]
                                 [--zones]
  examples:
  - summary: |-
      Creates a new InterconnectBlock resource.
    syntax: az interconnect-block create --name training-icb-001 --resource-group ai-training-rg --location eastus --zones 1 --sku-name Standard_ND128isr_GB300_v6 --sku-capacity 36 --interconnect-group-id "/subscriptions/12345678-1234-1234-1234-123456789012/resourceGroups/network-rg/providers/Microsoft.Network/interconnectGroups/training-ig" --tags Environment=Production Workload=AI-Training CostCenter=ML-Engineering
  requiredParameters:
  - isRequired: true
    name: --interconnect-block-name --name -n
    summary: |-
      The name of the Interconnect Block.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --exclude-zones --placement-exclude-zones
    summary: |-
      This property supplements the 'zonePlacementPolicy' property. If 'zonePlacementPolicy' is set to 'Any'/'Auto', availability zone selected by the system must not be present in the list of availability zones passed with 'excludeZones'. If 'excludeZones' is not provided, all availability zones in region will be considered for selection.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Placement Arguments
  - name: --group-id --interconnect-group-id
    summary: |-
      The ARM resource id in the form of /subscriptions/{SubscriptionId}/resourceGroups/{ResourceGroupName}/...
    groupName: InterconnectGroup Arguments
  - name: --include-zones --placement-include-zones
    summary: |-
      This property supplements the 'zonePlacementPolicy' property. If 'zonePlacementPolicy' is set to 'Any'/'Auto', availability zone selected by the system must be present in the list of availability zones passed with 'includeZones'. If 'includeZones' is not provided, all availability zones in region will be considered for selection.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Placement Arguments
  - name: --location -l
    summary: |-
      The geo-location where the resource lives  When not specified, the location of the resource group will be used.
    groupName: Resource Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --placement-policy --zone-placement-policy
    acceptedValues: Any, Auto
    summary: |-
      Specifies the policy for resource's placement in availability zone. Possible values are: **Any** (used for Virtual Machines), **Auto** (used for Virtual Machine Scale Sets) - An availability zone will be automatically picked by system as part of resource creation.
    groupName: Placement Arguments
  - name: --sku-capacity
    summary: |-
      Specifies the number of virtual machines in the scale set.
    groupName: Sku Arguments
  - name: --sku-name
    summary: |-
      The sku name.
    groupName: Sku Arguments
  - name: --sku-tier
    summary: |-
      Specifies the tier of virtual machines in a scale set.<br /><br /> Possible Values:<br /><br /> **Standard**<br /><br /> **Basic**.
    groupName: Sku Arguments
  - name: --tags
    summary: |-
      Resource tags.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Resource Arguments
  - name: --zones
    summary: |-
      The availability zones.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Resource Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_interconnect-block_delete
  name: az interconnect-block delete
  summary: |-
    Delete an Interconnect Block. The operation is only allowed when there are no virtual machines or VMSS VM instances associated with the Interconnect Block.
  status: GA
  sourceType: Extension
  syntax: >-
    az interconnect-block delete [--acquire-policy-token]
                                 [--change-reference]
                                 [--ids]
                                 [--interconnect-block-name --name]
                                 [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                 [--resource-group]
                                 [--subscription]
                                 [--yes]
  examples:
  - summary: |-
      Delete with confirmation
    syntax: az interconnect-block delete --name training-icb-001 --resource-group ai-training-rg
  - summary: |-
      Delete without confirmation
    syntax: az interconnect-block delete --name training-icb-001 --resource-group ai-training-rg --yes
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --ids
    summary: |-
      One or more resource IDs (space-delimited). It should be a complete resource ID containing all information of 'Resource Id' arguments. You should provide either --ids or other 'Resource Id' arguments.
    groupName: Resource Id Arguments
  - name: --interconnect-block-name --name -n
    summary: |-
      The name of the Interconnect Block.
    groupName: Resource Id Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
    groupName: Resource Id Arguments
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
    groupName: Resource Id Arguments
  - name: --yes -y
    defaultValue: "False"
    summary: |-
      Do not prompt for confirmation.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_interconnect-block_list
  name: az interconnect-block list
  summary: |-
    List all of the Interconnect Blocks in the subscription. Use the nextLink property in the response to get the next page of Interconnect Blocks.
  status: GA
  sourceType: Extension
  syntax: >-
    az interconnect-block list [--max-items]
                               [--next-token]
                               [--resource-group]
  examples:
  - summary: |-
      List all in subscription
    syntax: az interconnect-block list
  - summary: |-
      List by resource group
    syntax: az interconnect-block list --resource-group ai-training-rg
  - summary: |-
      List and filter by capacity
    syntax: az interconnect-block list --resource-group ai-training-rg --query "[?sku.capacity>=36]"
  optionalParameters:
  - name: --max-items
    summary: |-
      Total number of items to return in the command's output. If the total number of items available is more than the value specified, a token is provided in the command's output. To resume pagination, provide the token value in `--next-token` argument of a subsequent command.
    groupName: Pagination Arguments
  - name: --next-token
    summary: |-
      Token to specify where to start paginating. This is the token value from a previously truncated response.
    groupName: Pagination Arguments
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  globalParameters:
