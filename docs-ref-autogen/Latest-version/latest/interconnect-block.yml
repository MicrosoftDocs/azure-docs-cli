    groupName: Generic Update Arguments
  - name: --sku-capacity
    summary: |-
      Specifies the number of virtual machines in the scale set.
    groupName: Sku Arguments
  - name: --sku-name
    summary: |-
      The sku name.
    groupName: Sku Arguments
  - name: --sku-tier
    summary: |-
