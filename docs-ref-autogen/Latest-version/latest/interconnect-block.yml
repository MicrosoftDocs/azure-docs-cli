- uid: az_interconnect-block_update
  name: az interconnect-block update
  summary: |-
    Update an Interconnect Block. When updating an Interconnect Block, only tags and sku-capacity may be modified.
  status: GA
  sourceType: Extension
  syntax: >-
    az interconnect-block update [--acquire-policy-token]
                                 [--add]
                                 [--change-reference]
                                 [--exclude-zones --placement-exclude-zones]
                                 [--force-string {0, 1, f, false, n, no, t, true, y, yes}]
                                 [--ids]
                                 [--include-zones --placement-include-zones]
                                 [--interconnect-block-name --name]
                                 [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                 [--placement-policy --zone-placement-policy {Any, Auto}]
                                 [--remove]
                                 [--resource-group]
                                 [--set]
                                 [--sku-capacity]
                                 [--sku-name]
                                 [--sku-tier]
                                 [--subscription]
                                 [--tags]
                                 [--zones]
  examples:
  - summary: |-
      Update scale capacity
    syntax: az interconnect-block update --name training-icb-001 --resource-group ai-training-rg --sku-capacity 54
  - summary: |-
      Update tags
    syntax: az interconnect-block update --name training-icb-001 --resource-group ai-training-rg --tags Environment=Production Capacity=54-nodes LastScaled=$(date +%Y-%m-%d)
  - summary: |-
      Update scale with no-wait
    syntax: az interconnect-block update --name training-icb-001 --resource-group ai-training-rg --sku-capacity 72 --no-wait
