- uid: az_aimanager_namespace_rotate-accesskeys
  name: az aimanager namespace rotate-accesskeys
  summary: |-
    Rotate the LLM gateway API keys of an AI Manager namespace.
  description: |-
    A new key is generated and installed as the primary key, and the previous primary key
    overwrites the secondary key so clients can roll over without downtime. Returns the updated
    access info. Any client still using the previous secondary key will stop being able to
    authenticate.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'aimanager namespace' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az aimanager namespace rotate-accesskeys --aimanager-name --manager
                                             --name
                                             --resource-group
                                             [--acquire-policy-token]
                                             [--aks-custom-headers]
                                             [--change-reference]
                                             [--yes]
  examples:
  - summary: |-
      Rotate the access keys of a namespace
    syntax: az aimanager namespace rotate-accesskeys -g myrg --aimanager-name my-ai-manager --name team-alpha
  requiredParameters:
  - isRequired: true
    name: --aimanager-name --manager -m
    summary: |-
      The name of the AI Manager resource.
  - isRequired: true
    name: --name -n
    summary: |-
      The name of the AI Manager namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --aks-custom-headers
    summary: |-
