  summary: |-
    List the LLM gateway endpoint and API keys of an AI Manager namespace.
  description: |-
    Returns the namespace-scoped, OpenAI-compatible inference gateway endpoint together with the
    current primary and secondary API keys. Treat the keys as secrets: do not log them or persist
    them in plaintext.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'aimanager namespace' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az aimanager namespace list-accesskeys --aimanager-name --manager
                                           --name
                                           --resource-group
                                           [--acquire-policy-token]
                                           [--aks-custom-headers]
                                           [--change-reference]
  examples:
  - summary: |-
      List the access keys of a namespace
    syntax: az aimanager namespace list-accesskeys -g myrg --aimanager-name my-ai-manager --name team-alpha
  - summary: |-
