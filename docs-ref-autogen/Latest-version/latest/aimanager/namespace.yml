### YamlMime:AzureCLIGroup
uid: az_aimanager_namespace
name: az aimanager namespace
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **aimanager** extension for the Azure CLI (version 2.61.0 or higher). The extension will automatically install the first time you run an **az aimanager namespace** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage namespaces within an AI Manager.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'aimanager' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_aimanager_namespace_add
  name: az aimanager namespace add
  summary: |-
    Add a namespace to an AI Manager.
  description: |-
    Once creation succeeds the caller is granted the built-in 'Azure AIManager Contributor' and 'Azure AIManager and namespace RBAC Reader' roles on the new namespace (best-effort; requires Owner or User Access Administrator). Skipped with --no-wait.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'aimanager namespace' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az aimanager namespace add --aimanager-name --manager
                               --name
                               --resource-group
                               [--acquire-policy-token]
                               [--aks-custom-headers]
                               [--annotations]
                               [--change-reference]
                               [--labels]
                               [--no-wait]
  examples:
  - summary: |-
      Add a namespace
    syntax: az aimanager namespace add -m my-ai-manager -g myrg --name team-alpha
  - summary: |-
      Add a namespace with labels and annotations
    syntax: az aimanager namespace add -m my-ai-manager -g myrg --name team-alpha --labels team=alpha --annotations owner=alice
  requiredParameters:
  - isRequired: true
    name: --aimanager-name --manager -m
    summary: |-
      The name of the AI Manager resource.
  - isRequired: true
    name: --name -n
    summary: |-
      The name of the AI Manager namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --aks-custom-headers
    summary: |-
      Comma-separated key=value pairs to specify custom headers.
  - name: --annotations
    summary: |-
      Space-separated annotations (key=value) applied to the Kubernetes namespace.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --labels
    summary: |-
      Space-separated labels (key=value) applied to the Kubernetes namespace.
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
