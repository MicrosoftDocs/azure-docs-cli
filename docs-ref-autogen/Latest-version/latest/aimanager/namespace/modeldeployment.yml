### YamlMime:AzureCLIGroup
uid: az_aimanager_namespace_modeldeployment
name: az aimanager namespace modeldeployment
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **aimanager** extension for the Azure CLI (version 2.61.0 or higher). The extension will automatically install the first time you run an **az aimanager namespace modeldeployment** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage model deployments within an AI Manager namespace.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'aimanager namespace' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_aimanager_namespace_modeldeployment_add
  name: az aimanager namespace modeldeployment add
  summary: |-
    Add a model deployment to an AI Manager namespace.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'aimanager namespace modeldeployment' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az aimanager namespace modeldeployment add --aimanager-name --manager
                                               --model-resource-id
                                               --name
                                               --namespace-name
                                               --resource-group
                                               --vm-size
                                               [--acquire-policy-token]
                                               [--aks-custom-headers]
                                               [--change-reference]
                                               [--max-replicas]
                                               [--min-replicas]
                                               [--model-source-resource-id --source-id]
                                               [--no-wait]
                                               [--overrides]
                                               [--performance-mode {Balanced, Latency, Throughput}]
                                               [--replicas]
  examples:
  - summary: |-
      Add a manually scaled model deployment
    syntax: az aimanager namespace modeldeployment add -g myrg --aimanager-name my-ai-manager --namespace-name team-alpha -n phi --model-resource-id /subscriptions/00000000-0000-0000-0000-000000000000/providers/Microsoft.ContainerService/locations/eastus2/aiModels/phi --vm-size Standard_NC24ads_A100_v4 --replicas 1
  - summary: |-
      Add an autoscaled model deployment
    syntax: az aimanager namespace modeldeployment add -g myrg --aimanager-name my-ai-manager --namespace-name team-alpha -n phi --model-resource-id /subscriptions/00000000-0000-0000-0000-000000000000/providers/Microsoft.ContainerService/locations/eastus2/aiModels/phi --vm-size Standard_NC24ads_A100_v4 --min-replicas 1 --max-replicas 3
  requiredParameters:
  - isRequired: true
    name: --aimanager-name --manager -m
    summary: |-
      The name of the AI Manager resource.
  - isRequired: true
    name: --model-resource-id
    summary: |-
      The full ARM resource ID of the AI model to deploy.
  - isRequired: true
    name: --name -n
    summary: |-
      The name of the model deployment.
  - isRequired: true
    name: --namespace-name
    summary: |-
      The name of the AI Manager namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --vm-size -s
    summary: |-
      The Azure VM SKU used to host the deployment.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --aks-custom-headers
    summary: |-
      Comma-separated key=value pairs to specify custom headers.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --max-replicas
    summary: |-
      Maximum autoscale replica count.
  - name: --min-replicas
    summary: |-
      Minimum autoscale replica count. Must be at least 1.
  - name: --model-source-resource-id --source-id
    summary: |-
      The full ARM resource ID of the model source used to pull artifacts.
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --overrides
    summary: |-
      Space-separated experimental deployment overrides (key=value).
  - name: --performance-mode
    acceptedValues: Balanced, Latency, Throughput
    summary: |-
      Runtime performance mode.
  - name: --replicas
    summary: |-
      Fixed replica count. Cannot be combined with autoscale arguments.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
