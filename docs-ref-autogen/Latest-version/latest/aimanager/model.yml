### YamlMime:AzureCLIGroup
uid: az_aimanager_model
name: az aimanager model
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **aimanager** extension for the Azure CLI (version 2.61.0 or higher). The extension will automatically install the first time you run an **az aimanager model** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Browse the AI model catalog and estimate deployment cost.
description: |-
  AI models are read-only, platform-maintained catalog entries scoped to an Azure region.
  Use 'az aimanager model list' to discover the models available in a region and their
  resource names, which can then be passed to
  'az aimanager namespace modeldeployment add --model-resource-id'.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'aimanager' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_aimanager_model_calculate-cost
  name: az aimanager model calculate-cost
  summary: |-
    Calculate the estimated cost of deploying an AI model in a region.
  description: |-
    Returns a ranked list of GPU SKU pricing plans for deploying the model in the target
    region, each annotated with feasibility, per-replica hourly cost, and estimated relative
    performance. Feasible plans are returned first, ordered by total hourly price ascending.
    No Azure or Kubernetes resources are provisioned by this command. Prices describe a single
    replica; multiply by the desired replica count, bounded by maxAvailableReplicas.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'aimanager' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az aimanager model calculate-cost --location
                                      --name
                                      [--acquire-policy-token]
                                      [--change-reference]
  examples:
  - summary: |-
      Calculate the cost of deploying a model
    syntax: az aimanager model calculate-cost -l eastus2 -n 9806f0c862fdd920
  - summary: |-
      Show the pricing plans as a table
    syntax: az aimanager model calculate-cost -l eastus2 -n 9806f0c862fdd920 -o table
  requiredParameters:
  - isRequired: true
    name: --location -l
    summary: |-
      The Azure region hosting the AI model catalog.
  - isRequired: true
    name: --name -n
    summary: |-
      The name of the AI model. This is an opaque, stable identifier derived from the model ID; use "az aimanager model list" to discover it.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
