### YamlMime:AzureCLIGroup
uid: az_aimanager_modelsource
name: az aimanager modelsource
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **aimanager** extension for the Azure CLI (version 2.61.0 or higher). The extension will automatically install the first time you run an **az aimanager modelsource** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage model sources within an AI Manager.
description: |-
  A model source tells the platform where to pull model artifacts from and, for gated or
  private sources, which credential to authenticate with. Model sources are referenced by
  'az aimanager namespace modeldeployment add --model-source-resource-id'.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'aimanager' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_aimanager_modelsource_add
  name: az aimanager modelsource add
  summary: |-
    Add a model source to an AI Manager.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'aimanager' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az aimanager modelsource add --aimanager-name --manager
                                 --name
                                 --resource-group
                                 --source-type {HuggingFace}
                                 [--acquire-policy-token]
                                 [--aks-custom-headers]
                                 [--change-reference]
                                 [--description]
                                 [--no-wait]
                                 [--token]
  examples:
  - summary: |-
      Add a public Hugging Face model source
    syntax: az aimanager modelsource add -g myrg --aimanager-name my-ai-manager -n hf --source-type HuggingFace
  - summary: |-
      Add a Hugging Face model source with an access token for gated models
    syntax: az aimanager modelsource add -g myrg --aimanager-name my-ai-manager -n hf -s HuggingFace --token hf_xxx --description "Gated models"
  requiredParameters:
  - isRequired: true
    name: --aimanager-name --manager -m
    summary: |-
      The name of the AI Manager resource.
  - isRequired: true
    name: --name -n
    summary: |-
      The name of the model source.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --source-type -s
    acceptedValues: HuggingFace
    summary: |-
      The type of the model source. Immutable after creation.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --aks-custom-headers
    summary: |-
      Comma-separated key=value pairs to specify custom headers.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --description
    summary: |-
      An optional, free-form description of the model source.
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --token
    summary: |-
      Access token used by the platform to authenticate to the source. Optional for public sources such as ungated Hugging Face models.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
