### YamlMime:AzureCLIGroup
uid: az_oracle-database_autonomous-database_backup
name: az oracle-database autonomous-database backup
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **oracle-database** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az oracle-database autonomous-database backup** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Autonomous Databases Backup.
status: GA
sourceType: Extension
directCommands:
- uid: az_oracle-database_autonomous-database_backup_create
  name: az oracle-database autonomous-database backup create
  summary: |-
    Create an Autonomous Database backup.
  status: GA
  sourceType: Extension
  syntax: >-
    az oracle-database autonomous-database backup create --adbbackupid --name
                                                         --autonomousdatabasename
                                                         --resource-group
                                                         [--acquire-policy-token]
                                                         [--change-reference]
                                                         [--display-name]
                                                         [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                                         [--retention-days --retention-period-in-days]
  examples:
  - summary: |-
      Create an Autonomous Database backup
    syntax: az oracle-database autonomous-database backup create --autonomousdatabasename <ADBS name> --resource-group <resource_group> --adbbackupid <id> --display-name <display name> --retention-period-in-days <days>
  requiredParameters:
  - isRequired: true
    name: --adbbackupid --name -n
    summary: |-
      Name for the new Azure backup resource.
  - isRequired: true
    name: --autonomousdatabasename
    summary: |-
      The database name.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --display-name
    summary: |-
      The user-friendly name for the backup. The name does not have to be unique.
    groupName: Properties Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --retention-days --retention-period-in-days
    summary: |-
      Retention period, in days, for long-term backups.
    groupName: Properties Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
