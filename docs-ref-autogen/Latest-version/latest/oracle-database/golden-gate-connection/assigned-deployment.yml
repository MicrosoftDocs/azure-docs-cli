directCommands:
- uid: az_oracle-database_golden-gate-connection_assigned-deployment_list
  name: az oracle-database golden-gate-connection assigned-deployment list
  summary: |-
    List assigned deployments by GoldenGate connection.
  status: GA
  sourceType: Extension
  syntax: >-
    az oracle-database golden-gate-connection assigned-deployment list --golden-gate-connection-name
                                                                       --resource-group
                                                                       [--max-items]
                                                                       [--next-token]
  requiredParameters:
  - isRequired: true
    name: --golden-gate-connection-name
    summary: |-
      The name of the GoldenGateConnection.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --max-items
    summary: |-
      Total number of items to return in the command's output. If the total number of items available is more than the value specified, a token is provided in the command's output. To resume pagination, provide the token value in `--next-token` argument of a subsequent command.
    groupName: Pagination Arguments
  - name: --next-token
    summary: |-
      Token to specify where to start paginating. This is the token value from a previously truncated response.
    groupName: Pagination Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_oracle-database_golden-gate-connection_assigned-deployment_show
  name: az oracle-database golden-gate-connection assigned-deployment show
  summary: |-
    Get assigned deployment by GoldenGate connection.
  status: GA
  sourceType: Extension
  syntax: >-
    az oracle-database golden-gate-connection assigned-deployment show [--assignment-id --name]
                                                                       [--golden-gate-connection-name]
                                                                       [--ids]
                                                                       [--resource-group]
                                                                       [--subscription]
  optionalParameters:
  - name: --assignment-id --name -n
    summary: |-
      Assigned Deployment assignment OCID.
    groupName: Resource Id Arguments
  - name: --golden-gate-connection-name
    summary: |-
      The name of the GoldenGateConnection.
    groupName: Resource Id Arguments
  - name: --ids
    summary: |-
      One or more resource IDs (space-delimited). It should be a complete resource ID containing all information of 'Resource Id' arguments. You should provide either --ids or other 'Resource Id' arguments.
    groupName: Resource Id Arguments
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
    groupName: Resource Id Arguments
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
    groupName: Resource Id Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
