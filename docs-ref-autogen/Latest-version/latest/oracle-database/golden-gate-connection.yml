uid: az_oracle-database_golden-gate-connection
name: az oracle-database golden-gate-connection
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **oracle-database** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az oracle-database golden-gate-connection** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Golden Gate Connection.
status: GA
sourceType: Extension
directCommands:
- uid: az_oracle-database_golden-gate-connection_assign-deployment
  name: az oracle-database golden-gate-connection assign-deployment
  summary: |-
    Assign a GoldenGate deployment to a connection.
  status: GA
  sourceType: Extension
  syntax: >-
    az oracle-database golden-gate-connection assign-deployment --deployment-id
                                                                [--acquire-policy-token]
                                                                [--change-reference]
                                                                [--golden-gate-connection-name]
                                                                [--ids]
                                                                [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                                                [--resource-group]
                                                                [--subscription]
  examples:
  - summary: |-
      Assign a deployment to a GoldenGate connection.
    syntax: az oracle-database golden-gate-connection assign-deployment -g MyResourceGroup --golden-gate-connection-name myConnection --deployment-id /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/MyResourceGroup/providers/Oracle.Database/goldenGateDeployments/myDeployment
  requiredParameters:
  - isRequired: true
    name: --deployment-id
    summary: |-
      The Azure resource ID of the deployment to assign or unassign.
    groupName: Body Arguments
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --golden-gate-connection-name
    summary: |-
      The name of the GoldenGateConnection.
    groupName: Resource Id Arguments
  - name: --ids
    summary: |-
      One or more resource IDs (space-delimited). It should be a complete resource ID containing all information of 'Resource Id' arguments. You should provide either --ids or other 'Resource Id' arguments.
    groupName: Resource Id Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
    groupName: Resource Id Arguments
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
    groupName: Resource Id Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
