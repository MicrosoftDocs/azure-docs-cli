    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_appconfig_enhanced-feature-flag_set
  name: az appconfig enhanced-feature-flag set
  summary: |-
    Set an enhanced feature flag.
  description: |-
    Without --flag, preserve unspecified properties and fail if another operation changes the flag before the write completes.
    Providing --flag replaces the entire flag unconditionally.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'appconfig enhanced-feature-flag' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/appconfig/_help.py
  syntax: >-
    az appconfig enhanced-feature-flag set [--acquire-policy-token]
                                           [--auth-mode {anonymous, key, login}]
                                           [--change-reference]
                                           [--connection-string]
                                           [--description]
                                           [--endpoint]
                                           [--feature-name]
                                           [--flag]
                                           [--label]
                                           [--name]
                                           [--requirement-type {All, Any}]
                                           [--tags]
                                           [--telemetry-enabled {false, true}]
                                           [--yes]
  examples:
  - summary: |-
      Set an enhanced feature flag with label MyLabel.
    syntax: az appconfig enhanced-feature-flag set -n MyAppConfiguration --feature-name color --label MyLabel
  - summary: |-
      Set an enhanced feature flag with null label using connection string and set a description.
    syntax: az appconfig enhanced-feature-flag set --connection-string "Endpoint=https://contoso.azconfig.io;Id=xxx;Secret=xxx" --feature-name color --description "This is a colorful feature"
  - summary: |-
      Set an enhanced feature flag using your 'az login' credentials.
    syntax: az appconfig enhanced-feature-flag set --endpoint https://myappconfiguration.azconfig.io --feature-name color --label MyLabel --auth-mode login
  - summary: |-
      Set an enhanced feature flag with tags "tag1=value1" and "tag2=value2".
    syntax: az appconfig enhanced-feature-flag set -n MyAppConfiguration --feature-name color --tags tag1=value1 tag2=value2
  - summary: |-
      Set an enhanced feature flag with telemetry enabled.
    syntax: az appconfig enhanced-feature-flag set -n MyAppConfiguration --feature-name color --telemetry-enabled
  - summary: |-
      Disable telemetry on an enhanced feature flag.
    syntax: az appconfig enhanced-feature-flag set -n MyAppConfiguration --feature-name color --telemetry-enabled false
  - summary: |-
      Set the entire enhanced feature flag from an inline JSON object.
    syntax: az appconfig enhanced-feature-flag set -n MyAppConfiguration --flag '{"name":"Beta","enabled":true,"conditions":{"requirement_type":"Any","filters":[{"name":"Microsoft.TimeWindow","parameters":{"Start":"Wed, 01 Jan 2025 00:00:00 GMT"}}]}}'
  - summary: |-
      Set the entire enhanced feature flag using shorthand syntax.
    syntax: az appconfig enhanced-feature-flag set -n MyAppConfiguration --flag "{name:Beta,enabled:true,conditions:{requirement_type:Any,filters:[{name:Microsoft.TimeWindow,parameters:{Start:'Wed, 01 Jan 2025 00:00:00 GMT'}}]}}"
  - summary: |-
      Set the entire enhanced feature flag from a JSON file.
    syntax: az appconfig enhanced-feature-flag set -n MyAppConfiguration --flag @flag.json
  - summary: |-
      Set the entire enhanced feature flag by reading the JSON from stdin.
    syntax: cat flag.json | az appconfig enhanced-feature-flag set -n MyAppConfiguration --flag @-
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --auth-mode
    defaultValue: key
    acceptedValues: anonymous, key, login
    summary: |-
      This parameter can be used for indicating how a data operation is to be authorized. If the auth mode is "key", provide connection string or store name and your account access keys will be retrieved for authorization. If the auth mode is "login", provide the `--endpoint` or `--name` and your "az login" credentials will be used for authorization. If the auth mode is "anonymous", provide the --endpoint that will be used for authorization. Anonymous mode is intended for custom endpoints only, such as the App Configuration emulator. You can configure the default auth mode using `az configure --defaults appconfig_auth_mode=<auth_mode>`. For more information, see https://learn.microsoft.com/azure/azure-app-configuration/concept-enable-rbac.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --connection-string
    summary: |-
      Combination of access key and endpoint of the App Configuration store. Can be found using 'az appconfig credential list'. Users can preset it using `az configure --defaults appconfig_connection_string=<connection_string>` or environment variable with the name AZURE_APPCONFIG_CONNECTION_STRING.
  - name: --description
    summary: |-
      Description of the enhanced feature flag to be set.
  - name: --endpoint
    summary: |-
      If auth mode is "login" or "anonymous", provide endpoint URL of the App Configuration store. The endpoint can be retrieved using "az appconfig show" command. You can configure the default endpoint using `az configure --defaults appconfig_endpoint=<endpoint>`.
  - name: --feature-name
    summary: |-
      Name of the enhanced feature flag. Enhanced feature flag name cannot contain the '%' or ':' characters.
  - name: --flag
    summary: |-
      The entire enhanced feature flag, using the same property names, casing and types as the data-plane API and 'az appconfig enhanced-feature-flag show' (name, enabled, description, conditions, allocation, variants, telemetry, tags). Accepts a JSON object, a shorthand-syntax object, a file path with @ prefix (e.g. @flag.json), or @- to read from stdin. Providing --flag replaces the entire feature flag and cannot be combined with --description, --requirement-type or --telemetry-enabled. A string feature flag name is required, either inside --flag or via --feature-name.
  - name: --label
    summary: |-
      If no label specified, uses the null label.
  - name: --name -n
    summary: |-
      Name of the App Configuration store. You can configure the default name using `az configure --defaults app_configuration_store=<name>`.
  - name: --requirement-type
    acceptedValues: All, Any
    summary: |-
      Requirement type determines if filters should use "Any" or "All" logic when evaluating the state of an enhanced feature flag.
  - name: --tags
    summary: |-
      Space-separated tags: key[=value] [key[=value] ...]. Use "" to clear existing tags.
  - name: --telemetry-enabled
    acceptedValues: false, true
    summary: |-
      Enable or disable telemetry for the enhanced feature flag.
  - name: --yes -y
    defaultValue: "False"
    summary: |-
      Do not prompt for confirmation.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_appconfig_enhanced-feature-flag_show
  name: az appconfig enhanced-feature-flag show
  summary: |-
    Show all attributes of an enhanced feature flag.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'appconfig enhanced-feature-flag' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/appconfig/_help.py
  syntax: >-
    az appconfig enhanced-feature-flag show --feature-name
                                            [--auth-mode {anonymous, key, login}]
                                            [--connection-string]
                                            [--endpoint]
                                            [--fields {allocation, conditions, description, enabled, label, last_modified, name, tags, telemetry, variants}]
                                            [--label]
                                            [--name]
  examples:
  - summary: |-
      Show an enhanced feature flag using App Configuration store name with a specific label.
    syntax: az appconfig enhanced-feature-flag show -n MyAppConfiguration --feature-name color --label MyLabel
  - summary: |-
      Show an enhanced feature flag using connection string and field filters.
    syntax: az appconfig enhanced-feature-flag show --connection-string "Endpoint=https://contoso.azconfig.io;Id=xxx;Secret=xxx" --feature-name color --fields name enabled conditions
  - summary: |-
      Show an enhanced feature flag using App Configuration store endpoint and your 'az login' credentials.
    syntax: az appconfig enhanced-feature-flag show --endpoint https://myappconfiguration.azconfig.io --feature-name color --auth-mode login
  requiredParameters:
  - isRequired: true
    name: --feature-name
    summary: |-
      Name of the enhanced feature flag. Enhanced feature flag name cannot contain the '%' or ':' characters.
  optionalParameters:
  - name: --auth-mode
    defaultValue: key
    acceptedValues: anonymous, key, login
    summary: |-
      This parameter can be used for indicating how a data operation is to be authorized. If the auth mode is "key", provide connection string or store name and your account access keys will be retrieved for authorization. If the auth mode is "login", provide the `--endpoint` or `--name` and your "az login" credentials will be used for authorization. If the auth mode is "anonymous", provide the --endpoint that will be used for authorization. Anonymous mode is intended for custom endpoints only, such as the App Configuration emulator. You can configure the default auth mode using `az configure --defaults appconfig_auth_mode=<auth_mode>`. For more information, see https://learn.microsoft.com/azure/azure-app-configuration/concept-enable-rbac.
  - name: --connection-string
    summary: |-
      Combination of access key and endpoint of the App Configuration store. Can be found using 'az appconfig credential list'. Users can preset it using `az configure --defaults appconfig_connection_string=<connection_string>` or environment variable with the name AZURE_APPCONFIG_CONNECTION_STRING.
  - name: --endpoint
    summary: |-
      If auth mode is "login" or "anonymous", provide endpoint URL of the App Configuration store. The endpoint can be retrieved using "az appconfig show" command. You can configure the default endpoint using `az configure --defaults appconfig_endpoint=<endpoint>`.
  - name: --fields
    acceptedValues: allocation, conditions, description, enabled, label, last_modified, name, tags, telemetry, variants
    summary: |-
      Customize output fields for Enhanced Feature Flags.
  - name: --label
    summary: |-
      If no label specified, uses the null label.
  - name: --name -n
    summary: |-
      Name of the App Configuration store. You can configure the default name using `az configure --defaults app_configuration_store=<name>`.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
