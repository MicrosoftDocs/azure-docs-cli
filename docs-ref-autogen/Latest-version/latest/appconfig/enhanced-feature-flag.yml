### YamlMime:AzureCLIGroup
uid: az_appconfig_enhanced-feature-flag
name: az appconfig enhanced-feature-flag
summary: |-
  Manage enhanced feature flags stored in an App Configuration store.
status: Preview
isPreview: true
previewOrExperimentalInfo: 'This command group is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus'
sourceType: Core
directCommands:
- uid: az_appconfig_enhanced-feature-flag_delete
  name: az appconfig enhanced-feature-flag delete
  summary: |-
    Delete enhanced feature flags.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'appconfig enhanced-feature-flag' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/appconfig/_help.py
  syntax: >-
    az appconfig enhanced-feature-flag delete --feature-name
                                              [--acquire-policy-token]
                                              [--auth-mode {anonymous, key, login}]
                                              [--change-reference]
                                              [--connection-string]
                                              [--endpoint]
                                              [--label]
                                              [--name]
                                              [--tags]
                                              [--yes]
  examples:
  - summary: |-
      Delete an enhanced feature flag using App Configuration store name without confirmation.
    syntax: az appconfig enhanced-feature-flag delete -n MyAppConfiguration --feature-name color --label MyLabel --yes
  - summary: |-
      Delete an enhanced feature flag using connection string.
    syntax: az appconfig enhanced-feature-flag delete --connection-string "Endpoint=https://contoso.azconfig.io;Id=xxx;Secret=xxx" --feature-name color --label MyLabel
  - summary: |-
      Delete all enhanced feature flags with label MyLabel using App Configuration store name.
    syntax: az appconfig enhanced-feature-flag delete -n MyAppConfiguration --feature-name * --label MyLabel --yes
  - summary: |-
      Delete all enhanced feature flags beginning with "MyApp" across all labels using App Configuration store name.
    syntax: az appconfig enhanced-feature-flag delete -n MyAppConfiguration --feature-name MyApp* --label * --yes
  - summary: |-
      Delete an enhanced feature flag using App Configuration store endpoint and your 'az login' credentials.
    syntax: az appconfig enhanced-feature-flag delete --endpoint https://myappconfiguration.azconfig.io --feature-name color --auth-mode login
  requiredParameters:
  - isRequired: true
    name: --feature-name
    summary: |-
      Name of the enhanced feature flag to be deleted. Support star sign as filters, for instance * means all enhanced feature flags and abc* means enhanced feature flags with abc as prefix.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --auth-mode
    defaultValue: key
    acceptedValues: anonymous, key, login
    summary: |-
      This parameter can be used for indicating how a data operation is to be authorized. If the auth mode is "key", provide connection string or store name and your account access keys will be retrieved for authorization. If the auth mode is "login", provide the `--endpoint` or `--name` and your "az login" credentials will be used for authorization. If the auth mode is "anonymous", provide the --endpoint that will be used for authorization. Anonymous mode is intended for custom endpoints only, such as the App Configuration emulator. You can configure the default auth mode using `az configure --defaults appconfig_auth_mode=<auth_mode>`. For more information, see https://learn.microsoft.com/azure/azure-app-configuration/concept-enable-rbac.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --connection-string
    summary: |-
      Combination of access key and endpoint of the App Configuration store. Can be found using 'az appconfig credential list'. Users can preset it using `az configure --defaults appconfig_connection_string=<connection_string>` or environment variable with the name AZURE_APPCONFIG_CONNECTION_STRING.
  - name: --endpoint
    summary: |-
      If auth mode is "login" or "anonymous", provide endpoint URL of the App Configuration store. The endpoint can be retrieved using "az appconfig show" command. You can configure the default endpoint using `az configure --defaults appconfig_endpoint=<endpoint>`.
  - name: --label
    summary: |-
      If no label specified, delete the enhanced feature flag with null label. Support star sign as filters, for instance * means all labels and abc* means labels with abc as prefix.
  - name: --name -n
    summary: |-
      Name of the App Configuration store. You can configure the default name using `az configure --defaults app_configuration_store=<name>`.
  - name: --tags
    summary: |-
      If no tags are specified, delete all enhanced feature flags with any tags that match the specified feature and label. Support space-separated tags: key[=value] [key[=value] ...].
  - name: --yes -y
    defaultValue: "False"
    summary: |-
      Do not prompt for confirmation.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
