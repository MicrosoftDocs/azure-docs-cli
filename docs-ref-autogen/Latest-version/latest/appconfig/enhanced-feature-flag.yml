- uid: az_appconfig_enhanced-feature-flag_list
  name: az appconfig enhanced-feature-flag list
  summary: |-
    List enhanced feature flags.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'appconfig enhanced-feature-flag' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/appconfig/_help.py
  syntax: >-
    az appconfig enhanced-feature-flag list [--all]
                                            [--auth-mode {anonymous, key, login}]
                                            [--connection-string]
                                            [--endpoint]
                                            [--feature-name]
                                            [--fields {allocation, conditions, description, enabled, label, last_modified, name, tags, telemetry, variants}]
                                            [--label]
                                            [--name]
                                            [--tags]
                                            [--top]
  examples:
  - summary: |-
      List all enhanced feature flags.
    syntax: az appconfig enhanced-feature-flag list -n MyAppConfiguration
  - summary: |-
      List all enhanced feature flags with null labels/(No Label) in the portal.
    syntax: az appconfig enhanced-feature-flag list -n MyAppConfiguration --label \0
  - summary: |-
      List a specific feature for any label starting with v1. using connection string.
    syntax: az appconfig enhanced-feature-flag list --feature-name color --connection-string "Endpoint=https://contoso.azconfig.io;Id=xxx;Secret=xxx" --label v1.*
  - summary: |-
      List all features with any labels and query only name, enabled and conditions.
    syntax: az appconfig enhanced-feature-flag list --connection-string "Endpoint=https://contoso.azconfig.io;Id=xxx;Secret=xxx" --fields name enabled conditions
  - summary: |-
      List 150 enhanced feature flags with any labels.
    syntax: az appconfig enhanced-feature-flag list --connection-string "Endpoint=https://contoso.azconfig.io;Id=xxx;Secret=xxx" --top 150
  - summary: |-
      List all enhanced feature flags with specific tags.
    syntax: az appconfig enhanced-feature-flag list -n MyAppConfiguration --tags tag1=value1 tag2=value2
  optionalParameters:
  - name: --all
    defaultValue: "False"
    summary: |-
      List all enhanced feature flags.
  - name: --auth-mode
    defaultValue: key
    acceptedValues: anonymous, key, login
    summary: |-
      This parameter can be used for indicating how a data operation is to be authorized. If the auth mode is "key", provide connection string or store name and your account access keys will be retrieved for authorization. If the auth mode is "login", provide the `--endpoint` or `--name` and your "az login" credentials will be used for authorization. If the auth mode is "anonymous", provide the --endpoint that will be used for authorization. Anonymous mode is intended for custom endpoints only, such as the App Configuration emulator. You can configure the default auth mode using `az configure --defaults appconfig_auth_mode=<auth_mode>`. For more information, see https://learn.microsoft.com/azure/azure-app-configuration/concept-enable-rbac.
  - name: --connection-string
    summary: |-
      Combination of access key and endpoint of the App Configuration store. Can be found using 'az appconfig credential list'. Users can preset it using `az configure --defaults appconfig_connection_string=<connection_string>` or environment variable with the name AZURE_APPCONFIG_CONNECTION_STRING.
  - name: --endpoint
    summary: |-
      If auth mode is "login" or "anonymous", provide endpoint URL of the App Configuration store. The endpoint can be retrieved using "az appconfig show" command. You can configure the default endpoint using `az configure --defaults appconfig_endpoint=<endpoint>`.
  - name: --feature-name
    summary: |-
      Name of the enhanced feature flag to be listed. Support star sign as filters, for instance * means all enhanced feature flags and abc* means enhanced feature flags with abc as prefix.
  - name: --fields
    acceptedValues: allocation, conditions, description, enabled, label, last_modified, name, tags, telemetry, variants
    summary: |-
      Customize output fields for Enhanced Feature Flags.
  - name: --label
    summary: |-
      If no label specified, list all labels. Support star sign as filters, for instance * means all labels and abc* means labels with abc as prefix.
  - name: --name -n
    summary: |-
      Name of the App Configuration store. You can configure the default name using `az configure --defaults app_configuration_store=<name>`.
  - name: --tags
    summary: |-
      If no tags are specified, list all enhanced feature flags with any tags. Support space-separated tags: key[=value] [key[=value] ...].
  - name: --top -t
    summary: |-
      Maximum number of items to return. Must be a positive integer. Default to 100.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
