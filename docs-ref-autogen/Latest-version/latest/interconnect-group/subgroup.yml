### YamlMime:AzureCLIGroup
uid: az_interconnect-group_subgroup
name: az interconnect-group subgroup
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **interconnect** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az interconnect-group subgroup** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Subgroup.
status: GA
sourceType: Extension
directCommands:
- uid: az_interconnect-group_subgroup_list
  name: az interconnect-group subgroup list
  summary: |-
    List all subgroups in an interconnect group.
  status: GA
  sourceType: Extension
  syntax: >-
    az interconnect-group subgroup list --group-name --interconnect-group-name
                                        --resource-group
                                        [--max-items]
                                        [--next-token]
  examples:
  - summary: |-
      List subgroups
    syntax: az network interconnect-group subgroup list --resource-group rg1 --interconnect-group-name test-ig
  requiredParameters:
  - isRequired: true
    name: --group-name --interconnect-group-name
    summary: |-
      The name of the interconnect group.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --max-items
    summary: |-
      Total number of items to return in the command's output. If the total number of items available is more than the value specified, a token is provided in the command's output. To resume pagination, provide the token value in `--next-token` argument of a subsequent command.
    groupName: Pagination Arguments
  - name: --next-token
    summary: |-
      Token to specify where to start paginating. This is the token value from a previously truncated response.
    groupName: Pagination Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_interconnect-group_subgroup_show
  name: az interconnect-group subgroup show
  summary: |-
    Get the specified subgroup in an interconnect group.
  status: GA
  sourceType: Extension
  syntax: >-
    az interconnect-group subgroup show [--group-name --interconnect-group-name]
                                        [--ids]
                                        [--name --subgroup-name]
                                        [--resource-group]
                                        [--subscription]
  examples:
  - summary: |-
      Get subgroup
    syntax: az network interconnect-group subgroup show --resource-group rg1 --interconnect-group-name test-ig --subgroup-name subgroup0
  optionalParameters:
  - name: --group-name --interconnect-group-name
    summary: |-
      The name of the interconnect group.
    groupName: Resource Id Arguments
  - name: --ids
    summary: |-
      One or more resource IDs (space-delimited). It should be a complete resource ID containing all information of 'Resource Id' arguments. You should provide either --ids or other 'Resource Id' arguments.
    groupName: Resource Id Arguments
  - name: --name --subgroup-name -n
    summary: |-
      The name of the subgroup.
    groupName: Resource Id Arguments
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
    groupName: Resource Id Arguments
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
    groupName: Resource Id Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_interconnect-group_subgroup_list
- az_interconnect-group_subgroup_show
metadata:
  description: Manage Subgroup.
