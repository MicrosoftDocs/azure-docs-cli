### YamlMime:AzureCLIGroup
uid: az_netappfiles_account_ldap-configuration
name: az netappfiles account ldap-configuration
summary: |-
  Manage Ldap Configuration.
status: GA
sourceType: Core
directCommands:
- uid: az_netappfiles_account_ldap-configuration_create
  name: az netappfiles account ldap-configuration create
  summary: |-
    Create LDAP configuration.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/netappfiles/_help.py
  syntax: >-
    az netappfiles account ldap-configuration create --account-name
                                                     --resource-group
                                                     [--acquire-policy-token]
                                                     [--bind-auth-level --bind-authentication-level {Anonymous, Simple}]
                                                     [--bind-dn]
                                                     [--bind-password-azure-key-vault-uri --bp-akv-uri]
                                                     [--bind-password-secret-name --bp-secret-name]
                                                     [--bind-password-user-assigned-identity --bp-user-assigned-mi]
                                                     [--certificate-cn-host]
                                                     [--change-reference]
                                                     [--dns-servers]
                                                     [--domain]
                                                     [--group-dn]
                                                     [--ldap-port]
                                                     [--ldap-servers]
                                                     [--net-group-dn]
                                                     [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                                     [--secure-ldap-type {LdapOverTLS, None}]
                                                     [--server-ca-certificate]
                                                     [--user-dn]
  examples:
  - summary: |-
      Accounts_CreateOrUpdate
    syntax: az netappfiles account ldap-configuration create --resource-group myRG --account-name account1
  requiredParameters:
  - isRequired: true
    name: --account-name
    summary: |-
      The name of the NetApp account.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --bind-auth-level --bind-authentication-level
    defaultValue: Anonymous
    acceptedValues: Anonymous, Simple
    summary: |-
      The authentication level to use when binding to the LDAP server, defaults to Anonymous.
    groupName: Body.properties.ldapConfiguration Arguments
  - name: --bind-dn
    summary: |-
      The distinguished name (DN) to bind as when performing LDAP operations.
    groupName: Body.properties.ldapConfiguration Arguments
  - name: --bind-password-azure-key-vault-uri --bp-akv-uri
    summary: |-
      The Azure Key Vault URI where the Bind DN user password is stored.
    groupName: BindPasswordAkvConfig Arguments
  - name: --bind-password-secret-name --bp-secret-name
    summary: |-
      The name of the secret in Azure Key Vault that contains the Bind DN user password.
    groupName: BindPasswordAkvConfig Arguments
  - name: --bind-password-user-assigned-identity --bp-user-assigned-mi
    summary: |-
      The ARM resource identifier of the user assigned identity used to authenticate with key vault.
    groupName: BindPasswordAkvConfig Arguments
  - name: --certificate-cn-host
    summary: |-
      The CN host name used while generating the certificate, LDAP Over TLS requires the CN host name to create DNS host entry.
    groupName: Body.properties.ldapConfiguration Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --dns-servers
    summary: |-
      List of DNS server IPv4 addresses for resolving the CN host certificate. This parameter is used when LDAP over TLS is enabled.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Body.properties.ldapConfiguration Arguments
  - name: --domain
    summary: |-
      Name of the LDAP configuration domain.
    groupName: Body.properties.ldapConfiguration Arguments
  - name: --group-dn
    summary: |-
      This specifies the group DN (Distinguished Name), which overrides the base DN for group lookups.
    groupName: Body.properties.ldapConfiguration Arguments
  - name: --ldap-port
    summary: |-
      Port number for LDAP communication. Default is 389 for LDAP.
    groupName: Body.properties.ldapConfiguration Arguments
  - name: --ldap-servers
    summary: |-
      List of LDAP server IP addresses (IPv4 only) for the LDAP domain.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Body.properties.ldapConfiguration Arguments
  - name: --net-group-dn
    summary: |-
      This specifies the netgroup DN (Distinguished Name), which overrides the base DN for netgroup lookups.
    groupName: Body.properties.ldapConfiguration Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --secure-ldap-type
    defaultValue: None
    acceptedValues: LdapOverTLS, None
    summary: |-
      Indicates the secure LDAP mode for encrypting communication between ANF storage and customer LDAP servers.
    groupName: Body.properties.ldapConfiguration Arguments
  - name: --server-ca-certificate
    summary: |-
      When LDAP over SSL/TLS is enabled, the LDAP client is required to have base64 encoded ldap servers CA certificate.  If value is blank it's asked from the tty.
    groupName: Body.properties.ldapConfiguration Arguments
  - name: --user-dn
    summary: |-
      This specifies the user DN (Distinguished Name), which overrides the base DN for user lookups.
    groupName: Body.properties.ldapConfiguration Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
