### YamlMime:AzureCLIGroup
uid: az_aldo_system-configuration
name: az aldo system-configuration
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **edgeoperator** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az aldo system-configuration** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage ALDO system configuration.
status: GA
sourceType: Extension
directCommands:
- uid: az_aldo_system-configuration_create
  name: az aldo system-configuration create
  summary: |-
    Create or fully replace the active ALDO system configuration.
  description: |-
    Sends a PUT request for the default singleton. This replaces the configuration rather than merging changes; omitted writable fields are not preserved. The service requires --dns-forwarder-ip, --connection-intent, --stamp-id, and --device-resource-id on every PUT. The current subscription must be the Operator subscription.
  status: GA
  sourceType: Extension
  syntax: >-
    az aldo system-configuration create [--acquire-policy-token]
                                        [--change-reference]
                                        [--connection-intent]
                                        [--device-resource-id]
                                        [--dns-forwarder-ip]
                                        [--stamp-id]
  examples:
  - summary: |-
      Replace the system configuration with all four required writable values.
    syntax: az aldo system-configuration create --dns-forwarder-ip 192.0.2.53 --connection-intent Connected --stamp-id 11111111-1111-1111-1111-111111111111 --device-resource-id /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-aldo/providers/Microsoft.Edge/disconnectedOperations/example-device
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --connection-intent
    summary: |-
      Connection intent for the system, such as Connected or Disconnected.
  - name: --device-resource-id
    summary: |-
      Resource ID of the Microsoft.Edge/disconnectedOperations device.
  - name: --dns-forwarder-ip
    summary: |-
      IP address of the DNS forwarder used by the system.
  - name: --stamp-id
    summary: |-
      GUID of the stamp hosting the system.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_aldo_system-configuration_show
  name: az aldo system-configuration show
  summary: |-
    Show the active ALDO system configuration.
  description: |-
    Retrieves the system configuration singleton. The current subscription must be the Operator subscription.
  status: GA
  sourceType: Extension
  syntax: az aldo system-configuration show
  examples:
  - summary: |-
      Show the active system configuration.
    syntax: az aldo system-configuration show
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_aldo_system-configuration_create
- az_aldo_system-configuration_show
metadata:
  description: Manage ALDO system configuration.
