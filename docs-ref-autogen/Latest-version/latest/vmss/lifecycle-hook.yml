### YamlMime:AzureCLIGroup
uid: az_vmss_lifecycle-hook
name: az vmss lifecycle-hook
summary: |-
  Manage lifecycle hooks on a Virtual Machine Scale Set (preview).
status: Preview
isPreview: true
previewOrExperimentalInfo: 'This command group is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus'
sourceType: Core
directCommands:
- uid: az_vmss_lifecycle-hook_add
  name: az vmss lifecycle-hook add
  summary: |-
    Add a lifecycle hook to a VMSS.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'vmss lifecycle-hook' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/vm/_help.py
  syntax: >-
    az vmss lifecycle-hook add --resource-group
                               --type {UpgradeAutoOSRollingBatchStarting, UpgradeAutoOSScheduling}
                               --vmss-name
                               [--acquire-policy-token]
                               [--change-reference]
                               [--default-action {Approve, Reject}]
                               [--no-wait]
                               [--wait-duration]
  examples:
  - summary: |-
      Add an UpgradeAutoOSScheduling hook with an 8 hour wait.
    syntax: az vmss lifecycle-hook add -g MyRg --vmss-name MyVmss --type UpgradeAutoOSScheduling --wait-duration PT8H
  requiredParameters:
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --type
    acceptedValues: UpgradeAutoOSRollingBatchStarting, UpgradeAutoOSScheduling
    summary: |-
      Specifies the type of the lifecycle hook.
  - isRequired: true
    name: --vmss-name
    summary: |-
      The name of the VM scale set.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --default-action
    acceptedValues: Approve, Reject
    summary: |-
      Specifies the action that will be applied to a target resource in the virtual machine scale set lifecycle hook event if the platform does not receive a response from the customer for the target resource before waitUntil.
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --wait-duration
    summary: |-
      Specifies the time duration a virtual machine scale set lifecycle hook event sent to the customer waits for a response from the customer. It should be in ISO 8601 format.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
