summary: |-
  Manage Blob Access Point Configuration.
status: GA
sourceType: Core
directCommands:
- uid: az_storage_account_blob-access-point-configuration_create
  name: az storage account blob-access-point-configuration create
  summary: |-
    Create a Blob Access Point configuration.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/storage/_help.py
  syntax: >-
    az storage account blob-access-point-configuration create --account-name
                                                              --blob-access-point-configuration-name --name
                                                              --resource-group
                                                              --source
                                                              [--acquire-policy-token]
                                                              [--change-reference]
                                                              [--description]
                                                              [--location]
                                                              [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                                              [--state {Active, Inactive}]
                                                              [--tags]
  examples:
  - summary: |-
      Create for a Blob Access Point configuration
    syntax: az storage account blob-access-point-configuration create --resource-group MyResourceGroup --account-name mystorageaccount --name myaccesspoint --location eastus --source '{"s3-compatible":{"connection":{"endpoint":{"endpoint":"https://s3.example.com"}},"auth":{"access-key":{"access-key-id":"<access-key-id>","secret-access-key":"<secret-access-key>"}}}}'
  requiredParameters:
  - isRequired: true
    name: --account-name
    summary: |-
      The name of the storage account within the specified resource group. Storage account names must be between 3 and 24 characters in length and use numbers and lower-case letters only.
  - isRequired: true
    name: --blob-access-point-configuration-name --name -n
    summary: |-
      The name of the Blob Access Point configuration.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --source
    summary: |-
      Information about the backing data source.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --description
    summary: |-
      An arbitrary description of the Blob Access Point configuration.
    groupName: Properties Arguments
  - name: --location -l
    summary: |-
      The geo-location where the resource lives  When not specified, the location of the resource group will be used.
    groupName: Resource Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --state
    acceptedValues: Active, Inactive
    summary: |-
      The configuration state. A configuration is created in the Active state when this value is not specified.
    groupName: Properties Arguments
  - name: --tags
    summary: |-
      Resource tags.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Resource Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
