### YamlMime:AzureCLIGroup
uid: az_storage_context-cache
name: az storage context-cache
summary: |-
  Manage Context Caches.
status: GA
sourceType: Core
directCommands:
- uid: az_storage_context-cache_check-name
  name: az storage context-cache check-name
  summary: |-
    Check the availability of a context cache resource name.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/storage/_help.py
  syntax: >-
    az storage context-cache check-name --name
                                        [--acquire-policy-token]
                                        [--change-reference]
                                        [--type {Microsoft.Storage/contextCaches}]
  examples:
  - summary: |-
      Check whether a context cache name is available
    syntax: az storage context-cache check-name --name mycontextcache
  requiredParameters:
  - isRequired: true
    name: --name
    summary: |-
      The name of the context cache resource to check for availability.
    groupName: Body Arguments
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --type
    defaultValue: Microsoft.Storage/contextCaches
    acceptedValues: Microsoft.Storage/contextCaches
    summary: |-
      The type of the context cache resource to check for availability.
    groupName: Body Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_storage_context-cache_create
  name: az storage context-cache create
  summary: |-
    Create a Context Cache.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/storage/_help.py
  syntax: >-
    az storage context-cache create --account-kind {DataZone, Global, Regional}
                                    --context-cache-name --name
                                    --resource-group
                                    [--acquire-policy-token]
                                    [--change-reference]
                                    [--description]
                                    [--encryption]
                                    [--identity]
                                    [--location]
                                    [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                    [--tags]
  examples:
  - summary: |-
      Create a Context Cache with a system-assigned identity
    syntax: az storage context-cache create --resource-group testrg --name testaccount --location eastus --identity "{type:SystemAssigned}" --account-kind Regional --description "Test Context Cache account"
  requiredParameters:
  - isRequired: true
    name: --account-kind
    acceptedValues: DataZone, Global, Regional
    summary: |-
      The kind of account determining storage topology.
    groupName: Properties Arguments
  - isRequired: true
    name: --context-cache-name --name -n
    summary: |-
      The name of the context cache.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --description
    summary: |-
      Account description.
    groupName: Properties Arguments
  - name: --encryption
    summary: |-
      Encryption settings for the account.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --identity
    summary: |-
      The managed service identities assigned to this resource.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Resource Arguments
  - name: --location -l
    summary: |-
      The geo-location where the resource lives  When not specified, the location of the resource group will be used.
    groupName: Resource Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --tags
    summary: |-
      Resource tags.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Resource Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
