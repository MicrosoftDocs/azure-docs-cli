### YamlMime:AzureCLIGroup
uid: az_storage_context-cache_container
name: az storage context-cache container
summary: |-
  Manage Context Cache containers.
status: GA
sourceType: Core
directCommands:
- uid: az_storage_context-cache_container_create
  name: az storage context-cache container create
  summary: |-
    Create a container in a Context Cache.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/storage/_help.py
  syntax: >-
    az storage context-cache container create --context-cache-container-name --name
                                              --context-cache-name
                                              --model-name
                                              --provider {OpenAI}
                                              --resource-group
                                              [--acquire-policy-token]
                                              [--change-reference]
                                              [--description]
                                              [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                              [--time-to-live]
  examples:
  - summary: |-
      Create a Context Cache Container
    syntax: az storage context-cache container create --resource-group testrg --context-cache-name testaccount --context-cache-container-name gpt4-prompts --description 'Container for GPT-4 prompt caching' --model-name gpt-4 --provider OpenAI --time-to-live 7
  requiredParameters:
  - isRequired: true
    name: --context-cache-container-name --name -n
    summary: |-
      The name of the context cache container.
  - isRequired: true
    name: --context-cache-name
    summary: |-
      The name of the context cache.
  - isRequired: true
    name: --model-name
    summary: |-
      The model name associated with this container (e.g., gpt-4, claude-3).
    groupName: Properties Arguments
  - isRequired: true
    name: --provider
    acceptedValues: OpenAI
    summary: |-
      The AI provider associated with this container.
    groupName: Properties Arguments
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --description
    summary: |-
      Container description.
    groupName: Properties Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --time-to-live
    summary: |-
      The Time to Live (TTL) in days (1–30) for this container. Blobs in the container that have not been accessed within this number of days will be automatically deleted. If not specified at creation time, it defaults to 1 day.
    groupName: Properties Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
