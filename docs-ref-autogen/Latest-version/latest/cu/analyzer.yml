- uid: az_cu_analyzer_list
  name: az cu analyzer list
  summary: |-
    List analyzers in the Microsoft Foundry resource.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'cu analyzer' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az cu analyzer list [--api-key]
                        [--api-version]
                        [--auth-mode {key, login}]
                        [--endpoint]
                        [--kind {all, custom, prebuilt}]
                        [--profile]
                        [--sort-by {analyzerId, createdAt, lastModifiedAt}]
  examples:
  - summary: |-
      List all analyzers by using an explicit endpoint.
    syntax: az cu analyzer list --endpoint https://contoso.services.ai.azure.com/
  - summary: |-
      List prebuilt analyzers using the endpoint from the active CU profile.
    syntax: az cu analyzer list --kind prebuilt --output table
  - summary: |-
      Select an analyzer with a JMESPath query.
    syntax: az cu analyzer list --query "[?analyzerId=='prebuilt-layout']"
  optionalParameters:
  - name: --api-key
    summary: |-
      Microsoft Foundry resource API key.
  - name: --api-version
    summary: |-
      Content Understanding service API version.
  - name: --auth-mode
    acceptedValues: key, login
    summary: |-
      Authentication mode.
  - name: --endpoint
    summary: |-
      Microsoft Foundry resource endpoint for Content Understanding.
  - name: --kind
    defaultValue: all
    acceptedValues: all, custom, prebuilt
    summary: |-
      Filter analyzers by kind.
  - name: --profile
    summary: |-
      CU CLI profile used to resolve endpoint and API-version defaults.
  - name: --sort-by
    defaultValue: analyzerId
    acceptedValues: analyzerId, createdAt, lastModifiedAt
    summary: |-
      Sort analyzers by name, creation time, or modification time.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
