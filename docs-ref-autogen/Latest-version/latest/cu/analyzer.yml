- uid: az_cu_analyzer_test
  name: az cu analyzer test
  summary: |-
    Run an analyzer over local samples.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'cu analyzer' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az cu analyzer test --name
                        [--acquire-policy-token]
                        [--api-key]
                        [--api-version]
                        [--auth-mode {key, login}]
                        [--change-reference]
                        [--concurrency]
                        [--dry-run]
                        [--endpoint]
                        [--file]
                        [--force]
                        [--output-file]
                        [--pattern]
                        [--profile]
                        [--recursive]
                        [--source]
                        [--yes]
  examples:
  - summary: |-
      Test all PDF files under a directory.
    syntax: az cu analyzer test --name ContosoInvoice --source samples --pattern "\*.pdf" --output-file report.json --yes
  requiredParameters:
  - isRequired: true
    name: --name -a -n
    summary: |-
      Analyzer name.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --api-key
    summary: |-
      Microsoft Foundry resource API key.
  - name: --api-version
    summary: |-
      Content Understanding service API version.
  - name: --auth-mode
    acceptedValues: key, login
    summary: |-
      Authentication mode.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --concurrency -j
    defaultValue: "4"
    summary: |-
      Concurrent analysis jobs.
  - name: --dry-run
    defaultValue: "False"
    summary: |-
      Display the local test plan without service calls.
  - name: --endpoint
    summary: |-
      Microsoft Foundry resource endpoint for Content Understanding.
  - name: --file
    summary: |-
      Literal local file. Repeat for multiple files.
  - name: --force
    defaultValue: "False"
    summary: |-
      Overwrite an existing test report.
  - name: --output-file
    summary: |-
      Write the structured test report to a file.
  - name: --pattern
    summary: |-
      Python fnmatch pattern applied to every --source.
  - name: --profile
    summary: |-
      CU CLI profile used to resolve endpoint and API-version defaults.
  - name: --recursive -r
    defaultValue: "False"
    summary: |-
      Recurse into selected directories.
  - name: --source
    summary: |-
      Local source directory. Repeat for multiple directories.
  - name: --yes -y
    defaultValue: "False"
    summary: |-
      Skip discovery confirmation.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_cu_analyzer_validate
  name: az cu analyzer validate
  summary: |-
    Validate a local analyzer schema.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'cu analyzer' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az cu analyzer validate --schema
                            [--acquire-policy-token]
                            [--api-version]
                            [--change-reference]
                            [--spec]
                            [--strict]
  examples:
  - summary: |-
      Validate curated rules and the bundled service contract.
    syntax: az cu analyzer validate --schema analyzer.json --spec --strict
  requiredParameters:
  - isRequired: true
    name: --schema -s
    summary: |-
      Path to a JSON analyzer schema.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --api-version
    summary: |-
      Content Understanding service API version.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --spec
    defaultValue: "False"
    summary: |-
      Also validate against the bundled service contract.
  - name: --strict
    defaultValue: "False"
    summary: |-
      Treat warnings as errors.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
