### YamlMime:AzureCLIGroup
uid: az_cu_analyzer
name: az cu analyzer
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **content-understanding** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az cu analyzer** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Content Understanding analyzers.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'cu' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_cu_analyzer_copy
  name: az cu analyzer copy
  summary: |-
    Copy an analyzer within or across Microsoft Foundry resources.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'cu analyzer' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az cu analyzer copy --destination
                        --source
                        [--acquire-policy-token]
                        [--api-key]
                        [--api-version]
                        [--auth-mode {key, login}]
                        [--change-reference]
                        [--destination-resource]
                        [--destination-resource-group]
                        [--destination-subscription]
                        [--endpoint]
                        [--profile]
                        [--source-resource]
                        [--source-resource-group]
                        [--source-subscription]
  examples:
  - summary: |-
      Copy within the resource selected by the active profile.
    syntax: az cu analyzer copy --source ContosoInvoice --destination ContosoInvoice_v2
  - summary: |-
      Copy between resources using ARM IDs or account names.
    syntax: az cu analyzer copy --source ContosoInvoice --destination ContosoInvoice --source-resource source-account --destination-resource target-account
  requiredParameters:
  - isRequired: true
    name: --destination
    summary: |-
      New analyzer name to create.
  - isRequired: true
    name: --source
    summary: |-
      Analyzer to copy.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --api-key
    summary: |-
      Microsoft Foundry resource API key.
  - name: --api-version
    summary: |-
      Content Understanding service API version.
  - name: --auth-mode
    acceptedValues: key, login
    summary: |-
      Authentication mode.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --destination-resource
    summary: |-
      Resolve the destination resource directly from Azure.
  - name: --destination-resource-group
    summary: |-
      Resource group used for destination discovery.
  - name: --destination-subscription
    summary: |-
      Subscription in which to resolve the destination resource; defaults to the active Azure CLI subscription.
  - name: --endpoint
    summary: |-
      Microsoft Foundry resource endpoint for Content Understanding.
  - name: --profile
    summary: |-
      CU CLI profile used to resolve endpoint and API-version defaults.
  - name: --source-resource
    summary: |-
      Resolve the source resource directly from Azure.
  - name: --source-resource-group
    summary: |-
      Resource group used for source discovery.
  - name: --source-subscription
    summary: |-
      Subscription in which to resolve the source resource; defaults to the active Azure CLI subscription.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_cu_analyzer_create
