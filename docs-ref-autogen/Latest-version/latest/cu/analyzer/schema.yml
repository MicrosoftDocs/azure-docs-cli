### YamlMime:AzureCLIGroup
uid: az_cu_analyzer_schema
name: az cu analyzer schema
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **content-understanding** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az cu analyzer schema** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Author Content Understanding analyzer schemas.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'cu analyzer' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_cu_analyzer_schema_create
  name: az cu analyzer schema create
  summary: |-
    Create a starter schema or derive one from a local document sample.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'cu analyzer schema' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az cu analyzer schema create [--acquire-policy-token]
                                 [--api-key]
                                 [--api-version]
                                 [--auth-mode {key, login}]
                                 [--base]
                                 [--change-reference]
                                 [--endpoint]
                                 [--force]
                                 [--from-sample]
                                 [--from-template]
                                 [--modality {audio, document, image, video}]
                                 [--name]
                                 [--output-file]
                                 [--profile]
                                 [--type {classification, extraction}]
  examples:
  - summary: |-
      Write an extraction starter schema.
    syntax: az cu analyzer schema create --name ContosoInvoice --output-file analyzer.json
  - summary: |-
      Derive a schema from one document sample.
    syntax: az cu analyzer schema create --name ContosoInvoice --from-sample invoice.pdf --output-file analyzer.json
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --api-key
    summary: |-
      Microsoft Foundry resource API key.
  - name: --api-version
    summary: |-
      Content Understanding service API version.
  - name: --auth-mode
    acceptedValues: key, login
    summary: |-
      Authentication mode.
  - name: --base
    summary: |-
      Base analyzer name; defaults from --modality.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --endpoint
    summary: |-
      Microsoft Foundry resource endpoint for Content Understanding.
  - name: --force
    defaultValue: "False"
    summary: |-
      Overwrite an existing schema output file.
  - name: --from-sample
    summary: |-
      Create an extraction schema from one local document sample.
  - name: --from-template
    defaultValue: "False"
    summary: |-
      Create an offline starter schema (the default).
  - name: --modality
    defaultValue: document
    acceptedValues: audio, document, image, video
    summary: |-
      Modality used to choose a base analyzer.
  - name: --name -a -n
    defaultValue: my_analyzer_v1
    summary: |-
      Custom analyzer name.
  - name: --output-file
    summary: |-
      Write the schema to a file.
  - name: --profile
    summary: |-
      CU CLI profile used to resolve endpoint and API-version defaults.
  - name: --type
    defaultValue: extraction
    acceptedValues: classification, extraction
    summary: |-
      Schema template style.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_cu_analyzer_schema_create
metadata:
  description: Author Content Understanding analyzer schemas.
