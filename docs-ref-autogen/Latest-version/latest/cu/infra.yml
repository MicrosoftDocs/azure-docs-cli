- uid: az_cu_infra_generate
  name: az cu infra generate
  summary: |-
    Generate an azd/Bicep project for Content Understanding.
  description: |-
    Writes a self-contained project and returns a structured summary. This
    command does not provision resources or run azd. On a terminal it prompts
    only for choices not supplied as arguments.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'cu infra' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az cu infra generate [--acquire-policy-token]
                         [--api-version]
                         [--assign-roles {false, true}]
                         [--change-reference]
                         [--environment]
                         [--force]
                         [--foundry-endpoint]
                         [--foundry-prefix]
                         [--location]
                         [--models]
                         [--output-dir]
  examples:
  - summary: |-
      Interactively generate a project.
    syntax: az cu infra generate
  - summary: |-
      Generate a project for a new resource without role assignments.
    syntax: az cu infra generate --location eastus2 --models recommended --assign-roles false --output-dir provision
  - summary: |-
      Generate a project targeting an existing Foundry resource.
    syntax: az cu infra generate --foundry-endpoint https://contoso.services.ai.azure.com/ --models none
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --api-version
    summary: |-
      Content Understanding API version. Known versions: 2025-11-01 (GA) and 2026-06-01-preview (preview); any YYYY-MM-DD-preview version is also accepted.
  - name: --assign-roles
    acceptedValues: false, true
    summary: |-
      Whether to configure RBAC role assignments; omit to use interactive or default behavior.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --environment -e
    summary: |-
      Azd environment name.
  - name: --force
    defaultValue: "False"
    summary: |-
      Overwrite an existing generated template.
  - name: --foundry-endpoint
    summary: |-
      Existing Microsoft Foundry resource endpoint.
  - name: --foundry-prefix
    summary: |-
      Prefix for a new Microsoft Foundry resource name.
  - name: --location -l
    summary: |-
      Location. Values from: `az account list-locations`. You can configure the default location using `az configure --defaults location=<location>`.
  - name: --models
    summary: |-
      Comma-separated model names, 'recommended', or 'none'.
  - name: --output-dir -d
    defaultValue: provision
    summary: |-
      Directory where the azd template is generated.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
