### YamlMime:AzureCLIGroup
uid: az_cu_infra
name: az cu infra
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **content-understanding** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az cu infra** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Generate infrastructure-as-code for Content Understanding.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'cu' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_cu_infra__models
  name: az cu infra _models
  summary: |-
    Configure model deployments for a generated infrastructure project.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'cu infra' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az cu infra _models --account
                        --endpoint
                        --out
                        --resource-group
                        --selection
                        [--acquire-policy-token]
                        [--api-version]
                        [--change-reference]
                        [--deploy]
                        [--use-key]
  requiredParameters:
  - isRequired: true
    name: --account
    summary: |-
      Foundry account name.
  - isRequired: true
    name: --endpoint
    summary: |-
      Microsoft Foundry resource endpoint.
  - isRequired: true
    name: --out
    summary: |-
      Output Bicep model file.
  - isRequired: true
    name: --resource-group
    summary: |-
      Resource group containing the Foundry account.
  - isRequired: true
    name: --selection
    summary: |-
      Prompt, recommended, none, or comma-separated model selectors.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --api-version
    summary: |-
      Content Understanding API version. Known versions: 2025-11-01 (GA) and 2026-06-01-preview (preview); any YYYY-MM-DD-preview version is also accepted.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --deploy
    defaultValue: "True"
    summary: |-
      Deploy selected models before writing the model file.
  - name: --use-key
    defaultValue: "False"
    summary: |-
      Use an account key for the data-plane request.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
