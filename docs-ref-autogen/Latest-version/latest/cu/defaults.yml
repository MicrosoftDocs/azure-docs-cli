### YamlMime:AzureCLIGroup
uid: az_cu_defaults
name: az cu defaults
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **content-understanding** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az cu defaults** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Content Understanding model-deployment defaults.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'cu' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_cu_defaults_set
  name: az cu defaults set
  summary: |-
    Configure Content Understanding defaults that map models to deployments.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'cu defaults' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az cu defaults set [--acquire-policy-token]
                       [--api-key]
                       [--api-version]
                       [--auth-mode {key, login}]
                       [--change-reference]
                       [--endpoint]
                       [--model]
                       [--profile]
                       [--replace]
  examples:
  - summary: |-
      Add or update model deployment mappings.
    syntax: az cu defaults set --model gpt-5.2=gpt52 --model text-embedding-3-large=embedding3
  - summary: |-
      Replace all model deployment mappings.
    syntax: az cu defaults set --model gpt-5.2=gpt52 --replace
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --api-key
    summary: |-
      Microsoft Foundry resource API key.
  - name: --api-version
    summary: |-
      Content Understanding service API version.
  - name: --auth-mode
    acceptedValues: key, login
    summary: |-
      Authentication mode.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --endpoint
    summary: |-
      Microsoft Foundry resource endpoint for Content Understanding.
  - name: --model
    summary: |-
      Model deployment mapping in MODEL=DEPLOYMENT form.
  - name: --profile
    summary: |-
      CU CLI profile used to resolve endpoint and API-version defaults.
  - name: --replace
    defaultValue: "False"
    summary: |-
      Replace defaults instead of merging.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_cu_defaults_show
  name: az cu defaults show
  summary: |-
    Show Content Understanding defaults that map models to deployments.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'cu defaults' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az cu defaults show [--api-key]
                        [--api-version]
                        [--auth-mode {key, login}]
                        [--endpoint]
                        [--profile]
  examples:
  - summary: |-
      Show defaults as JSON.
    syntax: az cu defaults show --endpoint https://contoso.services.ai.azure.com/
  - summary: |-
      Show defaults as a table.
    syntax: az cu defaults show --output table
  optionalParameters:
  - name: --api-key
    summary: |-
      Microsoft Foundry resource API key.
  - name: --api-version
    summary: |-
      Content Understanding service API version.
  - name: --auth-mode
    acceptedValues: key, login
    summary: |-
      Authentication mode.
  - name: --endpoint
    summary: |-
      Microsoft Foundry resource endpoint for Content Understanding.
  - name: --profile
    summary: |-
      CU CLI profile used to resolve endpoint and API-version defaults.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_cu_defaults_set
- az_cu_defaults_show
metadata:
  description: Manage Content Understanding model-deployment defaults.
