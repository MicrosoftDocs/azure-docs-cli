### YamlMime:AzureCLIGroup
uid: az_cu_profile
name: az cu profile
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **content-understanding** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az cu profile** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage CU profiles stored atomically in Azure CLI configuration.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'cu' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_cu_profile_copy
  name: az cu profile copy
  summary: |-
    Copy a CU CLI profile to a new name.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'cu profile' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az cu profile copy --destination
                       [--acquire-policy-token]
                       [--change-reference]
                       [--source]
  requiredParameters:
  - isRequired: true
    name: --destination
    summary: |-
      New destination profile name. Use 1-64 ASCII letters or numbers, with hyphens (-) or underscores (_); 'default' and 'model_deployments' are reserved.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --source
    summary: |-
      Source CU CLI profile; defaults to the active CU CLI profile.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
