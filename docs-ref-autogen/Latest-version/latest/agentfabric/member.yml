### YamlMime:AzureCLIGroup
uid: az_agentfabric_member
name: az agentfabric member
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **agentfabric** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az agentfabric member** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Agent Fabric members.
description: |-
  Members are children of an Agent Fabric and require the parent Fabric name. Show, list, and wait are supported for existing members. Member creation, updates, and deletion are handled by resource providers, not this command group.
status: GA
sourceType: Extension
directCommands:
- uid: az_agentfabric_member_list
  name: az agentfabric member list
  summary: |-
    List members of an Agent Fabric.
  description: |-
    Members are children of an Agent Fabric and require the parent Fabric name. This command lists Agent Fabric sandbox members.
  status: GA
  sourceType: Extension
  syntax: >-
    az agentfabric member list --fabric-name
                               --resource-group
                               [--max-items]
                               [--next-token]
  examples:
  - summary: |-
      List Agent Fabric members
    syntax: az agentfabric member list --resource-group rgnetworksecurity --fabric-name testAIFabric
  requiredParameters:
  - isRequired: true
    name: --fabric-name
    summary: |-
      Name of the parent Agent Fabric.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --max-items
    summary: |-
      Total number of items to return in the command's output. If the total number of items available is more than the value specified, a token is provided in the command's output. To resume pagination, provide the token value in `--next-token` argument of a subsequent command.
    groupName: Pagination Arguments
  - name: --next-token
    summary: |-
      Token to specify where to start paginating. This is the token value from a previously truncated response.
    groupName: Pagination Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_agentfabric_member_show
  name: az agentfabric member show
  summary: |-
    Show an Agent Fabric member.
  description: |-
    Members are children of an Agent Fabric and require the parent Fabric name. This command shows an Agent Fabric sandbox member.
  status: GA
  sourceType: Extension
  syntax: >-
    az agentfabric member show [--fabric-name]
                               [--ids]
                               [--member-name --name]
                               [--resource-group]
                               [--subscription]
  examples:
  - summary: |-
      Show an Agent Fabric member
    syntax: az agentfabric member show --resource-group rgnetworksecurity --fabric-name testAIFabric --member-name checkoutApi
  optionalParameters:
  - name: --fabric-name
    summary: |-
      Name of the parent Agent Fabric.
    groupName: Resource Id Arguments
  - name: --ids
    summary: |-
      One or more resource IDs (space-delimited). It should be a complete resource ID containing all information of 'Resource Id' arguments. You should provide either --ids or other 'Resource Id' arguments.
    groupName: Resource Id Arguments
  - name: --member-name --name -n
    summary: |-
      The name of the Member.
    groupName: Resource Id Arguments
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
    groupName: Resource Id Arguments
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
    groupName: Resource Id Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_agentfabric_member_wait
  name: az agentfabric member wait
  summary: |-
    Place the CLI in a waiting state until a condition is met.
  status: GA
  sourceType: Extension
  syntax: >-
    az agentfabric member wait [--acquire-policy-token]
                               [--change-reference]
                               [--created]
                               [--custom]
                               [--deleted]
                               [--exists]
                               [--fabric-name]
                               [--ids]
                               [--interval]
                               [--member-name --name]
                               [--resource-group]
                               [--subscription]
                               [--timeout]
                               [--updated]
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --created
    defaultValue: "False"
    summary: |-
      Wait until created with 'provisioningState' at 'Succeeded'.
    groupName: Wait Condition Arguments
  - name: --custom
    summary: |-
      Wait until the condition satisfies a custom JMESPath query. E.g. provisioningState!='InProgress', instanceView.statuses[?code=='PowerState/running'].
    groupName: Wait Condition Arguments
  - name: --deleted
    defaultValue: "False"
    summary: |-
      Wait until deleted.
    groupName: Wait Condition Arguments
  - name: --exists
    defaultValue: "False"
    summary: |-
      Wait until the resource exists.
    groupName: Wait Condition Arguments
  - name: --fabric-name
    summary: |-
      Name of the parent Agent Fabric.
    groupName: Resource Id Arguments
  - name: --ids
    summary: |-
      One or more resource IDs (space-delimited). It should be a complete resource ID containing all information of 'Resource Id' arguments. You should provide either --ids or other 'Resource Id' arguments.
    groupName: Resource Id Arguments
  - name: --interval
    defaultValue: "30"
    summary: |-
      Polling interval in seconds.
    groupName: Wait Condition Arguments
  - name: --member-name --name -n
    summary: |-
      The name of the Member.
    groupName: Resource Id Arguments
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
    groupName: Resource Id Arguments
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
    groupName: Resource Id Arguments
  - name: --timeout
    defaultValue: "3600"
    summary: |-
      Maximum wait in seconds.
    groupName: Wait Condition Arguments
  - name: --updated
    defaultValue: "False"
    summary: |-
      Wait until updated with provisioningState at 'Succeeded'.
    groupName: Wait Condition Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_agentfabric_member_list
- az_agentfabric_member_show
- az_agentfabric_member_wait
metadata:
  description: Members are children of an Agent Fabric and require the parent Fabric name. Show, list, and wait are supported for existing members. Member creation, updates, and deletion are handled by resource providers, not this command group.
