### YamlMime:AzureCLIGroup
uid: az_agentfabric_egress-trust-bundle
name: az agentfabric egress-trust-bundle
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **agentfabric** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az agentfabric egress-trust-bundle** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Read Agent Fabric egress trust bundles.
description: |-
  Read the service-managed egress TLS-inspection trust bundle for an Agent Fabric. The singleton bundle is read-only and should be cached for its advertised validity period.
status: GA
sourceType: Extension
directCommands:
- uid: az_agentfabric_egress-trust-bundle_list
  name: az agentfabric egress-trust-bundle list
  summary: |-
    List egress trust bundles for an Agent Fabric.
  description: |-
    Read the service-managed egress TLS-inspection trust bundle for an Agent Fabric. The singleton bundle is read-only and should be cached for its advertised validity period.
  status: GA
  sourceType: Extension
  syntax: >-
    az agentfabric egress-trust-bundle list --fabric-name
                                            --resource-group
                                            [--max-items]
                                            [--next-token]
  examples:
  - summary: |-
      List egress trust bundles
    syntax: az agentfabric egress-trust-bundle list --resource-group rgnetworksecurity --fabric-name testAIFabric
  requiredParameters:
  - isRequired: true
    name: --fabric-name
    summary: |-
      Name of the parent Agent Fabric.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --max-items
    summary: |-
      Total number of items to return in the command's output. If the total number of items available is more than the value specified, a token is provided in the command's output. To resume pagination, provide the token value in `--next-token` argument of a subsequent command.
    groupName: Pagination Arguments
  - name: --next-token
    summary: |-
      Token to specify where to start paginating. This is the token value from a previously truncated response.
    groupName: Pagination Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_agentfabric_egress-trust-bundle_show
  name: az agentfabric egress-trust-bundle show
  summary: |-
    Show the default egress trust bundle for an Agent Fabric.
  description: |-
    Read the service-managed egress TLS-inspection trust bundle for an Agent Fabric. The singleton bundle is read-only and should be cached for its advertised validity period.
  status: GA
  sourceType: Extension
  syntax: >-
    az agentfabric egress-trust-bundle show [--fabric-name]
                                            [--ids]
                                            [--resource-group]
                                            [--subscription]
  examples:
  - summary: |-
      Show the default egress trust bundle
    syntax: az agentfabric egress-trust-bundle show --resource-group rgnetworksecurity --fabric-name testAIFabric
  optionalParameters:
  - name: --fabric-name
    summary: |-
      Name of the parent Agent Fabric.
    groupName: Resource Id Arguments
  - name: --ids
    summary: |-
      One or more resource IDs (space-delimited). It should be a complete resource ID containing all information of 'Resource Id' arguments. You should provide either --ids or other 'Resource Id' arguments.
    groupName: Resource Id Arguments
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
    groupName: Resource Id Arguments
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
    groupName: Resource Id Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_agentfabric_egress-trust-bundle_list
- az_agentfabric_egress-trust-bundle_show
metadata:
  description: Read the service-managed egress TLS-inspection trust bundle for an Agent Fabric. The singleton bundle is read-only and should be cached for its advertised validity period.
