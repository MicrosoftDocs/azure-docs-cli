### YamlMime:AzureCLIGroup
uid: az_agentfabric_policy-group
name: az agentfabric policy-group
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **agentfabric** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az agentfabric policy-group** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage independent Agent Fabric Policy Groups.
description: |-
  Policy Groups are independent resource-group-scoped Microsoft.NetworkSecurity peer resources and are not children of an Agent Fabric.
status: GA
sourceType: Extension
directCommands:
- uid: az_agentfabric_policy-group_create
  name: az agentfabric policy-group create
  summary: |-
    Create an independent Microsoft.NetworkSecurity Policy Group.
  description: |-
    Policy Groups are independent resource-group-scoped Microsoft.NetworkSecurity peer resources and are not children of an Agent Fabric.
  status: GA
  sourceType: Extension
  syntax: >-
    az agentfabric policy-group create --name
                                       --resource-group
                                       [--acquire-policy-token]
                                       [--change-reference]
                                       [--description]
                                       [--display-name]
                                       [--location]
                                       [--network-security-policies]
                                       [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                       [--priority]
                                       [--tags]
  examples:
  - summary: |-
      Create an independent FQDN filtering Policy Group
    syntax: az agentfabric policy-group create --resource-group rgnetworksecurity --name testPolicyGroup --location eastus --display-name "Test Policy Group" --priority 100 --network-security-policies "[{fqdn-filtering:{name:allowOutbound,priority:10,direction:Outbound,ports:[443],source:{workload-id-patterns:{patterns:[workload1]}},destination:{fqdns:{fqdns:[example.com]}}}}]"
  requiredParameters:
  - isRequired: true
    name: --name -n
    summary: |-
      The name of the PolicyGroup.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --description
    summary: |-
      The description of the policy group.
    groupName: Properties Arguments
  - name: --display-name
    summary: |-
      The display name of the policy group.
    groupName: Properties Arguments
  - name: --location -l
    summary: |-
      The geo-location where the resource lives  When not specified, the location of the resource group will be used.
    groupName: Resource Arguments
  - name: --network-security-policies
    summary: |-
      The list of network security policies. A PUT introducing a ContentInspection policy is incompatible if any associated fabric has no configured inspection connection, regardless of whether selectors currently match traffic. The request is rejected before persisting or distributing the proposed changes, preserving the previously accepted policies; mixed compatible and incompatible associations cannot partially apply changes or silently skip inspection. An unattached group, or one attached only to compatible fabrics, may contain ContentInspection policies. Removing ContentInspection policies remains allowed, subject to other validation.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --priority
    summary: |-
      The priority of the policy group.
    groupName: Properties Arguments
  - name: --tags
    summary: |-
      Resource tags.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Resource Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
