### YamlMime:AzureCLIGroup
uid: az_workload-manager_workload-space_runtime-binding
name: az workload-manager workload-space runtime-binding
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **workload-manager** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az workload-manager workload-space runtime-binding** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Runtime Binding.
status: GA
sourceType: Extension
directCommands:
- uid: az_workload-manager_workload-space_runtime-binding_create
  name: az workload-manager workload-space runtime-binding create
  summary: |-
    Create a runtime binding.
  status: GA
  sourceType: Extension
  syntax: >-
    az workload-manager workload-space runtime-binding create --binding-name --name
                                                              --resource-group
                                                              --space-name
                                                              [--acquire-policy-token]
                                                              [--change-reference]
                                                              [--identity-profile]
                                                              [--kind {Kubernetes, ServerlessContainers}]
                                                              [--location]
                                                              [--managed]
                                                              [--network-profile]
                                                              [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                                              [--referenced]
                                                              [--tags]
  examples:
  - summary: |-
      Attach a referenced Kubernetes runtime binding
    syntax: az workload-manager workload-space runtime-binding create --resource-group rg-workload --space-name managed-agents-prod --binding-name customer-aks --location eastus2 --kind Kubernetes --referenced "{resource-id:/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/aks-rg/providers/Microsoft.ContainerService/managedClusters/aks-prod}"
  - summary: |-
      Create a managed Kubernetes runtime binding
    syntax: az workload-manager workload-space runtime-binding create --resource-group rg-workload --space-name managed-agents-prod --binding-name kubernetes-default --location eastus2 --kind Kubernetes --managed "{managed-profile:{offering:Automatic}}"
  - summary: |-
      Create a managed serverless container runtime binding
    syntax: az workload-manager workload-space runtime-binding create --resource-group rg-workload --space-name managed-agents-prod --binding-name serverless-default --location eastus2 --kind ServerlessContainers --managed "{managed-profile:{provider:ACI}}" --identity-profile "{execution-identity:{service-managed:{},scope:SandboxGroup}}"
  requiredParameters:
  - isRequired: true
    name: --binding-name --name -n
    summary: |-
      The name of the RuntimeBinding.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --space-name
    summary: |-
      The name of the WorkloadSpace.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --identity-profile
    summary: |-
      The runtime identity configuration for a managed runtime.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --kind
    acceptedValues: Kubernetes, ServerlessContainers
    summary: |-
      Metadata used by portal/tooling/etc to render different UX experiences for resources of the same type; e.g. ApiApps are a kind of Microsoft.Web/sites type.  If supported, the resource provider must validate and persist this value.
    groupName: Resource Arguments
  - name: --location -l
    summary: |-
      The geo-location where the resource lives  When not specified, the location of the resource group will be used.
    groupName: Resource Arguments
  - name: --managed
    summary: |-
      Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --network-profile
    summary: |-
      The runtime network configuration for a managed runtime.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --referenced
    summary: |-
      Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --tags
    summary: |-
      Resource tags.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Resource Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_workload-manager_workload-space_runtime-binding_delete
