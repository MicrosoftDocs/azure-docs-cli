### YamlMime:AzureCLIGroup
uid: az_workload-manager_workload-space_runtime-link
name: az workload-manager workload-space runtime-link
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **workload-manager** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az workload-manager workload-space runtime-link** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Runtime Link.
status: GA
sourceType: Extension
directCommands:
- uid: az_workload-manager_workload-space_runtime-link_create
  name: az workload-manager workload-space runtime-link create
  summary: |-
    Create a runtime link.
  status: GA
  sourceType: Extension
  syntax: >-
    az workload-manager workload-space runtime-link create --link-name --name
                                                           --resource-group
                                                           --space-name
                                                           [--acquire-policy-token]
                                                           [--capacity-profile]
                                                           [--change-reference]
                                                           [--execution-binding --execution-binding-resource-id]
                                                           [--integration-profile]
                                                           [--location]
                                                           [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                                           [--orchestrator-binding --orchestrator-binding-resource-id]
                                                           [--tags]
  examples:
  - summary: |-
      Create a Kubernetes-only runtime link
    syntax: az workload-manager workload-space runtime-link create --resource-group rg-workload --space-name managed-agents-prod --link-name kubernetes-only --location eastus2 --orchestrator-binding /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-workload/providers/Microsoft.Compute/workloadSpaces/managed-agents-prod/runtimeBindings/customer-aks
  - summary: |-
      Create a runtime link between Kubernetes and serverless containers
    syntax: az workload-manager workload-space runtime-link create --resource-group rg-workload --space-name managed-agents-prod --link-name default --location eastus2 --orchestrator-binding /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-workload/providers/Microsoft.Compute/workloadSpaces/managed-agents-prod/runtimeBindings/kubernetes-default --execution-binding /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-workload/providers/Microsoft.Compute/workloadSpaces/managed-agents-prod/runtimeBindings/serverless-default --capacity-profile "{minimum-nodes:1,maximum-nodes:100}"
  requiredParameters:
  - isRequired: true
    name: --link-name --name -n
    summary: |-
      The name of the RuntimeLink.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --space-name
    summary: |-
      The name of the WorkloadSpace.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --capacity-profile
    summary: |-
      The mutable capacity policy for the runtime composition.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --execution-binding --execution-binding-resource-id
    summary: |-
      The optional sibling runtime binding that provides execution.
    groupName: Properties Arguments
  - name: --integration-profile
    summary: |-
      The provider integration identity configuration.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --location -l
    summary: |-
      The geo-location where the resource lives  When not specified, the location of the resource group will be used.
    groupName: Resource Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --orchestrator-binding --orchestrator-binding-resource-id
    summary: |-
      The sibling runtime binding that provides orchestration.
    groupName: Properties Arguments
  - name: --tags
    summary: |-
      Resource tags.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Resource Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
