extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **interconnect** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az interconnect-group** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Interconnect Group.
status: GA
sourceType: Extension
directCommands:
- uid: az_interconnect-group_create
  name: az interconnect-group create
  summary: |-
    Create an interconnect group.
  status: GA
  sourceType: Extension
  syntax: >-
    az interconnect-group create --interconnect-group-name --name
                                 --resource-group
                                 [--acquire-policy-token]
                                 [--change-reference]
                                 [--location]
                                 [--scope {InfiniBand, None}]
                                 [--subgroup-profile]
                                 [--tags]
  examples:
  - summary: |-
      Create interconnect group
    syntax: az network interconnect-group create --resource-group rg1 --interconnect-group-name test-ig
  requiredParameters:
  - isRequired: true
    name: --interconnect-group-name --name -n
    summary: |-
      The name of the interconnect group.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --location -l
    summary: |-
      Resource location.
    groupName: Resource Arguments
  - name: --scope
    acceptedValues: InfiniBand, None
    summary: |-
      Scope of interconnect group resource.
    groupName: Properties Arguments
  - name: --subgroup-profile
    summary: |-
      The subgroup profile of the interconnect group resource.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --tags
    summary: |-
      Resource tags.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Resource Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
