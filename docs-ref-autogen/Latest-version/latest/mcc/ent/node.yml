- uid: az_mcc_ent_node_update
  name: az mcc ent node update
  summary: |-
    Configures a Microsoft Connected Cache for Enterprise cache node with specified configuration parameters.
  status: GA
  sourceType: Extension
  syntax: >-
    az mcc ent node update [--acquire-policy-token]
                           [--add]
                           [--auto-update-day]
                           [--auto-update-ring {Beta, Stable}]
                           [--auto-update-time]
                           [--auto-update-week]
                           [--cache-drive]
                           [--cache-node-name]
                           [--change-reference]
                           [--force-string {0, 1, f, false, n, no, t, true, y, yes}]
                           [--ids]
                           [--mcc-resource-name]
                           [--proxy {Disabled, Enabled}]
                           [--proxy-host]
                           [--proxy-port]
                           [--remove]
                           [--resource-group]
                           [--set]
                           [--subscription]
                           [--tags]
  examples:
  - summary: |-
      Configure the cache drives of a cache node
    syntax: az mcc ent node update --mcc-resource-name MyMccResource --cache-node-name MyCacheNode --resource-group MyResourceGroup --cache-drive "[{physical-path:/var/mcc,size-in-gb:200}]"
  - summary: |-
      Move a cache node to the Stable update ring (an install schedule is required)
    syntax: az mcc ent node update --mcc-resource-name MyMccResource --cache-node-name MyCacheNode --resource-group MyResourceGroup --auto-update-ring Stable --auto-update-day 2 --auto-update-week 3 --auto-update-time 02:00
  - summary: |-
      Move a cache node to the Beta update ring (the schedule is managed by Microsoft)
    syntax: az mcc ent node update --mcc-resource-name MyMccResource --cache-node-name MyCacheNode --resource-group MyResourceGroup --auto-update-ring Beta
  - summary: |-
      Route a cache node through an outbound proxy
    syntax: az mcc ent node update --mcc-resource-name MyMccResource --cache-node-name MyCacheNode --resource-group MyResourceGroup --proxy Enabled --proxy-host proxy.contoso.com --proxy-port 8080
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --add
    summary: |-
      Add an object to a list of objects by specifying a path and key value pairs.  Example: `--add property.listProperty <key=value, string or JSON string>`.
    groupName: Generic Update Arguments
  - name: --auto-update-day
    summary: |-
      Day of week that cache node will automatically install software update. Allowed values: 1-7. Only valid on the "Stable" update ring.
    groupName: Configuration Arguments
  - name: --auto-update-ring
    acceptedValues: Beta, Stable
    summary: |-
      Cache node automatic software update periodicity ring. Use "Stable" to choose the install schedule yourself, which requires --auto-update-day, --auto-update-week and --auto-update-time. Use "Beta" to let Microsoft manage the schedule, in which case those three arguments must not be provided.
    groupName: Configuration Arguments
  - name: --auto-update-time
    summary: |-
      Time of day in 24-hour time (hh:mm) that cache node will automatically install software update. Only valid on the "Stable" update ring.
    groupName: Configuration Arguments
  - name: --auto-update-week
    summary: |-
      Week of month that cache node will automatically install software update. Allowed values: 2-3. Only valid on the "Stable" update ring.
    groupName: Configuration Arguments
  - name: --cache-drive
    summary: |-
      The physical path and size of cache drive. For a Windows cache node exactly one drive is allowed and its physical path must be "/var/mcc"; a Linux cache node allows up to 9 drives. Size must be between 50 and 10000 GB.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Configuration Arguments
  - name: --cache-node-name
    summary: |-
      Name of Microsoft Connected Cache for Enterprise cache node.
    groupName: Resource Id Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --force-string
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      When using 'set' or 'add', preserve string literals instead of attempting to convert to JSON.
    groupName: Generic Update Arguments
  - name: --ids
    summary: |-
      One or more resource IDs (space-delimited). It should be a complete resource ID containing all information of 'Resource Id' arguments. You should provide either --ids or other 'Resource Id' arguments.
    groupName: Resource Id Arguments
  - name: --mcc-resource-name
    summary: |-
      Name of Microsoft Connected Cache for Enterprise resource.
    groupName: Resource Id Arguments
  - name: --proxy
    acceptedValues: Disabled, Enabled
    summary: |-
      Enable or disable proxy. When enabled, provide --proxy-host and --proxy-port.
    groupName: Configuration Arguments
  - name: --proxy-host
    summary: |-
      Host proxy address configuration. Ex: xxx.xxx.x.x or http://exampleproxy.com.
    groupName: Configuration Arguments
  - name: --proxy-port
    summary: |-
      Port number for proxy host.
    groupName: Configuration Arguments
  - name: --remove
    summary: |-
      Remove a property or an element from a list.  Example: `--remove property.list <indexToRemove>` OR `--remove propertyToRemove`.
    groupName: Generic Update Arguments
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
    groupName: Resource Id Arguments
  - name: --set
    summary: |-
      Update an object by specifying a property path and value to set.  Example: `--set property1.property2=<value>`.
    groupName: Generic Update Arguments
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
    groupName: Resource Id Arguments
  - name: --tags
    summary: |-
      Resource tags.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Resource Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_mcc_ent_node_wait
  name: az mcc ent node wait
  summary: |-
    Place the CLI in a waiting state until a condition is met.
  status: GA
  sourceType: Extension
  syntax: >-
    az mcc ent node wait [--acquire-policy-token]
                         [--cache-node-name]
                         [--change-reference]
                         [--created]
                         [--custom]
                         [--deleted]
                         [--exists]
                         [--ids]
                         [--interval]
                         [--mcc-resource-name]
                         [--resource-group]
                         [--subscription]
                         [--timeout]
                         [--updated]
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --cache-node-name
    summary: |-
      Name of Microsoft Connected Cache for Enterprise cache node.
    groupName: Resource Id Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --created
    defaultValue: "False"
    summary: |-
      Wait until created with 'provisioningState' at 'Succeeded'.
    groupName: Wait Condition Arguments
  - name: --custom
    summary: |-
      Wait until the condition satisfies a custom JMESPath query. E.g. provisioningState!='InProgress', instanceView.statuses[?code=='PowerState/running'].
    groupName: Wait Condition Arguments
  - name: --deleted
    defaultValue: "False"
    summary: |-
      Wait until deleted.
    groupName: Wait Condition Arguments
  - name: --exists
    defaultValue: "False"
    summary: |-
      Wait until the resource exists.
    groupName: Wait Condition Arguments
  - name: --ids
    summary: |-
      One or more resource IDs (space-delimited). It should be a complete resource ID containing all information of 'Resource Id' arguments. You should provide either --ids or other 'Resource Id' arguments.
    groupName: Resource Id Arguments
  - name: --interval
    defaultValue: "30"
    summary: |-
      Polling interval in seconds.
    groupName: Wait Condition Arguments
  - name: --mcc-resource-name
    summary: |-
      Name of Microsoft Connected Cache for Enterprise resource.
    groupName: Resource Id Arguments
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
    groupName: Resource Id Arguments
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
    groupName: Resource Id Arguments
  - name: --timeout
    defaultValue: "3600"
    summary: |-
      Maximum wait in seconds.
    groupName: Wait Condition Arguments
  - name: --updated
    defaultValue: "False"
    summary: |-
      Wait until updated with provisioningState at 'Succeeded'.
    groupName: Wait Condition Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
