- uid: az_migrate_runbook_wait
  name: az migrate runbook wait
  summary: |-
    Wait until a runbook reaches a desired state.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'migrate runbook' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az migrate runbook wait --name --runbook-name
                            --project-name
                            --resource-group
                            [--acquire-policy-token]
                            [--change-reference]
                            [--created]
                            [--custom]
                            [--deleted]
                            [--exists]
                            [--interval]
                            [--timeout]
                            [--updated]
  examples:
  - summary: |-
      Wait until execution completes.
    syntax: >-
      az migrate runbook wait -g myRg --project-name myProject \
        -n myRunbook --custom "properties.state=='ExecutionSucceeded'"
  - summary: |-
      Wait until the runbook exists.
    syntax: >-
      az migrate runbook wait -g myRg --project-name myProject \
        -n myRunbook --created
  requiredParameters:
  - isRequired: true
    name: --name --runbook-name -n
    summary: |-
      Name of the runbook.
  - isRequired: true
    name: --project-name -p
    summary: |-
      Name of the Azure Migrate project. You can configure the default using `az configure --defaults migrate_project=<name>`.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --created
    defaultValue: "False"
    summary: |-
      Wait until provisioningState reaches Succeeded.
  - name: --custom
    summary: |-
      Wait until a JMESPath condition is met, e.g. "properties.state=='ExecutionSucceeded'".
  - name: --deleted
    defaultValue: "False"
    summary: |-
      Wait until the runbook no longer exists.
  - name: --exists
    defaultValue: "False"
    summary: |-
      Wait until the runbook exists.
  - name: --interval
    defaultValue: "30"
    summary: |-
      Polling interval in seconds (default: 30).
  - name: --timeout
    defaultValue: "3600"
    summary: |-
      Maximum wait time in seconds (default: 3600).
  - name: --updated
    defaultValue: "False"
    summary: |-
      Wait until provisioningState reaches Succeeded after an update.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
