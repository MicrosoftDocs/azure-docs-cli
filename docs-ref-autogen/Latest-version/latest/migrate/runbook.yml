### YamlMime:AzureCLIGroup
uid: az_migrate_runbook
name: az migrate runbook
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **migrate** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az migrate runbook** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Azure Migrate runbooks.
description: |-
  Commands to generate and manage Azure Migrate runbooks and their
  executions. This command group is in preview and under active
  development; additional subgroups and commands are added
  incrementally.

  To avoid repeating --resource-group/-g and --project-name/-p on
  every command, set defaults once. For example:
  `az configure --defaults group=<rg> migrate_project=<name>`.
  Once set, -g and -p can be omitted; an explicit flag always wins.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'migrate' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_migrate_runbook_delete
  name: az migrate runbook delete
  summary: |-
    Delete a runbook.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'migrate runbook' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az migrate runbook delete --name --runbook-name
                              --project-name
                              --resource-group
                              [--acquire-policy-token]
                              [--change-reference]
                              [--no-wait]
                              [--yes]
  examples:
  - summary: |-
      Delete a runbook.
    syntax: >-
      az migrate runbook delete -g myRg --project-name myProject \
        -n myRunbook
  requiredParameters:
  - isRequired: true
    name: --name --runbook-name -n
    summary: |-
      Name of the runbook.
  - isRequired: true
    name: --project-name -p
    summary: |-
      Name of the Azure Migrate project. You can configure the default using `az configure --defaults migrate_project=<name>`.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --yes -y
    defaultValue: "False"
    summary: |-
      Do not prompt for confirmation.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_migrate_runbook_generate
  name: az migrate runbook generate
  summary: |-
    Generate a runbook for a migration wave.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'migrate runbook' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az migrate runbook generate --name --runbook-name
                                --project-name
                                --resource-group
                                --wave-name
                                [--acquire-policy-token]
                                [--change-reference]
                                [--no-visualize]
                                [--no-wait]
  examples:
  - summary: |-
      Generate a runbook scoped to a wave.
    syntax: >-
      az migrate runbook generate -g myRg --project-name myProject \
        -n myRunbook --wave-name myWave
  - summary: |-
      Generate a runbook and return immediately.
    syntax: >-
      az migrate runbook generate -g myRg --project-name myProject \
        -n myRunbook --wave-name myWave --no-wait
  requiredParameters:
  - isRequired: true
    name: --name --runbook-name -n
    summary: |-
      Name of the runbook.
  - isRequired: true
    name: --project-name -p
    summary: |-
      Name of the Azure Migrate project. You can configure the default using `az configure --defaults migrate_project=<name>`.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --wave-name
    summary: |-
      Name of the wave to generate the runbook from (required).
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --no-visualize
    defaultValue: "False"
    summary: |-
      Do not open the runbook definition HTML view after the runbook is generated. Useful for automation and non-interactive environments.
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
