### YamlMime:AzureCLIGroup
uid: az_migrate_runbook_parameter
name: az migrate runbook parameter
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **migrate** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az migrate runbook parameter** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Download, upload, and configure a runbook's parameters (inputs) file.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'migrate runbook' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_migrate_runbook_parameter_configure
  name: az migrate runbook parameter configure
  summary: |-
    Generate an offline HTML editor for the parameters file.
  description: |-
    Downloads the runbook's inputs and renders a self-contained HTML page for editing them, with fields and validation driven by the schema in the parameters file. The page cannot call Azure; it writes inputs.json locally and shows the parameter upload command to run.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'migrate runbook parameter' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az migrate runbook parameter configure [--acquire-policy-token]
                                           [--change-reference]
                                           [--file]
                                           [--from-file]
                                           [--name --runbook-name]
                                           [--project-name]
                                           [--resource-group]
                                           [--spec-file]
  examples:
  - summary: |-
      Open the parameters editor for a runbook.
    syntax: >-
      az migrate runbook parameter configure -g myRg \
        --project-name myProject --runbook-name myRunbook
  - summary: |-
      Render from a local inputs.json without contacting Azure.
    syntax: >-
      az migrate runbook parameter configure \
        --from-file ./inputs.json --spec-file ./spec.json
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --file
    summary: |-
      Output path for the generated HTML editor (default: current directory).
  - name: --from-file
    summary: |-
      Render from a local parameters (inputs.json) file instead of fetching from the service.
  - name: --name --runbook-name -n
    summary: |-
      Name of the runbook.
  - name: --project-name -p
    summary: |-
      Name of the Azure Migrate project. You can configure the default using `az configure --defaults migrate_project=<name>`.
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - name: --spec-file
    summary: |-
      Optional local spec JSON file supplying the per-step entity list when rendering from --from-file.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_migrate_runbook_parameter_download
  name: az migrate runbook parameter download
  summary: |-
    Download the runbook's parameters files.
  description: |-
    Downloads the parameters file (inputs.json) and, when the validation schema is shipped separately, schema.json, into a directory.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'migrate runbook parameter' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az migrate runbook parameter download --name --runbook-name
                                          --project-name
                                          --resource-group
                                          [--acquire-policy-token]
                                          [--change-reference]
                                          [--directory]
  examples:
  - summary: |-
      Download the parameters files to the current directory.
    syntax: >-
      az migrate runbook parameter download -g myRg \
        --project-name myProject --runbook-name myRunbook
  - summary: |-
      Download the parameters files to a directory.
    syntax: >-
      az migrate runbook parameter download -g myRg \
        --project-name myProject --runbook-name myRunbook \
        --directory ./params
  requiredParameters:
  - isRequired: true
    name: --name --runbook-name -n
    summary: |-
      Name of the runbook.
  - isRequired: true
    name: --project-name -p
    summary: |-
      Name of the Azure Migrate project. You can configure the default using `az configure --defaults migrate_project=<name>`.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --directory
    summary: |-
      Output directory for the downloaded parameter files (default: current directory).
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_migrate_runbook_parameter_upload
  name: az migrate runbook parameter upload
  summary: |-
    Upload a new parameters file and validate it.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'migrate runbook parameter' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az migrate runbook parameter upload --file
                                        --name --runbook-name
                                        --project-name
                                        --resource-group
                                        [--acquire-policy-token]
                                        [--change-reference]
  examples:
  - summary: |-
      Upload a parameters file.
    syntax: >-
      az migrate runbook parameter upload -g myRg \
        --project-name myProject --runbook-name myRunbook \
        --file ./params.json
  requiredParameters:
  - isRequired: true
    name: --file
    summary: |-
      Path to the parameters JSON file to upload.
  - isRequired: true
