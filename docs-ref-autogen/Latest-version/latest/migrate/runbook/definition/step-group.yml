### YamlMime:AzureCLIGroup
uid: az_migrate_runbook_definition_step-group
name: az migrate runbook definition step-group
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **migrate** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az migrate runbook definition step-group** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage step groups in a runbook definition.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'migrate runbook definition' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_migrate_runbook_definition_step-group_merge
  name: az migrate runbook definition step-group merge
  summary: |-
    Merge two or more step groups into a single step group.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'migrate runbook definition step-group' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az migrate runbook definition step-group merge --name --runbook-name
                                                   --new-step-group-name
                                                   --project-name
                                                   --resource-group
                                                   --source-step-group-ids
                                                   [--acquire-policy-token]
                                                   [--change-reference]
  examples:
  - summary: |-
      Merge two step groups.
    syntax: >-
      az migrate runbook definition step-group merge -g myRg \
        --project-name myProject -n myRunbook \
        --source-step-group-ids ws1 ws2 \
        --new-step-group-name "Combined tier"
  requiredParameters:
  - isRequired: true
    name: --name --runbook-name -n
    summary: |-
      Name of the runbook.
  - isRequired: true
    name: --new-step-group-name
    summary: |-
      Display name for the merged step group.
  - isRequired: true
    name: --project-name -p
    summary: |-
      Name of the Azure Migrate project. You can configure the default using `az configure --defaults migrate_project=<name>`.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --source-step-group-ids
    summary: |-
      Space-separated ids of the step groups to merge.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_migrate_runbook_definition_step-group_split
  name: az migrate runbook definition step-group split
  summary: |-
    Split a step group into two step groups.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'migrate runbook definition step-group' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az migrate runbook definition step-group split --name --runbook-name
                                                   --new-step-group-name
                                                   --project-name
                                                   --resource-group
                                                   --source-step-group-id
                                                   --step-ids
                                                   [--acquire-policy-token]
                                                   [--change-reference]
  examples:
  - summary: |-
      Move steps into a new step group.
    syntax: >-
      az migrate runbook definition step-group split -g myRg \
        --project-name myProject -n myRunbook \
        --source-step-group-id ws1 \
        --new-step-group-name "Database tier" \
        --step-ids step1 step2
  requiredParameters:
  - isRequired: true
    name: --name --runbook-name -n
    summary: |-
      Name of the runbook.
  - isRequired: true
    name: --new-step-group-name
    summary: |-
      Display name for the new step group.
  - isRequired: true
    name: --project-name -p
    summary: |-
      Name of the Azure Migrate project. You can configure the default using `az configure --defaults migrate_project=<name>`.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --source-step-group-id
    summary: |-
      Id of the step group to split.
  - isRequired: true
    name: --step-ids
    summary: |-
      Space-separated step ids to move into the new step group.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_migrate_runbook_definition_step-group_merge
