### YamlMime:AzureCLIGroup
uid: az_migrate_runbook_execution_step
name: az migrate runbook execution step
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **migrate** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az migrate runbook execution step** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Act on a single step within a runbook execution.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'migrate runbook execution' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_migrate_runbook_execution_step_approve
  name: az migrate runbook execution step approve
  summary: |-
    Provide approval for an approval-type step during execution.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'migrate runbook execution step' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az migrate runbook execution step approve --execution-id
                                              --name --runbook-name
                                              --project-name
                                              --resource-group
                                              --step-id
                                              [--acquire-policy-token]
                                              [--change-reference]
                                              [--entities]
  examples:
  - summary: |-
      Approve a Full approval step.
    syntax: >-
      az migrate runbook execution step approve -g myRg \
        --project-name myProject --runbook-name myRunbook \
        --execution-id myExecution --step-id step1
  - summary: |-
      Approve specific ready entities for a Partial approval step.
    syntax: >-
      az migrate runbook execution step approve -g myRg \
        --project-name myProject --runbook-name myRunbook \
        --execution-id myExecution --step-id step1 \
        --entities vm1 vm2
  requiredParameters:
  - isRequired: true
    name: --execution-id
    summary: |-
      Id of the runbook execution.
  - isRequired: true
    name: --name --runbook-name -n
    summary: |-
      Name of the runbook.
  - isRequired: true
    name: --project-name -p
    summary: |-
      Name of the Azure Migrate project. You can configure the default using `az configure --defaults migrate_project=<name>`.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --step-id
    summary: |-
      Id of the approval step to approve.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --entities
    summary: |-
      Space-separated entity ids to approve (partial approval steps only). Omit to approve every currently ready entity for the step.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
