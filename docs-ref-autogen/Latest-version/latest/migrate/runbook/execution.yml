- uid: az_migrate_runbook_execution_show
  name: az migrate runbook execution show
  summary: |-
    Show (or watch) the status of a runbook execution.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'migrate runbook execution' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az migrate runbook execution show --execution-id
                                      --name --runbook-name
                                      --project-name
                                      --resource-group
                                      [--interval]
                                      [--step-id]
                                      [--watch]
  examples:
  - summary: |-
      Show an execution's status.
    syntax: >-
      az migrate runbook execution show -g myRg \
        --project-name myProject --runbook-name myRunbook \
        --execution-id myExecution
  - summary: |-
      Show the status of a single step.
    syntax: >-
      az migrate runbook execution show -g myRg \
        --project-name myProject --runbook-name myRunbook \
        --execution-id myExecution --step-id step1
  - summary: |-
      Auto-refresh the status table until it completes.
    syntax: >-
      az migrate runbook execution show -g myRg \
        --project-name myProject --runbook-name myRunbook \
        --execution-id myExecution --watch
  requiredParameters:
  - isRequired: true
    name: --execution-id
    summary: |-
      Id of the runbook execution.
  - isRequired: true
    name: --name --runbook-name -n
    summary: |-
      Name of the runbook.
  - isRequired: true
    name: --project-name -p
    summary: |-
      Name of the Azure Migrate project. You can configure the default using `az configure --defaults migrate_project=<name>`.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --interval
    defaultValue: "60"
    summary: |-
      Refresh interval in seconds for --watch (default: 60).
  - name: --step-id
    summary: |-
      Limit the output to a single step.
  - name: --watch
    defaultValue: "False"
    summary: |-
      Re-render the status table on an interval until the execution reaches a terminal state.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_migrate_runbook_execution_start
  name: az migrate runbook execution start
  summary: |-
    Start a new execution of a runbook.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'migrate runbook execution' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az migrate runbook execution start --name --runbook-name
                                       --project-name
                                       --resource-group
                                       [--acquire-policy-token]
                                       [--change-reference]
                                       [--no-visualize]
                                       [--no-wait]
  examples:
  - summary: |-
      Start a runbook execution.
    syntax: >-
      az migrate runbook execution start -g myRg \
        --project-name myProject --runbook-name myRunbook
  - summary: |-
      Start without waiting for completion.
    syntax: >-
      az migrate runbook execution start -g myRg \
        --project-name myProject --runbook-name myRunbook --no-wait
  requiredParameters:
  - isRequired: true
    name: --name --runbook-name -n
    summary: |-
      Name of the runbook.
  - isRequired: true
    name: --project-name -p
    summary: |-
      Name of the Azure Migrate project. You can configure the default using `az configure --defaults migrate_project=<name>`.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --no-visualize
    defaultValue: "False"
    summary: |-
      Do not open the live execution watch view after the execution starts. Useful for automation and non-interactive environments.
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_migrate_runbook_execution_visualize
  name: az migrate runbook execution visualize
  summary: |-
    Render an execution's status as a self-contained HTML graph.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'migrate runbook execution' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az migrate runbook execution visualize [--acquire-policy-token]
                                           [--change-reference]
                                           [--execution-id]
                                           [--file]
                                           [--from-file]
                                           [--interval]
                                           [--name --runbook-name]
                                           [--no-open]
                                           [--project-name]
                                           [--resource-group]
                                           [--watch]
  examples:
  - summary: |-
      Visualize an execution's status (opens in the browser).
    syntax: >-
      az migrate runbook execution visualize -g myRg \
        --project-name myProject --runbook-name myRunbook \
        --execution-id myExecution
  - summary: |-
      Regenerate the snapshot on an interval until it completes.
    syntax: >-
      az migrate runbook execution visualize -g myRg \
        --project-name myProject --runbook-name myRunbook \
        --execution-id myExecution --watch
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --execution-id
    summary: |-
      Id of the runbook execution to visualize.
  - name: --file
    summary: |-
      Output path for the generated HTML file (default: current directory).
  - name: --from-file
    summary: |-
      Render from a local execution status JSON file instead of fetching from the service.
  - name: --interval
    defaultValue: "60"
    summary: |-
      Refresh interval in seconds for --watch (default: 60).
  - name: --name --runbook-name -n
    summary: |-
      Name of the runbook.
  - name: --no-open
    defaultValue: "False"
    summary: |-
      Write the HTML file but do not open it in a browser.
  - name: --project-name -p
    summary: |-
      Name of the Azure Migrate project. You can configure the default using `az configure --defaults migrate_project=<name>`.
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - name: --watch
    defaultValue: "False"
    summary: |-
      Regenerate the HTML snapshot on an interval until the execution reaches a terminal state.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
