### YamlMime:AzureCLIGroup
uid: az_migrate_runbook_execution
name: az migrate runbook execution
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **migrate** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az migrate runbook execution** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage runbook executions.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'migrate runbook' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_migrate_runbook_execution_cancel
  name: az migrate runbook execution cancel
  summary: |-
    Cancel an in-progress or paused runbook execution.
  description: |-
    Cancellation is terminal; a cancelled execution cannot be resumed. Start a new execution instead.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'migrate runbook execution' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az migrate runbook execution cancel --execution-id
                                        --name --runbook-name
                                        --project-name
                                        --resource-group
                                        [--acquire-policy-token]
                                        [--change-reference]
                                        [--yes]
  examples:
  - summary: |-
      Cancel an execution.
    syntax: >-
      az migrate runbook execution cancel -g myRg \
        --project-name myProject --runbook-name myRunbook \
        --execution-id myExecution
  requiredParameters:
  - isRequired: true
    name: --execution-id
    summary: |-
      Id of the runbook execution.
  - isRequired: true
    name: --name --runbook-name -n
    summary: |-
      Name of the runbook.
  - isRequired: true
    name: --project-name -p
    summary: |-
      Name of the Azure Migrate project. You can configure the default using `az configure --defaults migrate_project=<name>`.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --yes -y
    defaultValue: "False"
    summary: |-
      Do not prompt for confirmation.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
