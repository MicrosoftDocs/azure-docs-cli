### YamlMime:AzureCLIGroup
uid: az_migrate_runbook_definition
name: az migrate runbook definition
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **migrate** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az migrate runbook definition** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  View and download the contents of a runbook definition.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'migrate runbook' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_migrate_runbook_definition_download
  name: az migrate runbook definition download
  summary: |-
    Download the runbook definition and documentation files.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'migrate runbook definition' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az migrate runbook definition download --name --runbook-name
                                           --project-name
                                           --resource-group
                                           [--acquire-policy-token]
                                           [--change-reference]
                                           [--destination]
  examples:
  - summary: |-
      Download a runbook definition to the current directory.
    syntax: >-
      az migrate runbook definition download -g myRg \
        --project-name myProject -n myRunbook
  - summary: |-
      Download a runbook definition to a specific directory.
    syntax: >-
      az migrate runbook definition download -g myRg \
        --project-name myProject -n myRunbook \
        --destination ./runbooks
  requiredParameters:
  - isRequired: true
    name: --name --runbook-name -n
    summary: |-
      Name of the runbook.
  - isRequired: true
    name: --project-name -p
    summary: |-
      Name of the Azure Migrate project. You can configure the default using `az configure --defaults migrate_project=<name>`.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --destination
    summary: |-
      Directory to save the downloaded files to (default: current directory).
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_migrate_runbook_definition_show
  name: az migrate runbook definition show
  summary: |-
    Show the definition (contents) of a runbook.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'migrate runbook definition' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az migrate runbook definition show --name --runbook-name
                                       --project-name
                                       --resource-group
                                       [--step-group-id]
                                       [--step-id]
  examples:
  - summary: |-
      Show a runbook definition.
    syntax: >-
      az migrate runbook definition show -g myRg \
        --project-name myProject -n myRunbook
  - summary: |-
      Show a single step group in a runbook definition.
    syntax: >-
      az migrate runbook definition show -g myRg \
        --project-name myProject -n myRunbook \
        --step-group-id myStepGroup
  requiredParameters:
  - isRequired: true
    name: --name --runbook-name -n
    summary: |-
      Name of the runbook.
  - isRequired: true
    name: --project-name -p
    summary: |-
      Name of the Azure Migrate project. You can configure the default using `az configure --defaults migrate_project=<name>`.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --step-group-id
    summary: |-
      Limit the output to a single step group.
  - name: --step-id
    summary: |-
      Limit the output to a single step.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_migrate_runbook_definition_visualize
  name: az migrate runbook definition visualize
  summary: |-
    Render the runbook definition as a self-contained HTML page.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'migrate runbook definition' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az migrate runbook definition visualize [--acquire-policy-token]
                                            [--change-reference]
                                            [--file]
                                            [--from-file]
                                            [--name --runbook-name]
                                            [--no-open]
                                            [--parameters-file]
                                            [--project-name]
                                            [--resource-group]
  examples:
  - summary: |-
      Visualize a runbook definition (opens in the browser).
    syntax: >-
      az migrate runbook definition visualize -g myRg \
        --project-name myProject -n myRunbook
  - summary: |-
      Write the HTML without opening a browser.
    syntax: >-
      az migrate runbook definition visualize -g myRg \
        --project-name myProject -n myRunbook --no-open
  - summary: |-
      Visualize from a local definition file.
    syntax: >-
      az migrate runbook definition visualize \
        --from-file ./definition.json --file ./definition.html
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --file
    summary: |-
      Output path for the generated HTML file (default: current directory).
  - name: --from-file
    summary: |-
      Render from a local runbook definition JSON file instead of fetching from the service.
  - name: --name --runbook-name -n
    summary: |-
      Name of the runbook.
  - name: --no-open
    defaultValue: "False"
    summary: |-
      Write the HTML file but do not open it in a browser.
  - name: --parameters-file
    summary: |-
      Optional local parameters JSON file to merge when rendering from --from-file.
  - name: --project-name -p
    summary: |-
      Name of the Azure Migrate project. You can configure the default using `az configure --defaults migrate_project=<name>`.
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
