- uid: az_horizondb_cluster_restore
  name: az horizondb cluster restore
  summary: |-
    Restore a HorizonDB cluster to a point in time.
  description: |-
    Inherits unspecified cluster settings from the source cluster, waits for provisioning, and retrieves the restored cluster.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'az horizondb cluster' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az horizondb cluster restore --cluster-name --name
                                 --creation-source-cluster-resource-id --source-cluster-id
                                 --resource-group
                                 [--acquire-policy-token]
                                 [--change-reference]
                                 [--location]
                                 [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                 [--point-in-time-utc]
                                 [--primary-key-uri]
                                 [--primary-user-assigned-identity-id --primary-user-id]
                                 [--public-access {Disabled, Enabled}]
                                 [--tags]
  examples:
  - summary: |-
      Restore a HorizonDB cluster to a specified UTC time
    syntax: az horizondb cluster restore --resource-group example-resource-group --cluster-name restored-cluster --source-cluster-id /subscriptions/00000000-0000-0000-0000-000000000001/resourceGroups/source-resource-group/providers/Microsoft.HorizonDb/clusters/source-cluster --point-in-time-utc 2026-07-27T12:00:00Z
  requiredParameters:
  - isRequired: true
    name: --cluster-name --name -n
    summary: |-
      The name of the HorizonDB cluster.
  - isRequired: true
    name: --creation-source-cluster-resource-id --source-cluster-id
    summary: |-
      Resource ID of the source HorizonDB cluster.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --location -l
    summary: |-
      Location of the restored cluster. Can only be specified for a geo-redundant restore when the source cluster has geo-redundancy enabled. Defaults to the source cluster location.
    groupName: Resource Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --point-in-time-utc
    summary: |-
      UTC restore time, for example 2026-07-27T12:00:00Z. Defaults to five minutes before the current UTC time.
  - name: --primary-key-uri
    summary: |-
      Versionless Azure Key Vault key URI. Must be supplied together with --primary-user-assigned-identity-id to enable data encryption.
    groupName: DataEncryption Arguments
  - name: --primary-user-assigned-identity-id --primary-user-id
    summary: |-
      Resource ID of the user-assigned managed identity used to access the encryption key. Must be supplied together with --primary-key-uri.
    groupName: DataEncryption Arguments
  - name: --public-access
    acceptedValues: Disabled, Enabled
    summary: |-
      Specifies whether public access is enabled for the cluster. The service defaults to Disabled when this property is omitted.
    groupName: Network Arguments
  - name: --tags
    summary: |-
      Resource tags.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Resource Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
