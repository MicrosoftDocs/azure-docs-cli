### YamlMime:AzureCLIGroup
uid: az_horizondb_cluster
name: az horizondb cluster
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **horizondb** extension for the Azure CLI (version 2.17.1 or higher). The extension will automatically install the first time you run an **az horizondb cluster** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage HorizonDB Cluster.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'az horizondb' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_horizondb_cluster_create
  name: az horizondb cluster create
  summary: |-
    Create a HorizonDB cluster.
  description: |-
    Waits for cluster provisioning and retrieves the cluster to return its current state.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'az horizondb cluster' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az horizondb cluster create --cluster-name --name
                                --resource-group
                                [--acquire-policy-token]
                                [--backup-retention-days --retention-days]
                                [--change-reference]
                                [--geo-redundancy {Disabled, Enabled}]
                                [--location]
                                [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                [--primary-key-uri]
                                [--primary-user-assigned-identity-id --primary-user-id]
                                [--public-access {Disabled, Enabled}]
                                [--tags]
                                [--version {17, 18}]
  examples:
  - summary: |-
      Create a HorizonDB cluster
    syntax: az horizondb cluster create --resource-group example-resource-group --cluster-name example-cluster --location eastus2 --version 17 --geo-redundancy Enabled
  requiredParameters:
  - isRequired: true
    name: --cluster-name --name -n
    summary: |-
      The name of the HorizonDB cluster.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --backup-retention-days --retention-days
    defaultValue: "7"
    summary: |-
      The number of days that automatic backups are retained. The service defaults to 7 days when this property is omitted.
    groupName: Backup Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --geo-redundancy
    acceptedValues: Disabled, Enabled
    summary: |-
      The geo-redundancy state. When creationMode is PointInTimeRestore, the service ignores the requested value during cluster creation and configures the new cluster with the same geo-redundancy setting as the source cluster, for both same-location and cross-location restores. The response reports the inherited setting. Geo-redundant backup is not supported when dataEncryption.type is AzureKeyVault.
    groupName: Backup Arguments
  - name: --location -l
    summary: |-
      The geo-location where the resource lives  When not specified, the location of the resource group will be used.
    groupName: Resource Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --primary-key-uri
    summary: |-
      Versionless Azure Key Vault key URI. Must be supplied together with --primary-user-assigned-identity-id to enable data encryption.
    groupName: DataEncryption Arguments
  - name: --primary-user-assigned-identity-id --primary-user-id
    summary: |-
      Resource ID of the user-assigned managed identity used to access the encryption key. Must be supplied together with --primary-key-uri.
    groupName: DataEncryption Arguments
  - name: --public-access
    defaultValue: Disabled
    acceptedValues: Disabled, Enabled
    summary: |-
      Specifies whether public access is enabled for the cluster. The service defaults to Disabled when this property is omitted.
    groupName: Network Arguments
  - name: --tags
    summary: |-
      Resource tags.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Resource Arguments
  - name: --version
    acceptedValues: 17, 18
    summary: |-
      The PostgreSQL major version used by the HorizonDB cluster. API version 2026-10-01-preview supports versions 17 and 18. For ordinary cluster creation, the version is supplied in the request and is immutable after creation. For point-in-time restore, the service obtains the version from the source backup metadata and the request must omit this property. This API version does not support in-place PostgreSQL major-version upgrades.
    groupName: Properties Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
