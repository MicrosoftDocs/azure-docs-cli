### YamlMime:AzureCLIGroup
uid: az_horizondb_parameter-group
name: az horizondb parameter-group
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **horizondb** extension for the Azure CLI (version 2.17.1 or higher). The extension will automatically install the first time you run an **az horizondb parameter-group** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage a HorizonDB Parameter Group.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'az horizondb' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_horizondb_parameter-group_create
  name: az horizondb parameter-group create
  summary: |-
    Create a new HorizonDB parameter group.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'az horizondb parameter-group' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az horizondb parameter-group create --name --parameter-group-name
                                        --resource-group
                                        [--acquire-policy-token]
                                        [--change-reference]
                                        [--description]
                                        [--location]
                                        [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                        [--parameters]
                                        [--tags]
                                        [--version {17, 18}]
  examples:
  - summary: |-
      Create or replace a HorizonDB parameter group for a PostgreSQL version
    syntax: az horizondb parameter-group create --resource-group example-resource-group --parameter-group-name production-parameters --location eastus2 --tags "{environment:production}" --version 17 --parameters "[{name:application_name,value:horizondb-production},{name:autovacuum,value:off},{name:wal_receiver_timeout,value:45000},{name:work_mem,value:8192},{name:xmlbinary,value:base64}]" --description Parameters for production transactional workloads
  requiredParameters:
  - isRequired: true
    name: --name --parameter-group-name -n
    summary: |-
      The name of the HorizonDB parameter group.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --description
    summary: |-
      Description of the parameter group. The maximum length is 1024 characters.
    groupName: Properties Arguments
  - name: --location -l
    summary: |-
      The geo-location where the resource lives  When not specified, the location of the resource group will be used.
    groupName: Resource Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --parameters
    summary: |-
      Parameters in the parameter group.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --tags
    summary: |-
      Resource tags.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Resource Arguments
  - name: --version
    acceptedValues: 17, 18
    summary: |-
      The PostgreSQL major version used by the HorizonDB cluster. API version 2026-10-01-preview supports versions 17 and 18. For ordinary cluster creation, the version is supplied in the request and is immutable after creation. For point-in-time restore, the service obtains the version from the source backup metadata and the request must omit this property. This API version does not support in-place PostgreSQL major-version upgrades.
    groupName: Properties Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_horizondb_parameter-group_delete
  name: az horizondb parameter-group delete
  summary: |-
    Delete a HorizonDB parameter group. Deletion fails with a conflict when the parameter group is associated with one or more pools.
