### YamlMime:AzureCLIGroup
uid: az_horizondb_parameter-group
name: az horizondb parameter-group
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **horizondb** extension for the Azure CLI (version 2.17.1 or higher). The extension will automatically install the first time you run an **az horizondb parameter-group** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Azure HorizonDB parameter groups.
status: GA
sourceType: Extension
directCommands:
- uid: az_horizondb_parameter-group_create
  name: az horizondb parameter-group create
  summary: |-
    Create a new Azure HorizonDB parameter group.
  status: GA
  sourceType: Extension
  syntax: >-
    az horizondb parameter-group create --name
                                        --parameters
                                        --resource-group
                                        [--acquire-policy-token]
                                        [--apply-immediately {false, true}]
                                        [--change-reference]
                                        [--description]
                                        [--location]
                                        [--no-wait]
                                        [--tags]
                                        [--version]
  examples:
  - summary: |-
      Create an Azure HorizonDB parameter group with custom parameter values. Unspecified parameters inherit the default PostgreSQL values.
    syntax: az horizondb parameter-group create --name exampleparametergroup --resource-group exampleresourcegroup --location westus2 --version 17 --parameters max_connections=200 log_min_error_statement=error shared_buffers=2000
  - summary: |-
      Create an Azure HorizonDB parameter group that applies parameters immediately and includes a description.
    syntax: az horizondb parameter-group create --name exampleparametergroup --resource-group exampleresourcegroup --location westus2 --version 17 --parameters max_connections=200 log_min_error_statement=error shared_buffers=2000 --apply-immediately true --description "Parameter group for high-throughput workloads"
  requiredParameters:
  - isRequired: true
    name: --name -n
    summary: |-
      Name of the parameter group.
  - isRequired: true
    name: --parameters
    summary: |-
      Space-separated list of parameters in 'name=value' format. At least one parameter is required; any parameters you do not specify inherit the PostgreSQL defaults for the parameter group.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --apply-immediately
    acceptedValues: false, true
    summary: |-
      Indicates whether the parameters should be applied immediately.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --description
    summary: |-
      Description of the parameter group.
  - name: --location -l
    summary: |-
      Location. Values from: `az account list-locations`. You can configure the default location using `az configure --defaults location=<location>`.
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --tags
    summary: |-
      Space-separated tags: key[=value] [key[=value] ...]. Use "" to clear existing tags.
  - name: --version -v
    summary: |-
      Specifies the PostgreSQL major version.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
