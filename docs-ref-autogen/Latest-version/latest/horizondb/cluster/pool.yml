### YamlMime:AzureCLIGroup
uid: az_horizondb_cluster_pool
name: az horizondb cluster pool
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **horizondb** extension for the Azure CLI (version 2.17.1 or higher). The extension will automatically install the first time you run an **az horizondb cluster pool** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage HorizonDB Pool.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'az horizondb cluster' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_horizondb_cluster_pool_create
  name: az horizondb cluster pool create
  summary: |-
    Create a new HorizonDB pool.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'az horizondb cluster pool' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az horizondb cluster pool create --cluster-name
                                     --name --pool-name
                                     --resource-group
                                     [--acquire-policy-token]
                                     [--change-reference]
                                     [--compute-generation]
                                     [--compute-processor {AMD, Intel}]
                                     [--high-availability-mode {AnyZone, Disabled, ZoneRedundant}]
                                     [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                     [--node-count]
                                     [--v-cores]
  examples:
  - summary: |-
      Create a minimum provisioned HorizonDB pool using the default parameter group
    syntax: az horizondb cluster pool create --resource-group example-resource-group --cluster-name example-cluster --pool-name example-pool-01 --compute-processor AMD --compute-generation 3 --v-cores 2 --node-count 1 --high-availability-mode Disabled
  requiredParameters:
  - isRequired: true
    name: --cluster-name
    summary: |-
      The name of the HorizonDB cluster.
  - isRequired: true
    name: --name --pool-name -n
    summary: |-
      The name of the HorizonDB pool.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --compute-generation
    summary: |-
      The compute generation for the compute model.
    groupName: ComputeModel Arguments
  - name: --compute-processor
    acceptedValues: AMD, Intel
    summary: |-
      The processor type for the compute model.
    groupName: ComputeModel Arguments
  - name: --high-availability-mode
    acceptedValues: AnyZone, Disabled, ZoneRedundant
    summary: |-
      The high-availability mode. Disabled is required when nodeCount is 1. AnyZone or ZoneRedundant is required when nodeCount is 2 through 16.
    groupName: HighAvailability Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --node-count
    summary: |-
      The required number of nodes to allocate and assign to the pool. Allowed values are 1 through 16. To deallocate runtime compute without changing the configured node count, stop the pool.
    groupName: Properties Arguments
  - name: --v-cores
    summary: |-
      The number of vCores. Allowed values are 1 through 192.
    groupName: ComputeModel Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
