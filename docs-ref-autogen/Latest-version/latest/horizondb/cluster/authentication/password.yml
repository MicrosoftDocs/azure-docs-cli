### YamlMime:AzureCLIGroup
uid: az_horizondb_cluster_authentication_password
name: az horizondb cluster authentication password
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **horizondb** extension for the Azure CLI (version 2.17.1 or higher). The extension will automatically install the first time you run an **az horizondb cluster authentication password** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage password authentication settings for a HorizonDB cluster.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'az horizondb cluster authentication' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_horizondb_cluster_authentication_password_create
  name: az horizondb cluster authentication password create
  summary: |-
    Create or replace password authentication settings for a HorizonDB cluster.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'az horizondb cluster authentication password' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az horizondb cluster authentication password create --cluster-name
                                                        --resource-group
                                                        [--acquire-policy-token]
                                                        [--admin-password --administrator-login-password]
                                                        [--administrator-login]
                                                        [--change-reference]
                                                        [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                                        [--state {Disabled, Enabled}]
  examples:
  - summary: |-
      Set up an administrator using a securely prompted password
    syntax: az horizondb cluster authentication password create --resource-group example-resource-group --cluster-name example-cluster --state Enabled --administrator-login exampleadmin --administrator-login-password
  requiredParameters:
  - isRequired: true
    name: --cluster-name
    summary: |-
      The name of the HorizonDB cluster.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --admin-password --administrator-login-password
    summary: |-
      The PostgreSQL administrator password. Setting the password requires password authentication state to be Enabled in the same request.  If value is blank it's asked from the tty.
    groupName: Properties Arguments
  - name: --administrator-login
    summary: |-
      The PostgreSQL administrator login name. This value is returned in responses after it is set. After it is set, renaming is not supported. Setting the login requires password authentication state to be Enabled in the same request.
    groupName: Properties Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --state
    acceptedValues: Disabled, Enabled
    summary: |-
      The state of PostgreSQL username-and-password authentication.
    groupName: Properties Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
