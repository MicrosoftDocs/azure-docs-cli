### YamlMime:AzureCLIGroup
uid: az_horizondb_cluster_pool_maintenance-event
name: az horizondb cluster pool maintenance-event
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **horizondb** extension for the Azure CLI (version 2.17.1 or higher). The extension will automatically install the first time you run an **az horizondb cluster pool maintenance-event** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Maintenance Event.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'az horizondb cluster pool' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_horizondb_cluster_pool_maintenance-event_list
  name: az horizondb cluster pool maintenance-event list
  summary: |-
    Show the system-managed maintenance policy for a HorizonDB pool.
  description: |-
    Maintenance updates are managed by the system. Currently, HorizonDB supports System-Managed Maintenance Window.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'az horizondb cluster pool maintenance-event' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az horizondb cluster pool maintenance-event list --cluster-name
                                                     --pool-name
                                                     --resource-group
  examples:
  - summary: |-
      Show maintenance information for a HorizonDB pool
    syntax: az horizondb cluster pool maintenance-event list --resource-group example-resource-group --cluster-name example-cluster --pool-name example-pool
  requiredParameters:
  - isRequired: true
    name: --cluster-name
    summary: |-
      The name of the HorizonDB cluster.
  - isRequired: true
    name: --pool-name
    summary: |-
      The name of the HorizonDB pool.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_horizondb_cluster_pool_maintenance-event_list
