- uid: az_horizondb_cluster_private-endpoint-connection_update
  name: az horizondb cluster private-endpoint-connection update
  summary: |-
    Update an existing private endpoint connection.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'az horizondb cluster private-endpoint-connection' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az horizondb cluster private-endpoint-connection update [--acquire-policy-token]
                                                            [--actions-required]
                                                            [--add]
                                                            [--change-reference]
                                                            [--cluster-name]
                                                            [--description]
                                                            [--force-string {0, 1, f, false, n, no, t, true, y, yes}]
                                                            [--ids]
                                                            [--name --private-endpoint-connection-name]
                                                            [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                                            [--remove]
                                                            [--resource-group]
                                                            [--set]
                                                            [--status {Approved, Pending, Rejected}]
                                                            [--subscription]
  examples:
  - summary: |-
      Approve or reject a private endpoint connection
    syntax: az horizondb cluster private-endpoint-connection update --resource-group example-resource-group --cluster-name example-cluster --private-endpoint-connection-name example-private-endpoint-connection --status Approved --description Approved for the production database network
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --actions-required
    summary: |-
      A message indicating if changes on the service provider require any updates on the consumer.
    groupName: PrivateLinkServiceConnectionState Arguments
  - name: --add
    summary: |-
      Add an object to a list of objects by specifying a path and key value pairs.  Example: `--add property.listProperty <key=value, string or JSON string>`.
    groupName: Generic Update Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --cluster-name
    summary: |-
      The name of the HorizonDB cluster.
    groupName: Resource Id Arguments
  - name: --description
    summary: |-
      The reason for approval/rejection of the connection.
    groupName: PrivateLinkServiceConnectionState Arguments
  - name: --force-string
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      When using 'set' or 'add', preserve string literals instead of attempting to convert to JSON.
    groupName: Generic Update Arguments
