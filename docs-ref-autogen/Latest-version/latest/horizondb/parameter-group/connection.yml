### YamlMime:AzureCLIGroup
uid: az_horizondb_parameter-group_connection
name: az horizondb parameter-group connection
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **horizondb** extension for the Azure CLI (version 2.17.1 or higher). The extension will automatically install the first time you run an **az horizondb parameter-group connection** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage HorizonDB Parameter Group Connections.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'az horizondb parameter-group' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_horizondb_parameter-group_connection_list
  name: az horizondb parameter-group connection list
  summary: |-
    List all connections to a parameter group.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'az horizondb parameter-group connection' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az horizondb parameter-group connection list --parameter-group-name
                                                 --resource-group
                                                 [--max-items]
                                                 [--next-token]
  examples:
  - summary: |-
      List HorizonDB pools connected to a parameter group
    syntax: az horizondb parameter-group connection list --resource-group example-resource-group --parameter-group-name production-parameters
  requiredParameters:
  - isRequired: true
    name: --parameter-group-name
    summary: |-
      The name of the HorizonDB parameter group.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --max-items
    summary: |-
      Total number of items to return in the command's output. If the total number of items available is more than the value specified, a token is provided in the command's output. To resume pagination, provide the token value in `--next-token` argument of a subsequent command.
    groupName: Pagination Arguments
  - name: --next-token
    summary: |-
      Token to specify where to start paginating. This is the token value from a previously truncated response.
    groupName: Pagination Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_horizondb_parameter-group_connection_list
metadata:
  description: Manage HorizonDB Parameter Group Connections.
