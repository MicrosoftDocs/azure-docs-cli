### YamlMime:AzureCLIGroup
uid: az_horizondb_parameter-group_default
name: az horizondb parameter-group default
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **horizondb** extension for the Azure CLI (version 2.17.1 or higher). The extension will automatically install the first time you run an **az horizondb parameter-group default** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage default HorizonDB parameter groups.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'az horizondb parameter-group' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_horizondb_parameter-group_default_list
  name: az horizondb parameter-group default list
  summary: |-
    List default HorizonDB parameter groups in a region.
  description: |-
    Each region has at most one default parameter group for each PostgreSQL version. Default parameter groups contain engine-defined parameters only.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'az horizondb parameter-group default' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az horizondb parameter-group default list --location
                                              [--max-items]
                                              [--next-token]
  examples:
  - summary: |-
      List default HorizonDB parameter groups by subscription and region
    syntax: az horizondb parameter-group default list --location eastus2
  requiredParameters:
  - isRequired: true
    name: --location -l
    summary: |-
      Location. Values from: `az account list-locations`. You can configure the default location using `az configure --defaults location=<location>`.
  optionalParameters:
  - name: --max-items
    summary: |-
      Total number of items to return in the command's output. If the total number of items available is more than the value specified, a token is provided in the command's output. To resume pagination, provide the token value in `--next-token` argument of a subsequent command.
    groupName: Pagination Arguments
  - name: --next-token
    summary: |-
      Token to specify where to start paginating. This is the token value from a previously truncated response.
    groupName: Pagination Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_horizondb_parameter-group_default_show
  name: az horizondb parameter-group default show
  summary: |-
    Get a default HorizonDB parameter group in a region.
  description: |-
    Each region has at most one default parameter group for each PostgreSQL version. Default parameter groups contain engine-defined parameters only.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'az horizondb parameter-group default' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az horizondb parameter-group default show [--ids]
                                              [--location]
                                              [--name]
                                              [--subscription]
  examples:
  - summary: |-
      Get a default HorizonDB parameter group by subscription, location, and name
    syntax: az horizondb parameter-group default show --location eastus2 --name default-postgresql-17-provisioned
  optionalParameters:
  - name: --ids
    summary: |-
      One or more resource IDs (space-delimited). It should be a complete resource ID containing all information of 'Resource Id' arguments. You should provide either --ids or other 'Resource Id' arguments.
    groupName: Resource Id Arguments
  - name: --location -l
    summary: |-
      Location. Values from: `az account list-locations`. You can configure the default location using `az configure --defaults location=<location>`.
    groupName: Resource Id Arguments
  - name: --name -n
    summary: |-
      The name of the DefaultParameterGroup.
    groupName: Resource Id Arguments
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
    groupName: Resource Id Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_horizondb_parameter-group_default_list
- az_horizondb_parameter-group_default_show
metadata:
  description: Manage default HorizonDB parameter groups.
