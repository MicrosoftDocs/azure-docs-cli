### YamlMime:AzureCLIGroup
uid: az_backup_item_source-scan-configuration
name: az backup item source-scan-configuration
summary: |-
  Manage Source Scan configuration for a backed up Azure VM item.
status: GA
sourceType: Core
directCommands:
- uid: az_backup_item_source-scan-configuration_set
  name: az backup item source-scan-configuration set
  summary: |-
    Set the Source Scan configuration used by Microsoft Defender for Cloud threat detection.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/backup/_help.py
  syntax: >-
    az backup item source-scan-configuration set --backup-management-type {AzureIaasVM}
                                                 --container-name
                                                 --name
                                                 --state {Disabled, Enabled}
                                                 --workload-type {VM}
                                                 [--acquire-policy-token]
                                                 [--change-reference]
                                                 [--ids]
                                                 [--resource-group]
                                                 [--subscription]
                                                 [--vault-name]
  examples:
  - summary: |-
      Enable Source Scan for a backed up Azure VM item.
    syntax: az backup item source-scan-configuration set --resource-group MyResourceGroup --vault-name MyVault --container-name MyContainer --name MyItem --state Enabled --backup-management-type AzureIaasVM --workload-type VM
  - summary: |-
      Disable Source Scan for a backed up Azure VM item.
    syntax: az backup item source-scan-configuration set --resource-group MyResourceGroup --vault-name MyVault --container-name MyContainer --name MyItem --state Disabled --backup-management-type AzureIaasVM --workload-type VM
  requiredParameters:
  - isRequired: true
    name: --backup-management-type
    acceptedValues: AzureIaasVM
    summary: |-
      Type of backup management for the item.
  - isRequired: true
    name: --container-name -c
    summary: |-
      Name of the backup container. Accepts 'Name' or 'FriendlyName' from the output of az backup container list command. If 'FriendlyName' is passed then BackupManagementType is required.
  - isRequired: true
    name: --name -n
    summary: |-
      Name of the backed up Azure VM item.
  - isRequired: true
    name: --state
    acceptedValues: Disabled, Enabled
    summary: |-
      Source Scan state used by Microsoft Defender for Cloud threat detection.
  - isRequired: true
    name: --workload-type
    acceptedValues: VM
    summary: |-
      Type of workload protected by the item.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --ids
    summary: |-
      One or more resource IDs (space-delimited). It should be a complete resource ID containing all information of 'Resource Id' arguments. You should provide either --ids or other 'Resource Id' arguments.
    groupName: Resource Id Arguments
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
    groupName: Resource Id Arguments
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
    groupName: Resource Id Arguments
  - name: --vault-name -v
    summary: |-
      Name of the Recovery services vault.
    groupName: Resource Id Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_backup_item_source-scan-configuration_set
metadata:
  ms.date: 09/18/2026
  description: Manage Source Scan configuration for a backed up Azure VM item.
