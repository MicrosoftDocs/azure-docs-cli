### YamlMime:AzureCLIGroup
uid: az_apr_publication
name: az apr publication
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **apr** extension for the Azure CLI (version 2.55.0 or higher). The extension will automatically install the first time you run an **az apr publication** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  View and delete publications.
status: Preview
isPreview: true
previewOrExperimentalInfo: 'This command group is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus'
sourceType: Extension
directCommands:
- uid: az_apr_publication_delete
  name: az apr publication delete
  summary: |-
    Delete a publication.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'apr publication' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az apr publication delete --id
                              --registry
                              [--acquire-policy-token]
                              [--change-reference]
                              [--no-wait]
                              [--resource-group]
                              [--yes]
  examples:
  - summary: |-
      Delete a publication by id.
    syntax: az apr publication delete -g myrg -r myregistry --id mypublicationid
  requiredParameters:
  - isRequired: true
    name: --id
    summary: |-
      Publication id.
  - isRequired: true
    name: --registry -r
    summary: |-
      Name of the parent APR registry.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - name: --yes -y
    defaultValue: "False"
    summary: |-
      Do not prompt for confirmation.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_apr_publication_list
  name: az apr publication list
  summary: |-
    List publications.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'apr publication' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az apr publication list --registry
                            [--limit]
                            [--repository]
                            [--resource-group]
  examples:
  - summary: |-
      List all publications in a registry.
    syntax: az apr publication list -g myrg -r myregistry
  - summary: |-
      List publications for a given repository.
    syntax: az apr publication list -g myrg -r myregistry --repository myrepo
  requiredParameters:
  - isRequired: true
    name: --registry -r
    summary: |-
      Name of the parent APR registry.
  optionalParameters:
  - name: --limit
    summary: |-
      Max number of publications to return. Omit to return all.
  - name: --repository
    summary: |-
      Filter publications by repository (Name or ID).
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
