### YamlMime:AzureCLIGroup
uid: az_apr_package_file
name: az apr package file
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **apr** extension for the Azure CLI (version 2.55.0 or higher). The extension will automatically install the first time you run an **az apr package file** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage file packages.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'apr package' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_apr_package_file_list
  name: az apr package file list
  summary: |-
    List file packages.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'apr package file' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az apr package file list --registry
                             [--limit]
                             [--name]
                             [--repository]
                             [--resource-group]
                             [--sha256]
  requiredParameters:
  - isRequired: true
    name: --registry -r
    summary: |-
      Name of the parent APR registry.
  optionalParameters:
  - name: --limit
    summary: |-
      Max number of packages to return. Omit to return all.
  - name: --name
    summary: |-
      Filter packages by name.
  - name: --repository
    summary: |-
      Filter packages by repository (name or ID).
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - name: --sha256
    summary: |-
      Filter packages by sha256 sum.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_apr_package_file_show
  name: az apr package file show
  summary: |-
    Show details for a package.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'apr package file' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az apr package file show --id
                             --registry
                             [--resource-group]
  requiredParameters:
  - isRequired: true
    name: --id
    summary: |-
      Package id.
  - isRequired: true
    name: --registry -r
    summary: |-
      Name of the parent APR registry.
  optionalParameters:
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_apr_package_file_list
- az_apr_package_file_show
metadata:
  description: Manage file packages.
