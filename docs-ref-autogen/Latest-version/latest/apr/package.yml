### YamlMime:AzureCLIGroup
uid: az_apr_package
name: az apr package
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **apr** extension for the Azure CLI (version 2.55.0 or higher). The extension will automatically install the first time you run an **az apr package** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Upload and inspect packages.
status: Preview
isPreview: true
previewOrExperimentalInfo: 'This command group is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus'
sourceType: Extension
directCommands:
- uid: az_apr_package_upload
  name: az apr package upload
  summary: |-
    Upload a package.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'apr package' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az apr package upload --file
                          --registry
                          [--acquire-policy-token]
                          [--change-reference]
                          [--component]
                          [--no-wait]
                          [--relative-path]
                          [--release]
                          [--repository]
                          [--resource-group]
                          [--type {deb, file, rpm}]
  examples:
  - summary: |-
      Upload a package without adding it to a repository.
    syntax: az apr package upload -g myrg -r myregistry --file ./my-package.deb
  - summary: |-
      Upload a deb package to a repository.
    syntax: az apr package upload -g myrg -r myregistry --repository myrepo         --release jammy --file ./my-package.deb
  - summary: |-
      Upload a deb package to a component of an apt repository.
    syntax: az apr package upload -g myrg -r myregistry --repository myrepo         --release jammy --component contrib --file ./my-package.deb
  - summary: |-
      Upload an RPM package to a repository.
    syntax: az apr package upload -g myrg -r myregistry --repository myrepo         --file ./my-package.rpm
  - summary: |-
      Upload a file package.
    syntax: az apr package upload -g myrg -r myregistry --repository myrepo         --file ./settings --type file
  requiredParameters:
  - isRequired: true
    name: --file
    summary: |-
      Path to the package file to upload.
  - isRequired: true
    name: --registry -r
    summary: |-
      Name of the parent APR registry.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --component
    summary: |-
      Release component for a deb package added to an apt repository.
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --relative-path
    summary: |-
      Path to store a file package at.
  - name: --release
    summary: |-
      Release name or ID for a deb package added to an apt repository.
  - name: --repository
    summary: |-
      Name or ID of the target repository. Omit to upload without adding it to a repository.
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - name: --type -t
    acceptedValues: deb, file, rpm
    summary: |-
      Package type. Omit for .deb and .rpm files. Use --type file for arbitrary files.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
