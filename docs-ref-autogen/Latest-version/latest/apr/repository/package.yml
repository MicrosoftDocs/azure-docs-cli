### YamlMime:AzureCLIGroup
uid: az_apr_repository_package
name: az apr repository package
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **apr** extension for the Azure CLI (version 2.55.0 or higher). The extension will automatically install the first time you run an **az apr repository package** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage the packages contained in a repository.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'apr repository' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_apr_repository_package_add
  name: az apr repository package add
  summary: |-
    Add packages to a repository.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'apr repository package' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az apr repository package add --name
                                  --packages
                                  --registry
                                  [--acquire-policy-token]
                                  [--change-reference]
                                  [--component]
                                  [--no-wait]
                                  [--releases]
                                  [--resource-group]
  examples:
  - summary: |-
      Add packages to a repository.
    syntax: az apr repository package add -g myrg -r myregistry -n myrepo --packages pkg1,pkg2
  - summary: |-
      Add packages to a specific release of an apt repository.
    syntax: az apr repository package add -g myrg -r myregistry -n myrepo         --packages pkg1 --releases jammy
  - summary: |-
      Add packages to multiple releases of an apt repository.
    syntax: az apr repository package add -g myrg -r myregistry -n myrepo         --packages pkg1 --releases jammy,focal
  - summary: |-
      Add packages to a specific component of an apt release.
    syntax: az apr repository package add -g myrg -r myregistry -n myrepo         --packages pkg1 --releases jammy --component contrib
  requiredParameters:
  - isRequired: true
    name: --name -n
    summary: |-
      Name or ID of the repository.
  - isRequired: true
    name: --packages
    summary: |-
      Comma-separated package ids.
  - isRequired: true
    name: --registry -r
    summary: |-
      Name of the parent APR registry.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --component
    summary: |-
      Component within --releases to target. Defaults to 'main' (apt only).
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --releases
    summary: |-
      Comma-separated apt release names or ids. Required for apt repositories.
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_apr_repository_package_remove
  name: az apr repository package remove
  summary: |-
    Remove packages from a repository.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'apr repository package' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az apr repository package remove --name
                                     --packages
                                     --registry
                                     [--acquire-policy-token]
                                     [--change-reference]
                                     [--component]
                                     [--no-wait]
                                     [--releases]
                                     [--resource-group]
                                     [--yes]
  examples:
  - summary: |-
      Remove packages from a repository.
    syntax: az apr repository package remove -g myrg -r myregistry -n myrepo --packages pkg1,pkg2
  - summary: |-
      Remove packages from a specific component of an apt release.
    syntax: az apr repository package remove -g myrg -r myregistry -n myrepo         --packages pkg1 --releases jammy --component contrib
  requiredParameters:
  - isRequired: true
    name: --name -n
    summary: |-
      Name or ID of the repository.
  - isRequired: true
    name: --packages
    summary: |-
      Comma-separated package ids.
  - isRequired: true
    name: --registry -r
    summary: |-
      Name of the parent APR registry.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --component
    summary: |-
      Component within --releases to target. Defaults to 'main' (apt only).
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --releases
    summary: |-
      Comma-separated apt release names or ids. Required for apt repositories.
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - name: --yes -y
    defaultValue: "False"
    summary: |-
      Do not prompt for confirmation.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_apr_repository_package_add
- az_apr_repository_package_remove
metadata:
  description: Manage the packages contained in a repository.
