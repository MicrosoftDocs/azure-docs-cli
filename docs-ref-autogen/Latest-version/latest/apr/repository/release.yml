- uid: az_apr_repository_release_list
  name: az apr repository release list
  summary: |-
    List releases.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'apr repository release' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az apr repository release list --registry
                                   --repository
                                   [--limit]
                                   [--name]
                                   [--resource-group]
  examples:
  - summary: |-
      List all releases in a repository.
    syntax: az apr repository release list -g myrg -r myregistry --repository myrepo
  requiredParameters:
  - isRequired: true
    name: --registry -r
    summary: |-
      Name of the parent APR registry.
  - isRequired: true
    name: --repository
    summary: |-
      Name or ID of the parent repository.
  optionalParameters:
  - name: --limit
    summary: |-
      Max number of releases to return. Omit to return all.
  - name: --name -n
    summary: |-
      Filter to releases with this name.
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
