### YamlMime:AzureCLIGroup
uid: az_apr_repository_release
name: az apr repository release
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **apr** extension for the Azure CLI (version 2.55.0 or higher). The extension will automatically install the first time you run an **az apr repository release** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage the apt releases (dists) of a repository.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'apr repository' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_apr_repository_release_create
  name: az apr repository release create
  summary: |-
    Create a release.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'apr repository release' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az apr repository release create --name
                                     --registry
                                     --repository
                                     [--acquire-policy-token]
                                     [--architectures]
                                     [--change-reference]
                                     [--codename]
                                     [--components]
                                     [--no-wait]
                                     [--resource-group]
                                     [--suite]
  examples:
  - summary: |-
      Create a release with default components and architectures.
    syntax: az apr repository release create -g myrg -r myregistry --repository myrepo         -n jammy
  - summary: |-
      Create a release with explicit components and architectures.
    syntax: az apr repository release create -g myrg -r myregistry --repository myrepo         -n jammy --suite stable --components main,contrib --architectures amd64,arm64
  requiredParameters:
  - isRequired: true
    name: --name -n
    summary: |-
      Name to distribute the release under (the apt distribution/dist name).
  - isRequired: true
    name: --registry -r
    summary: |-
      Name of the parent APR registry.
  - isRequired: true
    name: --repository
    summary: |-
      Name or ID of the parent repository.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --architectures
    summary: |-
      Comma-separated list of architectures. Defaults to 'amd64,arm64,armhf'.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --codename
    summary: |-
      Release codename. Defaults to the release name.
  - name: --components
    summary: |-
      Comma-separated list of components. Defaults to 'main'.
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - name: --suite
    summary: |-
      Release suite (e.g. stable). Defaults to the release name.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
