- uid: az_apr_repository_release_component_list
  name: az apr repository release component list
  summary: |-
    List the components of a release.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'apr repository release component' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az apr repository release component list --registry
                                             --release
                                             --repository
                                             [--limit]
                                             [--name]
                                             [--resource-group]
  examples:
  - summary: |-
      List the components of a release.
    syntax: az apr repository release component list -g myrg -r myregistry --repository myrepo         --release jammy
  requiredParameters:
  - isRequired: true
    name: --registry -r
    summary: |-
      Name of the parent APR registry.
  - isRequired: true
    name: --release
    summary: |-
      Name or ID of the release the component belongs to.
  - isRequired: true
    name: --repository
    summary: |-
      Name or ID of the parent repository.
  optionalParameters:
  - name: --limit
    summary: |-
      Max number of components to return. Omit to return all.
  - name: --name -n
    summary: |-
      Name of the release component (e.g. main, contrib).
  - name: --resource-group -g
