### YamlMime:AzureCLIGroup
uid: az_apr_repository_release_component
name: az apr repository release component
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **apr** extension for the Azure CLI (version 2.55.0 or higher). The extension will automatically install the first time you run an **az apr repository release component** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage the components of an apt release.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'apr repository release' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_apr_repository_release_component_create
  name: az apr repository release component create
  summary: |-
    Create a release component.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'apr repository release component' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az apr repository release component create --name
                                               --registry
                                               --release
                                               --repository
                                               [--acquire-policy-token]
                                               [--change-reference]
                                               [--no-wait]
                                               [--resource-group]
  examples:
  - summary: |-
      Add a component to an existing release.
    syntax: az apr repository release component create -g myrg -r myregistry --repository myrepo         --release jammy -n contrib
  requiredParameters:
  - isRequired: true
    name: --name -n
    summary: |-
      Name of the release component (e.g. main, contrib).
  - isRequired: true
    name: --registry -r
    summary: |-
      Name of the parent APR registry.
  - isRequired: true
    name: --release
    summary: |-
      Name or ID of the release the component belongs to.
  - isRequired: true
    name: --repository
    summary: |-
      Name or ID of the parent repository.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
