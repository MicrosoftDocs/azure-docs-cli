- uid: az_apr_repository_sync
  name: az apr repository sync
  summary: |-
    Sync packages from an upstream remote into this repository.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'apr repository' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az apr repository sync --name
                           --registry
                           [--acquire-policy-token]
                           [--change-reference]
                           [--confirm]
                           [--no-wait]
                           [--resource-group]
                           [--sync-mode {additive, mirror}]
                           [--yes]
  examples:
  - summary: |-
      Sync a repository from its bound remote.
    syntax: az apr repository sync -g myrg -r myregistry -n myrepo
  - summary: |-
      Add upstream content without removing existing packages.
    syntax: az apr repository sync -g myrg -r myregistry -n myrepo --sync-mode additive
  - summary: |-
      Make the repository match the remote, removing anything not upstream.
    syntax: az apr repository sync -g myrg -r myregistry -n myrepo --sync-mode mirror
  requiredParameters:
  - isRequired: true
    name: --name -n
    summary: |-
      Name or ID of the repository.
  - isRequired: true
    name: --registry -r
    summary: |-
      Name of the parent APR registry.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --confirm
    defaultValue: "False"
    summary: |-
      Confirm a destructive mirror sync without prompting.
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - name: --sync-mode
    acceptedValues: additive, mirror
    summary: |-
      How upstream content is applied to the repository. additive (the default) only adds; mirror also removes anything not upstream.
  - name: --yes -y
    defaultValue: "False"
    summary: |-
      Do not prompt for confirmation.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_apr_repository_update
  name: az apr repository update
  summary: |-
    Update repository configuration.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'apr repository' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az apr repository update --name
                             --registry
                             [--acquire-policy-token]
                             [--change-reference]
                             [--no-wait]
                             [--remote]
                             [--resource-group]
                             [--retain-all]
                             [--retain-versions]
  examples:
  - summary: |-
      Bind a repository to a remote it syncs from.
    syntax: az apr repository update -g myrg -r myregistry -n myrepo --remote myremote
  - summary: |-
      Unset the remote.
    syntax: az apr repository update -g myrg -r myregistry -n myrepo --remote ""
  - summary: |-
      Change how many versions the repository keeps.
    syntax: az apr repository update -g myrg -r myregistry -n myrepo --retain-versions 3
  - summary: |-
      Keep every version.
    syntax: az apr repository update -g myrg -r myregistry -n myrepo --retain-all
  requiredParameters:
  - isRequired: true
    name: --name -n
    summary: |-
      Name or ID of the repository.
  - isRequired: true
    name: --registry -r
    summary: |-
      Name of the parent APR registry.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --remote
    summary: |-
      Name or ID of the remote this repository syncs from. Empty string unsets it.
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - name: --retain-all
    defaultValue: "False"
    summary: |-
      Keep every repository version. Mutually exclusive with --retain-versions.
  - name: --retain-versions
    summary: |-
      Number of repository versions to keep; older ones are pruned. Omit to leave unchanged.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
