### YamlMime:AzureCLIGroup
uid: az_apr_repository
name: az apr repository
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **apr** extension for the Azure CLI (version 2.55.0 or higher). The extension will automatically install the first time you run an **az apr repository** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage repositories within an APR registry.
status: Preview
isPreview: true
previewOrExperimentalInfo: 'This command group is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus'
sourceType: Extension
directCommands:
- uid: az_apr_repository_create
  name: az apr repository create
  summary: |-
    Create a new repository (apt, yum, or file) within a registry.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'apr repository' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az apr repository create --name
                             --registry
                             --type {apt, file, yum}
                             [--acquire-policy-token]
                             [--change-reference]
                             [--resource-group]
                             [--retain-all]
                             [--retain-versions]
  examples:
  - summary: |-
      Create an apt repository.
    syntax: az apr repository create -g myrg -r myregistry -n myrepo --type apt
  - summary: |-
      Create a repository that keeps the last 10 versions.
    syntax: az apr repository create -g myrg -r myregistry -n myrepo --type apt --retain-versions 10
  - summary: |-
      Create a repository that keeps every version.
    syntax: az apr repository create -g myrg -r myregistry -n myrepo --type apt --retain-all
  requiredParameters:
  - isRequired: true
    name: --name -n
    summary: |-
      Name or ID of the repository.
  - isRequired: true
    name: --registry -r
    summary: |-
      Name of the parent APR registry.
  - isRequired: true
    name: --type
    acceptedValues: apt, file, yum
    summary: |-
      Repository type.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - name: --retain-all
    defaultValue: "False"
    summary: |-
      Keep every repository version. Mutually exclusive with --retain-versions.
  - name: --retain-versions
    summary: |-
      Number of repository versions to keep; older ones are pruned. Defaults to 5.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
