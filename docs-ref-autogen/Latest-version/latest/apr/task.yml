- uid: az_apr_task_wait
  name: az apr task wait
  summary: |-
    Wait for a set of tasks to finish.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'apr task' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az apr task wait --ids
                     --registry
                     [--acquire-policy-token]
                     [--change-reference]
                     [--resource-group]
  examples:
  - summary: |-
      Wait for several tasks to finish.
    syntax: az apr task wait -g myrg -r myregistry --ids task1,task2
  requiredParameters:
  - isRequired: true
    name: --ids
    summary: |-
      Comma-separated list of task ids to wait on.
  - isRequired: true
    name: --registry -r
    summary: |-
      Name of the parent APR registry.
  optionalParameters:
