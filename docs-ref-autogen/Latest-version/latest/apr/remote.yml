### YamlMime:AzureCLIGroup
uid: az_apr_remote
name: az apr remote
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **apr** extension for the Azure CLI (version 2.55.0 or higher). The extension will automatically install the first time you run an **az apr remote** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage upstream remotes that repositories sync from.
status: Preview
isPreview: true
previewOrExperimentalInfo: 'This command group is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus'
sourceType: Extension
directCommands:
- uid: az_apr_remote_create
  name: az apr remote create
  summary: |-
    Create a remote.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'apr remote' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az apr remote create --name
                         --registry
                         --type {apt, yum}
                         --url
                         [--acquire-policy-token]
                         [--architectures]
                         [--change-reference]
                         [--components]
                         [--no-wait]
                         [--policy {immediate, on-demand, streamed}]
                         [--releases]
                         [--resource-group]
  examples:
  - summary: |-
      Create an apt remote syncing selected distributions and components.
    syntax: az apr remote create -g myrg -r myregistry -n myremote --type apt         --url http://archive.ubuntu.com/ubuntu         --releases jammy,focal --components main,universe
  - summary: |-
      Create a yum remote.
    syntax: az apr remote create -g myrg -r myregistry -n myremote --type yum         --url https://packages.microsoft.com/rhel/9/prod --policy on-demand
  requiredParameters:
  - isRequired: true
    name: --name -n
    summary: |-
      Name or ID of the remote.
  - isRequired: true
    name: --registry -r
    summary: |-
      Name of the parent APR registry.
  - isRequired: true
    name: --type
    acceptedValues: apt, yum
    summary: |-
      Remote type.
  - isRequired: true
    name: --url
    summary: |-
      Upstream URL to sync from.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --architectures
    summary: |-
      Comma-separated architectures to sync (apt remotes only).
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --components
    summary: |-
      Comma-separated components to sync (apt remotes only).
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --policy
    acceptedValues: immediate, on-demand, streamed
    summary: |-
      How packages are fetched from upstream. immediate downloads packages during sync; on-demand downloads and stores each package when first requested; streamed fetches each package on every request without storing it.
  - name: --releases
    summary: |-
      Comma-separated upstream releases to sync (apt remotes only).
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
