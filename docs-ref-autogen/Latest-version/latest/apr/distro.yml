    List distributions.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'apr distro' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az apr distro list --registry
                       [--limit]
                       [--repository]
                       [--resource-group]
  examples:
  - summary: |-
      List all distributions in a registry.
    syntax: az apr distro list -g myrg -r myregistry
  - summary: |-
      List distributions serving a given repository.
    syntax: az apr distro list -g myrg -r myregistry --repository myrepo
  requiredParameters:
  - isRequired: true
    name: --registry -r
    summary: |-
      Name of the parent APR registry.
  optionalParameters:
  - name: --limit
    summary: |-
      Max number of distributions to return. Omit to return all.
  - name: --repository
    summary: |-
      Name or ID of a repository to filter distributions by.
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  globalParameters:
