### YamlMime:AzureCLIGroup
uid: az_apr_distro
name: az apr distro
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **apr** extension for the Azure CLI (version 2.55.0 or higher). The extension will automatically install the first time you run an **az apr distro** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage distributions that serve a repository's content.
status: Preview
isPreview: true
previewOrExperimentalInfo: 'This command group is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus'
sourceType: Extension
directCommands:
- uid: az_apr_distro_create
  name: az apr distro create
  summary: |-
    Create a distribution.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'apr distro' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az apr distro create --base-path
                         --name
                         --registry
                         --type {apt, file, yum}
                         [--acquire-policy-token]
                         [--change-reference]
                         [--hidden {false, true}]
                         [--no-wait]
                         [--publication]
                         [--repository]
                         [--resource-group]
  examples:
  - summary: |-
      Create an apt distribution serving a repository.
    syntax: az apr distro create -g myrg -r myregistry -n mydistro         --type apt --base-path dists/stable --repository myrepo
  requiredParameters:
  - isRequired: true
    name: --base-path
    summary: |-
      Base path the distribution is served at.
  - isRequired: true
    name: --name -n
    summary: |-
      Name or ID of the distribution.
  - isRequired: true
    name: --registry -r
    summary: |-
      Name of the parent APR registry.
  - isRequired: true
    name: --type
    acceptedValues: apt, file, yum
    summary: |-
      Distribution type.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --hidden
    acceptedValues: false, true
    summary: |-
      Mark the distribution as hidden.
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --publication
    summary: |-
      ID of a specific publication to serve as a fixed snapshot. Cannot be used with --repository.
  - name: --repository
    summary: |-
      Name or ID of the repository to serve. The distribution follows the repository's latest publication automatically. Cannot be used with --publication.
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
