### YamlMime:AzureCLIGroup
uid: az_monitor_account_trace-container
name: az monitor account trace-container
summary: |-
  Manage the trace container of an Azure Monitor workspace.
status: Preview
isPreview: true
previewOrExperimentalInfo: 'This command group is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus'
sourceType: Core
directCommands:
- uid: az_monitor_account_trace-container_create
  name: az monitor account trace-container create
  summary: |-
    Create the trace container of an Azure Monitor workspace.
  description: |-
    A workspace has one trace container, named default. On an existing container, omitted settings keep their current values. A new container defaults to 30 days retention, a 600-second duration window and Enabled trace metrics.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'az monitor account trace-container' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/monitor/_help.py
  syntax: >-
    az monitor account trace-container create --azure-monitor-workspace-name
                                              --resource-group
                                              [--acquire-policy-token]
                                              [--change-reference]
                                              [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                              [--retention-days]
                                              [--trace-duration-window]
                                              [--trace-metrics {Disabled, Enabled}]
  examples:
  - summary: |-
      Create the trace container of an Azure Monitor workspace
    syntax: az monitor account trace-container create -g obsRg -w myAmw --retention-days 30 --trace-duration-window 600 --trace-metrics Enabled
  requiredParameters:
  - isRequired: true
    name: --azure-monitor-workspace-name -w
    summary: |-
      The name of the Azure Monitor Workspace. The name is case insensitive.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --retention-days
    summary: |-
      The number of days for which the traces are retained. Value must be between 4 and 730 days.
    groupName: Properties Arguments
  - name: --trace-duration-window
    summary: |-
      The trace duration window in seconds.
    groupName: Properties Arguments
  - name: --trace-metrics
    acceptedValues: Disabled, Enabled
    summary: |-
      Controls trace-derived metrics. New containers default to Enabled.
    groupName: Properties Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
