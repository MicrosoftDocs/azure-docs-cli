### YamlMime:AzureCLIGroup
uid: az_monitor_trace-association
name: az monitor trace-association
summary: |-
  Route distributed traces to an Azure Monitor workspace.
description: |-
  A trace association sends the traces of an Application Insights component, or of every component in a resource group or subscription, to an Azure Monitor workspace. Associations are additive: a component sends traces to the workspaces associated with it, its resource group and its subscription.
status: Preview
isPreview: true
previewOrExperimentalInfo: 'This command group is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus'
sourceType: Core
directCommands:
- uid: az_monitor_trace-association_create
  name: az monitor trace-association create
  summary: |-
    Route the traces of a scope to an Azure Monitor workspace.
  description: |-
    Creates the association of the scope, or replaces its workspace. Associations of other scopes are unchanged. If the workspace has no trace container, one is created first. Replacing the workspace of a resource group or subscription asks for confirmation. You need write access on both the scope and the workspace.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'monitor trace-association' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/monitor/_help.py
  syntax: >-
    az monitor trace-association create --azure-monitor-workspace
                                        --resource-uri
                                        [--acquire-policy-token]
                                        [--change-reference]
                                        [--trace-metrics {Disabled, Enabled}]
                                        [--trace-retention-days]
                                        [--yes]
  examples:
  - summary: |-
      Route the traces of an Application Insights component to an Azure Monitor workspace.
    syntax: az monitor trace-association create --resource-uri /subscriptions/{subscriptionID}/resourceGroups/MyResourceGroup/providers/Microsoft.Insights/components/MyAppInsights --azure-monitor-workspace /subscriptions/{subscriptionID}/resourceGroups/MyResourceGroup/providers/Microsoft.Monitor/accounts/MyWorkspace
  - summary: |-
      Route the traces of every Application Insights component in a resource group, creating the trace container with 90 days retention if the workspace has none.
    syntax: az monitor trace-association create --resource-uri /subscriptions/{subscriptionID}/resourceGroups/MyResourceGroup --azure-monitor-workspace /subscriptions/{subscriptionID}/resourceGroups/MyResourceGroup/providers/Microsoft.Monitor/accounts/MyWorkspace --trace-retention-days 90
  requiredParameters:
  - isRequired: true
    name: --azure-monitor-workspace -w
    summary: |-
      Resource ID of the Azure Monitor workspace that receives the traces.
  - isRequired: true
    name: --resource-uri
    summary: |-
      Resource ID of an Application Insights component, a resource group or a subscription.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --trace-metrics
    acceptedValues: Disabled, Enabled
    summary: |-
      Trace-derived metrics if the workspace has no trace container yet. Default: Enabled.
  - name: --trace-retention-days
    summary: |-
      Days to keep traces, from 4 to 730, if the workspace has no trace container yet. Default: 30.
  - name: --yes -y
    defaultValue: "False"
    summary: |-
      Do not prompt for confirmation.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_monitor_trace-association_delete
  name: az monitor trace-association delete
  summary: |-
    Delete the association of a scope.
  description: |-
    Associations of other scopes, the Azure Monitor workspace and its trace container are unchanged. Deleting the association of a resource group or subscription asks for confirmation.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'monitor trace-association' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/monitor/_help.py
  syntax: >-
    az monitor trace-association delete --resource-uri
                                        [--acquire-policy-token]
                                        [--change-reference]
                                        [--yes]
  examples:
  - summary: |-
      Delete the association of a subscription without a confirmation prompt.
    syntax: az monitor trace-association delete --resource-uri /subscriptions/{subscriptionID} --yes
  requiredParameters:
  - isRequired: true
    name: --resource-uri
    summary: |-
      Resource ID of an Application Insights component, a resource group or a subscription.
  optionalParameters:
