### YamlMime:AzureCLIGroup
uid: az_new-relic
name: az new-relic
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **new-relic** extension for the Azure CLI (version 2.61.0 or higher). The extension will automatically install the first time you run an **az new-relic** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Azure New Relic resources.
status: GA
sourceType: Extension
directCommands:
- uid: az_new-relic_activate-saas
  name: az new-relic activate-saas
  summary: |-
    Resolve the token to get the SaaS resource ID and activate the SaaS resource.
  status: GA
  sourceType: Extension
  syntax: >-
    az new-relic activate-saas --publisher-id
                               --saas-guid
                               [--acquire-policy-token]
                               [--change-reference]
  examples:
  - summary: |-
      Activate a New Relic SaaS resource
    syntax: az new-relic activate-saas --publisher-id newrelicinc1635200720692 --saas-guid 00000000-0000-0000-0000-000005430000
  requiredParameters:
  - isRequired: true
    name: --publisher-id
    summary: |-
      Publisher Id for NewRelic resource.
    groupName: Request Arguments
  - isRequired: true
    name: --saas-guid
    summary: |-
      SaaS guid for Activate and Validate SaaS Resource.
    groupName: Request Arguments
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
