### YamlMime:AzureCLIGroup
uid: az_aro_hcp
name: az aro hcp
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **aro** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az aro hcp** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Azure Red Hat OpenShift with hosted control plane resource types.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'aro' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_aro_hcp_get-versions
  name: az aro hcp get-versions
  summary: |-
    List Azure Red Hat OpenShift with hosted control plane versions.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'aro' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az aro hcp get-versions --location
                            [--acquire-policy-token]
                            [--change-reference]
                            [--control-plane {0, 1, f, false, n, no, t, true, y, yes}]
                            [--max-items]
                            [--next-token]
                            [--node-pools {0, 1, f, false, n, no, t, true, y, yes}]
  examples:
  - summary: |-
      List available OpenShift versions in a location
    syntax: az aro hcp get-versions --location eastus
  requiredParameters:
  - isRequired: true
    name: --location -l
    summary: |-
      Location. Values from: `az account list-locations`. You can configure the default location using `az configure --defaults location=<location>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --control-plane
    defaultValue: "False"
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      List the distinct Major.Minor (X.Y) versions available for the control plane. Use one of these with 'cluster create --version', which takes an X.Y version.
  - name: --max-items
    summary: |-
      Total number of items to return in the command's output. If the total number of items available is more than the value specified, a token is provided in the command's output. To resume pagination, provide the token value in `--next-token` argument of a subsequent command.
    groupName: Pagination Arguments
  - name: --next-token
    summary: |-
      Token to specify where to start paginating. This is the token value from a previously truncated response.
    groupName: Pagination Arguments
  - name: --node-pools
    defaultValue: "False"
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      List all available full X.Y.Z versions for node pools. Use one of these with 'nodepool create --version', which requires a full X.Y.Z version.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
