### YamlMime:AzureCLIGroup
uid: az_aro_identity
name: az aro identity
summary: |-
  Manage identities related to Azure Red Hat OpenShift clusters.
status: GA
sourceType: Core
directCommands:
- uid: az_aro_identity_create-required
  name: az aro identity create-required
  summary: |-
    Create required identities.
  description: |-
    Create required identities to prepare for creating a cluster with managed identities.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/aro/_help.py
  syntax: >-
    az aro identity create-required --location
                                    --master-subnet
                                    --resource-group
                                    --version
                                    --worker-subnet
                                    [--acquire-policy-token]
                                    [--change-reference]
                                    [--disk-encryption-set]
                                    [--vnet]
                                    [--vnet-resource-group]
                                    [--yes]
  requiredParameters:
  - isRequired: true
    name: --location -l
    summary: |-
      Location. Values from: `az account list-locations`. You can configure the default location using `az configure --defaults location=<location>`.
  - isRequired: true
    name: --master-subnet
    summary: |-
      Name or ID of master vnet subnet.  If name is supplied, `--vnet` must be supplied.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --version
    summary: |-
      OpenShift version to use for cluster creation.
  - isRequired: true
    name: --worker-subnet
    summary: |-
      Name or ID of worker vnet subnet.  If name is supplied, `--vnet` must be supplied.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --disk-encryption-set
    summary: |-
      ResourceID of the DiskEncryptionSet to be used for master and worker VMs.
  - name: --vnet
    summary: |-
      Name or ID of vnet.  If name is supplied, `--vnet-resource-group` must be supplied.
  - name: --vnet-resource-group
    summary: |-
      Name of vnet resource group.
  - name: --yes -y
    defaultValue: "False"
    summary: |-
      Do not prompt for confirmation.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
