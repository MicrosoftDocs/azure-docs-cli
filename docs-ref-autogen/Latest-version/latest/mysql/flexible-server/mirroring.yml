### YamlMime:AzureCLIGroup
uid: az_mysql_flexible-server_mirroring
name: az mysql flexible-server mirroring
summary: |-
  Manage Microsoft Fabric Mirroring for Azure Database for MySQL Flexible Server.
description: |-
  Fabric Mirroring allows continuous data replication from MySQL Flexible Server into Microsoft Fabric for analytics and reporting.
status: GA
sourceType: Core
directCommands:
- uid: az_mysql_flexible-server_mirroring_disable
  name: az mysql flexible-server mirroring disable
  summary: |-
    Disable Fabric Mirroring for a MySQL Flexible Server.
  description: |-
    Removes Fabric Mirroring configuration from the server.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/mysql/_help.py
  syntax: >-
    az mysql flexible-server mirroring disable --name
                                               --resource-group
                                               [--acquire-policy-token]
                                               [--change-reference]
  examples:
  - summary: |-
      Disable Fabric Mirroring for server 'testsvr'.
    syntax: az mysql flexible-server mirroring disable -g testgroup -n testsvr
  requiredParameters:
  - isRequired: true
    name: --name -n
    summary: |-
      Name of the server. The name can contain only lowercase letters, numbers, and the hyphen (-) character. Minimum 3 characters and maximum 63 characters.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_mysql_flexible-server_mirroring_enable
  name: az mysql flexible-server mirroring enable
  summary: |-
    Enable Fabric Mirroring for a MySQL Flexible Server.
  description: |-
    Configures the server for Fabric Mirroring.
    Requires a User Assigned Managed Identity (UAMI) resource ID with appropriate permissions.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azure-cli/blob/dev/src/azure-cli/azure/cli/command_modules/mysql/_help.py
  syntax: >-
    az mysql flexible-server mirroring enable --identity-resource-id
                                              --name
                                              --resource-group
                                              [--acquire-policy-token]
                                              [--change-reference]
  examples:
  - summary: |-
      Enable Fabric Mirroring for server 'testsvr' using a User Assigned Managed Identity.
    syntax: az mysql flexible-server mirroring enable -g testgroup -n testsvr         --identity-resource-id /subscriptions/<sub>/resourceGroups/<rg>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/<name>
  requiredParameters:
  - isRequired: true
    name: --identity-resource-id
    summary: |-
      Resource ID of the User Assigned Managed Identity (UAMI) used for Fabric Mirroring. Example: /subscriptions/{sub-id}/resourceGroups/{rg}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/{identity-name}.
  - isRequired: true
    name: --name -n
    summary: |-
      Name of the server. The name can contain only lowercase letters, numbers, and the hyphen (-) character. Minimum 3 characters and maximum 63 characters.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_mysql_flexible-server_mirroring_disable
- az_mysql_flexible-server_mirroring_enable
metadata:
  ms.date: 08/04/2026
  description: Fabric Mirroring allows continuous data replication from MySQL Flexible Server into Microsoft Fabric for analytics and reporting.
