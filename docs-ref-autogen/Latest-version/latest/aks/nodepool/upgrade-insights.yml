### YamlMime:AzureCLIGroup
uid: az_aks_nodepool_upgrade-insights
name: az aks nodepool upgrade-insights
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **aks-preview** extension for the Azure CLI (version 2.85.0 or higher). The extension will automatically install the first time you run an **az aks nodepool upgrade-insights** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Evaluate Kubernetes or node-image upgrade readiness for one node pool.
description: |-
  These commands do not upgrade the pool. Issues are nested under the selected agent pool in the default readiness report. Use --output json for complete structured results. List all pool insights with az aks upgrade-insights list.
status: Preview
isPreview: true
previewOrExperimentalInfo: 'This command group is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus'
sourceType: Extension
directCommands:
- uid: az_aks_nodepool_upgrade-insights_create
  name: az aks nodepool upgrade-insights create
  summary: |-
    Generate or refresh an upgrade readiness evaluation for one node pool.
  description: |-
    This command does not upgrade the pool. Displays a readiness report with issues nested under the selected pool by default. Use --output json for complete structured results.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'aks nodepool upgrade-insights' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az aks nodepool upgrade-insights create --cluster-name
                                            --name
                                            --resource-group
                                            [--acquire-policy-token]
                                            [--change-reference]
                                            [--target-kubernetes-ver]
                                            [--target-node-image-ver]
                                            [--upgrade-type {AgentPool, NodeImage}]
  examples:
  - summary: |-
      Evaluate a Kubernetes version upgrade (the default upgrade type is AgentPool).
    syntax: az aks nodepool upgrade-insights create -g MyResourceGroup --cluster-name MyCluster --name nodepool1 --target-kubernetes-ver 1.35.1
  - summary: |-
      Evaluate the latest available node image.
    syntax: az aks nodepool upgrade-insights create -g MyResourceGroup --cluster-name MyCluster --name nodepool1 --upgrade-type NodeImage
  - summary: |-
      Evaluate a specific node image.
    syntax: az aks nodepool upgrade-insights create -g MyResourceGroup --cluster-name MyCluster --name nodepool1 --upgrade-type NodeImage --target-node-image-ver NODE_IMAGE_VERSION
  requiredParameters:
  - isRequired: true
    name: --cluster-name
    summary: |-
      The managed cluster name.
  - isRequired: true
    name: --name -n
    summary: |-
      The node pool name.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --target-kubernetes-ver
    summary: |-
      The target Kubernetes version. Required for AgentPool.
  - name: --target-node-image-ver
    summary: |-
      The target node image version. Only valid for NodeImage; omitted means the latest available image.
  - name: --upgrade-type
    defaultValue: AgentPool
    acceptedValues: AgentPool, NodeImage
    summary: |-
      The upgrade scope to evaluate. Defaults to an agent pool Kubernetes version upgrade.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_aks_nodepool_upgrade-insights_show
  name: az aks nodepool upgrade-insights show
  summary: |-
    Read a stored AgentPool or NodeImage insight for the specified node pool.
  description: |-
    The insight must belong to the selected pool. To read a combined control-plane and agent-pools insight, use az aks upgrade-insights show. Displays a pool-nested readiness report by default; use --output json for complete structured results.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'aks nodepool upgrade-insights' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az aks nodepool upgrade-insights show --cluster-name
                                          --insight-name
                                          --name
                                          --resource-group
  examples:
  - summary: |-
      Read a stored node pool insight without regenerating it.
    syntax: az aks nodepool upgrade-insights show -g MyResourceGroup --cluster-name MyCluster --name nodepool1 --insight-name INSIGHT_NAME
  requiredParameters:
  - isRequired: true
    name: --cluster-name
    summary: |-
      The managed cluster name.
  - isRequired: true
    name: --insight-name
    summary: |-
      The stored insight name returned by create or list.
  - isRequired: true
    name: --name -n
    summary: |-
      The node pool name.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_aks_nodepool_upgrade-insights_create
- az_aks_nodepool_upgrade-insights_show
metadata:
  description: These commands do not upgrade the pool. Issues are nested under the selected agent pool in the default readiness report. Use --output json for complete structured results. List all pool insights with az aks upgrade-insights list.
