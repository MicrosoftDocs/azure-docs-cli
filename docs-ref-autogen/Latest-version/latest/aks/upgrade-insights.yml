### YamlMime:AzureCLIGroup
uid: az_aks_upgrade-insights
name: az aks upgrade-insights
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **aks-preview** extension for the Azure CLI (version 2.85.0 or higher). The extension will automatically install the first time you run an **az aks upgrade-insights** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Evaluate upgrade readiness and read stored insights for an AKS cluster.
description: |-
  These commands do not upgrade the cluster. By default, results are displayed as a human-readable report with issues nested under their control-plane or agent-pool scope. Use --output json for complete structured results. Explicit output settings and --query retain standard Azure CLI output behavior.
status: Preview
isPreview: true
previewOrExperimentalInfo: 'This command group is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus'
sourceType: Extension
directCommands:
- uid: az_aks_upgrade-insights_create
  name: az aks upgrade-insights create
  summary: |-
    Generate or refresh a stored upgrade readiness evaluation.
  description: |-
    This command does not upgrade the cluster. Displays a scope-nested readiness report by default. Use --output json for complete structured results; explicit output settings, core.output configuration, and --query retain standard Azure CLI formatting.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'aks upgrade-insights' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az aks upgrade-insights create --name
                                   --resource-group
                                   --target-kubernetes-ver
                                   [--acquire-policy-token]
                                   [--change-reference]
                                   [--upgrade-type {ControlPlane, ControlPlaneAndAgentPools}]
  examples:
  - summary: |-
      Evaluate the control plane and all agent pools (the default upgrade type).
    syntax: az aks upgrade-insights create -g MyResourceGroup --name MyCluster --target-kubernetes-ver 1.35.1
  - summary: |-
      Evaluate only the control plane.
    syntax: az aks upgrade-insights create -g MyResourceGroup --name MyCluster --upgrade-type ControlPlane --target-kubernetes-ver 1.35.1
  requiredParameters:
  - isRequired: true
    name: --name -n
    summary: |-
      The managed cluster name.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --target-kubernetes-ver
    summary: |-
      The target Kubernetes version to evaluate. This command does not upgrade the cluster.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --upgrade-type
    defaultValue: ControlPlaneAndAgentPools
    acceptedValues: ControlPlane, ControlPlaneAndAgentPools
    summary: |-
      The upgrade scope to evaluate. Defaults to the control plane and all agent pools.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_aks_upgrade-insights_list
  name: az aks upgrade-insights list
  summary: |-
    List all stored upgrade insights for a cluster, including agent-pool and node-image insights.
  description: |-
    Displays insight names and issue summaries nested under each evaluated scope by default. Use --output json for complete structured results. This does not regenerate evaluations.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'aks upgrade-insights' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az aks upgrade-insights list --name
                                 --resource-group
  examples:
  - summary: |-
      List insights with issue summaries nested under each evaluated scope.
    syntax: az aks upgrade-insights list -g MyResourceGroup --name MyCluster
  - summary: |-
      List complete structured insights.
    syntax: az aks upgrade-insights list -g MyResourceGroup --name MyCluster --output json
  requiredParameters:
  - isRequired: true
    name: --name -n
    summary: |-
      The managed cluster name.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_aks_upgrade-insights_show
  name: az aks upgrade-insights show
  summary: |-
    Read a stored upgrade insight without regenerating its evaluation.
  description: |-
    Displays issue messages, affected resources, and recommended actions under their evaluated scope by default. Use --output json for complete structured results.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'aks upgrade-insights' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az aks upgrade-insights show --insight-name
                                 --name
                                 --resource-group
  examples:
  - summary: |-
      Read an insight using its server-generated name.
    syntax: az aks upgrade-insights show -g MyResourceGroup --name MyCluster --insight-name INSIGHT_NAME
  requiredParameters:
  - isRequired: true
    name: --insight-name
    summary: |-
      The stored insight name returned by create or list.
  - isRequired: true
    name: --name -n
    summary: |-
      The managed cluster name.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_aks_upgrade-insights_create
- az_aks_upgrade-insights_list
- az_aks_upgrade-insights_show
metadata:
  description: These commands do not upgrade the cluster. By default, results are displayed as a human-readable report with issues nested under their control-plane or agent-pool scope. Use --output json for complete structured results. Explicit output settings and --query retain standard Azure CLI output behavior.
