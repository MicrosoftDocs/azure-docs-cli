### YamlMime:AzureCLIGroup
uid: az_aks_bastion
name: az aks bastion
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **aks-preview** extension for the Azure CLI (version 2.85.0 or higher). The extension will automatically install the first time you run an **az aks bastion** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Commands to manage or connect to Azure Bastion for a managed Kubernetes cluster.
status: GA
sourceType: Extension
directCommands:
- uid: az_aks_bastion_disable
  name: az aks bastion disable
  summary: |-
    Disable managed Azure Bastion host for a managed Kubernetes cluster.
  status: GA
  sourceType: Extension
  syntax: >-
    az aks bastion disable --name
                           --resource-group
                           [--acquire-policy-token]
                           [--aks-custom-headers]
                           [--change-reference]
                           [--no-wait]
  examples:
  - summary: |-
      Disable managed Azure Bastion host for a managed Kubernetes cluster.
    syntax: az aks bastion disable --name MyManagedCluster --resource-group MyResourceGroup
  requiredParameters:
  - isRequired: true
    name: --name -n
    summary: |-
      Name of the managed cluster.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --aks-custom-headers
    summary: |-
      Send custom headers. When specified, format should be Key1=Value1,Key2=Value2.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_aks_bastion_enable
  name: az aks bastion enable
  summary: |-
    Enable managed Azure Bastion host for a managed Kubernetes cluster.
  status: GA
  sourceType: Extension
  syntax: >-
    az aks bastion enable --name
                          --resource-group
                          [--acquire-policy-token]
                          [--aks-custom-headers]
                          [--bastion-public-ip]
                          [--bastion-scale-units]
                          [--bastion-sku {Premium, Standard}]
                          [--change-reference]
                          [--no-wait]
  examples:
  - summary: |-
      Enable managed Azure Bastion host for a managed Kubernetes cluster with default settings.
    syntax: az aks bastion enable --name MyManagedCluster --resource-group MyResourceGroup
  - summary: |-
      Enable managed Azure Bastion host with premium sku and custom scale units.
    syntax: az aks bastion enable --name MyManagedCluster --resource-group MyResourceGroup --bastion-sku premium --bastion-scale-units 7
  - summary: |-
      Enable managed Azure Bastion host with BYO public IP address.
    syntax: az aks bastion enable --name MyManagedCluster --resource-group MyResourceGroup --bastion-public-ip /subscriptions/{subscription-id}/resourceGroups/MyResourceGroup/providers/Microsoft.Network/publicIPAddresses/MyPublicIP
  requiredParameters:
  - isRequired: true
    name: --name -n
    summary: |-
      Name of the managed cluster.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --aks-custom-headers
    summary: |-
      Send custom headers. When specified, format should be Key1=Value1,Key2=Value2.
  - name: --bastion-public-ip
    summary: |-
      The resource ID of an existing public IP address to be assigned to the managed Azure Bastion host.
    description: |-
      When not specified, a new public IP address will be created and assigned to the managed Azure Bastion host.
  - name: --bastion-scale-units
    summary: |-
      The number of scale units for the managed Azure Bastion host.
  - name: --bastion-sku -s
    acceptedValues: Premium, Standard
    summary: |-
      Specify the SKU of the managed Azure Bastion host.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_aks_bastion_tunnel
  name: az aks bastion tunnel
  summary: |-
    Connect to a managed Kubernetes cluster using Azure Bastion.
  description: |-
    The command will launch a subshell with the kubeconfig set to connect to the cluster via Bastion. Use exit or Ctrl-D (i.e. EOF) to exit the subshell.
  status: GA
  sourceType: Extension
  syntax: >-
    az aks bastion tunnel --name
                          --resource-group
                          [--acquire-policy-token]
                          [--admin]
                          [--bastion]
                          [--change-reference]
                          [--kubeconfig-path]
                          [--port]
                          [--yes]
  examples:
  - summary: |-
      Connect to a managed Kubernetes cluster using Azure Bastion with custom port and admin credentials.
    syntax: az aks bastion tunnel -g MyResourceGroup --name MyManagedCluster --bastion MyBastionResource --port 50001 --admin
  - summary: |-
      Connect using an existing kubeconfig file.
    syntax: az aks bastion tunnel -g MyResourceGroup --name MyManagedCluster --kubeconfig-path ~/.kube/config
  requiredParameters:
  - isRequired: true
    name: --name -n
    summary: |-
      Name of the managed cluster.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --admin
    defaultValue: "False"
    summary: |-
      Use the cluster admin credentials to connect to the bastion.
  - name: --bastion
    summary: |-
      The name or resource ID of a pre-deployed Bastion resource configured to connect to the current AKS cluster.
    description: |-
      If not specified, the command will try to identify an existing Bastion resource within the cluster's node resource group.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --kubeconfig-path
    summary: |-
      Path to an existing kubeconfig file to use.
    description: |-
      If specified, uses this kubeconfig file at its original location instead of fetching credentials from Azure.
  - name: --port
    summary: |-
      The local port number used for the bastion connection.
    description: |-
      If not provided, a random port will be used.
  - name: --yes -y
    defaultValue: "False"
    summary: |-
      Do not prompt for confirmation.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
