### YamlMime:AzureCLIGroup
uid: az_aks_identity-binding
name: az aks identity-binding
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **aks-preview** extension for the Azure CLI (version 2.85.0 or higher). The extension will automatically install the first time you run an **az aks identity-binding** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Commands to manage identity bindings in Azure Kubernetes Service.
status: GA
sourceType: Extension
directCommands:
- uid: az_aks_identity-binding_create
  name: az aks identity-binding create
  summary: |-
    Create a new identity binding in a managed Kubernetes cluster.
  status: GA
  sourceType: Extension
  syntax: >-
    az aks identity-binding create --cluster-name
                                   --managed-identity-resource-id
                                   --name
                                   --resource-group
                                   [--acquire-policy-token]
                                   [--allowed-subjects-from-file]
                                   [--change-reference]
  examples:
  - summary: |-
      Create an identity binding with allowed subjects targeting specific namespaces by name.
    syntax: >-
      az aks identity-binding create --resource-group myRG --cluster-name myCluster \
        --name my-identity-binding \
        --managed-identity-resource-id /subscriptions/.../userAssignedIdentities/myMI \
        --allowed-subjects-from-file allowed-subjects.json
  requiredParameters:
  - isRequired: true
    name: --cluster-name
    summary: |-
      Name of the managed Kubernetes cluster.
  - isRequired: true
    name: --managed-identity-resource-id
    summary: |-
      The resource ID of the managed identity to use.
  - isRequired: true
    name: --name -n
    summary: |-
      Name of the identity binding to create.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --allowed-subjects-from-file -f
    summary: |-
      Path to a JSON file with the list of subjects authorized to use this identity binding for token exchange.
    description: |-
      The file must contain a JSON array (max 100 entries). Each entry has a required
      'namespaceSelector' and an optional 'serviceAccountSelector', each a Kubernetes label
      selector supporting 'matchLabels' (an array of "key=value" strings) and/or
      'matchExpressions'. Use the built-in 'kubernetes.io/metadata.name' label to target
      specific namespaces by name. When omitted, authorization falls back to
      ClusterRole/ClusterRoleBinding evaluation.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
