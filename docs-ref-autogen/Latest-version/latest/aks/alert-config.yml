- uid: az_aks_alert-config_update
  name: az aks alert-config update
  summary: |-
    Update an alert configuration in a managed cluster.
  description: |-
    Only the properties you specify are changed; the rest are preserved.
  status: GA
  sourceType: Extension
  syntax: >-
    az aks alert-config update --cluster-name
                               --name
                               --resource-group
                               [--acquire-policy-token]
                               [--action-group-id]
                               [--aks-custom-headers]
                               [--change-reference]
                               [--mode {Disabled, Managed}]
                               [--no-wait]
  examples:
  - summary: |-
      Turn off alerting without changing the notification target
    syntax: az aks alert-config update -g MyResourceGroup --cluster-name MyCluster -n myalerts --mode Disabled
  - summary: |-
      Point an existing alert configuration at a different action group
    syntax: az aks alert-config update -g MyResourceGroup --cluster-name MyCluster -n myalerts --action-group-id /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/MyResourceGroup/providers/Microsoft.Insights/actionGroups/otherag
  - summary: |-
      Clear the notification target
    syntax: az aks alert-config update -g MyResourceGroup --cluster-name MyCluster -n myalerts --action-group-id ""
  requiredParameters:
  - isRequired: true
    name: --cluster-name
    summary: |-
      Name of the managed cluster.
  - isRequired: true
    name: --name -n
    summary: |-
      Name of the alert configuration to update.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --action-group-id
    summary: |-
      Resource ID of the Azure Monitor action group to send notifications to.
    description: |-
      Pass an empty string to remove the current notification target.
  - name: --aks-custom-headers
    summary: |-
      Send custom headers. When specified, format should be Key1=Value1,Key2=Value2.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --mode
    acceptedValues: Disabled, Managed
    summary: |-
      How AKS manages alerts for the cluster.
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
