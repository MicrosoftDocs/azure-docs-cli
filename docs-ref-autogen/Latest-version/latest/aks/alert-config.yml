### YamlMime:AzureCLIGroup
uid: az_aks_alert-config
name: az aks alert-config
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **aks-preview** extension for the Azure CLI (version 2.85.0 or higher). The extension will automatically install the first time you run an **az aks alert-config** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Commands to manage AKS-managed alert configurations for a cluster.
description: |-
  Alert configurations let AKS create and manage alerts for important cluster events and conditions, delivering notifications through an Azure Monitor action group.
status: GA
sourceType: Extension
directCommands:
- uid: az_aks_alert-config_add
  name: az aks alert-config add
  summary: |-
    Add an alert configuration to a managed cluster.
  status: GA
  sourceType: Extension
  syntax: >-
    az aks alert-config add --cluster-name
                            --mode {Disabled, Managed}
                            --name
                            --resource-group
                            [--acquire-policy-token]
                            [--action-group-id]
                            [--aks-custom-headers]
                            [--change-reference]
                            [--no-wait]
  examples:
  - summary: |-
      Add a managed alert configuration that notifies an action group
    syntax: az aks alert-config add -g MyResourceGroup --cluster-name MyCluster -n myalerts --mode Managed --action-group-id /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/MyResourceGroup/providers/Microsoft.Insights/actionGroups/myag
  - summary: |-
      Add an alert configuration with alerting disabled
    syntax: az aks alert-config add -g MyResourceGroup --cluster-name MyCluster -n myalerts --mode Disabled
  requiredParameters:
  - isRequired: true
    name: --cluster-name
    summary: |-
      Name of the managed cluster.
  - isRequired: true
    name: --mode
    acceptedValues: Disabled, Managed
    summary: |-
      How AKS manages alerts for the cluster.
    description: |-
      Use Managed to have AKS create, update and delete the alerts and send notifications to the configured action group. Use Disabled to turn alerting off.
  - isRequired: true
    name: --name -n
    summary: |-
      Name of the alert configuration (must be unique within the cluster).
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --action-group-id
    summary: |-
      Resource ID of the Azure Monitor action group to send notifications to.
    description: |-
      Optional. When omitted, the alert configuration is created without a notification target and no notifications are delivered.
  - name: --aks-custom-headers
    summary: |-
      Send custom headers. When specified, format should be Key1=Value1,Key2=Value2.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
