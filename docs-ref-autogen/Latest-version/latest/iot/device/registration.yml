  - name: --ck --compute-key
    defaultValue: "False"
    summary: |-
      Compute the per-device key from --symmetric-key, or from the enrollment-group key resolved by --group-id with --dps-name/--login. Cannot be combined with X.509 inputs.
    groupName: Symmetric Key Authentication Arguments
  - name: --dps-name -n
    summary: |-
      Name of the Azure IoT Hub Device Provisioning Service. Required if --login is not provided or authenticaton arguments and --id-scope are not provided.
    groupName: DPS Identifier Arguments
  - name: --enrollment-group-id --gid --group-id
    summary: |-
      Enrollment group ID. Only needed to retrieve authentication arguments.
  - name: --host --provisioning-host
    summary: |-
      DPS device endpoint. When omitted, the endpoint is derived from the selected DPS resource, then falls back to the global endpoint.
  - name: --id-scope --scope
    summary: |-
      ID scope of the Azure IoT Hub Device Provisioning Service. ID scope does not identify a device endpoint: --dps-name or --login is still resolved when supplied. With only --id-scope and explicit device credentials, the documented global endpoint fallback is used.
    groupName: DPS Identifier Arguments
  - name: --key --symmetric-key
    summary: |-
      The symmetric shared access key for the device registration.
    groupName: Symmetric Key Authentication Arguments
  - name: --key-file-path --kp
    summary: |-
      Path to key PEM file. Required for x509 registrations.
    groupName: x509 Authentication Arguments
