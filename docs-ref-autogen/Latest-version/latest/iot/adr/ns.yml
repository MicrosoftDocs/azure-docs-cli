- uid: az_iot_adr_ns_update
  name: az iot adr ns update
  summary: |-
    Update a Device Registry namespace.
  description: |-
    Observability can only be enabled or disabled when the namespace already has a
    service-configured observability endpoint. The existing endpoint configuration
    is preserved. Raw observability endpoint input is not accepted by this command.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns update --name --namespace
                         --resource-group
                         [--acquire-policy-token]
                         [--change-reference]
                         [--no-wait]
                         [--observability-enabled {false, true}]
                         [--omi-sa --outbound-system-assigned-mi {false, true}]
                         [--omi-ua --outbound-user-assigned-mi]
                         [--tags]
  examples:
  - summary: |-
      Update namespace tags
    syntax: az iot adr ns update -n myNamespace -g myResourceGroup --tags key=value
  - summary: |-
      Disable namespace observability
    syntax: az iot adr ns update -n myNamespace -g myResourceGroup --observability-enabled false
  - summary: |-
      Switch outbound identity to system-assigned managed identity
    syntax: az iot adr ns update -n myNamespace -g myResourceGroup --outbound-system-assigned-mi
  - summary: |-
      Switch outbound identity to a user-assigned managed identity
    syntax: >-
      az iot adr ns update -n myNamespace -g myResourceGroup \
        --outbound-user-assigned-mi /subscriptions/<sub>/resourceGroups/<rg>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/<id>
  - summary: |-
      Clear the explicit outbound identity and use the namespace default
    syntax: az iot adr ns update -n myNamespace -g myResourceGroup --outbound-system-assigned-mi false
  requiredParameters:
  - isRequired: true
    name: --name --namespace -n
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --observability-enabled
    acceptedValues: false, true
    summary: |-
      Enable or disable an existing namespace observability configuration. The namespace must already have a service-configured observability endpoint, which is preserved by this operation.
  - name: --omi-sa --outbound-system-assigned-mi
    acceptedValues: false, true
    summary: |-
      Enable the system-assigned managed identity as the outbound identity used by this namespace when calling linked Hub/DPS resources.
    groupName: Outbound Identity Arguments
  - name: --omi-ua --outbound-user-assigned-mi
    summary: |-
      User-assigned managed identity resource ID to assign to the namespace and use for outbound calls.
    groupName: Outbound Identity Arguments
  - name: --tags
    summary: |-
      Space-separated tags: key[=value] [key[=value] ...]. Use "" to clear existing tags.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_iot_adr_ns_wait
  name: az iot adr ns wait
  summary: |-
    Wait for a Device Registry namespace to reach a desired state.
  description: |-
    Without an explicit wait predicate, waits for provisioningState Succeeded.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns wait --name --namespace
                       --resource-group
                       [--acquire-policy-token]
                       [--change-reference]
                       [--created]
                       [--custom]
                       [--deleted]
                       [--exists]
                       [--interval]
                       [--timeout]
                       [--updated]
  examples:
  - summary: |-
      Wait until namespace provisioning succeeds
    syntax: az iot adr ns wait -n myNamespace -g myResourceGroup
  requiredParameters:
  - isRequired: true
    name: --name --namespace -n
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --created
    defaultValue: "False"
    summary: |-
      Wait until provisioningState is Succeeded.
    groupName: Wait Condition Arguments
  - name: --custom
    summary: |-
      Wait until a custom JMESPath expression evaluates to true.
    groupName: Wait Condition Arguments
  - name: --deleted
    defaultValue: "False"
    summary: |-
      Wait until the resource is deleted.
    groupName: Wait Condition Arguments
  - name: --exists
    defaultValue: "False"
    summary: |-
      Wait until the resource exists.
    groupName: Wait Condition Arguments
  - name: --interval
    defaultValue: "30"
    summary: |-
      Polling interval in seconds.
    groupName: Wait Condition Arguments
  - name: --timeout
    defaultValue: "3600"
    summary: |-
      Polling budget in seconds, including GET time. An in-flight GET is bounded by transport timeouts and cannot be interrupted by this polling deadline.
    groupName: Wait Condition Arguments
  - name: --updated
    defaultValue: "False"
    summary: |-
      Wait until provisioningState is Succeeded.
    groupName: Wait Condition Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
