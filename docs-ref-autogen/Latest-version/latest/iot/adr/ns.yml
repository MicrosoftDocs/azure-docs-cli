### YamlMime:AzureCLIGroup
uid: az_iot_adr_ns
name: az iot adr ns
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **azure-iot** extension for the Azure CLI (version 2.73.0 or higher). The extension will automatically install the first time you run an **az iot adr ns** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Device Registry namespaces.
status: Preview
isPreview: true
previewOrExperimentalInfo: 'This command group is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus'
sourceType: Extension
directCommands:
- uid: az_iot_adr_ns_create
  name: az iot adr ns create
  summary: |-
    Create a Device Registry namespace.
  description: |-
    A new namespace is created with a system-assigned managed identity by default.
    Observability is disabled by default for a new namespace. This command does not
    accept observability endpoint input. Re-running create for an existing namespace
    preserves its complete observability configuration.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns create --name --namespace
                         --resource-group
                         [--acquire-policy-token]
                         [--change-reference]
                         [--location]
                         [--no-wait]
                         [--omi-sa --outbound-system-assigned-mi {false, true}]
                         [--omi-ua --outbound-user-assigned-mi]
                         [--tags]
  examples:
  - summary: |-
      Create a basic Device Registry namespace
    syntax: az iot adr ns create -n myNamespace -g myResourceGroup
  - summary: |-
      Create a Device Registry namespace with system-assigned outbound identity
    syntax: az iot adr ns create -n myNamespace -g myResourceGroup --outbound-system-assigned-mi
  - summary: |-
      Create a namespace with a user-assigned outbound identity
    syntax: >-
      az iot adr ns create -n myNamespace -g myResourceGroup \
        --outbound-user-assigned-mi /subscriptions/<sub>/resourceGroups/<rg>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/<id>
  requiredParameters:
  - isRequired: true
    name: --name --namespace -n
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --location -l
    summary: |-
      Location. Values from: `az account list-locations`. You can configure the default location using `az configure --defaults location=<location>`.
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --omi-sa --outbound-system-assigned-mi
    acceptedValues: false, true
    summary: |-
      Enable the system-assigned managed identity as the outbound identity used by this namespace when calling linked Hub/DPS resources.
    groupName: Outbound Identity Arguments
  - name: --omi-ua --outbound-user-assigned-mi
    summary: |-
      User-assigned managed identity resource ID to assign to the namespace and use for outbound calls.
    groupName: Outbound Identity Arguments
  - name: --tags
    summary: |-
      Space-separated tags: key[=value] [key[=value] ...]. Use "" to clear existing tags.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
