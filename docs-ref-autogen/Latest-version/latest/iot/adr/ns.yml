- uid: az_iot_adr_ns_migrate
  name: az iot adr ns migrate
  summary: |-
    Migrate legacy assets into a namespace.
  description: |-
    Migrates only the supplied Microsoft.DeviceRegistry/assets resource IDs using the Resources scope.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns migrate --name --namespace
                          --resource-group
                          --resource-ids
                          [--acquire-policy-token]
                          [--change-reference]
                          [--no-wait]
  examples:
  - summary: |-
      Migrate a legacy asset.
    syntax: az iot adr ns migrate -n mynamespace -g mygroup --resource-ids /subscriptions/{subscription}/resourceGroups/mygroup/providers/Microsoft.DeviceRegistry/assets/myasset
  requiredParameters:
  - isRequired: true
    name: --name --namespace -n
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --resource-ids
    summary: |-
      Resource IDs of legacy Microsoft.DeviceRegistry/assets resources to migrate into the namespace.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
