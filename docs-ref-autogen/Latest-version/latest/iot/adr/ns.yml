- uid: az_iot_adr_ns_update
  name: az iot adr ns update
  summary: |-
    Update namespace tags, system-assigned identity or messaging endpoints.
  description: |-
    Omitted properties remain unchanged. Tags and the messaging endpoint map are replaced when supplied. Use an empty endpoint object to clear messaging endpoints.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns update --name --namespace
                         --resource-group
                         [--acquire-policy-token]
                         [--change-reference]
                         [--messaging-endpoints]
                         [--no-wait]
                         [--system-assigned {false, true}]
                         [--tags]
  examples:
  - summary: |-
      Replace tags without changing other properties.
    syntax: az iot adr ns update -n mynamespace -g mygroup --tags environment=production
  - summary: |-
      Load messaging endpoints from a JSON file.
    syntax: az iot adr ns update -n mynamespace -g mygroup --messaging-endpoints endpoints.json
  - summary: |-
      Disable the system-assigned identity.
    syntax: az iot adr ns update -n mynamespace -g mygroup --system-assigned false
  requiredParameters:
  - isRequired: true
    name: --name --namespace -n
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --messaging-endpoints
    summary: |-
      JSON object or file mapping endpoint names to objects with required address and optional endpointType/resourceId. Replaces the endpoint map; use '{}' to clear it.
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --system-assigned
    acceptedValues: false, true
    summary: |-
      Enable the system-assigned identity (SystemAssigned) or disable it (None). Defaults to enabled on create; unchanged on update.
  - name: --tags
    summary: |-
      Space-separated tags: key[=value] [key[=value] ...]. Use "" to clear existing tags.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
