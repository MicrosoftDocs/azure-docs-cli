### YamlMime:AzureCLIGroup
uid: az_iot_adr_ns
name: az iot adr ns
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **azure-iot** extension for the Azure CLI (version 2.73.0 or higher). The extension will automatically install the first time you run an **az iot adr ns** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Device Registry namespaces.
description: |-
  Uses the 2026-04-01 management API.
status: Preview
isPreview: true
previewOrExperimentalInfo: 'This command group is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus'
sourceType: Extension
directCommands:
- uid: az_iot_adr_ns_create
  name: az iot adr ns create
  summary: |-
    Create or replace a namespace.
  description: |-
    A system-assigned identity is enabled by default.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns create --name --namespace
                         --resource-group
                         [--acquire-policy-token]
                         [--change-reference]
                         [--location]
                         [--messaging-endpoints]
                         [--no-wait]
                         [--system-assigned {false, true}]
                         [--tags]
  examples:
  - summary: |-
      Create a namespace with a system-assigned identity.
    syntax: az iot adr ns create -n mynamespace -g mygroup --location centraluseuap
  - summary: |-
      Create with tags and a simple messaging endpoint.
    syntax: az iot adr ns create -n mynamespace -g mygroup --tags environment=test --messaging-endpoints '{"events":{"address":"https://events.example"}}'
  requiredParameters:
  - isRequired: true
    name: --name --namespace -n
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --location -l
    summary: |-
      Location. Values from: `az account list-locations`. You can configure the default location using `az configure --defaults location=<location>`.
  - name: --messaging-endpoints
    summary: |-
      JSON object or file mapping endpoint names to objects with required address and optional endpointType/resourceId. Replaces the endpoint map; use '{}' to clear it.
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --system-assigned
    defaultValue: "True"
    acceptedValues: false, true
    summary: |-
      Enable the system-assigned identity (SystemAssigned) or disable it (None). Defaults to enabled on create; unchanged on update.
  - name: --tags
    summary: |-
      Space-separated tags: key[=value] [key[=value] ...]. Use "" to clear existing tags.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
