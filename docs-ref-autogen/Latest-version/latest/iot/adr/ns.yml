- uid: az_iot_adr_ns_migrate
  name: az iot adr ns migrate
  summary: |-
    Migrate legacy assets into a Device Registry namespace.
  description: |-
    Migrates existing Microsoft.DeviceRegistry/assets resources into the
    namespace. The response reports success or failure for each resource ID.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns migrate --ids --resource-ids
                          --name --namespace
                          --resource-group
                          [--acquire-policy-token]
                          [--change-reference]
                          [--no-wait]
  examples:
  - summary: |-
      Migrate legacy assets into a namespace
    syntax: >-
      az iot adr ns migrate -n myNamespace -g myResourceGroup \
        --resource-ids /subscriptions/<sub>/resourceGroups/<rg>/providers/Microsoft.DeviceRegistry/assets/asset1
  requiredParameters:
  - isRequired: true
    name: --ids --resource-ids
    summary: |-
      Space-separated resource IDs of legacy Microsoft.DeviceRegistry/assets resources to migrate.
