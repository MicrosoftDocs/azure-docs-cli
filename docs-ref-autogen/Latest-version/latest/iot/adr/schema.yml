### YamlMime:AzureCLIGroup
uid: az_iot_adr_schema
name: az iot adr schema
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **azure-iot** extension for the Azure CLI (version 2.73.0 or higher). The extension will automatically install the first time you run an **az iot adr schema** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage schemas and their versions in a Schema Registry.
description: |-
  A Schema stores information such as the document type and format. Each Schema
  Version stores one Message Schema, Thing Model, or Thing Description document.
  When another resource asks for a schema or model reference, use the full resource
  ID of a specific Schema Version.
status: Preview
isPreview: true
previewOrExperimentalInfo: 'This command group is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus'
sourceType: Extension
directCommands:
- uid: az_iot_adr_schema_create
  name: az iot adr schema create
  summary: |-
    Create a Schema.
  description: |-
    Creates Schema metadata. Use 'schema version create' to create a version and
    provide its schemaContent value.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr schema' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr schema create --format
                             --name
                             --registry
                             --resource-group
                             --schema-type
                             [--acquire-policy-token]
                             [--change-reference]
                             [--desc --description]
                             [--display-name]
                             [--tags]
  examples:
  - summary: |-
      Create a Thing Model Schema
    syntax: >-
      az iot adr schema create -n smart-lamp -g MyRG --registry site-a \
        --schema-type ThingModel --format JsonLD/1.1
  requiredParameters:
  - isRequired: true
    name: --format
    summary: |-
      Schema format written to properties.format. Current values include JsonSchema/draft-07, Delta/1.0, and JsonLD/1.1.
  - isRequired: true
    name: --name -n
    summary: |-
      Schema name.
  - isRequired: true
    name: --registry
    summary: |-
      Schema Registry name.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --schema-type
    summary: |-
      Schema type written to properties.schemaType. Current values include MessageSchema, ThingModel, and ThingDescription.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --desc --description
    summary: |-
      Description for the schema.
  - name: --display-name
    summary: |-
      Display name for the schema.
  - name: --tags
    summary: |-
      Space-separated tags: key[=value] [key[=value] ...]. Use "" to clear existing tags.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
