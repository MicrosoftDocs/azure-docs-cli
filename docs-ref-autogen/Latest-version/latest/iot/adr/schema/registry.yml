### YamlMime:AzureCLIGroup
uid: az_iot_adr_schema_registry
name: az iot adr schema registry
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **azure-iot** extension for the Azure CLI (version 2.73.0 or higher). The extension will automatically install the first time you run an **az iot adr schema registry** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Schema Registries.
description: |-
  A Schema Registry stores Schema Version content in an Azure Data Lake Storage
  Gen2 container. It is a separate Azure resource and does not belong to a
  Device Registry namespace.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'iot adr schema' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_iot_adr_schema_registry_create
  name: az iot adr schema registry create
  summary: |-
    Create a Schema Registry backed by Azure Data Lake Storage Gen2.
  description: |-
    Provide the URL of an existing container in a storage account with hierarchical
    namespace. When only an outbound identity is selected, the command also attaches
    that identity to the Schema Registry. The command does not create the container
    or grant storage access.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr schema registry' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr schema registry create --container-url --storage-account-container-url
                                      --name
                                      --registry-namespace
                                      --resource-group
                                      [--acquire-policy-token]
                                      [--change-reference]
                                      [--desc --description]
                                      [--display-name]
                                      [--location]
                                      [--no-wait]
                                      [--omi-sa --outbound-system-assigned-mi {false, true}]
                                      [--omi-ua --outbound-user-assigned-mi]
                                      [--system-assigned-mi {false, true}]
                                      [--tags]
                                      [--user-assigned-mi]
  examples:
  - summary: |-
      Create a Schema Registry with a system-assigned identity
    syntax: >-
      az iot adr schema registry create -n site-a -g MyRG \
        --registry-namespace site-a \
        --storage-account-container-url https://mystorage.blob.core.windows.net/schemas \
        --system-assigned-mi
  requiredParameters:
  - isRequired: true
    name: --container-url --storage-account-container-url
    summary: |-
      URL of the existing Azure Data Lake Storage Gen2 container used to store Schema Version content.
  - isRequired: true
    name: --name -n
    summary: |-
      Schema Registry name.
  - isRequired: true
    name: --registry-namespace
    summary: |-
      Tenant-unique namespace for the Schema Registry.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --desc --description
    summary: |-
      Description for the Schema Registry.
  - name: --display-name
    summary: |-
      Display name for the Schema Registry.
  - name: --location -l
    summary: |-
      Location. Values from: `az account list-locations`. You can configure the default location using `az configure --defaults location=<location>`.
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --omi-sa --outbound-system-assigned-mi
    acceptedValues: false, true
    summary: |-
      Use the Schema Registry system-assigned identity for outbound calls. Pass false on update to clear the explicit outbound identity.
    groupName: Outbound Identity Arguments
  - name: --omi-ua --outbound-user-assigned-mi
    summary: |-
      User-assigned managed identity resource ID used for outbound calls.
    groupName: Outbound Identity Arguments
  - name: --system-assigned-mi
    acceptedValues: false, true
    summary: |-
      Include or remove the system-assigned managed identity.
    groupName: Managed Identity Arguments
  - name: --tags
    summary: |-
      Space-separated tags: key[=value] [key[=value] ...]. Use "" to clear existing tags.
  - name: --user-assigned-mi
    summary: |-
      Complete desired set of user-assigned managed identity resource IDs.
    groupName: Managed Identity Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
