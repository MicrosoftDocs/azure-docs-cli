### YamlMime:AzureCLIGroup
uid: az_iot_adr_schema_version
name: az iot adr schema version
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **azure-iot** extension for the Azure CLI (version 2.73.0 or higher). The extension will automatically install the first time you run an **az iot adr schema version** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Schema Versions.
description: |-
  A version name must contain 1 to 10 digits.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'iot adr schema' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_iot_adr_schema_version_create
  name: az iot adr schema version create
  summary: |-
    Create a Schema Version.
  description: |-
    The --schema-content value is sent directly to properties.schemaContent.
    After a version is created, its schemaContent cannot be changed.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr schema version' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr schema version create --registry
                                     --resource-group
                                     --schema
                                     --schema-content
                                     --version
                                     [--acquire-policy-token]
                                     [--change-reference]
                                     [--desc --description]
  examples:
  - summary: |-
      Create a Message Schema version
    syntax: >-
      az iot adr schema version create --registry site-a --schema telemetry \
        --version 1 --schema-content '{"type":"object"}' -g MyRG
  requiredParameters:
  - isRequired: true
    name: --registry
    summary: |-
      Schema Registry name.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --schema
    summary: |-
      Schema name.
  - isRequired: true
    name: --schema-content
    summary: |-
      Schema content string written to properties.schemaContent.
  - isRequired: true
    name: --version
    summary: |-
      Schema Version name. Must contain 1 to 10 digits.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --desc --description
    summary: |-
      Description for the Schema Version.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
