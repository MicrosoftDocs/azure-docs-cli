  syntax: >-
    az iot adr schema version delete --registry
                                     --resource-group
                                     --schema
                                     --version
                                     [--acquire-policy-token]
                                     [--change-reference]
                                     [--no-wait]
                                     [--yes {false, true}]
  examples:
