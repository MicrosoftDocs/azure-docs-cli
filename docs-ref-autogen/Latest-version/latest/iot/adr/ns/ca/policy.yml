- uid: az_iot_adr_ns_ca_policy_update
  name: az iot adr ns ca policy update
  summary: |-
    Update a certificate policy for a certificate authority.
  description: |-
    When supplied, the leaf certificate validity period must be between 1 and
    90 days, inclusive.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns ca policy' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns ca policy update --ca --ca-name
                                   --name --pn --policy-name
                                   --namespace --ns
                                   --resource-group
                                   [--acquire-policy-token]
                                   [--change-reference]
                                   [--no-wait]
                                   [--tags]
                                   [--validity-days --vd]
  examples:
  - summary: |-
      Update certificate policy tags
    syntax: az iot adr ns ca policy update -n myPolicy --ca-name myCA --ns myNamespace -g myResourceGroup --tags env=prod
  - summary: |-
      Update leaf certificate validity to the maximum supported period
    syntax: az iot adr ns ca policy update -n myPolicy --ca-name myCA --ns myNamespace -g myResourceGroup --validity-days 90
  requiredParameters:
  - isRequired: true
    name: --ca --ca-name
    summary: |-
      Name of the parent certificate authority.
  - isRequired: true
    name: --name --pn --policy-name -n
    summary: |-
      Name of the certificate policy.
  - isRequired: true
    name: --namespace --ns
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --tags
    summary: |-
      Space-separated tags: key[=value] [key[=value] ...]. Use "" to clear existing tags.
  - name: --validity-days --vd
    summary: |-
      Updated leaf certificate validity period in days. Must be between 1 and 90 days, inclusive.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
