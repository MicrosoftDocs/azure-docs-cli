### YamlMime:AzureCLIGroup
uid: az_iot_adr_ns_ca_policy
name: az iot adr ns ca policy
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **azure-iot** extension for the Azure CLI (version 2.73.0 or higher). The extension will automatically install the first time you run an **az iot adr ns ca policy** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage certificate policies for a certificate authority.
description: |-
  A certificate policy carries the leaf certificate issuance settings for a certificate authority.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'iot adr ns ca' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_iot_adr_ns_ca_policy_create
  name: az iot adr ns ca policy create
  summary: |-
    Create a certificate policy for a certificate authority.
  description: |-
    Certificate policies can only be created under an issuing certificate
    authority with type ICA. Create the ICA under a Root CA, then pass the ICA
    name to --ca-name. The leaf certificate validity period must be between 1
    and 90 days, inclusive. Use 'ca policy update --validity-days' to change
    the validity period of an existing policy.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns ca policy' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns ca policy create --ca --ca-name
                                   --name --pn --policy-name
                                   --namespace --ns
                                   --resource-group
                                   --validity-days --vd
                                   [--acquire-policy-token]
                                   [--change-reference]
                                   [--location]
                                   [--no-wait]
                                   [--tags]
  examples:
  - summary: |-
      Create a certificate policy with a 30 day leaf certificate validity period
    syntax: az iot adr ns ca policy create -n myPolicy --ca-name myICA --ns myNamespace -g myResourceGroup --validity-days 30
  requiredParameters:
  - isRequired: true
    name: --ca --ca-name
    summary: |-
      Name of the parent certificate authority.
  - isRequired: true
    name: --name --pn --policy-name -n
    summary: |-
      Name of the certificate policy.
  - isRequired: true
    name: --namespace --ns
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --validity-days --vd
    summary: |-
      Leaf certificate validity period in days. Must be between 1 and 90 days, inclusive.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --location -l
    summary: |-
      Location. Values from: `az account list-locations`. You can configure the default location using `az configure --defaults location=<location>`.
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --tags
    summary: |-
      Space-separated tags: key[=value] [key[=value] ...]. Use "" to clear existing tags.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
