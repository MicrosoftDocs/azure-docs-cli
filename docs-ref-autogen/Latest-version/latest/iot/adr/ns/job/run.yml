### YamlMime:AzureCLIGroup
uid: az_iot_adr_ns_job_run
name: az iot adr ns job run
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **azure-iot** extension for the Azure CLI (version 2.73.0 or higher). The extension will automatically install the first time you run an **az iot adr ns job run** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage runs of Device Registry namespace jobs.
description: |-
  A job describes what to deploy and where; a run is one execution of it.
  Schedule a run with 'az iot adr ns job schedule'.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'iot adr ns job' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_iot_adr_ns_job_run_cancel
  name: az iot adr ns job run cancel
  summary: |-
    Cancel a Device Registry job run.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns job run' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns job run cancel --jn --job-name
                                 --name --rn --run-name
                                 --namespace --ns
                                 --resource-group
                                 [--acquire-policy-token]
                                 [--change-reference]
                                 [--no-wait]
                                 [--yes {false, true}]
  examples:
  - summary: |-
      Cancel a run
    syntax: az iot adr ns job run cancel -n myRun --job-name myJob --ns myNamespace -g myResourceGroup
  requiredParameters:
  - isRequired: true
    name: --jn --job-name
    summary: |-
      Name of the parent job that owns this run.
  - isRequired: true
    name: --name --rn --run-name -n
    summary: |-
      Name of the job run.
  - isRequired: true
    name: --namespace --ns
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --yes -y
    acceptedValues: false, true
    summary: |-
      Skip user prompts. Indicates acceptance of action. Used primarily for automation scenarios. Default: false.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
