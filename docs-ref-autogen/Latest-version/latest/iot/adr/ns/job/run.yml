- uid: az_iot_adr_ns_job_run_list
  name: az iot adr ns job run list
  summary: |-
    List job runs by parent job or across a namespace.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns job run' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns job run list --namespace --ns
                               --resource-group
                               [--filter]
                               [--jn --job-name --name]
                               [--ob --order-by]
  examples:
  - summary: |-
      List all runs for a job
    syntax: az iot adr ns job run list --job-name myJob --ns myNamespace -g myResourceGroup
  - summary: |-
      List active runs across the namespace
    syntax: az iot adr ns job run list --ns myNamespace -g myResourceGroup --filter "status eq 'Active'"
  - summary: |-
      List active or scheduled runs
    syntax: az iot adr ns job run list --ns myNamespace -g myResourceGroup --filter "status in ('Active', 'Scheduled')"
  - summary: |-
      List runs ordered by status
    syntax: az iot adr ns job run list --ns myNamespace -g myResourceGroup --order-by "status asc"
  requiredParameters:
  - isRequired: true
    name: --namespace --ns
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --filter
    summary: |-
      Status filter using 'eq' or 'in', for example: status in ('Active', 'Scheduled').
  - name: --jn --job-name --name -n
    summary: |-
      Optional parent job name. Omit to list runs across the namespace.
  - name: --ob --order-by
    summary: |-
      Sort expression for job runs, for example: "status asc" or "status desc".
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_iot_adr_ns_job_run_results
  name: az iot adr ns job run results
  summary: |-
    Browse per-device results of a job run.
  description: |-
    Returns a flat list of per-device results aggregated across all pages of
    the service-side `POST .../listResults` response. Use --filter for
    server-side status filtering.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns job run' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns job run results --jn --job-name
                                  --name --rn --run-name
                                  --namespace --ns
                                  --resource-group
                                  [--acquire-policy-token]
                                  [--change-reference]
                                  [--filter]
                                  [--ob --order-by]
  examples:
  - summary: |-
      List every per-device result for a run
    syntax: az iot adr ns job run results -n myRun --job-name myJob --ns myNamespace -g myResourceGroup
  - summary: |-
      Show only the failed devices in a run
    syntax: >-
      az iot adr ns job run results -n myRun --job-name myJob --ns myNamespace -g myResourceGroup \
        --filter "status eq 'Failed'"
  - summary: |-
      Order device results by status
    syntax: >-
      az iot adr ns job run results -n myRun --job-name myJob --ns myNamespace -g myResourceGroup \
        --order-by "status asc"
  requiredParameters:
  - isRequired: true
    name: --jn --job-name
    summary: |-
      Name of the parent job that owns this run.
  - isRequired: true
    name: --name --rn --run-name -n
    summary: |-
      Name of the job run.
  - isRequired: true
    name: --namespace --ns
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --filter
    summary: |-
      One result status equality clause, for example: status eq 'Failed'.
  - name: --ob --order-by
    summary: |-
      Sort results by status: "status", "status asc", or "status desc".
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
