- uid: az_iot_adr_ns_group_refresh
  name: az iot adr ns group refresh
  summary: |-
    Trigger an asynchronous refresh of a group's membership.
  description: |-
    Refreshing membership is a long-running operation. Use 'az iot adr ns group wait'
    to wait for the refresh to complete, or 'az iot adr ns group show' to poll
    the 'membershipState' field. If a membership calculation is already in
    progress, this command reuses that calculation instead of starting another.
    The service allows membership refresh at most once per hour, including the
    initial membership calculation triggered by group creation.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns group' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns group refresh --gn --group-name --name
                                --namespace --ns
                                --resource-group
                                [--acquire-policy-token]
                                [--change-reference]
                                [--no-wait]
  examples:
  - summary: |-
      Refresh group membership
    syntax: az iot adr ns group refresh -n myGroup --ns myNamespace -g myResourceGroup
  requiredParameters:
  - isRequired: true
    name: --gn --group-name --name -n
    summary: |-
      Name of the group.
  - isRequired: true
    name: --namespace --ns
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
