- uid: az_iot_adr_ns_group_create
  name: az iot adr ns group create
  summary: |-
    Create a group in a Device Registry namespace.
  description: |-
    The group's --group-type and --query-string are immutable after creation. Only
    'RegistryDevice' is supported as the group type in the current preview API.

    --query-string is passed to the service verbatim. Use '*' to include every device in
    the namespace.

    Creating a group starts its initial membership calculation. Use
    'az iot adr ns group wait' without a predicate to wait for that calculation.
    Manual membership refresh is rate-limited to once per hour.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns group' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns group create --gn --group-name --name
                               --namespace --ns
                               --qs --query-string
                               --resource-group
                               [--acquire-policy-token]
                               [--change-reference]
                               [--description]
                               [--display-name]
                               [--group-type --gt {RegistryDevice}]
                               [--location]
                               [--tags]
  examples:
  - summary: |-
      Create a group containing every device in the namespace
    syntax: >-
      az iot adr ns group create -n myGroup --ns myNamespace -g myResourceGroup \
        --query-string "*"
  - summary: |-
      Create a group with a membership query, display name and description
    syntax: >-
      az iot adr ns group create -n myGroup --ns myNamespace -g myResourceGroup \
        --query-string "properties.manufacturer = 'Contoso'" \
        --display-name "Contoso devices" --description "All Contoso-manufactured devices"
  requiredParameters:
  - isRequired: true
    name: --gn --group-name --name -n
    summary: |-
      Name of the group.
  - isRequired: true
    name: --namespace --ns
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --qs --query-string
    summary: |-
      Membership query filter used to determine which devices belong to the group. Use '*' to include every device in the namespace. Required and immutable after creation.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --description
    summary: |-
      Human-readable description of the group.
  - name: --display-name
    summary: |-
      Human-readable display name for the group.
  - name: --group-type --gt
    defaultValue: RegistryDevice
    acceptedValues: RegistryDevice
    summary: |-
      Type of the group. Only 'RegistryDevice' is supported in the current preview API; this is immutable after creation.
  - name: --location -l
    summary: |-
      Location. Values from: `az account list-locations`. You can configure the default location using `az configure --defaults location=<location>`.
  - name: --tags
    summary: |-
      Space-separated tags: key[=value] [key[=value] ...]. Use "" to clear existing tags.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_iot_adr_ns_group_delete
  name: az iot adr ns group delete
  summary: |-
    Delete a group from a Device Registry namespace.
  description: |-
    Deletion completes synchronously and does not delete jobs or job runs.
    --no-wait is accepted for compatibility, but still waits for the delete response.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns group' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns group delete --gn --group-name --name
                               --namespace --ns
                               --resource-group
                               [--acquire-policy-token]
                               [--change-reference]
                               [--no-wait]
                               [--yes {false, true}]
  examples:
  - summary: |-
      Delete a group
    syntax: az iot adr ns group delete -n myGroup --ns myNamespace -g myResourceGroup
  - summary: |-
      Delete a group without confirmation prompt
    syntax: az iot adr ns group delete -n myGroup --ns myNamespace -g myResourceGroup --yes
  requiredParameters:
  - isRequired: true
    name: --gn --group-name --name -n
    summary: |-
      Name of the group.
  - isRequired: true
    name: --namespace --ns
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Accepted for compatibility only; has no effect because group deletion is synchronous.
  - name: --yes -y
    acceptedValues: false, true
    summary: |-
      Skip user prompts. Indicates acceptance of action. Used primarily for automation scenarios. Default: false.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
