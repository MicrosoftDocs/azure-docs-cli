- uid: az_iot_adr_ns_device_attribute_show
  name: az iot adr ns device attribute show
  summary: |-
    Get an attribute.
  description: |-
    The software-update alias falls back to the canonical update attribute only
    after the literal name returns HTTP 404. Create and delete use literal names.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns device attribute' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns device attribute show --an --attribute-name --name
                                        --device-name --dn --rdn --registry-device-name
                                        --namespace --ns
                                        --resource-group
  examples:
  - summary: |-
      Read an attribute.
    syntax: az iot adr ns device attribute show -n my-attribute --rdn my-device --ns my-ns -g MyRG
  requiredParameters:
  - isRequired: true
    name: --an --attribute-name --name -n
    summary: |-
      Attribute name. If no literal match exists, software-update is an alias for the service-owned Device Update attribute named update.
  - isRequired: true
    name: --device-name --dn --rdn --registry-device-name
    summary: |-
      Name of the parent Registry Device.
  - isRequired: true
    name: --namespace --ns
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
