### YamlMime:AzureCLIGroup
uid: az_iot_adr_ns_device_attribute
name: az iot adr ns device attribute
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **azure-iot** extension for the Azure CLI (version 2.73.0 or higher). The extension will automatically install the first time you run an **az iot adr ns device attribute** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Registry Device attributes.
description: |-
  User attributes are customer-authored. Microsoft.DeviceUpdate attributes are service-owned.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'iot adr ns device' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_iot_adr_ns_device_attribute_create
  name: az iot adr ns device attribute create
  summary: |-
    Create or replace a User-reported attribute.
  description: |-
    Properties must be a JSON object. User provenance is added automatically.
    Use schema identifiers and property values supported by your service;
    the CLI does not infer a schema or validate application-specific fields.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns device attribute' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns device attribute create --an --attribute-name --name
                                          --device-name --dn --rdn --registry-device-name
                                          --namespace --ns
                                          --resource-group
                                          [--acquire-policy-token]
                                          [--change-reference]
                                          [--properties --props]
                                          [--schema]
  examples:
  - summary: |-
      Create an attribute from a JSON file.
    syntax: az iot adr ns device attribute create -n my-attribute --rdn my-device --ns my-ns -g MyRG --properties @attribute.json
  requiredParameters:
  - isRequired: true
    name: --an --attribute-name --name -n
    summary: |-
      Name of the Registry Device attribute.
  - isRequired: true
    name: --device-name --dn --rdn --registry-device-name
    summary: |-
      Name of the parent Registry Device.
  - isRequired: true
    name: --namespace --ns
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --properties --props
    summary: |-
      Attribute properties as a JSON object or JSON file path (optionally prefixed by @). Service-owned Microsoft.DeviceUpdate provenance cannot be authored.
  - name: --schema
    summary: |-
      Schema identifier for the attribute. Use a schema supported by your service.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
