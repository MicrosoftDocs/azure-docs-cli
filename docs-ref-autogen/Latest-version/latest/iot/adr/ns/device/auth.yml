### YamlMime:AzureCLIGroup
uid: az_iot_adr_ns_device_auth
name: az iot adr ns device auth
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **azure-iot** extension for the Azure CLI (version 2.73.0 or higher). The extension will automatically install the first time you run an **az iot adr ns device auth** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Inspect service-materialized authentication profiles.
description: |-
  Profiles are read-only metadata; use the provisioning service to issue credentials.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'iot adr ns device' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_iot_adr_ns_device_auth_list
  name: az iot adr ns device auth list
  summary: |-
    List authentication profile metadata, not plaintext keys.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns device auth' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns device auth list --device-name --dn --rdn --registry-device-name
                                   --namespace --ns
                                   --resource-group
  examples:
  - summary: |-
      Discover profile names.
    syntax: az iot adr ns device auth list --rdn my-device --ns my-ns -g MyRG
  requiredParameters:
  - isRequired: true
    name: --device-name --dn --rdn --registry-device-name
    summary: |-
      Name of the parent Registry Device.
  - isRequired: true
    name: --namespace --ns
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_iot_adr_ns_device_auth_revoke-certs
  name: az iot adr ns device auth revoke-certs
  summary: |-
    Revoke certificates for a CA-signed X.509 profile.
  description: |-
    Requires CertificateAuthoritySignedX509Certificate authentication. Self-signed
    X.509 and symmetric-key profiles are rejected. This action is destructive.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns device auth' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns device auth revoke-certs --apn --auth-profile-name --name
                                           --device-name --dn --rdn --registry-device-name
                                           --namespace --ns
                                           --resource-group
                                           [--acquire-policy-token]
                                           [--change-reference]
                                           [--no-wait]
                                           [--yes {false, true}]
  examples:
  - summary: |-
      Revoke certificates for an owned CA-issued profile.
    syntax: az iot adr ns device auth revoke-certs -n my-profile --rdn my-device --ns my-ns -g MyRG --yes
  requiredParameters:
  - isRequired: true
    name: --apn --auth-profile-name --name -n
    summary: |-
      Name of the Registry Device auth.
  - isRequired: true
    name: --device-name --dn --rdn --registry-device-name
    summary: |-
      Name of the parent Registry Device.
  - isRequired: true
    name: --namespace --ns
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --yes -y
    acceptedValues: false, true
    summary: |-
      Skip user prompts. Indicates acceptance of action. Used primarily for automation scenarios. Default: false.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
