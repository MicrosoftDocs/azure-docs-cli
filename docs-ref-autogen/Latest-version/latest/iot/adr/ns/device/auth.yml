- uid: az_iot_adr_ns_device_auth_wait
  name: az iot adr ns device auth wait
  summary: |-
    Wait for authentication profile materialization or a specified condition.
  description: |-
    By default waits for GET to succeed. Profiles have no provisioningState;
    --created and --updated are not profile materialization predicates.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns device auth' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns device auth wait --apn --auth-profile-name --name
                                   --device-name --dn --rdn --registry-device-name
                                   --namespace --ns
                                   --resource-group
                                   [--acquire-policy-token]
                                   [--change-reference]
                                   [--created]
                                   [--custom]
                                   [--deleted]
                                   [--exists]
                                   [--interval]
                                   [--timeout]
                                   [--updated]
  examples:
  - summary: |-
      Wait for a discovered authentication profile.
    syntax: az iot adr ns device auth wait -n my-profile --rdn my-device --ns my-ns -g MyRG --timeout 600 --interval 10
  requiredParameters:
  - isRequired: true
    name: --apn --auth-profile-name --name -n
    summary: |-
      Name of the Registry Device auth.
  - isRequired: true
    name: --device-name --dn --rdn --registry-device-name
    summary: |-
      Name of the parent Registry Device.
  - isRequired: true
    name: --namespace --ns
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --created
    defaultValue: "False"
    summary: |-
      Wait until provisioningState is Succeeded.
    groupName: Wait Condition Arguments
  - name: --custom
    summary: |-
      Wait until a custom JMESPath expression evaluates to true.
    groupName: Wait Condition Arguments
  - name: --deleted
    defaultValue: "False"
    summary: |-
      Wait until the resource is deleted.
    groupName: Wait Condition Arguments
  - name: --exists
    defaultValue: "False"
    summary: |-
      Wait until the resource exists.
    groupName: Wait Condition Arguments
  - name: --interval
    defaultValue: "30"
    summary: |-
      Polling interval in seconds.
    groupName: Wait Condition Arguments
  - name: --timeout
    defaultValue: "3600"
    summary: |-
      Polling budget in seconds, including GET time. An in-flight GET is bounded by transport timeouts and cannot be interrupted by this polling deadline.
    groupName: Wait Condition Arguments
  - name: --updated
    defaultValue: "False"
    summary: |-
      Wait until provisioningState is Succeeded.
    groupName: Wait Condition Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
