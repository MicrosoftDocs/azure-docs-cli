- uid: az_iot_adr_ns_device_auth_show-keys
  name: az iot adr ns device auth show-keys
  summary: |-
    Retrieve plaintext keys for a SymmetricKey profile.
  description: |-
    Output contains secrets. Store it securely; avoid shared logs. Other
    authentication types are rejected. List and show do not call the key action.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns device auth' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns device auth show-keys --apn --auth-profile-name --name
                                        --device-name --dn --rdn --registry-device-name
                                        --namespace --ns
                                        --resource-group
                                        [--acquire-policy-token]
                                        [--change-reference]
  examples:
