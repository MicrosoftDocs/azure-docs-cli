### YamlMime:AzureCLIGroup
uid: az_iot_adr_ns_device_capability
name: az iot adr ns device capability
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **azure-iot** extension for the Azure CLI (version 2.73.0 or higher). The extension will automatically install the first time you run an **az iot adr ns device capability** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Inspect service-materialized Registry Device capabilities.
description: |-
  Capabilities are read-only. Provisioning services create them; the CLI does not synthesize them.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'iot adr ns device' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_iot_adr_ns_device_capability_list
  name: az iot adr ns device capability list
  summary: |-
    List Registry Device capabilities.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns device capability' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns device capability list --device-name --dn --rdn --registry-device-name
                                         --namespace --ns
                                         --resource-group
  examples:
  - summary: |-
      Discover capabilities.
    syntax: az iot adr ns device capability list --rdn my-device --ns my-ns -g MyRG
  requiredParameters:
  - isRequired: true
    name: --device-name --dn --rdn --registry-device-name
    summary: |-
      Name of the parent Registry Device.
  - isRequired: true
    name: --namespace --ns
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_iot_adr_ns_device_capability_show
  name: az iot adr ns device capability show
  summary: |-
    Get a discovered capability.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns device capability' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns device capability show --capability-name --cn --name
                                         --device-name --dn --rdn --registry-device-name
                                         --namespace --ns
                                         --resource-group
  examples:
  - summary: |-
      Inspect an IoT Hub capability whose name is the namespace messaging endpoint.
    syntax: az iot adr ns device capability show -n my-hub-endpoint --rdn my-device --ns my-ns -g MyRG
  requiredParameters:
  - isRequired: true
    name: --capability-name --cn --name -n
    summary: |-
      Name of the Registry Device capability.
  - isRequired: true
    name: --device-name --dn --rdn --registry-device-name
    summary: |-
      Name of the parent Registry Device.
  - isRequired: true
    name: --namespace --ns
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_iot_adr_ns_device_capability_list
- az_iot_adr_ns_device_capability_show
metadata:
  description: Capabilities are read-only. Provisioning services create them; the CLI does not synthesize them.
