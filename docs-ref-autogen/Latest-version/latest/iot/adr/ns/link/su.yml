### YamlMime:AzureCLIGroup
uid: az_iot_adr_ns_link_su
name: az iot adr ns link su
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **azure-iot** extension for the Azure CLI (version 2.73.0 or higher). The extension will automatically install the first time you run an **az iot adr ns link su** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Software Updates links (updating endpoints) on a Device Registry namespace.
description: |-
  Links a 'Microsoft.DeviceUpdate/updateInstances' resource to the namespace as an
  updating endpoint under properties.updating.endpoints. Links live on the namespace, not on
  the Update Instance. Only one Software Updates instance may be linked per namespace.
  Linking is asynchronous; read-only address fields (serviceAddress, deviceAddress,
  legacyDeviceAddress) are resolved once linking succeeds.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'iot adr ns link' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_iot_adr_ns_link_su_add
  name: az iot adr ns link su add
  summary: |-
    Link an Update Instance to a Device Registry namespace.
  description: |-
    Adds a Software Updates updating endpoint entry under the namespace's properties.updating.endpoints.
    Only one Software Updates instance may be linked per namespace. If one is already
    linked, use 'link su update' to modify the existing endpoint.
    Exactly one of --system-assigned-mi or --user-assigned-mi must be provided to set the
    inbound caller identity that the update instance will use to call back into the namespace.
    Required service-to-service roles: namespace outbound MI -> Contributor on SU; namespace outbound MI -> Device Update Administrator on SU; SU selected inbound MI -> Azure Device Registry Contributor on namespace.
    These are exactly three service-to-service grants. Device Update Administrator enables
    namespace-initiated ADU data-plane operations, including report generation; ARM Contributor
    alone does not grant data-plane access. The configured namespace outbound identity
    and the selected Update Instance inbound identity each support SAMI or an attached UAMI.
    No ADU first-party service principal or Microsoft Graph lookup is required.
    Missing assignments are created only when run by a caller who can create role assignments
    (for example Owner, User Access Administrator, or Role Based Access Control Administrator).
    A newly created assignment must become visible within 180 seconds.
    This link workflow never grants the signed-in user Software Updates content roles.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns link su' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns link su add --en --endpoint-name --name
                              --namespace --ns
                              --resource-group
                              --su-id --su-resource-id
                              [--acquire-policy-token]
                              [--change-reference]
                              [--interval]
                              [--mi-sa --system-assigned-mi {false, true}]
                              [--mi-ua --user-assigned-mi]
                              [--no-wait]
                              [--timeout]
  examples:
  - summary: |-
      Link an Update Instance using its system-assigned identity for inbound calls
    syntax: >-
      az iot adr ns link su add -n my-su --ns myNamespace -g myResourceGroup \
        --su-id /subscriptions/<sub>/resourceGroups/<rg>/providers/Microsoft.DeviceUpdate/updateInstances/<instance> \
        --system-assigned-mi
  - summary: |-
      Link an Update Instance with a user-assigned identity
    syntax: >-
      az iot adr ns link su add -n my-su --ns myNamespace -g myResourceGroup \
        --su-id /subscriptions/<sub>/resourceGroups/<rg>/providers/Microsoft.DeviceUpdate/updateInstances/<instance> \
        --user-assigned-mi /subscriptions/<sub>/resourceGroups/<rg>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/<id>
  requiredParameters:
  - isRequired: true
    name: --en --endpoint-name --name -n
    summary: |-
      Logical name of the Software Updates endpoint entry.
  - isRequired: true
    name: --namespace --ns
    summary: |-
      Name of the Device Registry namespace that owns the link.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --su-id --su-resource-id
    summary: |-
      Azure resource ID of the Update Instance to link.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --interval
    defaultValue: "30"
    summary: |-
      Positive polling interval in seconds. Default: 30.
    groupName: Wait Condition Arguments
  - name: --mi-sa --system-assigned-mi
    defaultValue: "False"
    acceptedValues: false, true
    summary: |-
      Use the linked Update Instance's system-assigned identity. The instance must have that identity enabled.
    groupName: Inbound Caller Identity Arguments
  - name: --mi-ua --user-assigned-mi
    summary: |-
      Resource ID of a user-assigned identity attached to the linked Update Instance.
    groupName: Inbound Caller Identity Arguments
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Return after submission without observing endpoint readiness or recovering later failures.
  - name: --timeout
    defaultValue: "600"
    summary: |-
      Positive mutation/recovery budget in seconds after initial RBAC preflight. Default: 600.
    groupName: Wait Condition Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
