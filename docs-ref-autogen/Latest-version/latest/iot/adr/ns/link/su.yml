- uid: az_iot_adr_ns_link_su_remove
  name: az iot adr ns link su remove
  summary: |-
    Remove a Software Updates instance endpoint from a Device Registry namespace.
  description: |-
    Delete the linked Software Updates instance first; this command removes only the namespace endpoint.
    The namespace outbound identity needs Reader on the linked resource's resource group.
    A missing grant is created when you can create role assignments; it is kept after unlinking.
    Keep that resource group until the unlink completes.
    The command does not wait. Confirm removal with 'az iot adr ns show'.
    Avoid concurrent namespace updates while this command runs.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns link su' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns link su remove --en --endpoint-name --name
                                 --namespace --ns
                                 --resource-group
                                 [--acquire-policy-token]
                                 [--change-reference]
                                 [--yes {false, true}]
  examples:
  - summary: |-
      Remove an endpoint after its linked Software Updates instance has been deleted
    syntax: az iot adr ns link su remove -n primary --ns myNamespace -g myResourceGroup --yes
  requiredParameters:
  - isRequired: true
    name: --en --endpoint-name --name -n
    summary: |-
      Logical name of the Software Updates endpoint entry.
  - isRequired: true
    name: --namespace --ns
    summary: |-
      Name of the Device Registry namespace that owns the link.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
