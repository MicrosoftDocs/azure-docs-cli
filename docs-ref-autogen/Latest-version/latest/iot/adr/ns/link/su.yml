- uid: az_iot_adr_ns_link_su_update
  name: az iot adr ns link su update
  summary: |-
    Update an existing Software Updates updating endpoint on a Device Registry namespace.
  description: |-
    Retry a Failed endpoint without identity options to reuse its saved inbound identity.
    Pass --system-assigned-mi or --user-assigned-mi to change that identity.
    Healthy endpoints require an explicit change. The linked Update Instance cannot be changed
    in place. Before PATCH, update repeats add's target existence, region,
    provisioning-state, selected identity attachment, namespace outbound principal,
    automatic RBAC, and assignment-visibility preflight.
    This includes Device Update Administrator for the namespace outbound identity on the linked
    Update Instance, adding the missing grant for links created with older CLI versions.
    ARM assignment visibility does not guarantee that the linked service already honors access.
    Waited add/update commands recover only confirmed AdrMiNotAuthorized on the unchanged endpoint,
    rechecking required assignments and preserving identity and settings. --timeout (600 seconds) bounds
    mutation, polling and 30/60/120-second propagation backoff after initial RBAC preflight;
    --interval (30 seconds) controls polling. Success requires endpoint linkingState Succeeded.
    With --no-wait, use the matching link wait command to track completion.
    After verifying access and allowing recent assignments to propagate, retry a persisted
    failed endpoint with update, not add, passing its existing inbound identity. There is no
    need to delete the linked Update Instance to retry the link.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns link su' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns link su update --en --endpoint-name --name
                                 --namespace --ns
                                 --resource-group
                                 [--acquire-policy-token]
                                 [--change-reference]
                                 [--interval]
                                 [--mi-sa --system-assigned-mi {false, true}]
                                 [--mi-ua --user-assigned-mi]
                                 [--no-wait]
                                 [--timeout]
  examples:
  - summary: |-
      Rotate to a system-assigned identity on an existing Software Updates link
    syntax: az iot adr ns link su update -n my-su --ns myNamespace -g myResourceGroup --system-assigned-mi
  requiredParameters:
  - isRequired: true
    name: --en --endpoint-name --name -n
    summary: |-
      Logical name of the Software Updates endpoint entry.
  - isRequired: true
    name: --namespace --ns
    summary: |-
      Name of the Device Registry namespace that owns the link.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --interval
    summary: |-
      Positive polling interval in seconds. Default: 30.
    groupName: Wait Condition Arguments
  - name: --mi-sa --system-assigned-mi
    defaultValue: "False"
    acceptedValues: false, true
    summary: |-
      Use the linked Update Instance's system-assigned identity. The instance must have that identity enabled.
    groupName: Inbound Caller Identity Arguments
  - name: --mi-ua --user-assigned-mi
    summary: |-
      Resource ID of a user-assigned identity attached to the linked Update Instance.
    groupName: Inbound Caller Identity Arguments
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Return after submission without observing endpoint readiness or recovering later failures.
  - name: --timeout
    summary: |-
      Positive mutation/recovery budget in seconds after initial RBAC preflight. Default: 600.
    groupName: Wait Condition Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_iot_adr_ns_link_su_wait
  name: az iot adr ns link su wait
  summary: |-
    Wait for a Software Updates endpoint to link successfully.
  description: |-
    The endpoint name is required. Without an explicit wait predicate, this command
    polls that endpoint's linkingState and fails immediately if it reaches Failed.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns link su' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns link su wait --en --endpoint-name --name
                               --namespace --ns
                               --resource-group
                               [--acquire-policy-token]
                               [--change-reference]
                               [--created]
                               [--custom]
                               [--deleted]
                               [--exists]
                               [--interval]
                               [--timeout]
                               [--updated]
  examples:
  - summary: |-
      Wait until a Software Updates endpoint reaches linkingState Succeeded
    syntax: az iot adr ns link su wait -n my-su --ns myNamespace -g myResourceGroup
  requiredParameters:
  - isRequired: true
    name: --en --endpoint-name --name -n
    summary: |-
      Logical name of the Software Updates endpoint entry.
  - isRequired: true
    name: --namespace --ns
    summary: |-
      Name of the Device Registry namespace that owns the link.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --created
    defaultValue: "False"
    summary: |-
      Wait until provisioningState is Succeeded.
    groupName: Wait Condition Arguments
  - name: --custom
    summary: |-
      Wait until a custom JMESPath expression evaluates to true.
    groupName: Wait Condition Arguments
  - name: --deleted
    defaultValue: "False"
    summary: |-
      Wait until the resource is deleted.
    groupName: Wait Condition Arguments
  - name: --exists
    defaultValue: "False"
    summary: |-
      Wait until the resource exists.
    groupName: Wait Condition Arguments
  - name: --interval
    defaultValue: "30"
    summary: |-
      Polling interval in seconds.
    groupName: Wait Condition Arguments
  - name: --timeout
    defaultValue: "3600"
    summary: |-
      Polling budget in seconds, including GET time. An in-flight GET is bounded by transport timeouts and cannot be interrupted by this polling deadline.
    groupName: Wait Condition Arguments
  - name: --updated
    defaultValue: "False"
    summary: |-
      Wait until provisioningState is Succeeded.
    groupName: Wait Condition Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
