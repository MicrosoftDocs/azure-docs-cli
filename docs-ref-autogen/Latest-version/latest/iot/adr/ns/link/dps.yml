- uid: az_iot_adr_ns_link_dps_update
  name: az iot adr ns link dps update
  summary: |-
    Update an existing DPS provisioning endpoint on a Device Registry namespace.
  description: |-
    Retry a Failed DPS endpoint without identity options to reuse its saved inbound identity.
    Pass --system-assigned-mi or --user-assigned-mi to change that identity. A healthy endpoint
    requires an explicit change; the target DPS cannot be changed in place.
    Update checks target existence, region,
    provisioning-state, selected identity attachment, namespace outbound principal,
    automatic RBAC, and assignment-visibility preflight.
    DPS preflight retains the namespace system-assigned identity prerequisite, but grants
    Azure Device Registry Administrator on the namespace to its selected outbound identity.
    ARM assignment visibility does not guarantee that the linked service already honors access.
    Waited add/update commands recover only confirmed AdrMiNotAuthorized on the unchanged endpoint,
    rechecking required assignments and preserving identity and settings. --timeout (600 seconds) bounds
    mutation, polling and 30/60/120-second propagation backoff after initial RBAC preflight;
    --interval (30 seconds) controls polling. Success requires endpoint linkingState Succeeded.
    With --no-wait, use the matching link wait command to track completion.
    Use update, not add, for a persisted failure. Do not delete the linked DPS to retry it.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns link dps' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns link dps update --en --endpoint-name --name
                                  --namespace --ns
                                  --resource-group
                                  [--acquire-policy-token]
                                  [--change-reference]
                                  [--interval]
                                  [--mi-sa --system-assigned-mi {false, true}]
                                  [--mi-ua --user-assigned-mi]
                                  [--no-wait]
                                  [--timeout]
  examples:
  - summary: |-
      Rotate to a system-assigned identity on an existing DPS link
    syntax: az iot adr ns link dps update -n primary --ns myNamespace -g myResourceGroup --system-assigned-mi
  requiredParameters:
  - isRequired: true
    name: --en --endpoint-name --name -n
    summary: |-
      Logical name of the provisioning endpoint entry on the namespace.
  - isRequired: true
    name: --namespace --ns
    summary: |-
      Name of the Device Registry namespace that owns the link.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --interval
    summary: |-
      Positive polling interval in seconds. Default: 30.
    groupName: Wait Condition Arguments
  - name: --mi-sa --system-assigned-mi
    defaultValue: "False"
    acceptedValues: false, true
    summary: |-
      Use the linked DPS resource's system-assigned identity as the inbound caller identity. DPS must have that identity enabled.
    groupName: Inbound Caller Identity Arguments
  - name: --mi-ua --user-assigned-mi
    summary: |-
      Resource ID of a user-assigned identity attached to the linked DPS resource.
    groupName: Inbound Caller Identity Arguments
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Return after submission without observing endpoint readiness or recovering later failures.
  - name: --timeout
    summary: |-
      Positive mutation/recovery budget in seconds after initial RBAC preflight. Default: 600.
    groupName: Wait Condition Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
