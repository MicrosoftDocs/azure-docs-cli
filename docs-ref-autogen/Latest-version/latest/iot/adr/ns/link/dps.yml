### YamlMime:AzureCLIGroup
uid: az_iot_adr_ns_link_dps
name: az iot adr ns link dps
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **azure-iot** extension for the Azure CLI (version 2.73.0 or higher). The extension will automatically install the first time you run an **az iot adr ns link dps** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage DPS links (provisioning endpoints) on a Device Registry namespace.
description: |-
  Only one DPS may be linked per namespace today. Links live on the namespace, not on the
  DPS resource. Run link dps remove to remove its namespace endpoint. For a Succeeded
  link, delete the DPS resource first; Failed links do not require deleting it.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'iot adr ns link' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_iot_adr_ns_link_dps_add
  name: az iot adr ns link dps add
  summary: |-
    Link a Device Provisioning Service (DPS) to a Device Registry namespace.
  description: |-
    Adds a DPS provisioning endpoint entry under the namespace's properties.provisioning.endpoints.
    Rejected if the namespace already has a linked DPS (one DPS per namespace).
    Exactly one of --system-assigned-mi or --user-assigned-mi must be provided.
    Required service-to-service roles: namespace outbound MI -> Contributor on DPS; DPS selected inbound MI -> Azure Device Registry Contributor on namespace; DPS selected inbound MI -> Reader on namespace; namespace outbound MI -> Azure Device Registry Administrator on namespace; namespace outbound MI -> Reader on namespace resource group; namespace outbound MI -> Reader on DPS resource group; DPS selected MI -> IoT Hub Data Contributor on linked IoT Hubs.
    The namespace must also have a system-assigned identity enabled. Azure Device Registry
    Administrator on the namespace is granted to the selected outbound identity: SAMI when
    system-assigned outbound is selected, or the selected UAMI otherwise.
    No role is granted to the signed-in caller;
    DPS enrollment management with --auth-type login requires separate DPS data-plane access.
    The command reuses inherited assignments and creates only missing assignments when run by
    a caller who can create role assignments (for example Owner, User Access Administrator,
    or Role Based Access Control Administrator). Otherwise it stops before changing the namespace and prints the exact commands
    to run. A newly created assignment must become visible within 180 seconds.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns link dps' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns link dps add --dps-id --dps-resource-id
                               --en --endpoint-name --name
                               --namespace --ns
                               --resource-group
                               [--acquire-policy-token]
                               [--change-reference]
                               [--interval]
                               [--mi-sa --system-assigned-mi {false, true}]
                               [--mi-ua --user-assigned-mi]
                               [--no-wait]
                               [--timeout]
  examples:
  - summary: |-
      Link a DPS using the DPS resource's system-assigned identity
    syntax: >-
      az iot adr ns link dps add -n primary --ns myNamespace -g myResourceGroup \
        --dps-id /subscriptions/<sub>/resourceGroups/<rg>/providers/Microsoft.Devices/provisioningServices/<dps> \
        --system-assigned-mi
  - summary: |-
      Link a DPS with a user-assigned identity
    syntax: >-
      az iot adr ns link dps add -n primary --ns myNamespace -g myResourceGroup \
        --dps-id /subscriptions/<sub>/resourceGroups/<rg>/providers/Microsoft.Devices/provisioningServices/<dps> \
        --user-assigned-mi /subscriptions/<sub>/resourceGroups/<rg>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/<id>
  requiredParameters:
  - isRequired: true
    name: --dps-id --dps-resource-id
    summary: |-
      Azure resource ID of the Device Provisioning Service to link to this namespace.
  - isRequired: true
    name: --en --endpoint-name --name -n
    summary: |-
      Logical name of the provisioning endpoint entry on the namespace.
  - isRequired: true
    name: --namespace --ns
    summary: |-
      Name of the Device Registry namespace that owns the link.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --interval
    defaultValue: "30"
    summary: |-
      Positive polling interval in seconds. Default: 30.
    groupName: Wait Condition Arguments
  - name: --mi-sa --system-assigned-mi
    defaultValue: "False"
    acceptedValues: false, true
    summary: |-
      Use the linked DPS resource's system-assigned identity as the inbound caller identity. DPS must have that identity enabled.
    groupName: Inbound Caller Identity Arguments
  - name: --mi-ua --user-assigned-mi
    summary: |-
      Resource ID of a user-assigned identity attached to the linked DPS resource.
    groupName: Inbound Caller Identity Arguments
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Return after submission without observing endpoint readiness or recovering later failures.
  - name: --timeout
    defaultValue: "600"
    summary: |-
      Positive mutation/recovery budget in seconds after initial RBAC preflight. Default: 600.
    groupName: Wait Condition Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
