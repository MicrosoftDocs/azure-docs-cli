- uid: az_iot_adr_ns_link_dps_remove
  name: az iot adr ns link dps remove
  summary: |-
    Remove a DPS endpoint from a Device Registry namespace.
  description: |-
    Delete the linked DPS first; this command removes only the namespace endpoint.
    The namespace outbound identity needs Reader on the linked resource's resource group.
    A missing grant is created when you can create role assignments; it is kept after unlinking.
    Keep that resource group until the unlink completes.
    The command does not wait. Confirm removal with 'az iot adr ns show'.
    Avoid concurrent namespace updates while this command runs.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns link dps' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns link dps remove --en --endpoint-name --name
                                  --namespace --ns
                                  --resource-group
                                  [--acquire-policy-token]
                                  [--change-reference]
                                  [--yes {false, true}]
  examples:
  - summary: |-
      Remove an endpoint after its linked DPS has been deleted
    syntax: az iot adr ns link dps remove -n primary --ns myNamespace -g myResourceGroup --yes
  requiredParameters:
  - isRequired: true
    name: --en --endpoint-name --name -n
    summary: |-
      Logical name of the provisioning endpoint entry on the namespace.
  - isRequired: true
    name: --namespace --ns
    summary: |-
      Name of the Device Registry namespace that owns the link.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --yes -y
    acceptedValues: false, true
    summary: |-
      Skip user prompts. Indicates acceptance of action. Used primarily for automation scenarios. Default: false.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_iot_adr_ns_link_dps_show
  name: az iot adr ns link dps show
  summary: |-
    Show a single DPS provisioning endpoint on a Device Registry namespace.
  description: |-
    Inspect the named endpoint and decide which existing DPS Hubs to link to the namespace.
    When the DPS read succeeds, brownfieldHubs contains its properties.iotHubs[] list and
    brownfieldHubsAvailable is true. An empty list then means no Hubs are registered.
    If access or a service failure prevents that read, brownfieldHubs is null,
    brownfieldHubsAvailable is false, and a warning explains why. Namespace inspection
    still succeeds; unavailable data must not be treated as an empty DPS registration list.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns link dps' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns link dps show --en --endpoint-name --name
                                --namespace --ns
                                --resource-group
  examples:
  - summary: |-
      Show a DPS link by endpoint name (with brownfield Hubs when accessible)
    syntax: az iot adr ns link dps show -n primary --ns myNamespace -g myResourceGroup
  - summary: |-
      Show the endpoint linking state
    syntax: az iot adr ns link dps show -n primary --ns myNamespace -g myResourceGroup --query linkingState -o tsv
  requiredParameters:
  - isRequired: true
    name: --en --endpoint-name --name -n
    summary: |-
      Logical name of the provisioning endpoint entry on the namespace.
  - isRequired: true
    name: --namespace --ns
    summary: |-
      Name of the Device Registry namespace that owns the link.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
