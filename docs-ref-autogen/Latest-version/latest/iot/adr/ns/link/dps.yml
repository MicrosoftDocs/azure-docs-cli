- uid: az_iot_adr_ns_link_dps_remove
  name: az iot adr ns link dps remove
  summary: |-
    Remove a DPS endpoint from a Device Registry namespace.
  description: |-
    This command removes only the namespace endpoint, not the linked DPS.
    For a Succeeded link, delete the linked DPS first.
    Failed links do not require the linked resource to be deleted.
    For Succeeded links, the namespace outbound identity needs read access to the linked resource's
    resource group, or subscription if that group was deleted. Checks are advisory by default:
    uncertain access warns and continues without changing role assignments; ADR validates removal.
    --no-rbac-check skips only the advisory check, not ADR authorization. --yes skips only confirmation.
    For Succeeded links, --grant-reader requests missing Reader access at the linked resource's
    resource group, never its subscription. Reader covers all resources in that group.
    It requires role-assignment permission and cannot be combined with --no-rbac-check.
    Reader setup failures stop removal. Requested assignments are retained even if removal fails
    and can take several minutes to take effect; retry after propagation if ADR rejects removal.
    The command waits up to 600 seconds. --no-wait returns after submission but does not skip Reader setup.
    After --no-wait or a timeout, inspect completion with 'az iot adr ns show' before retrying.
    For permission-check limitations, deleted resource groups and concurrent updates, see:
    https://github.com/Azure/azure-iot-cli-extension/blob/release/1.1.0-preview/README.md#adr-link-troubleshooting.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns link dps' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns link dps remove --en --endpoint-name --name
                                  --namespace --ns
                                  --resource-group
                                  [--acquire-policy-token]
                                  [--change-reference]
                                  [--grant-reader]
                                  [--no-rbac-check]
                                  [--no-wait]
                                  [--yes {false, true}]
  examples:
  - summary: |-
      Remove an endpoint after its linked DPS has been deleted
    syntax: az iot adr ns link dps remove -n primary --ns myNamespace -g myResourceGroup --yes
  - summary: |-
      Submit endpoint removal without waiting for completion
    syntax: az iot adr ns link dps remove -n primary --ns myNamespace -g myResourceGroup --yes --no-wait
  - summary: |-
      Remove an endpoint without the advisory permission check
    syntax: az iot adr ns link dps remove -n primary --ns myNamespace -g myResourceGroup --yes --no-rbac-check
  - summary: |-
      Grant missing resource-group Reader access before removing a Succeeded endpoint
    syntax: az iot adr ns link dps remove -n primary --ns myNamespace -g myResourceGroup --yes --grant-reader
  requiredParameters:
  - isRequired: true
    name: --en --endpoint-name --name -n
    summary: |-
      Logical name of the provisioning endpoint entry on the namespace.
  - isRequired: true
    name: --namespace --ns
    summary: |-
      Name of the Device Registry namespace that owns the link.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --grant-reader
    defaultValue: "False"
    summary: |-
      For Succeeded links, assign missing Reader access to the namespace outbound identity on the linked resource's resource group. Requires permission to assign roles; never grants at subscription scope. Setup failures stop removal. Assignments are retained even if removal fails and can take several minutes to take effect. Cannot be combined with --no-rbac-check.
  - name: --no-rbac-check
    defaultValue: "False"
    summary: |-
      Skip the advisory outbound-identity read-permission check. Does not bypass confirmation, ETag validation or ADR service validation. Cannot be combined with --grant-reader.
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --yes -y
    acceptedValues: false, true
    summary: |-
      Skip user prompts. Indicates acceptance of action. Used primarily for automation scenarios. Default: false.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_iot_adr_ns_link_dps_show
  name: az iot adr ns link dps show
  summary: |-
    Show a single DPS provisioning endpoint on a Device Registry namespace.
  description: |-
    Inspect classic DPS Hub registrations to plan combined linking or dependent Failed-link recovery.
    When the DPS read succeeds, brownfieldHubs contains its properties.iotHubs[] list and
    brownfieldHubsAvailable is true. An empty list then means no Hubs are registered.
    If access or a service failure prevents that read, brownfieldHubs is null,
    brownfieldHubsAvailable is false, and a warning explains why. Namespace inspection
    still succeeds; unavailable data must not be treated as an empty DPS registration list.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns link dps' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns link dps show --en --endpoint-name --name
                                --namespace --ns
                                --resource-group
  examples:
  - summary: |-
      Show a DPS link by endpoint name (with brownfield Hubs when accessible)
    syntax: az iot adr ns link dps show -n primary --ns myNamespace -g myResourceGroup
  - summary: |-
      Show the endpoint linking state
    syntax: az iot adr ns link dps show -n primary --ns myNamespace -g myResourceGroup --query linkingState -o tsv
  requiredParameters:
  - isRequired: true
    name: --en --endpoint-name --name -n
    summary: |-
      Logical name of the provisioning endpoint entry on the namespace.
  - isRequired: true
    name: --namespace --ns
    summary: |-
      Name of the Device Registry namespace that owns the link.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
