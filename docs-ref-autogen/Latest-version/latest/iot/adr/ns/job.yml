### YamlMime:AzureCLIGroup
uid: az_iot_adr_ns_job
name: az iot adr ns job
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **azure-iot** extension for the Azure CLI (version 2.73.0 or higher). The extension will automatically install the first time you run an **az iot adr ns job** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Device Registry namespace jobs.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'iot adr ns' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_iot_adr_ns_job_create
  name: az iot adr ns job create
  summary: |-
    Create a job in a Device Registry namespace.
  description: |-
    PUT is a long-running operation. SoftwareUpdate jobs require a target group.
    OnboardingUpdate jobs target all compatible onboarding devices and do not
    accept a target group. Job definition fields are immutable after creation.

    The target group is specified by --target-group-name and must live in the
    same namespace and resource group as the job (cross-namespace targets are
    not supported in this preview release). The Software Update identity
    (--update-id-provider, --update-id-name, --update-id-version) is passed
    opaquely to the backend; no Software Updates preflight is performed.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns job' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns job create --jn --job-name --name
                             --namespace --ns
                             --resource-group
                             [--acquire-policy-token]
                             [--change-reference]
                             [--description]
                             [--display-name]
                             [--location]
                             [--no-wait]
                             [--tags]
                             [--target-group-name --tg]
                             [--type {OnboardingUpdate, SoftwareUpdate}]
                             [--un --update-id-name --update-name]
                             [--up --update-id-provider --update-provider]
                             [--update-id-version --update-version --uv]
  examples:
  - summary: |-
      Create a SoftwareUpdate job targeting a group
    syntax: >-
      az iot adr ns job create -n myJob --ns myNamespace -g myResourceGroup \
        --type SoftwareUpdate \
        --target-group-name myGroup \
        --update-id-provider Contoso --update-id-name gateway-firmware --update-id-version 1.2.3
  - summary: |-
      Create an OnboardingUpdate job
    syntax: >-
      az iot adr ns job create -n onboarding --ns myNamespace -g myResourceGroup \
        --type OnboardingUpdate \
        --update-id-provider Contoso --update-id-name gateway-firmware --update-id-version 1.2.3
  requiredParameters:
  - isRequired: true
    name: --jn --job-name --name -n
    summary: |-
      Name of the job.
  - isRequired: true
    name: --namespace --ns
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --description
    summary: |-
      Human-readable job description.
  - name: --display-name
    summary: |-
      Human-readable display name for the job.
  - name: --location -l
    summary: |-
      Location. Values from: `az account list-locations`. You can configure the default location using `az configure --defaults location=<location>`.
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --tags
    summary: |-
      Space-separated tags: key[=value] [key[=value] ...]. Use "" to clear existing tags.
  - name: --target-group-name --tg
    summary: |-
      Name of the target group. The group must live in the same namespace and resource group as the job; cross-namespace targets are not supported in this preview release.
  - name: --type
    defaultValue: SoftwareUpdate
    acceptedValues: OnboardingUpdate, SoftwareUpdate
    summary: |-
      Job type: SoftwareUpdate targets a group; OnboardingUpdate targets all compatible onboarding devices.
  - name: --un --update-id-name --update-name
    summary: |-
      Software Update updateId.name (e.g. 'gateway-firmware'). This is the update identity's name, distinct from the job's --name.
    groupName: Update Arguments
  - name: --up --update-id-provider --update-provider
    summary: |-
      Software Update updateId.provider (e.g. 'Contoso'). The update identity is a {provider, name, version} triple.
    groupName: Update Arguments
  - name: --update-id-version --update-version --uv
    summary: |-
      Software Update updateId.version (e.g. '1.2.3').
    groupName: Update Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_iot_adr_ns_job_delete
  name: az iot adr ns job delete
  summary: |-
    Delete a job from a Device Registry namespace.
  description: |-
    DELETE is a long-running operation. If any in-flight runs (status
    'Scheduled' or 'Active') exist for this job, a warning is
    surfaced before deletion; the backend cancels affected runs with reason
    'CanceledByCustomer'.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns job' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns job delete --jn --job-name --name
                             --namespace --ns
                             --resource-group
                             [--acquire-policy-token]
                             [--change-reference]
                             [--no-wait]
                             [--yes {false, true}]
  examples:
  - summary: |-
      Delete a job
    syntax: az iot adr ns job delete -n myJob --ns myNamespace -g myResourceGroup
  requiredParameters:
  - isRequired: true
    name: --jn --job-name --name -n
    summary: |-
      Name of the job.
  - isRequired: true
    name: --namespace --ns
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --yes -y
    acceptedValues: false, true
    summary: |-
      Skip user prompts. Indicates acceptance of action. Used primarily for automation scenarios. Default: false.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
