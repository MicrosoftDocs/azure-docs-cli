- uid: az_iot_adr_ns_job_schedule
  name: az iot adr ns job schedule
  summary: |-
    Schedule an execution of a Device Registry job.
  description: |-
    A job defines what to deploy and where; scheduling it creates a job run that
    tracks one execution. Schedule the same job as many times as you need.

    --scheduled-time is the only writable property on a run; every other property
    is populated by the service. Omit it to start immediately.

    --run-name is optional. When omitted, a UTC-timestamped name such as
    'run-20251201080000' is generated and returned in the response. Use
    'az iot adr ns job run' to show, cancel, or inspect the resulting run.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns job' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns job schedule --jn --job-name --name
                               --namespace --ns
                               --resource-group
                               [--acquire-policy-token]
                               [--change-reference]
                               [--no-wait]
                               [--rn --run-name]
                               [--scheduled-time --st]
  examples:
  - summary: |-
      Schedule a job to run immediately
    syntax: az iot adr ns job schedule -n myJob --ns myNamespace -g myResourceGroup
  - summary: |-
      Schedule a job for a specific UTC time with an explicit run name
    syntax: >-
      az iot adr ns job schedule -n myJob --ns myNamespace -g myResourceGroup \
        --run-name myRun --scheduled-time 2025-12-01T08:00:00Z
  requiredParameters:
  - isRequired: true
    name: --jn --job-name --name -n
    summary: |-
      Name of the job.
  - isRequired: true
    name: --namespace --ns
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --rn --run-name
    summary: |-
      Name of the job run to create. Defaults to a generated UTC-timestamped name such as 'run-20251201080000'.
  - name: --scheduled-time --st
    summary: |-
      Optional ISO 8601 UTC timestamp at which the run should start (e.g. '2025-12-01T08:00:00Z'). Omit to start immediately.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
