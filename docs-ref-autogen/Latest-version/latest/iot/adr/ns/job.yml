- uid: az_iot_adr_ns_job_update
  name: az iot adr ns job update
  summary: |-
    Update tags on a job in a Device Registry namespace.
  description: |-
    PATCH is synchronous and tags-only by design. The job's --type, target
    group, update identity, and scheduling fields are immutable after creation
    because mutating them would have unintended effects on already-scheduled
    runs. To change these, delete and recreate the job.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns job' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns job update --jn --job-name --name
                             --namespace --ns
                             --resource-group
                             [--acquire-policy-token]
                             [--change-reference]
                             [--tags]
  examples:
  - summary: |-
      Update job tags
    syntax: az iot adr ns job update -n myJob --ns myNamespace -g myResourceGroup --tags env=prod owner=platform
  - summary: |-
      Clear all job tags
    syntax: az iot adr ns job update -n myJob --ns myNamespace -g myResourceGroup --tags ""
  requiredParameters:
  - isRequired: true
    name: --jn --job-name --name -n
    summary: |-
      Name of the job.
  - isRequired: true
    name: --namespace --ns
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --tags
    summary: |-
      Space-separated tags: key[=value] [key[=value] ...]. Use "" to clear existing tags.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
