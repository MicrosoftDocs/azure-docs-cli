### YamlMime:AzureCLIGroup
uid: az_iot_adr_ns_su
name: az iot adr ns su
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **azure-iot** extension for the Azure CLI (version 2.73.0 or higher). The extension will automatically install the first time you run an **az iot adr ns su** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Software Updates for Device Registry namespaces.
description: |-
  Manages the Update Instance (Microsoft.DeviceUpdate/updateInstances) that powers
  Software Updates and the updates and device classes available through a linked
  Device Registry namespace. Namespace links remain under 'az iot adr ns link su'.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'iot adr ns' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
