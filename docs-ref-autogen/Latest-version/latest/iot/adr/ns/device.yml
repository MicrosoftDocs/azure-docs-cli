### YamlMime:AzureCLIGroup
uid: az_iot_adr_ns_device
name: az iot adr ns device
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **azure-iot** extension for the Azure CLI (version 2.73.0 or higher). The extension will automatically install the first time you run an **az iot adr ns device** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Registry Devices in a Device Registry namespace.
description: |-
  Registry Devices use the 2026-11-02-preview management API. Device creation does
  not itself issue credentials or create service capabilities. Authentication
  profiles and capabilities are materialized by the provisioning services.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'iot adr ns' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_iot_adr_ns_device_create
  name: az iot adr ns device create
  summary: |-
    Create or replace a Registry Device.
  description: |-
    Location defaults to the namespace location. External device ID is create-only.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns device' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns device create --device-name --dn --name
                                --namespace --ns
                                --resource-group
                                [--acquire-policy-token]
                                [--change-reference]
                                [--enablement-state {Disabled, Enabled}]
                                [--ext-id --external-device-id]
                                [--hardware-revision]
                                [--location]
                                [--manufacturer]
                                [--model]
                                [--no-wait]
                                [--software-revision]
                                [--tags]
  examples:
  - summary: |-
      Create an enabled device.
    syntax: az iot adr ns device create -n my-device --ns my-ns -g MyRG --external-device-id factory-device-1 --manufacturer Contoso
  requiredParameters:
  - isRequired: true
    name: --device-name --dn --name -n
    summary: |-
      Name of the Registry Device.
  - isRequired: true
    name: --namespace --ns
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --enablement-state
    defaultValue: Enabled
    acceptedValues: Disabled, Enabled
    summary: |-
      Whether the Registry Device is enabled or disabled.
  - name: --ext-id --external-device-id
    summary: |-
      Customer-provided device ID. This property is create-only.
  - name: --hardware-revision
    summary: |-
      Hardware revision of the Registry Device.
  - name: --location -l
    summary: |-
      Location. Values from: `az account list-locations`. You can configure the default location using `az configure --defaults location=<location>`.
  - name: --manufacturer
    summary: |-
      Manufacturer of the Registry Device.
  - name: --model
    summary: |-
      Model of the Registry Device.
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --software-revision
    summary: |-
      Software revision of the Registry Device.
  - name: --tags
    summary: |-
      Space-separated tags: key[=value] [key[=value] ...]. Use "" to clear existing tags.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_iot_adr_ns_device_delete
  name: az iot adr ns device delete
  summary: |-
    Delete a Registry Device.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns device' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns device delete --device-name --dn --name
                                --namespace --ns
                                --resource-group
                                [--acquire-policy-token]
                                [--change-reference]
                                [--no-wait]
                                [--yes {false, true}]
  examples:
  - summary: |-
      Delete a device and wait for its absence.
    syntax: >-
      az iot adr ns device delete -n my-device --ns my-ns -g MyRG --yes --no-wait

      az iot adr ns device wait -n my-device --ns my-ns -g MyRG --deleted
  requiredParameters:
  - isRequired: true
    name: --device-name --dn --name -n
    summary: |-
      Name of the Registry Device.
  - isRequired: true
    name: --namespace --ns
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --yes -y
    acceptedValues: false, true
    summary: |-
      Skip user prompts. Indicates acceptance of action. Used primarily for automation scenarios. Default: false.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
