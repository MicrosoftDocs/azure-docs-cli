- uid: az_iot_adr_ns_ca_create
  name: az iot adr ns ca create
  summary: |-
    Create a certificate authority for a Device Registry namespace.
  description: |-
    The certificate authority type determines the required associated properties:
    - Root: a service-managed self-signed root CA.
    - ICA with a Microsoft issuer: signed by a root CA in the same namespace. Pass the issuing
      CA's name with --issuer-ca-name.
    - ICA with an External issuer: signed by an external PKI. After creation the service returns
      a CSR; sign that CSR (do not generate a replacement ICA key) and complete activation with
      'az iot adr ns ca activate'. See activate help for a complete external ECC signing recipe.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns ca' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns ca create --ca-name --name
                            --ca-type --type {ICA, Root}
                            --namespace --ns
                            --resource-group
                            [--acquire-policy-token]
                            [--change-reference]
                            [--issuer-ca-name --issuer-certificate-authority-name]
                            [--issuer-type {External, Microsoft}]
                            [--key-type {ECC}]
                            [--location]
                            [--no-wait]
                            [--tags]
  examples:
  - summary: |-
      Create a service-managed root certificate authority
    syntax: az iot adr ns ca create -n myRootCA --ns myNamespace -g myResourceGroup --type Root
  - summary: |-
      Create a Microsoft-issued intermediate certificate authority
    syntax: >-
      az iot adr ns ca create -n myMicrosoftICA --ns myNamespace -g myResourceGroup \
        --type ICA --issuer-type Microsoft --issuer-ca-name myRootCA
  - summary: |-
      Create an externally issued intermediate certificate authority
    syntax: >-
      az iot adr ns ca create -n myExternalICA --ns myNamespace -g myResourceGroup \
        --type ICA --issuer-type External
  requiredParameters:
  - isRequired: true
    name: --ca-name --name -n
    summary: |-
      Name of the certificate authority.
  - isRequired: true
    name: --ca-type --type
    acceptedValues: ICA, Root
    summary: |-
      The certificate authority type. Use 'Root' for a service-managed self-signed root CA or 'ICA' for an intermediate CA.
  - isRequired: true
    name: --namespace --ns
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --issuer-ca-name --issuer-certificate-authority-name
    summary: |-
      Name of the same-namespace issuing root CA. Required with --issuer-type Microsoft.
  - name: --issuer-type
    acceptedValues: External, Microsoft
    summary: |-
      Issuer type for an ICA. Use 'Microsoft' for a same-namespace CA or 'External' for an external PKI.
  - name: --key-type
    acceptedValues: ECC
    summary: |-
      The cryptographic key type for the certificate authority.
  - name: --location -l
    summary: |-
      Location. Values from: `az account list-locations`. You can configure the default location using `az configure --defaults location=<location>`.
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --tags
    summary: |-
      Space-separated tags: key[=value] [key[=value] ...]. Use "" to clear existing tags.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
