- uid: az_iot_adr_ns_ca_revoke
  name: az iot adr ns ca revoke
  summary: |-
    Revoke and rotate an intermediate certificate authority issued by a Microsoft CA.
  description: |-
    Applies only to an ICA whose issuerType is 'Microsoft'. The service revokes the current
    certificate and issues a replacement signed by the same root CA.
    Successful waited revocation returns a fresh CA resource; --no-wait returns submission only
    without an added completion wait or output read. Microsoft issuers may not expose status or
    thumbprint. Fields are returned as supplied by the service. provisioningState describes the
    resource operation; it does not prove that an old certificate is rejected.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns ca' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns ca revoke --ca-name --name
                            --namespace --ns
                            --resource-group
                            [--acquire-policy-token]
                            [--change-reference]
                            [--no-wait]
                            [--yes {false, true}]
  examples:
  - summary: |-
      Revoke a certificate authority
    syntax: az iot adr ns ca revoke -n myCA --ns myNamespace -g myResourceGroup
  requiredParameters:
  - isRequired: true
    name: --ca-name --name -n
    summary: |-
      Name of the certificate authority.
  - isRequired: true
    name: --namespace --ns
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
