### YamlMime:AzureCLIGroup
uid: az_iot_adr_ns_su_instance
name: az iot adr ns su instance
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **azure-iot** extension for the Azure CLI (version 2.73.0 or higher). The extension will automatically install the first time you run an **az iot adr ns su instance** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage the Update Instance that powers Software Updates.
description: |-
  Update Instances are top-level Microsoft.DeviceUpdate resources. They are
  grouped here for Device Registry discoverability but are not namespace children.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'iot adr ns' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
