- uid: az_iot_adr_ns_su_instance_create
  name: az iot adr ns su instance create
  summary: |-
    Create an Update Instance.
  description: |-
    Creates a Microsoft.DeviceUpdate/updateInstances resource. Managed identity
    arguments can be combined and describe the complete desired identity state
    when supplied. Re-running create without either identity option preserves an
    existing instance's SAMI/UAMI configuration, tags, and service-managed state.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns su instance' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns su instance create --name
                                     --resource-group
                                     [--acquire-policy-token]
                                     [--change-reference]
                                     [--location]
                                     [--mi-sa --system-assigned-mi {false, true}]
                                     [--mi-ua --user-assigned-mi]
                                     [--no-wait]
                                     [--tags]
  examples:
  - summary: |-
      Create an instance with a system-assigned identity
    syntax: az iot adr ns su instance create -n myUpdateInstance -g myResourceGroup --location eastus2 --system-assigned-mi
  - summary: |-
      Create an instance with system- and user-assigned identities
    syntax: >-
      az iot adr ns su instance create -n myUpdateInstance -g myResourceGroup \
        --system-assigned-mi --user-assigned-mi /subscriptions/<sub>/resourceGroups/<rg>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/<identity>
  - summary: |-
      Replace an existing instance identity with a user-assigned-only configuration
    syntax: >-
      az iot adr ns su instance create -n myUpdateInstance -g myResourceGroup \
        --user-assigned-mi /subscriptions/<sub>/resourceGroups/<rg>/providers/Microsoft.ManagedIdentity/userAssignedIdentities/<identity>
  requiredParameters:
  - isRequired: true
    name: --name -n
    summary: |-
      Name of the Update Instance.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --location -l
    summary: |-
      Location. Values from: `az account list-locations`. You can configure the default location using `az configure --defaults location=<location>`.
  - name: --mi-sa --system-assigned-mi
    acceptedValues: false, true
    summary: |-
      Include or remove the system-assigned managed identity. On create-or-update, omitting all managed identity options preserves the existing identity.
  - name: --mi-ua --user-assigned-mi
    summary: |-
      Complete desired set of user-assigned managed identity resource IDs. On create-or-update, omitting all managed identity options preserves the existing identity.
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --tags
    summary: |-
      Space-separated tags: key[=value] [key[=value] ...]. Use "" to clear existing tags.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
