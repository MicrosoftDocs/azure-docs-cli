- uid: az_iot_adr_ns_su_instance_update
  name: az iot adr ns su instance update
  summary: |-
    Update an Update Instance's tags or managed identity.
  description: |-
    Identity options describe the complete desired identity state when supplied:
    --system-assigned-mi controls SAMI and --user-assigned-mi supplies the UAMI
    set. Omit both identity options to leave the existing identity unchanged.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns su instance' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns su instance update --name
                                     --resource-group
                                     [--acquire-policy-token]
                                     [--change-reference]
                                     [--mi-sa --system-assigned-mi {false, true}]
                                     [--mi-ua --user-assigned-mi]
                                     [--no-wait]
                                     [--tags]
  examples:
  - summary: |-
      Update tags
    syntax: az iot adr ns su instance update -n myUpdateInstance -g myResourceGroup --tags environment=test
  - summary: |-
      Set the identity to system-assigned
    syntax: az iot adr ns su instance update -n myUpdateInstance -g myResourceGroup --system-assigned-mi
  requiredParameters:
  - isRequired: true
    name: --name -n
    summary: |-
      Name of the Update Instance.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --mi-sa --system-assigned-mi
    acceptedValues: false, true
    summary: |-
      Include or remove the system-assigned managed identity. On create-or-update, omitting all managed identity options preserves the existing identity.
  - name: --mi-ua --user-assigned-mi
    summary: |-
      Complete desired set of user-assigned managed identity resource IDs. On create-or-update, omitting all managed identity options preserves the existing identity.
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --tags
    summary: |-
      Space-separated tags: key[=value] [key[=value] ...]. Use "" to clear existing tags.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
