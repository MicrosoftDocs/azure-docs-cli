directCommands:
- uid: az_iot_adr_ns_su_device-class_delete
  name: az iot adr ns su device-class delete
  summary: |-
    Delete a Software Updates device class.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns su device-class' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns su device-class delete --cid --class-id --device-class-id
                                         --name --namespace --ns
                                         --resource-group
                                         [--acquire-policy-token]
                                         [--change-reference]
                                         [--yes {false, true}]
  examples:
  - summary: |-
      Delete a device class without prompting
    syntax: >-
      az iot adr ns su device-class delete --ns myNamespace -g myResourceGroup \
        --device-class-id 0123456789abcdef --yes
  requiredParameters:
  - isRequired: true
    name: --cid --class-id --device-class-id
    summary: |-
      Device class identifier.
  - isRequired: true
    name: --name --namespace --ns -n
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --yes -y
    acceptedValues: false, true
    summary: |-
      Skip user prompts. Indicates acceptance of action. Used primarily for automation scenarios. Default: false.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
