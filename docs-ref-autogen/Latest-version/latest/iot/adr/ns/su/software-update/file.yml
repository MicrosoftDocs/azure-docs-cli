### YamlMime:AzureCLIGroup
uid: az_iot_adr_ns_su_software-update_file
name: az iot adr ns su software-update file
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **azure-iot** extension for the Azure CLI (version 2.73.0 or higher). The extension will automatically install the first time you run an **az iot adr ns su software-update file** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Inspect files belonging to an imported update.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'iot adr ns su software-update' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_iot_adr_ns_su_software-update_file_list
  name: az iot adr ns su software-update file list
  summary: |-
    List file identifiers for an imported update.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns su software-update file' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns su software-update file list --name --namespace --ns
                                               --resource-group
                                               --un --update-name
                                               --up --update-provider
                                               --update-version --uv
  examples:
  - summary: |-
      List files
    syntax: >-
      az iot adr ns su software-update file list --ns myNamespace -g myResourceGroup \
        --update-provider Contoso --update-name Thermostat --update-version 1.0
  requiredParameters:
  - isRequired: true
    name: --name --namespace --ns -n
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --un --update-name
    summary: |-
      Update name.
  - isRequired: true
    name: --up --update-provider
    summary: |-
      Update provider.
  - isRequired: true
    name: --update-version --uv
    summary: |-
      Update version.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_iot_adr_ns_su_software-update_file_show
  name: az iot adr ns su software-update file show
  summary: |-
    Show an imported update file.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns su software-update file' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns su software-update file show --name --namespace --ns
                                               --resource-group
                                               --ufid --update-file-id
                                               --un --update-name
                                               --up --update-provider
                                               --update-version --uv
  examples:
  - summary: |-
      Show a file
    syntax: >-
      az iot adr ns su software-update file show --ns myNamespace -g myResourceGroup \
        --update-provider Contoso --update-name Thermostat --update-version 1.0 \
        --update-file-id payload
  requiredParameters:
  - isRequired: true
    name: --name --namespace --ns -n
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --ufid --update-file-id
    summary: |-
      Update file identifier.
  - isRequired: true
    name: --un --update-name
    summary: |-
      Update name.
  - isRequired: true
    name: --up --update-provider
    summary: |-
      Update provider.
  - isRequired: true
    name: --update-version --uv
    summary: |-
      Update version.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_iot_adr_ns_su_software-update_file_list
- az_iot_adr_ns_su_software-update_file_show
metadata:
  description: Inspect files belonging to an imported update.
