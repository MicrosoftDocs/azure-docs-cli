### YamlMime:AzureCLIGroup
uid: az_iot_adr_ns_su_software-update_catalog_version
name: az iot adr ns su software-update catalog version
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **azure-iot** extension for the Azure CLI (version 2.73.0 or higher). The extension will automatically install the first time you run an **az iot adr ns su software-update catalog version** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Discover update versions for a provider and name.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'iot adr ns su software-update' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_iot_adr_ns_su_software-update_catalog_version_list
  name: az iot adr ns su software-update catalog version list
  summary: |-
    List update versions for a provider and name.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns su software-update catalog version' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns su software-update catalog version list --name --namespace --ns
                                                          --resource-group
                                                          --un --update-name
                                                          --up --update-provider
                                                          [--filter]
  examples:
  - summary: |-
      List versions
    syntax: >-
      az iot adr ns su software-update catalog version list --ns myNamespace \
        -g myResourceGroup --update-provider Contoso --update-name Thermostat
  requiredParameters:
  - isRequired: true
    name: --name --namespace --ns -n
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --un --update-name
    summary: |-
      Update name.
  - isRequired: true
    name: --up --update-provider
    summary: |-
      Update provider.
  optionalParameters:
  - name: --filter
    summary: |-
      Filter update versions by supported service properties.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_iot_adr_ns_su_software-update_catalog_version_list
metadata:
  description: Discover update versions for a provider and name.
