### YamlMime:AzureCLIGroup
uid: az_iot_adr_ns_su_software-update_init
name: az iot adr ns su software-update init
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **azure-iot** extension for the Azure CLI (version 2.73.0 or higher). The extension will automatically install the first time you run an **az iot adr ns su software-update init** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Create Software Updates import manifests locally.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'iot adr ns su software-update' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_iot_adr_ns_su_software-update_init_v5
  name: az iot adr ns su software-update init v5
  summary: |-
    Create a version 5 import manifest.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns su software-update init' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns su software-update init v5 --compat
                                             --step
                                             --un --update-name
                                             --up --update-provider
                                             --update-version --uv
                                             [--acquire-policy-token]
                                             [--change-reference]
                                             [--description]
                                             [--file]
                                             [--is-deployable {false, true}]
                                             [--no-validation {false, true}]
                                             [--related-file]
  examples:
  - summary: |-
      Create a simple manifest
    syntax: >-
      az iot adr ns su software-update init v5 --update-provider Contoso \
        --update-name Thermostat --update-version 1.0 \
        --compat manufacturer=Contoso model=T1000 \
        --step handler=microsoft/script:1 --file path=./install.sh
  requiredParameters:
  - isRequired: true
    name: --compat
    summary: |-
      Compatible device properties as key=value pairs. --compat can be used more than once.
  - isRequired: true
    name: --step
    summary: |-
      Manifest step properties as key=value pairs. --step can be used more than once.
  - isRequired: true
    name: --un --update-name
    summary: |-
      Update name.
  - isRequired: true
    name: --up --update-provider
    summary: |-
      Update provider.
  - isRequired: true
    name: --update-version --uv
    summary: |-
      Update version.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --description
    summary: |-
      Description for the import manifest.
  - name: --file
    summary: |-
      Manifest file properties as key=value pairs. --file can be used more than once.
  - name: --is-deployable
    acceptedValues: false, true
    summary: |-
      Whether the update is independently deployable.
  - name: --no-validation
    acceptedValues: false, true
    summary: |-
      Disable client-side import-manifest schema validation.
  - name: --related-file
    summary: |-
      Related-file properties as key=value pairs. Each entry is associated with the nearest --file.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_iot_adr_ns_su_software-update_init_v5
metadata:
  description: Create Software Updates import manifests locally.
