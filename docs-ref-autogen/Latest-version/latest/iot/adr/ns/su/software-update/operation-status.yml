### YamlMime:AzureCLIGroup
uid: az_iot_adr_ns_su_software-update_operation-status
name: az iot adr ns su software-update operation-status
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **azure-iot** extension for the Azure CLI (version 2.73.0 or higher). The extension will automatically install the first time you run an **az iot adr ns su software-update operation-status** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Inspect asynchronous Software Updates operations.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'iot adr ns su software-update' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_iot_adr_ns_su_software-update_operation-status_list
  name: az iot adr ns su software-update operation-status list
  summary: |-
    List retained Software Updates operation statuses.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns su software-update operation-status' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns su software-update operation-status list --name --namespace --ns
                                                           --resource-group
  examples:
  - summary: |-
      List import operation statuses
    syntax: az iot adr ns su software-update operation-status list --ns myNamespace -g myResourceGroup
  requiredParameters:
  - isRequired: true
    name: --name --namespace --ns -n
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_iot_adr_ns_su_software-update_operation-status_show
  name: az iot adr ns su software-update operation-status show
  summary: |-
    Show a Software Updates operation status.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns su software-update operation-status' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns su software-update operation-status show --id --operation-id
                                                           --name --namespace --ns
                                                           --resource-group
  examples:
  - summary: |-
      Follow up a no-wait import
    syntax: >-
      az iot adr ns su software-update operation-status show --ns myNamespace \
        -g myResourceGroup --operation-id 00000000-0000-0000-0000-000000000000
  requiredParameters:
  - isRequired: true
    name: --id --operation-id
    summary: |-
      Software Update import or delete operation identifier.
  - isRequired: true
    name: --name --namespace --ns -n
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
commands:
- az_iot_adr_ns_su_software-update_operation-status_list
