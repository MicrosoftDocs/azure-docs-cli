- uid: az_iot_adr_ns_su_software-update_stage
  name: az iot adr ns su software-update stage
  summary: |-
    Stage local update artifacts and optionally import them.
  description: |-
    Validates local manifest payload sizes and SHA-256 hashes, uploads each manifest
    and its files to Azure Storage, and reuses matching staged blobs. File references
    must name files in the same directory as their manifest. Without --then-import,
    no SAS URLs are generated or returned. With --then-import, fresh read-only SAS
    URLs are generated and all manifests are submitted in one import request.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns su software-update' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns su software-update stage --manifest-path
                                           --name --namespace --ns
                                           --resource-group
                                           --storage-account
                                           --storage-container
                                           [--acquire-policy-token]
                                           [--change-reference]
                                           [--enable-scan {false, true}]
                                           [--friendly-name]
                                           [--no-wait]
                                           [--overwrite {false, true}]
                                           [--sas-expiry-hours]
                                           [--storage-prefix]
                                           [--storage-subscription]
                                           [--then-import {false, true}]
  examples:
  - summary: |-
      Stage a single update without importing it
    syntax: >-
      az iot adr ns su software-update stage --ns myNamespace -g myResourceGroup \
        --manifest-path ./manifest.json --storage-account mystorage \
        --storage-container updates
  - summary: |-
      Stage and import a multi-reference update
    syntax: >-
      az iot adr ns su software-update stage --ns myNamespace -g myResourceGroup \
        --manifest-path ./root.json --manifest-path ./leaf.json \
        --storage-account /subscriptions/<sub>/resourceGroups/<rg>/providers/Microsoft.Storage/storageAccounts/mystorage \
        --storage-container updates --then-import --enable-scan
  requiredParameters:
  - isRequired: true
    name: --manifest-path
    summary: |-
      Local import manifest path. Use --manifest-path more than once for a multi-reference update, with the root manifest first.
  - isRequired: true
    name: --name --namespace --ns -n
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --storage-account
    summary: |-
      Storage account name or ARM resource ID used to stage artifacts.
    groupName: Storage Arguments
  - isRequired: true
    name: --storage-container
    summary: |-
      Blob container used to stage artifacts.
    groupName: Storage Arguments
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --enable-scan
    acceptedValues: false, true
    summary: |-
      Request malware scanning when --then-import is used.
  - name: --friendly-name
    summary: |-
      Friendly name applied to the first, root manifest.
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --overwrite
    defaultValue: "False"
    acceptedValues: false, true
    summary: |-
      Replace staged blobs whose content differs from local artifacts.
    groupName: Storage Arguments
  - name: --sas-expiry-hours
    defaultValue: "4"
    summary: |-
      Read-only SAS lifetime used by --then-import. Defaults to 4 hours.
    groupName: Storage Arguments
  - name: --storage-prefix
    summary: |-
      Blob name prefix. Defaults to 'deviceupdate'.
    groupName: Storage Arguments
  - name: --storage-subscription
    summary: |-
      Storage account subscription. Use when the storage account is in a different subscription and is specified by name.
    groupName: Storage Arguments
  - name: --then-import
    defaultValue: "False"
    acceptedValues: false, true
    summary: |-
      Import all staged manifests in one request after uploading.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_iot_adr_ns_su_software-update_wait
  name: az iot adr ns su software-update wait
  summary: |-
    Wait for an imported Software Update condition.
  description: |-
    The Software Update model has no lifecycle status. Without an explicit wait
    predicate, a successful GET means the imported update is materialized and ready.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns su software-update' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns su software-update wait --name --namespace --ns
                                          --resource-group
                                          --un --update-name
                                          --up --update-provider
                                          --update-version --uv
                                          [--acquire-policy-token]
                                          [--change-reference]
                                          [--created]
                                          [--custom]
                                          [--deleted]
                                          [--exists]
                                          [--interval]
                                          [--timeout]
                                          [--updated]
  examples:
  - summary: |-
      Wait until an imported update exists
    syntax: >-
      az iot adr ns su software-update wait --ns myNamespace -g myResourceGroup \
        --update-provider Contoso --update-name Thermostat --update-version 1.0
  requiredParameters:
  - isRequired: true
    name: --name --namespace --ns -n
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --un --update-name
    summary: |-
      Update name.
  - isRequired: true
    name: --up --update-provider
    summary: |-
      Update provider.
  - isRequired: true
    name: --update-version --uv
    summary: |-
      Update version.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --created
    defaultValue: "False"
    summary: |-
      Wait until the software update exists. Software updates have no provisioningState.
    groupName: Wait Condition Arguments
  - name: --custom
    summary: |-
      Wait until a custom JMESPath expression evaluates to true.
    groupName: Wait Condition Arguments
  - name: --deleted
    defaultValue: "False"
    summary: |-
      Wait until the resource is deleted.
    groupName: Wait Condition Arguments
  - name: --exists
    defaultValue: "False"
    summary: |-
      Wait until the resource exists.
    groupName: Wait Condition Arguments
  - name: --interval
    defaultValue: "30"
    summary: |-
      Polling interval in seconds.
    groupName: Wait Condition Arguments
  - name: --timeout
    defaultValue: "3600"
    summary: |-
      Polling budget in seconds, including GET time. An in-flight GET is bounded by transport timeouts and cannot be interrupted by this polling deadline.
    groupName: Wait Condition Arguments
  - name: --updated
    defaultValue: "False"
    summary: |-
      Wait until the software update exists. Software updates have no provisioningState.
    groupName: Wait Condition Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
