### YamlMime:AzureCLIGroup
uid: az_iot_adr_ns_su_software-update
name: az iot adr ns su software-update
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **azure-iot** extension for the Azure CLI (version 2.73.0 or higher). The extension will automatically install the first time you run an **az iot adr ns su software-update** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Import and manage Software Updates content.
description: |-
  Uses the data-plane serviceAddress materialized on the namespace's Software
  Updates link. The link must finish provisioning before these commands can run.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'iot adr ns' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_iot_adr_ns_su_software-update_calculate-hash
