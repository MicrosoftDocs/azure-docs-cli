- uid: az_iot_adr_ns_su_software-update_import
  name: az iot adr ns su software-update import
  summary: |-
    Import an update into Software Updates.
  description: |-
    Imports a v5 manifest from a read-accessible URL. When --size or --hashes is
    omitted, the CLI streams the manifest to calculate its size and SHA-256 hash.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns su software-update' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns su software-update import --name --namespace --ns
                                            --resource-group
                                            --url
                                            [--acquire-policy-token]
                                            [--change-reference]
                                            [--enable-scan {false, true}]
                                            [--file]
                                            [--friendly-name]
                                            [--hashes]
                                            [--no-wait]
                                            [--size]
  examples:
  - summary: |-
      Import a manifest and one payload file
    syntax: >-
      az iot adr ns su software-update import --ns myNamespace -g myResourceGroup \
        --url "https://storage.example/manifest.json?<sas>" \
        --file filename=payload.bin url="https://storage.example/payload.bin?<sas>"
  requiredParameters:
  - isRequired: true
    name: --name --namespace --ns -n
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --url
    summary: |-
      Read-accessible URL of the update import manifest.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --enable-scan
    acceptedValues: false, true
    summary: |-
      Request malware scanning for the imported update.
  - name: --file
    summary: |-
      Update file metadata as filename=FILE_NAME url=READ_ACCESSIBLE_URL. --file can be used more than once.
  - name: --friendly-name
    summary: |-
      Friendly name associated with the imported update.
  - name: --hashes
    summary: |-
      Manifest hashes as key=value pairs. A sha256 value is required. Calculated from --url when omitted.
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --size
    summary: |-
      Import manifest size in bytes. Calculated from --url when omitted.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
