### YamlMime:AzureCLIGroup
uid: az_iot_adr_ns_report
name: az iot adr ns report
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **azure-iot** extension for the Azure CLI (version 2.73.0 or higher). The extension will automatically install the first time you run an **az iot adr ns report** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Device Registry update-compliance reports.
status: Preview
isPreview: true
previewOrExperimentalInfo: "Command group 'iot adr ns' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
sourceType: Extension
directCommands:
- uid: az_iot_adr_ns_report_generate
  name: az iot adr ns report generate
  summary: |-
    Generate an update-compliance report.
  description: |-
    Wait for generation to complete, then retrieve the latest report for the same type and group.
    With --no-wait, return the operation immediately without retrieving a report.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot adr ns report' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot adr ns report generate --namespace --ns
                                  --resource-group
                                  [--acquire-policy-token]
                                  [--change-reference]
                                  [--gn --group-name]
                                  [--no-wait]
                                  [--report-type --type {GroupBestUpdatesComplianceReport, GroupInstallableUpdatesReport, NamespaceUpdateComplianceReport}]
  examples:
  - summary: |-
      Generate a namespace update-compliance report
    syntax: az iot adr ns report generate --ns myNamespace -g myResourceGroup --report-type NamespaceUpdateComplianceReport
  - summary: |-
      Generate a group best-updates report
    syntax: az iot adr ns report generate --ns myNamespace -g myResourceGroup --report-type GroupBestUpdatesComplianceReport --group-name myGroup
  requiredParameters:
  - isRequired: true
    name: --namespace --ns
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --gn --group-name
    summary: |-
      Name of the device group. Required for group report types. The report identifies the group by its UUID (reportTarget).
  - name: --no-wait
    defaultValue: "False"
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --report-type --type
    defaultValue: NamespaceUpdateComplianceReport
    acceptedValues: GroupBestUpdatesComplianceReport, GroupInstallableUpdatesReport, NamespaceUpdateComplianceReport
    summary: |-
      Type of update compliance report.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_iot_adr_ns_report_latest
