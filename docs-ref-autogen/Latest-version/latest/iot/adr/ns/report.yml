      Show the latest namespace update-compliance report
    syntax: az iot adr ns report latest --ns myNamespace -g myResourceGroup --report-type NamespaceUpdateComplianceReport
  requiredParameters:
  - isRequired: true
    name: --namespace --ns
    summary: |-
      Name of the Device Registry namespace.
  - isRequired: true
