### YamlMime:AzureCLIGroup
uid: az_iot_hub_topic-group
name: az iot hub topic-group
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **azure-iot** extension for the Azure CLI (version 2.73.0 or higher). The extension will automatically install the first time you run an **az iot hub topic-group** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage MQTT 5 topic groups for an IoT Hub.
description: |-
  Topic groups are supported only for IoT Hubs using the MqttV5 connection profile.
status: Preview
isPreview: true
previewOrExperimentalInfo: 'This command group is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus'
sourceType: Extension
directCommands:
- uid: az_iot_hub_topic-group_create
  name: az iot hub topic-group create
  summary: |-
    Create an MQTT 5 topic group.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot hub topic-group' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot hub topic-group create --hub-name
                                  --topic-group-id
                                  --topic-templates
                                  [--acquire-policy-token]
                                  [--change-reference]
                                  [--resource-group]
  examples:
  - summary: |-
      Create a topic group with multiple topic templates.
    syntax: az iot hub topic-group create -n {iothub_name} --topic-group-id {topic_group_id} --topic-templates {topic_template_1} {topic_template_2}
  requiredParameters:
  - isRequired: true
    name: --hub-name -n
    summary: |-
      IoT Hub name.
  - isRequired: true
    name: --topic-group-id
    summary: |-
      Customer-defined identifier of the topic group.
  - isRequired: true
    name: --topic-templates
    summary: |-
      Provide one or more space-separated topic templates.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
- uid: az_iot_hub_topic-group_delete
  name: az iot hub topic-group delete
  summary: |-
    Delete one or all MQTT 5 topic groups.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: "Command group 'iot hub topic-group' is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus"
  sourceType: Extension
  syntax: >-
    az iot hub topic-group delete [--acquire-policy-token]
                                  [--all]
                                  [--change-reference]
                                  [--hub-name]
                                  [--ids]
                                  [--resource-group]
                                  [--subscription]
                                  [--topic-group-id]
                                  [--yes {false, true}]
  examples:
  - summary: |-
      Delete a topic group.
    syntax: az iot hub topic-group delete -n {iothub_name} --topic-group-id {topic_group_id}
  - summary: |-
      Delete all topic groups without prompting.
    syntax: az iot hub topic-group delete -n {iothub_name} --all --yes
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --all
    defaultValue: "False"
    summary: |-
      Delete all topic groups.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --hub-name -n
    summary: |-
      IoT Hub name.
    groupName: Resource Id Arguments
  - name: --ids
    summary: |-
      One or more resource IDs (space-delimited). It should be a complete resource ID containing all information of 'Resource Id' arguments. You should provide either --ids or other 'Resource Id' arguments.
    groupName: Resource Id Arguments
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
    groupName: Resource Id Arguments
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
    groupName: Resource Id Arguments
  - name: --topic-group-id
    summary: |-
      Customer-defined identifier of the topic group.
  - name: --yes -y
    defaultValue: "False"
    acceptedValues: false, true
    summary: |-
      Do not prompt for confirmation when deleting all topic groups.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
