### YamlMime:AzureCLIGroup
uid: az_iot_ops_ns_asset_mgmt-action
name: az iot ops ns asset mgmt-action
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **azure-iot-ops** extension for the Azure CLI (version 2.70.0 or higher). The extension will automatically install the first time you run an **az iot ops ns asset mgmt-action** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage actions for asset management groups in IoT Operations namespaces.
description: |-
  The connector type is detected automatically from the existing asset. For connector-specific parameters use --action-config (inline JSON or file). Use --show-template to discover the supported configuration schema for the asset's connector type.
status: GA
sourceType: Extension
directCommands:
- uid: az_iot_ops_ns_asset_mgmt-action_add
  name: az iot ops ns asset mgmt-action add
  summary: |-
    Add an action to an asset management group in an IoT Operations namespace.
  description: |-
    The connector type is detected from the asset's device endpoint. Connector-specific configuration can be supplied via --action-config. Use --show-template to discover the supported config schema. For non-OPC UA connectors, a connector template must exist in the instance.
  status: Preview
  isPreview: true
  previewOrExperimentalInfo: 'This command is in preview and under development. Reference and support levels: https://aka.ms/CLI_refstatus'
  sourceType: Extension
  syntax: >-
    az iot ops ns asset mgmt-action add --asset
                                        --group
                                        --instance
                                        --name
                                        --resource-group
                                        [--ac --action-config]
                                        [--acquire-policy-token]
                                        [--action-type --at {Call, Read, Write}]
                                        [--change-reference]
                                        [--replace {false, true}]
                                        [--show-template {config, schema}]
                                        [--target-uri --uri]
                                        [--timeout --to]
                                        [--topic]
                                        [--tr --type-ref]
  examples:
  - summary: |-
      Add a basic action to any asset type
    syntax: az iot ops ns asset mgmt-action add --asset myasset --instance myInstance -g myInstanceResourceGroup --group boilerControls --name restart --target-uri "opc.tcp://boiler/restart"
  - summary: |-
      Show the action config template for the asset's connector type
    syntax: az iot ops ns asset mgmt-action add --asset myasset --instance myInstance -g myInstanceResourceGroup --group boilerControls --name restart --show-template config
  - summary: |-
      Add an action with connector-specific configuration from inline JSON
    syntax: "az iot ops ns asset mgmt-action add --asset myasset --instance myInstance -g myInstanceResourceGroup --group boilerControls --name restart --target-uri \"opc.tcp://boiler/restart\" --action-config '{\"actionConfiguration\": {\"retryCount\": 3}}'"
  - summary: |-
      Add an action with configuration from a file
    syntax: az iot ops ns asset mgmt-action add --asset myasset --instance myInstance -g myInstanceResourceGroup --group boilerControls --name restart --target-uri "opc.tcp://boiler/restart" --action-config ./action_config.json
  - summary: |-
      Replace an existing action
    syntax: az iot ops ns asset mgmt-action add --asset myasset --instance myInstance -g myInstanceResourceGroup --group boilerControls --name restart --target-uri "opc.tcp://boiler/restart" --replace
  requiredParameters:
  - isRequired: true
    name: --asset -a
    summary: |-
      Asset name.
  - isRequired: true
    name: --group
    summary: |-
      Management group name.
  - isRequired: true
    name: --instance -i
    summary: |-
      The name of the Azure IoT Operations instance.
  - isRequired: true
    name: --name -n
    summary: |-
      Action name.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      The resource group of the Azure IoT Operations instance.
  optionalParameters:
  - name: --ac --action-config
    summary: |-
      Inline JSON string or path to a JSON/YAML file (.json, .yaml, .yml) containing connector-specific action configuration. The accepted key is 'actionConfiguration' (connector-specific config object). Use --show-template to discover the supported keys and schema for the asset's connector type. Cannot be combined with --show-template. For non-OPC UA connectors, a connector template must exist in the instance.
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --action-type --at
    defaultValue: Call
    acceptedValues: Call, Read, Write
    summary: |-
      Type of management action.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --replace
    defaultValue: "False"
    acceptedValues: false, true
    summary: |-
      Replace the action if another action with the same name is already present.
  - name: --show-template
    acceptedValues: config, schema
    summary: |-
      Show a starter action configuration template for the asset's connector type and exit without modifying the action. The connector type is read from the existing asset. config: fields shown with their default values (null if no default); output is directly usable as --action-config input. schema: every field includes type, default, and constraints (min, max, enum, pattern). Draft-07 $ref pointers (#/definitions/...) are resolved inline in both modes.
  - name: --target-uri --uri
    summary: |-
      Target URI for the management action.
  - name: --timeout --to
    summary: |-
      Timeout in seconds for this specific action. Minimum: 0.
  - name: --topic -t
    summary: |-
      Topic override for this specific action.
  - name: --tr --type-ref
    summary: |-
      Type definition ID or URI.
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
