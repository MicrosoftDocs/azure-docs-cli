### YamlMime:AzureCLIGroup
uid: az_iot_adr
name: az iot adr
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **azure-iot** extension for the Azure CLI (version 2.73.0 or higher). The extension will automatically install the first time you run an **az iot adr** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Azure Device Registry (ADR) resources.
description: |-
  Preview APIs support the Azure public cloud only. ADR management clients default to
  https://management.azure.com. Set
  AZURE_IOT_ADR_ARM_ENDPOINT=https://centraluseuap.management.azure.com to use canary ARM for ADR
  namespaces, Update Instances, and link-target management requests.
status: GA
sourceType: Extension
