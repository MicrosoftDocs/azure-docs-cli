### YamlMime:AzureCLIGroup
uid: az_neuroshield
name: az neuroshield
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **neuroshield** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az neuroshield** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Neuro Shield.
status: GA
sourceType: Extension
directCommands:
- uid: az_neuroshield_create
  name: az neuroshield create
  summary: |-
    Create a NeuroShield resource.
  status: GA
  sourceType: Extension
  syntax: >-
    az neuroshield create --name --neuroshield-name
                          --resource-group
                          --response-mode {Auto, Manual}
                          [--acquire-policy-token]
                          [--change-reference]
                          [--description]
                          [--if-match]
                          [--location]
                          [--severity-threshold {Critical, High, Low, Medium}]
                          [--tags]
  examples:
  - summary: |-
      Create or update NeuroShield resource
    syntax: az neuroshield create --resource-group myResourceGroup --neuroshield-name myNeuroShield --location eastus2 --tags "{env:test}" --response-mode Manual --severity-threshold Medium --description Test NeuroShield resource
  - summary: |-
      Create or update NeuroShield with omitted optional properties
    syntax: az neuroshield create --resource-group myResourceGroup --neuroshield-name myNeuroShield --location eastus2 --response-mode Manual
  requiredParameters:
  - isRequired: true
    name: --name --neuroshield-name -n
    summary: |-
      The name of the NeuroShield resource.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --response-mode
    acceptedValues: Auto, Manual
    summary: |-
      Response mode that controls mitigation serving behavior. A full create or update (PUT) request must specify Auto or Manual; there is no default. Omitting responseMode from a PATCH request preserves the existing mode.
    groupName: Properties Arguments
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --description
    summary: |-
      Human-readable description of the NeuroShield resource. Omission in a full PUT request resolves to an empty string. Control characters other than tab, line feed, and carriage return are not allowed.
    groupName: Properties Arguments
  - name: --if-match
    summary: |-
      The entity tag that makes the request conditional.
  - name: --location -l
    summary: |-
      The geo-location where the resource lives  When not specified, the location of the resource group will be used.
    groupName: Resource Arguments
  - name: --severity-threshold
    acceptedValues: Critical, High, Low, Medium
    summary: |-
      Minimum severity level for mitigation generation. Omission in a full PUT request resolves to Low; omission in PATCH preserves the value.
    groupName: Properties Arguments
  - name: --tags
    summary: |-
      Resource tags.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Resource Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
