- uid: az_neuroshield_update
  name: az neuroshield update
  summary: |-
    Update a NeuroShield resource.
  status: GA
  sourceType: Extension
  syntax: >-
    az neuroshield update [--acquire-policy-token]
                          [--add]
                          [--change-reference]
                          [--description]
                          [--force-string {0, 1, f, false, n, no, t, true, y, yes}]
                          [--ids]
                          [--if-match]
                          [--name --neuroshield-name]
                          [--remove]
                          [--resource-group]
                          [--response-mode {Auto, Manual}]
                          [--set]
                          [--severity-threshold {Critical, High, Low, Medium}]
                          [--subscription]
                          [--tags]
  examples:
  - summary: |-
      Update the response mode and severity threshold of a NeuroShield
    syntax: az neuroshield update -g myResourceGroup -n myNeuroShield --response-mode Manual --severity-threshold Medium
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --add
    summary: |-
      Add an object to a list of objects by specifying a path and key value pairs.  Example: `--add property.listProperty <key=value, string or JSON string>`.
    groupName: Generic Update Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --description
    summary: |-
      Human-readable description of the NeuroShield resource. Omission in a full PUT request resolves to an empty string. Control characters other than tab, line feed, and carriage return are not allowed.
    groupName: Properties Arguments
  - name: --force-string
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      When using 'set' or 'add', preserve string literals instead of attempting to convert to JSON.
    groupName: Generic Update Arguments
  - name: --ids
    summary: |-
      One or more resource IDs (space-delimited). It should be a complete resource ID containing all information of 'Resource Id' arguments. You should provide either --ids or other 'Resource Id' arguments.
    groupName: Resource Id Arguments
  - name: --if-match
    summary: |-
      The entity tag that makes the request conditional.
  - name: --name --neuroshield-name -n
    summary: |-
      The name of the NeuroShield resource.
    groupName: Resource Id Arguments
  - name: --remove
    summary: |-
      Remove a property or an element from a list.  Example: `--remove property.list <indexToRemove>` OR `--remove propertyToRemove`.
    groupName: Generic Update Arguments
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
    groupName: Resource Id Arguments
  - name: --response-mode
    acceptedValues: Auto, Manual
    summary: |-
      Response mode that controls mitigation serving behavior. A full create or update (PUT) request must specify Auto or Manual; there is no default. Omitting responseMode from a PATCH request preserves the existing mode.
    groupName: Properties Arguments
  - name: --set
    summary: |-
      Update an object by specifying a property path and value to set.  Example: `--set property1.property2=<value>`.
    groupName: Generic Update Arguments
  - name: --severity-threshold
    acceptedValues: Critical, High, Low, Medium
    summary: |-
      Minimum severity level for mitigation generation. Omission in a full PUT request resolves to Low; omission in PATCH preserves the value.
    groupName: Properties Arguments
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
    groupName: Resource Id Arguments
  - name: --tags
    summary: |-
      Resource tags.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Resource Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
