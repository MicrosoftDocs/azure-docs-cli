### YamlMime:AzureCLIGroup
uid: az_mission_virtual-enclave
name: az mission virtual-enclave
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **mission** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az mission virtual-enclave** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Virtual Enclave.
status: GA
sourceType: Extension
directCommands:
- uid: az_mission_virtual-enclave_create
  name: az mission virtual-enclave create
  summary: |-
    Create a EnclaveResource.
  status: GA
  sourceType: Extension
  syntax: >-
    az mission virtual-enclave create --name --virtual-enclave-name
                                      --resource-group
                                      [--acquire-policy-token]
                                      [--approval-settings]
                                      [--bastion-enabled {0, 1, f, false, n, no, t, true, y, yes}]
                                      [--change-reference]
                                      [--community-resource-id]
                                      [--dedicated-hub-resource-id]
                                      [--enclave-default-settings]
                                      [--enclave-role-assignments]
                                      [--enclave-virtual-network]
                                      [--governed-service-list]
                                      [--location]
                                      [--maintenance-mode-configuration]
                                      [--mi-system-assigned --system-assigned]
                                      [--mi-user-assigned --user-assigned]
                                      [--monitoring-settings]
                                      [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                      [--rbac-inheritance {Disabled, Enabled}]
                                      [--tags]
                                      [--workload-resource-visibility {Disabled, Enabled}]
                                      [--workload-role-assignments]
  examples:
  - summary: |-
      VirtualEnclave_CreateOrUpdate
    syntax: az mission virtual-enclave create --resource-group rgopenapi --virtual-enclave-name TestMyEnclave --type SystemAssigned,UserAssigned --user-assigned-identities "{/subscriptions/subid/resourceGroups/default-azurebatch-japaneast/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id1:{}}" --enclave-virtual-network "{network-size:small,custom-cidr-range:10.0.0.0/24,subnet-configurations:[{subnet-name:test,network-prefix-size:26}],allow-subnet-communication:True}" --community-resource-id /subscriptions/c64f6eca-bdc5-4bc2-88d6-f8f1dc23f86c/resourceGroups/TestMyRg/providers/microsoft.mission/communities/TestMyCommunity --enclave-default-settings "{diagnostic-destination:Both}" --maintenance-mode-configuration "{mode:Off,principals:[{id:355a6bb0-abc0-4cba-000d-12a345b678c9,type:User}],justification:Off}" --dedicated-hub-resource-id /subscriptions/c64f6eca-bdc5-4bc2-88d6-f8f1dc23f86c/resourceGroups/TestResourceGroup/providers/Microsoft.Mission/communities/TestMyCommunity/dedicatedHubs/TestDedicatedHub --bastion-enabled True --workload-resource-visibility Disabled --rbac-inheritance Disabled --enclave-role-assignments "[{roleDefinitionId:b24988ac-6180-42a0-ab88-20f7382dd24c,principals:[{id:355a6bb0-abc0-4cba-000d-12a345b678c9,type:User},{id:355a6bb0-abc0-4cba-000d-12a345b678c0,type:User}],condition:'@RoleDefinition.Name StringNotEquals '/Owner'/'},{roleDefinitionId:18d7d88d-d35e-4fb5-a5c3-7773c20a72d9,principals:[{id:355a6bb0-abc0-4cba-000d-12a345b678c9,type:User}]}]" --workload-role-assignments "[{roleDefinitionId:d73bb868-a0df-4d4d-bd69-98a00b01fccb,principals:[{id:01234567-89ab-ef01-2345-0123456789ab,type:Group}],condition:'@RoleDefinition.Name StringNotEquals '/Owner'/'},{roleDefinitionId:fb879df8-f326-4884-b1cf-06f3ad86be52,principals:[{id:01234567-89ab-ef01-2345-0123456789ab,type:Group}]}]" --approval-settings "{enclave-endpoint-update:{approvalPolicy:Required,minimumApproversRequired:1,mandatoryApprovers:[{approverEntraId:00000000-0000-0000-0000-000000000001}]},connection-creation:{approvalPolicy:Required,minimumApproversRequired:2,mandatoryApprovers:[{approverEntraId:00000000-0000-0000-0000-000000000002}]},connection-update:{approvalPolicy:Required,minimumApproversRequired:1},enclave-maintenance-mode:{approvalPolicy:NotRequired}}" --monitoring-settings "{diagnostic-destinations:[{destinationType:CommunityWorkspace},{destinationType:EnclaveWorkspace,diagnosticSettingsName:customName},{destinationType:CustomWorkspace,customWorkspaceResourceId:/subscriptions/c64f6eca-bdc5-4bc2-88d6-f8f1dc23f86c/resourceGroups/rgopenapi/providers/Microsoft.OperationalInsights/workspaces/CustomWorkspace,diagnosticSettingsName:customName},{destinationType:CustomWorkspace,customWorkspaceResourceId:/subscriptions/c64f6eca-bdc5-4bc2-88d6-f8f1dc23f86c/resourceGroups/rgopenapi/providers/Microsoft.OperationalInsights/workspaces/CustomWorkspace,diagnosticSettingsName:customName}],flow-log-destination:{destinationType:CustomWorkspace,customWorkspaceResourceId:/subscriptions/c64f6eca-bdc5-4bc2-88d6-f8f1dc23f86c/resourceGroups/rgopenapi/providers/Microsoft.OperationalInsights/workspaces/CustomWorkspace,diagnosticSettingsName:customName}}" --tags "{Tag1:Value1}" --location westcentralus
