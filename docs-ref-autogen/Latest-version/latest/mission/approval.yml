### YamlMime:AzureCLIGroup
uid: az_mission_approval
name: az mission approval
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **mission** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az mission approval** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Approval.
status: GA
sourceType: Extension
directCommands:
- uid: az_mission_approval_create
  name: az mission approval create
  summary: |-
    Create a ApprovalResource.
  status: GA
  sourceType: Extension
  syntax: >-
    az mission approval create --approval-name
                               --resource-uri
                               [--acquire-policy-token]
                               [--approvers]
                               [--change-reference]
                               [--created-at]
                               [--grandparent-resource-id]
                               [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                               [--parent-resource-id]
                               [--request-metadata]
                               [--state-changed-at]
                               [--ticket-id]
  examples:
  - summary: |-
      Approval_CreateOrUpdate
    syntax: "az mission approval create --resource-uri subscriptions/c64f6eca-bdc5-4bc2-88d6-f8f1dc23f86c/resourceGroups/TestMyRg/providers/Microsoft.Mission/enclaveconnections/TestMyEnclaveConnection --approval-name TestApprovals --parent-resource-id /subscriptions/c64f6eca-bdc5-4bc2-88d6-f8f1dc23f86c/resourceGroups/TestMyRg/providers/microsoft.mission/virtualenclaves/TestMyEnclave --grandparent-resource-id /subscriptions/c64f6eca-bdc5-4bc2-88d6-f8f1dc23f86c/resourceGroups/testrg/providers/Microsoft.Mission/communities/TestMyCommunity --request-metadata \"{resource-action:string,approval-status:Approved,approval-callback-route:approvalCallback,approval-callback-payload:\\'{\\n  \"key1\": \"value1\",\\n  \"key2\": \"value2\"\\n}\\'}\" --approvers \"[{approver-entra-id:00000000-0000-0000-0000-000000000000,action-performed:Approved,last-updated-at:'2023-03-17T20:43:17.760Z'}]\" --ticket-id string --created-at 2023-03-17T20:43:17.760Z --state-changed-at 2023-03-17T20:43:17.760Z"
  requiredParameters:
  - isRequired: true
    name: --approval-name
    summary: |-
      The name of the approvals resource.
  - isRequired: true
    name: --resource-uri
    summary: |-
      The fully qualified Azure Resource manager identifier of the resource.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --approvers
    summary: |-
      List of approvers for the approval request  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --created-at
    summary: |-
      Approval request creation time.
    groupName: Properties Arguments
  - name: --grandparent-resource-id
    summary: |-
      Parameter for optimizing query results.
    groupName: Properties Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --parent-resource-id
    summary: |-
      Parameter for optimizing query results.
    groupName: Properties Arguments
  - name: --request-metadata
    summary: |-
      Request metadata for the approval request.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --state-changed-at
    summary: |-
      Approval request state change time, time at which approval request state changed from pending to approved or rejected.
    groupName: Properties Arguments
  - name: --ticket-id
    summary: |-
      Ticket ID for the approval request.
    groupName: Properties Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
