- uid: az_mission_enclave-connection_create
  name: az mission enclave-connection create
  summary: |-
    Create a EnclaveConnectionResource.
  status: GA
  sourceType: Extension
  syntax: >-
    az mission enclave-connection create --enclave-connection-name --name
                                         --resource-group
                                         [--acquire-policy-token]
                                         [--change-reference]
                                         [--community-resource-id]
                                         [--destination-endpoint-id]
                                         [--location]
                                         [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                         [--source-cidr]
                                         [--source-resource-id]
                                         [--tags]
  examples:
  - summary: |-
      EnclaveConnection_CreateOrUpdate
    syntax: az mission enclave-connection create --resource-group rgopenapi --enclave-connection-name TestMyEnclaveConnection --community-resource-id /subscriptions/c64f6eca-bdc5-4bc2-88d6-f8f1dc23f86c/resourceGroups/testrg/providers/Microsoft.Mission/communities/TestMyCommunity --source-resource-id /subscriptions/c64f6eca-bdc5-4bc2-88d6-f8f1dc23f86c/resourceGroups/TestMyRg/providers/microsoft.mission/virtualenclaves/TestMyEnclave --source-cidr 10.0.0.0/24 --destination-endpoint-id /subscriptions/c64f6eca-bdc5-4bc2-88d6-f8f1dc23f86c/resourceGroups/TestMyRg/providers/Microsoft.Mission/virtualenclaves/TestMyEnclave/enclaveendpoints/TestMyEnclaveEndpoint --tags "{sampletag:samplevalue}" --location West US
  requiredParameters:
  - isRequired: true
    name: --enclave-connection-name --name -n
    summary: |-
      The name of the Enclave Connection Resource.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --community-resource-id
    summary: |-
      Community Resource Id.
    groupName: Properties Arguments
  - name: --destination-endpoint-id
    summary: |-
      Destination Endpoint Resource Id.
    groupName: Properties Arguments
  - name: --location -l
    summary: |-
      The geo-location where the resource lives  When not specified, the location of the resource group will be used.
    groupName: Resource Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --source-cidr
    summary: |-
      Source CIDR.
    groupName: Properties Arguments
  - name: --source-resource-id
    summary: |-
      Source Resource Id.
    groupName: Properties Arguments
  - name: --tags
    summary: |-
      Resource tags.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Resource Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
