                                                       [--change-reference]
                                                       [--location]
                                                       [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                                       [--rule-collection]
                                                       [--tags]
                                                       [--update-mode {Automatic, Manual}]
  examples:
  - summary: |-
      EnclaveEndpoints_CreateOrUpdate
    syntax: az mission virtual-enclave enclave-endpoint create --resource-group rgopenapi --virtual-enclave-name TestMyEnclave --enclave-endpoint-name TestMyEnclaveEndpoint --rule-collection "[{endpoint-rule-name:54CEECEF-2C30-488E-946F-D20F414D99BA,destination:10.0.0.0/24,ports:443,protocols:[TCP]}]" --update-mode Automatic --tags "{sampletag:samplevalue}" --location West US
  requiredParameters:
  - isRequired: true
    name: --enclave-endpoint-name --name -n
    summary: |-
      The name of the Enclave Endpoint Resource.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --virtual-enclave-name
    summary: |-
      The name of the enclaveResource Resource.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --location -l
    summary: |-
      The geo-location where the resource lives  When not specified, the location of the resource group will be used.
    groupName: Resource Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --rule-collection
    summary: |-
      Enclave Endpoint Rule Collection.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --tags
    summary: |-
      Resource tags.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Resource Arguments
  - name: --update-mode
    acceptedValues: Automatic, Manual
    summary: |-
      Whether update mode is automatic or manual.
    groupName: Properties Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
