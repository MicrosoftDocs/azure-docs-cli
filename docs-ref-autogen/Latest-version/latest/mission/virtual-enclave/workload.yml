uid: az_mission_virtual-enclave_workload
name: az mission virtual-enclave workload
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **mission** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az mission virtual-enclave workload** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
