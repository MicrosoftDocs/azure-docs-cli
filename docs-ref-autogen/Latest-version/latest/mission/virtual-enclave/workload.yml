status: GA
sourceType: Extension
directCommands:
- uid: az_mission_virtual-enclave_workload_create
  name: az mission virtual-enclave workload create
  summary: |-
    Create a WorkloadResource.
  status: GA
  sourceType: Extension
  syntax: >-
    az mission virtual-enclave workload create --name --workload-name
                                               --resource-group
                                               --virtual-enclave-name
                                               [--acquire-policy-token]
                                               [--change-reference]
                                               [--location]
                                               [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                               [--resource-group-collection]
                                               [--tags]
  examples:
  - summary: |-
      Workload_CreateOrUpdate
    syntax: az mission virtual-enclave workload create --resource-group rgopenapi --virtual-enclave-name TestMyEnclave --workload-name TestMyWorkload --resource-group-collection "[]" --tags "{TestKey:TestValue}" --location westcentralus
  requiredParameters:
  - isRequired: true
    name: --name --workload-name -n
    summary: |-
      The name of the workloadResource Resource.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  - isRequired: true
    name: --virtual-enclave-name
    summary: |-
      The name of the enclaveResource Resource.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --location -l
    summary: |-
      The geo-location where the resource lives  When not specified, the location of the resource group will be used.
    groupName: Resource Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --resource-group-collection
    summary: |-
      List of resource group ids.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  - name: --tags
    summary: |-
      Resource tags.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Resource Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
