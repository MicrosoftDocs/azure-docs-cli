### YamlMime:AzureCLIGroup
uid: az_mission_community_transit-hub
name: az mission community transit-hub
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **mission** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az mission community transit-hub** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Transit Hub.
status: GA
sourceType: Extension
directCommands:
- uid: az_mission_community_transit-hub_create
  name: az mission community transit-hub create
  summary: |-
    Create a TransitHubResource.
  status: GA
  sourceType: Extension
  syntax: >-
    az mission community transit-hub create --community-name
                                            --name --transit-hub-name
                                            --resource-group
                                            [--acquire-policy-token]
                                            [--change-reference]
                                            [--location]
                                            [--no-wait {0, 1, f, false, n, no, t, true, y, yes}]
                                            [--security-provider {AzureFirewall, None}]
                                            [--state {Active, Approved, Failed, PendingApproval, PendingUpdate}]
                                            [--tags]
                                            [--transit-option]
  examples:
  - summary: |-
      TransitHub_CreateOrUpdate
    syntax: az mission community transit-hub create --resource-group rgopenapi --community-name TestMyCommunity --transit-hub-name TestThName --state PendingApproval --transit-option "{type:ExpressRoute,params:{scale-units:1}}" --security-provider AzureFirewall --tags "{Tag1:Value1}" --location westcentralus
  requiredParameters:
  - isRequired: true
    name: --community-name
    summary: |-
      The name of the communityResource Resource.
  - isRequired: true
    name: --name --transit-hub-name -n
    summary: |-
      The name of the TransitHub Resource.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --location -l
    summary: |-
      The geo-location where the resource lives  When not specified, the location of the resource group will be used.
    groupName: Resource Arguments
  - name: --no-wait
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      Do not wait for the long-running operation to finish.
  - name: --security-provider
    acceptedValues: AzureFirewall, None
    summary: |-
      Specifies the security provider for the transit hub.
    groupName: Properties Arguments
  - name: --state
    acceptedValues: Active, Approved, Failed, PendingApproval, PendingUpdate
    summary: |-
      The state of the transitHub.
    groupName: Properties Arguments
  - name: --tags
    summary: |-
      Resource tags.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Resource Arguments
  - name: --transit-option
    summary: |-
      The TransitOption of the transitHub.  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: Properties Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
