### YamlMime:AzureCLIGroup
uid: az_mission_community
name: az mission community
extensionInformation: |-
  > [!NOTE]
  > This reference is part of the **mission** extension for the Azure CLI (version 2.75.0 or higher). The extension will automatically install the first time you run an **az mission community** command. [Learn more](https://learn.microsoft.com/cli/azure/azure-cli-extensions-overview) about extensions.
summary: |-
  Manage Community.
status: GA
sourceType: Extension
directCommands:
- uid: az_mission_community_check-address-space-availability
  name: az mission community check-address-space-availability
  summary: |-
    Checks that the IP Address Space to be allocated for this Community is available.
  status: GA
  sourceType: Extension
  syntax: >-
    az mission community check-address-space-availability --community-resource-id
                                                          --enclave-virtual-network
                                                          [--acquire-policy-token]
                                                          [--change-reference]
                                                          [--community-name]
                                                          [--ids]
                                                          [--resource-group]
                                                          [--subscription]
  examples:
  - summary: |-
      Community_CheckAddressSpaceAvailability
    syntax: az mission community check-address-space-availability --resource-group rgopenapi --community-name TestMyCommunity --community-resource-id /subscriptions/c64f6eca-bdc5-4bc2-88d6-f8f1dc23f86c/resourceGroups/TestMyRg/providers/Microsoft.Mission/communities/TestMyCommunity --enclave-virtual-network "{network-size:small,custom-cidr-range:10.0.0.0/24,subnet-configurations:[{subnet-name:test,network-prefix-size:26}],allow-subnet-communication:True}"
  requiredParameters:
  - isRequired: true
    name: --community-resource-id
    summary: |-
      Resource Id of the Community.
    groupName: CheckAddressSpaceAvailabilityRequest Arguments
  - isRequired: true
    name: --enclave-virtual-network
    summary: |-
      Information about the enclave virtual network  Support shorthand-syntax, json-file and yaml-file. Try "??" to show more.
    groupName: CheckAddressSpaceAvailabilityRequest Arguments
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
    groupName: Global Policy Arguments
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
    groupName: Global Policy Arguments
  - name: --community-name
    summary: |-
      The name of the communityResource Resource.
    groupName: Resource Id Arguments
  - name: --ids
    summary: |-
      One or more resource IDs (space-delimited). It should be a complete resource ID containing all information of 'Resource Id' arguments. You should provide either --ids or other 'Resource Id' arguments.
    groupName: Resource Id Arguments
  - name: --resource-group -g
    summary: |-
      Name of resource group. You can configure the default group using `az configure --defaults group=<name>`.
    groupName: Resource Id Arguments
  - name: --subscription
    summary: |-
      Name or ID of subscription. You can configure the default subscription using `az account set -s NAME_OR_ID`.
    groupName: Resource Id Arguments
  globalParameters:
  - name: --debug
    defaultValue: "False"
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show this help message and exit.
  - name: --only-show-errors
    defaultValue: "False"
    summary: |-
      Only show errors, suppressing warnings.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, none, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string. See http://jmespath.org/ for more information and examples.
  - name: --verbose
    defaultValue: "False"
    summary: |-
      Increase logging verbosity. Use --debug for full debug logs.
