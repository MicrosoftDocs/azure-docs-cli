### YamlMime:AzureCLIGroup
uid: az_msgraph_user
name: az msgraph user
summary: |-
  Manage Microsoft Entra users.
status: GA
sourceType: Core
directCommands:
- uid: az_msgraph_user_list
  name: az msgraph user list
  summary: |-
    List Microsoft Entra users.
  description: |-
    List users in your Microsoft Entra tenant. Filter results by a display name prefix, exact user principal name, or an OData `$filter` expression.
  status: GA
  sourceType: Core
  syntax: >-
    az msgraph user list [--display-name]
                         [--filter]
                         [--upn]
  examples:
  - summary: |-
      List all users
    syntax: az msgraph user list
  - summary: |-
      List users whose display name starts with a prefix
    syntax: az msgraph user list --display-name Ada
  - summary: |-
      List a user by user principal name
    syntax: az msgraph user list --upn ada@contoso.com
  - summary: |-
      List users with a custom filter expression
    syntax: az msgraph user list --filter "endswith(mail,'@contoso.com')"
  optionalParameters:
  - name: --display-name
    summary: |-
      List users whose display name starts with the specified prefix.
  - name: --filter
    summary: |-
      OData $filter expression, for example "accountEnabled eq true".
  - name: --upn
    summary: |-
      List users with the specified user principal name.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: plain
    acceptedValues: json, plain
    summary: |-
      Output format.
- uid: az_msgraph_user_show
  name: az msgraph user show
  summary: |-
    Get the details of a Microsoft Entra user.
  description: |-
    Retrieve full details for a user by object ID or user principal name.
  status: GA
  sourceType: Core
  syntax: az msgraph user show --id
  examples:
  - summary: |-
      Show a user by user principal name
    syntax: az msgraph user show --id user@contoso.com
  - summary: |-
      Show a user by object ID
    syntax: az msgraph user show --id 00000000-0000-0000-0000-000000000000
  requiredParameters:
  - isRequired: true
    name: --id
    summary: |-
      The object ID or user principal name (UPN) of the user.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: plain
    acceptedValues: json, plain
    summary: |-
      Output format.
commands:
- az_msgraph_user_list
- az_msgraph_user_show
metadata:
  description: Manage Microsoft Entra users.
