### YamlMime:AzureCLIGroup
uid: az_msgraph_user
name: az msgraph user
summary: |-
  Manage Microsoft Entra users.
status: Preview
isPreview: true
sourceType: Core
directCommands:
- uid: az_msgraph_user_list
  name: az msgraph user list
  summary: |-
    List Microsoft Entra users.
  description: |-
    List users in your Microsoft Entra tenant. Filter results by a display name prefix, exact user principal name, or an OData `$filter` expression. You can also project custom fields with `--select`, include relationships with `--expand`, and use advanced OData options like `--orderby` and `--search`. For advanced filters (for example `endswith(...)`), include `--consistency-level eventual`.
  status: Preview
  isPreview: true
  sourceType: Core
  syntax: >-
    az msgraph user list [--append-selected]
                         [--consistency-level]
                         [--display-name]
                         [--expand]
                         [--filter]
                         [--orderby]
                         [--search]
                         [--select]
                         [--upn]
  examples:
  - summary: |-
      List all users
    syntax: az msgraph user list
  - summary: |-
      List users whose display name starts with a prefix
    syntax: az msgraph user list --display-name Ada
  - summary: |-
      List a user by user principal name
    syntax: az msgraph user list --upn ada@contoso.com
  - summary: |-
      List users with a custom filter expression
    syntax: az msgraph user list --filter "endswith(mail,'@contoso.com')" --consistency-level eventual
  - summary: |-
      List users with custom projection and default fields
    syntax: az msgraph user list --select id displayName jobTitle --append-selected
  - summary: |-
      Search users by display name
    syntax: az msgraph user list --search "\"displayName:ada\"" --consistency-level eventual
  optionalParameters:
  - name: --append-selected
    summary: |-
      When set with Select, include the default property set alongside the values in Select rather than replacing them.
  - name: --consistency-level
    summary: |-
      Set to 'eventual' to enable advanced query features such as $search, $count, or $orderby on non-indexed properties.
  - name: --display-name
    summary: |-
      List users whose display name starts with the specified prefix.
  - name: --expand
    summary: |-
      Related properties to include in the response, for example memberOf.
  - name: --filter
    summary: |-
      OData $filter expression, for example "accountEnabled eq true".
  - name: --orderby
    summary: |-
      OData $orderby values, for example 'displayName' or 'mail desc'.
  - name: --search
    summary: |-
      OData $search expression, for example "displayName:ada". Requires ConsistencyLevel eventual.
  - name: --select
    summary: |-
      Properties to return. Combine with AppendSelected to include the default properties as well.
  - name: --upn
    summary: |-
      List users with the specified user principal name.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_msgraph_user_show
  name: az msgraph user show
  summary: |-
    Get the details of a Microsoft Entra user.
  description: |-
    Retrieve full details for a user by object ID or user principal name.
  status: Preview
  isPreview: true
  sourceType: Core
  syntax: >-
    az msgraph user show --id
                         [--append-selected]
                         [--expand]
                         [--select]
  examples:
  - summary: |-
      Show a user by user principal name
    syntax: az msgraph user show --id user@contoso.com
  - summary: |-
      Show a user by object ID
    syntax: az msgraph user show --id 00000000-0000-0000-0000-000000000000
  - summary: |-
      Show a user with selected fields only
    syntax: az msgraph user show --id user@contoso.com --select id displayName mail
  - summary: |-
      Show a user with selected fields plus default fields
    syntax: az msgraph user show --id user@contoso.com --select id displayName mail --append-selected
  requiredParameters:
  - isRequired: true
    name: --id
    summary: |-
      The object ID or user principal name (UPN) of the user.
  optionalParameters:
  - name: --append-selected
    summary: |-
      When set with Select, include the default property set alongside the values in Select rather than replacing them.
  - name: --expand
    summary: |-
      Related properties to include in the response, for example memberOf.
  - name: --select
    summary: |-
      Properties to return. Combine with AppendSelected to include the default properties as well.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
commands:
- az_msgraph_user_list
- az_msgraph_user_show
metadata:
  description: Manage Microsoft Entra users.
