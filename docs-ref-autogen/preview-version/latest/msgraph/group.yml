### YamlMime:AzureCLIGroup
uid: az_msgraph_group
name: az msgraph group
summary: |-
  Manage Microsoft Entra groups.
status: Preview
isPreview: true
sourceType: Core
directCommands:
- uid: az_msgraph_group_list
  name: az msgraph group list
  summary: |-
    List Microsoft Entra groups.
  description: |-
    List groups in your Microsoft Entra tenant. Filter results by a display name prefix or an OData `$filter` expression.
  status: Preview
  isPreview: true
  sourceType: Core
  syntax: >-
    az msgraph group list [--display-name]
                          [--filter]
  examples:
  - summary: |-
      List all groups
    syntax: az msgraph group list
  - summary: |-
      List groups whose display name starts with a prefix
    syntax: az msgraph group list --display-name Sales
  - summary: |-
      List groups with a custom filter expression
    syntax: az msgraph group list --filter "securityEnabled eq true"
  optionalParameters:
  - name: --display-name
    summary: |-
      List groups whose display name starts with the specified prefix.
  - name: --filter
    summary: |-
      OData $filter expression, for example "securityEnabled eq true".
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_msgraph_group_show
  name: az msgraph group show
  summary: |-
    Get the details of a Microsoft Entra group.
  description: |-
    Retrieve full details for a group. Accepts either the group's object ID or its display name (prefix works if there is a unique match).
  status: Preview
  isPreview: true
  sourceType: Core
  syntax: az msgraph group show --group
  examples:
  - summary: |-
      Show a group by object ID
    syntax: az msgraph group show --group 11111111-2222-3333-4444-555555555555
  - summary: |-
      Show a group by display name
    syntax: az msgraph group show --group Sales
  requiredParameters:
  - isRequired: true
    name: --group
    summary: |-
      The group's object ID or display name (prefix works if there is a unique match).
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
commands:
- az_msgraph_group_list
- az_msgraph_group_member
- az_msgraph_group_member_check
- az_msgraph_group_member_list
- az_msgraph_group_show
metadata:
  description: Manage Microsoft Entra groups.
