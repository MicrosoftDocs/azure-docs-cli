### YamlMime:AzureCLIGroup
uid: az_msgraph_group_member
name: az msgraph group member
summary: |-
  Manage members of a Microsoft Entra group.
status: GA
sourceType: Core
directCommands:
- uid: az_msgraph_group_member_check
  name: az msgraph group member check
  summary: |-
    Check whether a directory object is a member of a Microsoft Entra group.
  description: |-
    Report whether the specified member (user, group, service principal, or device) is a transitive member of the given group. The group can be identified by object ID or display name prefix (single match required). Returns `true` if the member is in the group, `false` otherwise.
  status: GA
  sourceType: Core
  syntax: >-
    az msgraph group member check --group
                                  --member-id
  examples:
  - summary: |-
      Check whether a user is a member of a group
    syntax: az msgraph group member check --group 11111111-2222-3333-4444-555555555555 --member-id aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
  - summary: |-
      Check by group display name
    syntax: az msgraph group member check --group Sales --member-id aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
  requiredParameters:
  - isRequired: true
    name: --group
    summary: |-
      The group's object ID or display name (prefix works if there is a unique match).
  - isRequired: true
    name: --member-id
    summary: |-
      The object ID of the member to test.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: plain
    acceptedValues: json, plain
    summary: |-
      Output format.
- uid: az_msgraph_group_member_list
  name: az msgraph group member list
  summary: |-
    List the members of a Microsoft Entra group.
  description: |-
    List every user, group, service principal, or device that is a direct member of the specified group. The group can be identified by object ID or display name prefix (single match required).
  status: GA
  sourceType: Core
  syntax: az msgraph group member list --group
  examples:
  - summary: |-
      List members of a group by object ID
    syntax: az msgraph group member list --group 11111111-2222-3333-4444-555555555555
  - summary: |-
      List members of a group by display name
    syntax: az msgraph group member list --group Sales
  requiredParameters:
  - isRequired: true
    name: --group
    summary: |-
      The group's object ID or display name (prefix works if there is a unique match).
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: plain
    acceptedValues: json, plain
    summary: |-
      Output format.
commands:
- az_msgraph_group_member_check
- az_msgraph_group_member_list
metadata:
  description: Manage members of a Microsoft Entra group.
