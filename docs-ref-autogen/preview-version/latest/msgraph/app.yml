### YamlMime:AzureCLIGroup
uid: az_msgraph_app
name: az msgraph app
summary: |-
  Manage Microsoft Entra application registrations through Microsoft Graph.
status: GA
sourceType: Core
directCommands:
- uid: az_msgraph_app_create
  name: az msgraph app create
  summary: |-
    Create a Microsoft Entra application registration.
  description: |-
    Register a new Microsoft Entra application. Only `--display-name` is required; the created application, including its object ID and app ID, is returned.
  status: GA
  sourceType: Core
  syntax: >-
    az msgraph app create --display-name
                          [--sign-in-audience]
  examples:
  - summary: |-
      Create an application registration
    syntax: az msgraph app create --display-name my-app
  - summary: |-
      Create an application for a single-tenant audience
    syntax: az msgraph app create --display-name my-app --sign-in-audience AzureADMyOrg
  requiredParameters:
  - isRequired: true
    name: --display-name
    summary: |-
      The display name of the application registration.
  optionalParameters:
  - name: --sign-in-audience
    summary: |-
      The Microsoft account types supported for sign-in.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: plain
    acceptedValues: json, plain
    summary: |-
      Output format.
- uid: az_msgraph_app_delete
  name: az msgraph app delete
  summary: |-
    Delete a Microsoft Entra application registration.
  description: |-
    Delete an application registration from Microsoft Graph by its object ID. Graph performs a soft delete; the application is recoverable for 30 days.
  status: GA
  sourceType: Core
  syntax: az msgraph app delete --id
  examples:
  - summary: |-
      Delete an application
    syntax: az msgraph app delete --id 00000000-0000-0000-0000-000000000000
  requiredParameters:
  - isRequired: true
    name: --id
    summary: |-
      The object ID of the application registration to delete.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: plain
    acceptedValues: json, plain
    summary: |-
      Output format.
- uid: az_msgraph_app_list
  name: az msgraph app list
  summary: |-
    List Microsoft Entra application registrations.
  description: |-
    Return the first page of application registrations from Microsoft Graph. Pagination is not followed in this preview — the response contains the default Graph page size. Use `--display-name` for a quick equality lookup, or `--filter` for any other OData expression.
  status: GA
  sourceType: Core
  syntax: >-
    az msgraph app list [--consistency-level]
                        [--display-name]
                        [--filter]
                        [--orderby]
                        [--search]
                        [--select]
  examples:
  - summary: |-
      List the first page of applications
    syntax: az msgraph app list
  - summary: |-
      List applications by display name
    syntax: az msgraph app list --display-name my-app
  - summary: |-
      List applications with a raw OData filter
    syntax: az msgraph app list --filter "signInAudience eq 'AzureADMyOrg'"
  optionalParameters:
  - name: --consistency-level
    summary: |-
      Value sent as the ConsistencyLevel HTTP header for advanced queries.
  - name: --display-name
    summary: |-
      Exact display name to match. Translated to the OData filter displayName eq 'value'.
  - name: --filter
    summary: |-
      OData $filter expression applied by Microsoft Graph.
  - name: --orderby
    summary: |-
      Property paths to sort by via OData $orderby.
  - name: --search
    summary: |-
      Free-text search expression mapped to OData $search.
  - name: --select
    summary: |-
      Properties to project via OData $select.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: plain
    acceptedValues: json, plain
    summary: |-
      Output format.
- uid: az_msgraph_app_show
  name: az msgraph app show
  summary: |-
    Show a Microsoft Entra application registration by object ID.
  description: |-
    Retrieve a single application registration from Microsoft Graph by its object ID.
  status: GA
  sourceType: Core
  syntax: az msgraph app show --id
  examples:
  - summary: |-
      Show an application by object ID
    syntax: az msgraph app show --id 00000000-0000-0000-0000-000000000000
  requiredParameters:
  - isRequired: true
    name: --id
    summary: |-
      The object ID of the application registration.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: plain
    acceptedValues: json, plain
    summary: |-
      Output format.
commands:
- az_msgraph_app_create
- az_msgraph_app_delete
- az_msgraph_app_list
- az_msgraph_app_show
metadata:
  description: Manage Microsoft Entra application registrations through Microsoft Graph.
