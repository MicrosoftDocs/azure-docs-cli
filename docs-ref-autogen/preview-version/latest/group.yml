### YamlMime:AzureCLIGroup
uid: az_group
name: az group
summary: |-
  Manage resource groups in your Azure subscription.
status: GA
sourceType: Core
directCommands:
- uid: az_group_create
  name: az group create
  summary: |-
    Create a new resource group.
  description: |-
    Provision a new resource group in your Azure subscription. Specify the resource group name and location (region). The subscription ID is optional and defaults to the current subscription when omitted. The resource group will be created immediately and can be used to organize your Azure resources.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/group/index.md
  syntax: >-
    az group create --location
                    --name
                    [--profile]
                    [--subscription-id]
  examples:
  - summary: |-
      Create a resource group in the current subscription
    syntax: az group create --name myresourcegroup --location eastus
  - summary: |-
      Create a resource group in a specific subscription
    syntax: az group create --name myresourcegroup --location eastus --subscription-id 00000000-0000-0000-0000-000000000000
  - summary: |-
      Create a resource group in West US
    syntax: az group create --name myrg --location westus --subscription-id 00000000-0000-0000-0000-000000000000
  requiredParameters:
  - isRequired: true
    name: --location
    summary: |-
      Location for resource group.
  - isRequired: true
    name: --name
    summary: |-
      The name of the resource group.
  optionalParameters:
  - name: --profile
    summary: |-
      Use the named profile for this command (overrides the active profile).
  - name: --subscription-id
    summary: |-
      Azure Subscription Id. Defaults to the active profile's subscription.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_group_delete
  name: az group delete
  summary: |-
    Delete a resource group and all resources it contains.
  description: |-
    Delete a resource group and all resources it contains. The command waits for deletion to finish.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/group/index.md
  syntax: >-
    az group delete --name
                    [--force-deletion-types {Microsoft.Compute/virtualMachines, Microsoft.Compute/virtualMachineScaleSets, Microsoft.Databricks/workspaces}]
                    [--profile]
                    [--subscription-id]
  examples:
  - summary: |-
      Delete a resource group
    syntax: az group delete --name myresourcegroup
  - summary: |-
      Force deletion of supported virtual machines
    syntax: az group delete --name myresourcegroup --force-deletion-types Microsoft.Compute/virtualMachines
  requiredParameters:
  - isRequired: true
    name: --name
    summary: |-
      The name of the resource group.
  optionalParameters:
  - name: --force-deletion-types
    acceptedValues: Microsoft.Compute/virtualMachines, Microsoft.Compute/virtualMachineScaleSets, Microsoft.Databricks/workspaces
    summary: |-
      The resource type to force delete.
  - name: --profile
    summary: |-
      Use the named profile for this command (overrides the active profile).
  - name: --subscription-id
    summary: |-
      Azure Subscription Id. Defaults to the active profile's subscription.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_group_exists
  name: az group exists
  summary: |-
    Check whether a resource group exists.
  description: |-
    Check whether a resource group exists in a subscription. The command returns `true` when the resource group exists and `false` when it does not. The subscription defaults to the active profile when `--subscription-id` is omitted.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/group/index.md
  syntax: >-
    az group exists --name
                    [--profile]
                    [--subscription-id]
  examples:
  - summary: |-
      Check whether a resource group exists
    syntax: az group exists --name myresourcegroup
  - summary: |-
      Check in a specific subscription
    syntax: az group exists --name myresourcegroup --subscription-id 00000000-0000-0000-0000-000000000000
  requiredParameters:
  - isRequired: true
    name: --name
    summary: |-
      The name of the resource group.
  optionalParameters:
  - name: --profile
    summary: |-
      Use the named profile for this command (overrides the active profile).
  - name: --subscription-id
    summary: |-
      Azure Subscription Id. Defaults to the active profile's subscription.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_group_list
  name: az group list
  summary: |-
    List all resource groups in a subscription.
  description: |-
    Retrieve a list of all resource groups in the specified Azure subscription. If no subscription ID is provided, the default subscription from your current login context is used. Output includes group names and locations.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/group/index.md
  syntax: >-
    az group list [--profile]
                  [--subscription-id]
  examples:
  - summary: |-
      List all resource groups
    syntax: az group list --subscription-id 00000000-0000-0000-0000-000000000000
  - summary: |-
      List using default subscription
    syntax: az group list
  optionalParameters:
  - name: --profile
    summary: |-
      Use the named profile for this command (overrides the active profile).
  - name: --subscription-id
    summary: |-
      Azure Subscription Id. Defaults to the active profile's subscription.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_group_show
  name: az group show
  summary: |-
    Show details of a specific resource group.
  description: |-
    Display information about a resource group including its name, location, provisioning state, and resource count. Specify the resource group name and optionally the subscription ID (defaults to current subscription if not provided).
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/group/index.md
  syntax: >-
    az group show --name
                  [--profile]
                  [--subscription-id]
  examples:
  - summary: |-
      Show a resource group
    syntax: az group show --name myresourcegroup --subscription-id 00000000-0000-0000-0000-000000000000
  - summary: |-
      Show using default subscription
    syntax: az group show --name myresourcegroup
  requiredParameters:
  - isRequired: true
    name: --name
    summary: |-
      The name of the resource group.
  optionalParameters:
  - name: --profile
    summary: |-
      Use the named profile for this command (overrides the active profile).
  - name: --subscription-id
    summary: |-
      Azure Subscription Id. Defaults to the active profile's subscription.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_group_update
  name: az group update
  summary: |-
    Update a resource group.
  description: |-
    Update a resource group without recreating it. Replace all tags with `--tags`, clear tags with an empty value, or modify an individual patchable property with `--set`. Use `--force-string` with `--set` when a value that resembles JSON, a number, or a boolean must remain a string.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/group/index.md
  syntax: >-
    az group update --name
                    [--force-string]
                    [--profile]
                    [--set]
                    [--subscription-id]
                    [--tags]
  examples:
  - summary: |-
      Replace the tags on a resource group
    syntax: az group update --name myresourcegroup --tags Environment=Production Owner=Platform
  - summary: |-
      Clear all tags from a resource group
    syntax: az group update --resource-group myresourcegroup --tags ""
  - summary: |-
      Update one tag while preserving its string value
    syntax: az group update --name myresourcegroup --set tags.CostCenter=042 --force-string
  requiredParameters:
  - isRequired: true
    name: --name
    summary: |-
      Name of resource group.
  optionalParameters:
  - name: --force-string
    summary: |-
      Preserve string literals when using --set instead of attempting to convert them to JSON.
  - name: --profile
    summary: |-
      Use the named profile for this command (overrides the active profile).
  - name: --set
    summary: |-
      Update a property by specifying a property path and value.
  - name: --subscription-id
    summary: |-
      Azure Subscription Id. Defaults to the active profile's subscription.
  - name: --tags
    summary: |-
      Space-separated tags in key[=value] format. Use an empty string to clear existing tags.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
