### YamlMime:AzureCLIGroup
uid: az_group
name: az group
summary: |-
  Manage resource groups in your Azure subscription.
status: GA
sourceType: Core
directCommands:
- uid: az_group_create
  name: az group create
  summary: |-
    Create a new resource group.
  description: |-
    Provision a new resource group in your Azure subscription. Specify the resource group name and location (region). The subscription ID is optional and defaults to the current subscription when omitted. The resource group will be created immediately and can be used to organize your Azure resources.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/group/index.md
  syntax: >-
    az group create --location
                    --name
                    [--profile]
                    [--subscription-id]
  examples:
  - summary: |-
      Create a resource group in the current subscription
    syntax: az group create --name myresourcegroup --location eastus
  - summary: |-
      Create a resource group in a specific subscription
    syntax: az group create --name myresourcegroup --location eastus --subscription-id 00000000-0000-0000-0000-000000000000
  - summary: |-
      Create a resource group in West US
    syntax: az group create --name myrg --location westus --subscription-id 00000000-0000-0000-0000-000000000000
  requiredParameters:
  - isRequired: true
    name: --location
    summary: |-
      Location for resource group.
  - isRequired: true
    name: --name
    summary: |-
      The name of the resource group.
  optionalParameters:
  - name: --profile
    summary: |-
      Use the named profile for this command (overrides the active profile).
  - name: --subscription-id
    summary: |-
      Azure Subscription Id. Defaults to the active profile's subscription.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: plain
    acceptedValues: json, plain
    summary: |-
      Output format.
- uid: az_group_list
  name: az group list
  summary: |-
    List all resource groups in a subscription.
  description: |-
    Retrieve a list of all resource groups in the specified Azure subscription. If no subscription ID is provided, the default subscription from your current login context is used. Output includes group names and locations.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/group/index.md
  syntax: >-
    az group list [--profile]
                  [--subscription-id]
  examples:
  - summary: |-
      List all resource groups
    syntax: az group list --subscription-id 00000000-0000-0000-0000-000000000000
  - summary: |-
      List using default subscription
    syntax: az group list
  optionalParameters:
  - name: --profile
    summary: |-
      Use the named profile for this command (overrides the active profile).
  - name: --subscription-id
    summary: |-
      Azure Subscription Id. Defaults to the active profile's subscription.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: plain
    acceptedValues: json, plain
    summary: |-
      Output format.
- uid: az_group_show
  name: az group show
  summary: |-
    Show details of a specific resource group.
  description: |-
    Display information about a resource group including its name, location, provisioning state, and resource count. Specify the resource group name and optionally the subscription ID (defaults to current subscription if not provided).
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/group/index.md
  syntax: >-
    az group show --name
                  [--profile]
                  [--subscription-id]
  examples:
  - summary: |-
      Show a resource group
    syntax: az group show --name myresourcegroup --subscription-id 00000000-0000-0000-0000-000000000000
  - summary: |-
      Show using default subscription
    syntax: az group show --name myresourcegroup
  requiredParameters:
  - isRequired: true
    name: --name
    summary: |-
      The name of the resource group.
  optionalParameters:
  - name: --profile
    summary: |-
      Use the named profile for this command (overrides the active profile).
  - name: --subscription-id
    summary: |-
      Azure Subscription Id. Defaults to the active profile's subscription.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: plain
    acceptedValues: json, plain
    summary: |-
      Output format.
commands:
- az_group_create
- az_group_list
- az_group_show
metadata:
  ms.date: 06/24/2026
  description: Manage resource groups in your Azure subscription.
