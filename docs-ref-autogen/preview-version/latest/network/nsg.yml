### YamlMime:AzureCLIGroup
uid: az_network_nsg
name: az network nsg
summary: |-
  Manage network security groups.
status: Preview
isPreview: true
sourceType: Core
directCommands:
- uid: az_network_nsg_create
  name: az network nsg create
  summary: |-
    Create a network security group.
  description: |-
    Create an Azure network security group. When `--location` is omitted, the resource group's location is used.
  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/network/index.md
  syntax: >-
    az network nsg create --name
                          --resource-group
                          [--location]
                          [--profile]
                          [--subscription-id]
                          [--tags]
  examples:
  - summary: |-
      Create a network security group with tags
    syntax: az network nsg create --name my-nsg --resource-group my-rg --location eastus --tags owner=network env=test
  - summary: |-
      Create in the resource group's location
    syntax: az network nsg create --name my-nsg --resource-group my-rg
  requiredParameters:
  - isRequired: true
    name: --name
    summary: |-
      The name of the network security group.
  - isRequired: true
    name: --resource-group
    summary: |-
      The resource group name.
  optionalParameters:
  - name: --location
    summary: |-
      Location for the network security group. Defaults to the resource group's location.
  - name: --profile
    summary: |-
      Use the named profile for this command (overrides the active profile).
  - name: --subscription-id
    summary: |-
      Azure Subscription Id. Defaults to the active profile's subscription.
  - name: --tags
    summary: |-
      Resource tags in KEY=VALUE form (space-separated).
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
