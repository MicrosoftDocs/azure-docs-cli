- uid: az_network_nsg_list
  name: az network nsg list
  summary: |-
    List network security groups.
  description: |-
    List network security groups in a resource group, or omit the resource group to list across the subscription.
  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/network/index.md
  syntax: >-
    az network nsg list [--profile]
                        [--resource-group]
                        [--subscription-id]
  examples:
  - summary: |-
      List network security groups in a resource group
    syntax: az network nsg list --resource-group my-rg
  optionalParameters:
  - name: --profile
    summary: |-
      Use the named profile for this command (overrides the active profile).
  - name: --resource-group
    summary: |-
      The resource group name. Omit to list every network security group in the subscription.
  - name: --subscription-id
    summary: |-
      Azure Subscription Id. Defaults to the active profile's subscription.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
