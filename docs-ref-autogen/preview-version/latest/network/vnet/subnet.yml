### YamlMime:AzureCLIGroup
uid: az_network_vnet_subnet
name: az network vnet subnet
summary: |-
  Manage subnets in an Azure virtual network.
status: Preview
isPreview: true
sourceType: Core
directCommands:
- uid: az_network_vnet_subnet_create
  name: az network vnet subnet create
  summary: |-
    Create or update a subnet.
  description: |-
    Create or replace a subnet in an existing virtual network.
  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/agent-command-restructure/src/CLI/Help/Docs/network/index.md
  syntax: >-
    az network vnet subnet create --name
                                  --resource-group
                                  --vnet-name
                                  [--address-prefixes]
                                  [--default-outbound-access --default-outbound]
                                  [--delegations --delegated-services]
                                  [--disable-private-endpoint-network-policies]
                                  [--disable-private-link-service-network-policies]
                                  [--ipam-allocations --ipam-pool-prefix-allocations]
                                  [--nat-gateway]
                                  [--network-security-group --nsg]
                                  [--private-endpoint-network-policies --ple-network-policies {Disabled, Enabled, NetworkSecurityGroupEnabled, RouteTableEnabled}]
                                  [--private-link-service-network-policies --pls-network-policies {Disabled, Enabled}]
                                  [--profile]
                                  [--route-table]
                                  [--service-endpoint-policy --service-endpoint-policies --policies]
                                  [--service-endpoints --endpoints]
                                  [--sharing-scope {DelegatedServices, Tenant}]
                                  [--subscription-id]
  examples:
  - summary: |-
      Create a subnet
    syntax: az network vnet subnet create --resource-group myrg --vnet-name myvnet --name web --address-prefixes 10.0.1.0/24
  - summary: |-
      Create a delegated subnet
    syntax: >-
      az network vnet subnet create --resource-group myrg --vnet-name myvnet --name apps \
        --address-prefixes 10.0.2.0/24 --delegations Microsoft.Web/serverFarms
  requiredParameters:
  - isRequired: true
    name: --name -n
    summary: |-
      The subnet name.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      The resource group name.
  - isRequired: true
    name: --vnet-name
    summary: |-
      The virtual network name.
  optionalParameters:
  - name: --address-prefixes
    summary: |-
      Address prefixes for the subnet in CIDR format.
  - name: --default-outbound-access --default-outbound
    summary: |-
      Whether default outbound access is enabled.
  - name: --delegations --delegated-services
    summary: |-
      Services to which to delegate the subnet, e.g. Microsoft.Web/serverFarms.
  - name: --disable-private-endpoint-network-policies
    summary: |-
      Disable network policies for private endpoints.
  - name: --disable-private-link-service-network-policies
    summary: |-
      Disable network policies for private link services.
  - name: --ipam-allocations --ipam-pool-prefix-allocations
    summary: |-
      Resource ids of IPAM pools from which to allocate subnet prefixes.
  - name: --nat-gateway
    summary: |-
      Name or resource id of the NAT gateway to associate.
  - name: --network-security-group --nsg
    summary: |-
      Name or resource id of the network security group to associate.
  - name: --private-endpoint-network-policies --ple-network-policies
    acceptedValues: Disabled, Enabled, NetworkSecurityGroupEnabled, RouteTableEnabled
    summary: |-
      Network policies for private endpoints.
  - name: --private-link-service-network-policies --pls-network-policies
    acceptedValues: Disabled, Enabled
    summary: |-
      Network policies for private link services.
  - name: --profile
    summary: |-
      Use the named profile for this command (overrides the active profile).
  - name: --route-table
    summary: |-
      Name or resource id of the route table to associate.
  - name: --service-endpoint-policy --service-endpoint-policies --policies
    summary: |-
      Names or resource ids of service endpoint policies to associate.
  - name: --service-endpoints --endpoints
    summary: |-
      Services for which to enable service endpoints.
  - name: --sharing-scope
    acceptedValues: DelegatedServices, Tenant
    summary: |-
      Tenant sharing scope for the subnet.
  - name: --subscription-id
    summary: |-
      Azure Subscription Id. Defaults to the active profile's subscription.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
