### YamlMime:AzureCLIGroup
uid: az_identity_federated-credential
name: az identity federated-credential
summary: |-
  Manage federated identity credentials on a user-assigned managed identity.
status: Preview
isPreview: true
sourceType: Core
directCommands:
- uid: az_identity_federated-credential_create
  name: az identity federated-credential create
  summary: |-
    Create a federated identity credential on a user-assigned managed identity.
  description: |-
    Create a federated identity credential that trusts an external OIDC issuer, so a workload presenting a matching token can exchange it for a Microsoft Entra access token on behalf of the managed identity. Specify either --subject or the claims-matching-expression pair, but not both.
  status: Preview
  isPreview: true
  sourceType: Core
  syntax: >-
    az identity federated-credential create --identity-name
                                            --name
                                            --resource-group
                                            [--acquire-policy-token]
                                            [--audiences]
                                            [--change-reference]
                                            [--claims-matching-expression-value]
                                            [--claims-matching-expression-version]
                                            [--issuer]
                                            [--subject]
                                            [--subscription]
  examples:
  - summary: |-
      Create a federated credential using a subject
    syntax: az identity federated-credential create --identity-name myIdentity --resource-group myResourceGroup --name myFederatedCredential --issuer https://kubernetes-oauth.azure.com --subject system:serviceaccount:ns:svcaccount --audiences api://AzureADTokenExchange
  requiredParameters:
  - isRequired: true
    name: --identity-name
    summary: |-
      The name of the identity resource.
  - isRequired: true
    name: --name -n
    summary: |-
      The name of the federated identity credential resource.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
  - name: --audiences
    summary: |-
      The list of audiences that can appear in the issued token.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
  - name: --claims-matching-expression-value -cme-value
    summary: |-
      The wildcard-based expression for matching incoming claims. Cannot be used with --subject.
  - name: --claims-matching-expression-version -cme-version
    summary: |-
      Specifies the version of the claims matching expression used in the expression.
  - name: --issuer
    summary: |-
      The URL of the issuer to be trusted.
  - name: --subject
    summary: |-
      The identifier of the external software workload. Cannot be used with --claims-matching-expression-value.
  - name: --subscription
    summary: |-
      Name or ID of subscription.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
