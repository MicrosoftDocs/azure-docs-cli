- uid: az_identity_federated-credential_update
  name: az identity federated-credential update
  summary: |-
    Update a federated identity credential on a user-assigned managed identity.
  description: |-
    Update the issuer, audiences, subject, or claims-matching-expression of a federated identity credential, or update generic properties with --set/--add/--remove. Setting --subject clears any existing claims-matching-expression, and vice versa, since the two are mutually exclusive.
  status: Preview
  isPreview: true
  sourceType: Core
  syntax: >-
    az identity federated-credential update --identity-name
                                            --name
                                            --resource-group
                                            [--acquire-policy-token]
                                            [--add]
                                            [--audiences]
                                            [--change-reference]
                                            [--claims-matching-expression-value]
                                            [--claims-matching-expression-version]
                                            [--force-string {0, 1, f, false, n, no, t, true, y, yes}]
                                            [--issuer]
                                            [--remove]
                                            [--set]
                                            [--subject]
                                            [--subscription]
  examples:
  - summary: |-
      Update a federated credential's audiences
    syntax: az identity federated-credential update --identity-name myIdentity --resource-group myResourceGroup --name myFederatedCredential --audiences api://AzureADTokenExchange
  - summary: |-
      Switch a federated credential to use a claims matching expression
    syntax: az identity federated-credential update --identity-name myIdentity --resource-group myResourceGroup --name myFederatedCredential --claims-matching-expression-version 1 --claims-matching-expression-value "claims['sub'] eq 'repo:contoso/my-repo:ref:refs/heads/main'"
  requiredParameters:
  - isRequired: true
    name: --identity-name
    summary: |-
      The name of the identity resource.
  - isRequired: true
    name: --name -n
    summary: |-
      The name of the federated identity credential resource.
  - isRequired: true
    name: --resource-group -g
    summary: |-
      Name of resource group.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
  - name: --add
    summary: |-
      Add an object to a list of objects by specifying a path and key value pairs.
  - name: --audiences
    summary: |-
      The list of audiences that can appear in the issued token.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
  - name: --claims-matching-expression-value -cme-value
    summary: |-
      The wildcard-based expression for matching incoming claims. Cannot be used with --subject.
  - name: --claims-matching-expression-version -cme-version
    summary: |-
      Specifies the version of the claims matching expression used in the expression.
  - name: --force-string
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      When using 'set' or 'add', preserve string literals instead of attempting to convert to JSON.
  - name: --issuer
    summary: |-
      The URL of the issuer to be trusted.
  - name: --remove
    summary: |-
      Remove a property or an element from a list.
  - name: --set
    summary: |-
      Update an object by specifying a property path and value to set.
  - name: --subject
    summary: |-
      The identifier of the external software workload. Cannot be used with --claims-matching-expression-value.
  - name: --subscription
    summary: |-
      Name or ID of subscription.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
commands:
- az_identity_federated-credential_create
- az_identity_federated-credential_delete
- az_identity_federated-credential_list
- az_identity_federated-credential_show
- az_identity_federated-credential_update
metadata:
  description: Manage federated identity credentials on a user-assigned managed identity.
