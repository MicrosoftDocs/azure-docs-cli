    List the federated identity credentials on a user-assigned managed identity.
  description: |-
    List all federated identity credentials configured on a user-assigned managed identity.
  status: Preview
  isPreview: true
  sourceType: Core
  syntax: >-
    az identity federated-credential list --identity-name
                                          --resource-group
                                          [--skiptoken]
                                          [--subscription]
                                          [--top]
  examples:
  - summary: |-
      List federated credentials on an identity
    syntax: az identity federated-credential list --identity-name myIdentity --resource-group myResourceGroup
  requiredParameters:
