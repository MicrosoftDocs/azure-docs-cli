### YamlMime:AzureCLIGroup
uid: az_account
name: az account
summary: |-
  Manage the signed-in account.
status: GA
sourceType: Core
directCommands:
- uid: az_account_get-access-token
  name: az account get-access-token
  summary: |-
    Get an access token for the current signed-in context.
  description: |-
    Acquire an access token from the current signed-in context for a resource, a well-known resource type, or an explicit list of Microsoft Entra scopes. When no target is specified, a token for Azure Resource Manager (ARM) is returned. The token value is redacted by default and is not returned. Pass --plaintext to obtain the raw token value.
  status: GA
  sourceType: Core
  syntax: >-
    az account get-access-token [--plaintext]
                                [--resource]
                                [--resource-type {arm, aad-graph, ms-graph, batch, data-lake, oss-rdbms, media, key-vault, storage, synapse, managed-hsm, communication-email, attestation, app-configuration, analysis-services, operational-insights}]
                                [--scope]
                                [--tenant-id]
  examples:
  - summary: |-
      Get an access token for Azure Resource Manager (the default target)
    syntax: az account get-access-token
  - summary: |-
      Get an access token for a well-known resource type
    syntax: az account get-access-token --resource-type ms-graph
  - summary: |-
      Get an access token for a specific resource URL
    syntax: az account get-access-token --resource https://vault.azure.net
  - summary: |-
      Get an access token for an explicit list of scopes
    syntax: az account get-access-token --scope https://graph.microsoft.com/.default
  - summary: |-
      Print the raw access token as plain text
    syntax: az account get-access-token --plaintext
  optionalParameters:
  - name: --plaintext
    summary: |-
      Emit the raw access token as plain text. By default the token is redacted in output.
  - name: --resource
    summary: |-
      Resource URL (v1.0) to acquire the token for. Mutually exclusive with --resource-type and --scope.
  - name: --resource-type
    acceptedValues: arm, aad-graph, ms-graph, batch, data-lake, oss-rdbms, media, key-vault, storage, synapse, managed-hsm, communication-email, attestation, app-configuration, analysis-services, operational-insights
    summary: |-
      Well-known resource type shortcut (e.g. arm, ms-graph, key-vault). Mutually exclusive with --resource and --scope.
  - name: --scope
    summary: |-
      One or more Microsoft Entra v2.0 scopes. Mutually exclusive with --resource and --resource-type.
  - name: --tenant-id
    summary: |-
      Tenant ID to acquire the token for. Defaults to the current profile's tenant.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
commands:
- az_account_get-access-token
metadata:
  description: Manage the signed-in account.
