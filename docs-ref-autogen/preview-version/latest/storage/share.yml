### YamlMime:AzureCLIGroup
uid: az_storage_share
name: az storage share
summary: |-
  Manage Azure file shares.
status: Preview
isPreview: true
sourceType: Core
directCommands:
- uid: az_storage_share_create
  name: az storage share create
  summary: |-
    Create a file share.
  description: |-
    Create a file share in a storage account. Use `--quota` to set the maximum share size in GiB.
  status: Preview
  isPreview: true
  sourceType: Core
  syntax: >-
    az storage share create [--access-tier {TransactionOptimized, Hot, Cool, Premium}]
                            [--account-key]
                            [--account-name]
                            [--client-request-id]
                            [--enabled-protocols {SMB, NFS}]
                            [--metadata]
                            [--name]
                            [--quota]
                            [--root-squash {NoRootSquash, RootSquash, AllSquash}]
                            [--sas-token]
                            [--timeout]
                            [--url]
  examples:
  - summary: |-
      Create a file share
    syntax: az storage share create --account-name mystorageaccount --account-key $ACCOUNT_KEY --name myshare
  - summary: |-
      Create a file share with a 100 GiB quota
    syntax: az storage share create --account-name mystorageaccount --account-key $ACCOUNT_KEY --name myshare --quota 100
  optionalParameters:
  - name: --access-tier
    acceptedValues: TransactionOptimized, Hot, Cool, Premium
    summary: |-
      The access tier of the share.
  - name: --account-key
    summary: |-
      Storage account key.
  - name: --account-name
    summary: |-
      Storage account name. Used with the share name when --url is not given.
  - name: --client-request-id
    summary: |-
      An opaque, globally-unique, client-generated string identifier for the request.
  - name: --enabled-protocols
    acceptedValues: SMB, NFS
    summary: |-
      The protocol to enable for the share.
  - name: --metadata
    summary: |-
      Metadata in space-separated key=value pairs.
  - name: --name
    summary: |-
      The share name.
  - name: --quota
    summary: |-
      The maximum size of the share in GiB.
  - name: --root-squash
    acceptedValues: NoRootSquash, RootSquash, AllSquash
    summary: |-
      Root squashing behavior on the share. Only valid for NFS shares.
  - name: --sas-token
    summary: |-
      A shared access signature. Alternative to --account-key.
  - name: --timeout
    summary: |-
      The timeout parameter is expressed in seconds.
  - name: --url
    summary: |-
      The share URL. Alternative to --account-name and --name.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_storage_share_delete
  name: az storage share delete
  summary: |-
    Delete a file share.
  description: |-
    Delete a file share and all its contents. If the share has snapshots, pass `--delete-snapshots include` to delete them too, or use `--snapshot` to delete a single snapshot.
  status: Preview
  isPreview: true
  sourceType: Core
  syntax: >-
    az storage share delete [--account-key]
                            [--account-name]
                            [--client-request-id]
                            [--delete-snapshots {include, include-leased}]
                            [--lease-id]
                            [--name]
                            [--sas-token]
                            [--snapshot]
                            [--timeout]
                            [--url]
  examples:
  - summary: |-
      Delete a file share
    syntax: az storage share delete --account-name mystorageaccount --account-key $ACCOUNT_KEY --name myshare
  optionalParameters:
  - name: --account-key
    summary: |-
      Storage account key.
  - name: --account-name
    summary: |-
      Storage account name. Used with the share name when --url is not given.
  - name: --client-request-id
    summary: |-
      An opaque, globally-unique, client-generated string identifier for the request.
  - name: --delete-snapshots
    acceptedValues: include, include-leased
    summary: |-
      Also delete the share's snapshots. Required when the share has snapshots.
  - name: --lease-id
    summary: |-
      If specified, the operation only succeeds if the share's lease is active and matches this ID.
  - name: --name
    summary: |-
      The share name.
  - name: --sas-token
    summary: |-
      A shared access signature. Alternative to --account-key.
  - name: --snapshot
    summary: |-
      Delete only this share snapshot.
  - name: --timeout
    summary: |-
      The timeout parameter is expressed in seconds.
  - name: --url
    summary: |-
      The share URL. Alternative to --account-name and --name.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_storage_share_list
  name: az storage share list
  summary: |-
    List file shares in a storage account.
  description: |-
    List the file shares in a storage account, following continuation markers until all pages are returned. Use `--prefix` to filter by name.
  status: Preview
  isPreview: true
  sourceType: Core
  syntax: >-
    az storage share list [--account-key]
                          [--account-name]
                          [--client-request-id]
                          [--marker]
                          [--maxresults]
                          [--prefix]
                          [--sas-token]
                          [--timeout]
                          [--url]
  examples:
  - summary: |-
      List file shares
    syntax: az storage share list --account-name mystorageaccount --account-key $ACCOUNT_KEY
  - summary: |-
      List file shares whose names start with a prefix
    syntax: az storage share list --account-name mystorageaccount --account-key $ACCOUNT_KEY --prefix logs
  optionalParameters:
  - name: --account-key
    summary: |-
      Storage account key.
  - name: --account-name
    summary: |-
      Storage account name. Used when --url is not given.
  - name: --client-request-id
    summary: |-
      An opaque, globally-unique, client-generated string identifier for the request.
  - name: --marker
    summary: |-
      An opaque string value that identifies the portion of the result set to return with this operation.
  - name: --maxresults
    summary: |-
      Specifies the maximum number of shares to return.
  - name: --prefix
    summary: |-
      Filters the results to return only shares whose name begins with the specified prefix.
  - name: --sas-token
    summary: |-
      A shared access signature. Alternative to --account-key.
  - name: --timeout
    summary: |-
      The timeout parameter is expressed in seconds.
  - name: --url
    summary: |-
      The file service URL. Alternative to --account-name.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_storage_share_show
  name: az storage share show
  summary: |-
    Show the properties of a file share.
  description: |-
    Get the properties and metadata of a file share, such as its quota, access tier, and last-modified time. Use `--snapshot` to read a share snapshot.
  status: Preview
  isPreview: true
  sourceType: Core
  syntax: >-
    az storage share show [--account-key]
                          [--account-name]
                          [--client-request-id]
                          [--lease-id]
                          [--name]
                          [--sas-token]
                          [--snapshot]
                          [--timeout]
                          [--url]
  examples:
  - summary: |-
      Show a file share
    syntax: az storage share show --account-name mystorageaccount --account-key $ACCOUNT_KEY --name myshare
  optionalParameters:
  - name: --account-key
    summary: |-
      Storage account key.
  - name: --account-name
    summary: |-
      Storage account name. Used with the share name when --url is not given.
  - name: --client-request-id
    summary: |-
      An opaque, globally-unique, client-generated string identifier for the request.
  - name: --lease-id
    summary: |-
      If specified, the operation only succeeds if the share's lease is active and matches this ID.
  - name: --name
    summary: |-
      The share name.
  - name: --sas-token
    summary: |-
      A shared access signature. Alternative to --account-key.
  - name: --snapshot
    summary: |-
      The share snapshot to query.
  - name: --timeout
    summary: |-
      The timeout parameter is expressed in seconds.
  - name: --url
    summary: |-
      The share URL. Alternative to --account-name and --name.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_storage_share_update
  name: az storage share update
  summary: |-
    Update the properties of a file share.
  description: |-
    Update the quota, access tier, or root squash setting of a file share.
  status: Preview
  isPreview: true
  sourceType: Core
  syntax: >-
    az storage share update [--access-tier {TransactionOptimized, Hot, Cool, Premium}]
                            [--account-key]
                            [--account-name]
                            [--client-request-id]
                            [--lease-id]
                            [--name]
                            [--quota]
                            [--root-squash {NoRootSquash, RootSquash, AllSquash}]
                            [--sas-token]
                            [--timeout]
                            [--url]
  examples:
  - summary: |-
      Set the quota of a file share
    syntax: az storage share update --account-name mystorageaccount --account-key $ACCOUNT_KEY --name myshare --quota 200
  optionalParameters:
  - name: --access-tier
    acceptedValues: TransactionOptimized, Hot, Cool, Premium
    summary: |-
      The access tier of the share.
  - name: --account-key
    summary: |-
      Storage account key.
  - name: --account-name
    summary: |-
      Storage account name. Used with the share name when --url is not given.
  - name: --client-request-id
    summary: |-
      An opaque, globally-unique, client-generated string identifier for the request.
  - name: --lease-id
    summary: |-
      If specified, the operation only succeeds if the share's lease is active and matches this ID.
  - name: --name
    summary: |-
      The share name.
  - name: --quota
    summary: |-
      The maximum size of the share in GiB.
  - name: --root-squash
    acceptedValues: NoRootSquash, RootSquash, AllSquash
    summary: |-
      Root squashing behavior on the share. Only valid for NFS shares.
  - name: --sas-token
    summary: |-
      A shared access signature. Alternative to --account-key.
  - name: --timeout
    summary: |-
      The timeout parameter is expressed in seconds.
  - name: --url
    summary: |-
      The share URL. Alternative to --account-name and --name.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
