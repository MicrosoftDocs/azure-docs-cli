### YamlMime:AzureCLIGroup
uid: az_storage_container
name: az storage container
summary: |-
  Manage blob containers.
status: Preview
isPreview: true
sourceType: Core
directCommands:
- uid: az_storage_container_create
  name: az storage container create
  summary: |-
    Create a blob container.
  description: |-
    Create a container in a storage account. Containers are private by default; use `--public-access` to allow anonymous read access to blobs or to the whole container.
  status: Preview
  isPreview: true
  sourceType: Core
  syntax: >-
    az storage container create [--account-key]
                                [--account-name]
                                [--client-request-id]
                                [--default-encryption-scope]
                                [--metadata]
                                [--name]
                                [--prevent-encryption-scope-override]
                                [--public-access {blob, container}]
                                [--sas-token]
                                [--timeout]
                                [--url]
  examples:
  - summary: |-
      Create a private container
    syntax: az storage container create --account-name mystorageaccount --account-key $ACCOUNT_KEY --name mycontainer
  - summary: |-
      Create a container with anonymous blob read access
    syntax: az storage container create --account-name mystorageaccount --account-key $ACCOUNT_KEY --name publiccontainer --public-access blob
  optionalParameters:
  - name: --account-key
    summary: |-
      Storage account key.
  - name: --account-name
    summary: |-
      Storage account name. Used with the container name when --url is not given.
  - name: --client-request-id
    summary: |-
      An opaque, globally-unique, client-generated string identifier for the request.
  - name: --default-encryption-scope
    summary: |-
      The default encryption scope for all writes to the container.
  - name: --metadata
    summary: |-
      Metadata in space-separated key=value pairs.
  - name: --name
    summary: |-
      The container name.
  - name: --prevent-encryption-scope-override
    summary: |-
      Block writes that specify an encryption scope other than the container default.
  - name: --public-access
    acceptedValues: blob, container
    summary: |-
      The public access level. Omit for private access.
  - name: --sas-token
    summary: |-
      A shared access signature. Alternative to --account-key.
  - name: --timeout
    summary: |-
      The timeout parameter is expressed in seconds.
  - name: --url
    summary: |-
      The container URL. Alternative to --account-name and --name.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_storage_container_delete
  name: az storage container delete
  summary: |-
    Delete a blob container.
  description: |-
    Mark a container and all blobs in it for deletion. The container is removed later by garbage collection, and a container with the same name can't be created until then.
  status: Preview
  isPreview: true
  sourceType: Core
  syntax: >-
    az storage container delete [--account-key]
                                [--account-name]
                                [--client-request-id]
                                [--if-modified-since]
                                [--if-unmodified-since]
                                [--lease-id]
                                [--name]
                                [--sas-token]
                                [--timeout]
                                [--url]
  examples:
  - summary: |-
      Delete a container
    syntax: az storage container delete --account-name mystorageaccount --account-key $ACCOUNT_KEY --name mycontainer
  optionalParameters:
  - name: --account-key
    summary: |-
      Storage account key.
  - name: --account-name
    summary: |-
      Storage account name. Used with the container name when --url is not given.
  - name: --client-request-id
    summary: |-
      An opaque, globally-unique, client-generated string identifier for the request.
  - name: --if-modified-since
    summary: |-
      Delete only if the container has been modified since the specified date-time.
  - name: --if-unmodified-since
    summary: |-
      Delete only if the container has not been modified since the specified date-time.
  - name: --lease-id
    summary: |-
      If specified, the operation only succeeds if the container's lease is active and matches this ID.
  - name: --name
    summary: |-
      The container name.
  - name: --sas-token
    summary: |-
      A shared access signature. Alternative to --account-key.
  - name: --timeout
    summary: |-
      The timeout parameter is expressed in seconds.
  - name: --url
    summary: |-
      The container URL. Alternative to --account-name and --name.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
commands:
- az_storage_container_create
- az_storage_container_delete
metadata:
  description: Manage blob containers.
