### YamlMime:AzureCLIGroup
uid: az_storage_file_copy
name: az storage file copy
summary: |-
  Manage asynchronous file copy operations.
status: Preview
isPreview: true
sourceType: Core
directCommands:
- uid: az_storage_file_copy_start
  name: az storage file copy start
  summary: |-
    Start an asynchronous copy into a file.
  description: |-
    Start a server-side copy into a file in a file share. The source must be an Azure file or blob; a source in another account must be readable, for example through a SAS token. The command returns once the copy is scheduled; check its status with `az storage file show`.
  status: Preview
  isPreview: true
  sourceType: Core
  syntax: >-
    az storage file copy start [--account-key]
                               [--account-name]
                               [--client-request-id]
                               [--metadata]
                               [--path]
                               [--sas-token]
                               [--share-name]
                               [--source-uri]
                               [--timeout]
                               [--url]
  examples:
  - summary: |-
      Copy a file within the share
    syntax: az storage file copy start --account-name mystorageaccount --account-key $ACCOUNT_KEY --share-name myshare --path mydir/copy.txt --source-uri https://mystorageaccount.file.core.windows.net/myshare/mydir/myfile.txt
  - summary: |-
      Copy a blob into a file
    syntax: az storage file copy start --account-name mystorageaccount --account-key $ACCOUNT_KEY --share-name myshare --path mydir/fromblob.txt --source-uri https://mystorageaccount.blob.core.windows.net/mycontainer/myblob.txt
  optionalParameters:
  - name: --account-key
    summary: |-
      Storage account key.
  - name: --account-name
    summary: |-
      Storage account name. Used with the share name and file path when --url is not given.
  - name: --client-request-id
    summary: |-
      An opaque, globally-unique, client-generated string identifier for the request.
  - name: --metadata
    summary: |-
      Destination metadata in space-separated key=value pairs. The source metadata is copied when not given.
  - name: --path
    summary: |-
      The destination file path within the share, e.g. dir/file.txt.
  - name: --sas-token
    summary: |-
      A shared access signature. Alternative to --account-key.
  - name: --share-name
    summary: |-
      The share name.
  - name: --source-uri
    summary: |-
      The source file or blob URL. It must be in the destination account or carry a SAS.
  - name: --timeout
    summary: |-
      The timeout parameter is expressed in seconds.
  - name: --url
    summary: |-
      The destination file URL. Alternative to --account-name, --share-name and --path.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
commands:
- az_storage_file_copy_start
metadata:
  description: Manage asynchronous file copy operations.
