### YamlMime:AzureCLIGroup
uid: az_storage_blob_copy
name: az storage blob copy
summary: |-
  Manage asynchronous blob copy operations.
status: Preview
isPreview: true
sourceType: Core
directCommands:
- uid: az_storage_blob_copy_start
  name: az storage blob copy start
  summary: |-
    Start an asynchronous copy of a source URL into a blob.
  description: |-
    Start a server-side copy from a source URL into a destination blob. The source can be another blob or any publicly readable URL. The command returns once the copy is scheduled; check its status with `az storage blob show`.
  status: Preview
  isPreview: true
  sourceType: Core
  syntax: >-
    az storage blob copy start --source-uri
                               [--account-key]
                               [--account-name]
                               [--client-request-id]
                               [--destination-blob]
                               [--destination-container]
                               [--destination-if-match]
                               [--destination-if-modified-since]
                               [--destination-if-none-match]
                               [--destination-if-unmodified-since]
                               [--destination-lease]
                               [--destination-tags-condition]
                               [--metadata]
                               [--rehydrate-priority {High, Standard}]
                               [--sas-token]
                               [--source-if-match]
                               [--source-if-modified-since]
                               [--source-if-none-match]
                               [--source-if-unmodified-since]
                               [--source-tags-condition]
                               [--tags]
                               [--tier]
                               [--timeout]
                               [--url]
  examples:
  - summary: |-
      Copy a public URL into a blob
    syntax: az storage blob copy start --account-name mystorageaccount --account-key $ACCOUNT_KEY --destination-container mycontainer --destination-blob copied.md --source-uri https://raw.githubusercontent.com/Azure/azure-rest-api-specs/refs/heads/main/specification/storage/data-plane/BlobStorage/readme.md
  - summary: |-
      Copy a blob within the account
    syntax: az storage blob copy start --account-name mystorageaccount --account-key $ACCOUNT_KEY --destination-container backup --destination-blob myblob.txt --source-uri https://mystorageaccount.blob.core.windows.net/mycontainer/myblob.txt
  requiredParameters:
  - isRequired: true
    name: --source-uri
    summary: |-
      The source blob URL. It must be public, in the destination account, or carry a SAS.
  optionalParameters:
  - name: --account-key
    summary: |-
      Destination storage account key.
  - name: --account-name
    summary: |-
      Destination storage account name. Used with the container and blob name when --url is not given.
  - name: --client-request-id
    summary: |-
      An opaque, globally-unique, client-generated string identifier for the request.
  - name: --destination-blob
    summary: |-
      The destination blob name.
  - name: --destination-container
    summary: |-
      The destination container name.
  - name: --destination-if-match
    summary: |-
      Copy only if the destination blob ETag matches.
  - name: --destination-if-modified-since
    summary: |-
      Copy only if the destination blob has been modified since the specified date-time.
  - name: --destination-if-none-match
    summary: |-
      Copy only if the destination blob ETag does not match.
  - name: --destination-if-unmodified-since
    summary: |-
      Copy only if the destination blob has not been modified since the specified date-time.
  - name: --destination-lease
    summary: |-
      The lease ID specified for the destination blob.
  - name: --destination-tags-condition
    summary: |-
      A SQL-like where clause on the destination blob's tags.
  - name: --metadata
    summary: |-
      Destination metadata in space-separated key=value pairs.
  - name: --rehydrate-priority
    acceptedValues: High, Standard
    summary: |-
      The priority of the rehydration operation.
  - name: --sas-token
    summary: |-
      A shared access signature for the destination. Alternative to --account-key; a source SAS goes in --source-uri.
  - name: --source-if-match
    summary: |-
      Copy only if the source blob ETag matches.
  - name: --source-if-modified-since
    summary: |-
      Copy only if the source blob has been modified since the specified date-time.
  - name: --source-if-none-match
    summary: |-
      Copy only if the source blob ETag does not match.
  - name: --source-if-unmodified-since
    summary: |-
      Copy only if the source blob has not been modified since the specified date-time.
  - name: --source-tags-condition
    summary: |-
      A SQL-like where clause on the source blob's tags.
  - name: --tags
    summary: |-
      Destination tags in space-separated key=value pairs.
  - name: --tier
    summary: |-
      The tier to be set on the destination blob.
  - name: --timeout
    summary: |-
      The timeout parameter is expressed in seconds.
  - name: --url
    summary: |-
      The destination blob URL. Alternative to --account-name, --destination-container and --destination-blob.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
commands:
- az_storage_blob_copy_start
metadata:
  description: Manage asynchronous blob copy operations.
