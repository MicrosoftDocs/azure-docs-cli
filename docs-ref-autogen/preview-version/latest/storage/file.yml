### YamlMime:AzureCLIGroup
uid: az_storage_file
name: az storage file
summary: |-
  Manage files in Azure file shares.
status: Preview
isPreview: true
sourceType: Core
directCommands:
- uid: az_storage_file_create
  name: az storage file create
  summary: |-
    Create an empty file.
  description: |-
    Create a file in a file share without uploading content. Use `--size` to set the file length in bytes; the content is zero-filled.
  status: Preview
  isPreview: true
  sourceType: Core
  syntax: >-
    az storage file create [--account-key]
                           [--account-name]
                           [--client-request-id]
                           [--content-cache-control]
                           [--content-disposition]
                           [--content-encoding]
                           [--content-language]
                           [--content-type]
                           [--metadata]
                           [--path]
                           [--sas-token]
                           [--share-name]
                           [--size]
                           [--timeout]
                           [--url]
  examples:
  - summary: |-
      Create an empty file
    syntax: az storage file create --account-name mystorageaccount --account-key $ACCOUNT_KEY --share-name myshare --path mydir/empty.txt
  - summary: |-
      Create a 1 KiB file
    syntax: az storage file create --account-name mystorageaccount --account-key $ACCOUNT_KEY --share-name myshare --path mydir/sized.bin --size 1024
  optionalParameters:
  - name: --account-key
    summary: |-
      Storage account key.
  - name: --account-name
    summary: |-
      Storage account name. Used with the share name and file path when --url is not given.
  - name: --client-request-id
    summary: |-
      An opaque, globally-unique, client-generated string identifier for the request.
  - name: --content-cache-control
    summary: |-
      The cache control of the file.
  - name: --content-disposition
    summary: |-
      The content disposition of the file.
  - name: --content-encoding
    summary: |-
      The content encoding of the file.
  - name: --content-language
    summary: |-
      The content language of the file.
  - name: --content-type
    summary: |-
      The content type of the file.
  - name: --metadata
    summary: |-
      Metadata in space-separated key=value pairs.
  - name: --path
    summary: |-
      The file path within the share, e.g. dir/file.txt. The directory must exist; an existing file is replaced.
  - name: --sas-token
    summary: |-
      A shared access signature. Alternative to --account-key.
  - name: --share-name
    summary: |-
      The share name.
  - name: --size
    summary: |-
      The file size in bytes. The file is created empty, filled with zeros.
  - name: --timeout
    summary: |-
      The timeout parameter is expressed in seconds.
  - name: --url
    summary: |-
      The file URL. Alternative to --account-name, --share-name and --path.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
