- uid: az_storage_file_download
  name: az storage file download
  summary: |-
    Download a file to a local path.
  description: |-
    Download the content of a file in a file share to a local file.
  status: Preview
  isPreview: true
  sourceType: Core
  syntax: >-
    az storage file download [--account-key]
                             [--account-name]
                             [--client-request-id]
                             [--dest]
                             [--path]
                             [--sas-token]
                             [--share-name]
                             [--timeout]
                             [--url]
  examples:
  - summary: |-
      Download a file
    syntax: az storage file download --account-name mystorageaccount --account-key $ACCOUNT_KEY --share-name myshare --path mydir/myfile.txt --dest ./downloaded.txt
  optionalParameters:
  - name: --account-key
    summary: |-
      Storage account key.
  - name: --account-name
    summary: |-
      Storage account name. Used with the share name and file path when --url is not given.
  - name: --client-request-id
    summary: |-
      An opaque, globally-unique, client-generated string identifier for the request.
  - name: --dest
    summary: |-
      Path of the local file to write. An existing file is not overwritten.
  - name: --path
    summary: |-
      The file path within the share, e.g. dir/file.txt.
  - name: --sas-token
    summary: |-
      A shared access signature. Alternative to --account-key.
  - name: --share-name
    summary: |-
      The share name.
  - name: --timeout
    summary: |-
      The timeout parameter is expressed in seconds.
  - name: --url
    summary: |-
      The file URL. Alternative to --account-name, --share-name and --path.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_storage_file_list
  name: az storage file list
  summary: |-
    List files and directories in a file share.
  description: |-
    List the files and directories in a directory, or in the share root when `--name` isn't given. Continuation markers are followed until all pages are returned.
  status: Preview
  isPreview: true
  sourceType: Core
  syntax: >-
    az storage file list [--account-key]
                         [--account-name]
                         [--client-request-id]
                         [--marker]
                         [--maxresults]
                         [--name]
                         [--prefix]
                         [--sas-token]
                         [--share-name]
                         [--snapshot]
                         [--timeout]
                         [--url]
  examples:
  - summary: |-
      List the share root
    syntax: az storage file list --account-name mystorageaccount --account-key $ACCOUNT_KEY --share-name myshare
  - summary: |-
      List a directory
    syntax: az storage file list --account-name mystorageaccount --account-key $ACCOUNT_KEY --share-name myshare --name mydir
  optionalParameters:
  - name: --account-key
    summary: |-
      Storage account key.
  - name: --account-name
    summary: |-
      Storage account name. Used with the share name when --url is not given.
  - name: --client-request-id
    summary: |-
      An opaque, globally-unique, client-generated string identifier for the request.
  - name: --marker
    summary: |-
      An opaque string value that identifies the portion of the result set to return with this operation.
  - name: --maxresults
    summary: |-
      Specifies the maximum number of entries, directories and files combined, the service scans per page.
  - name: --name
    summary: |-
      The directory path to list, e.g. parent/child. Lists the share root when not given.
  - name: --prefix
    summary: |-
      Filters the results to return only entries whose name begins with the specified prefix.
  - name: --sas-token
    summary: |-
      A shared access signature. Alternative to --account-key.
  - name: --share-name
    summary: |-
      The share name.
  - name: --snapshot
    summary: |-
      The share snapshot to list.
  - name: --timeout
    summary: |-
      The timeout parameter is expressed in seconds.
  - name: --url
    summary: |-
      The URL of the share or directory to list. Alternative to --account-name, --share-name and --name.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_storage_file_show
  name: az storage file show
  summary: |-
    Show the properties of a file.
  description: |-
    Get the system properties and metadata of a file, such as its content length and content type, without downloading its content.
  status: Preview
  isPreview: true
  sourceType: Core
  syntax: >-
    az storage file show [--account-key]
                         [--account-name]
                         [--client-request-id]
                         [--path]
                         [--sas-token]
                         [--share-name]
                         [--snapshot]
                         [--timeout]
                         [--url]
  examples:
  - summary: |-
      Show a file
    syntax: az storage file show --account-name mystorageaccount --account-key $ACCOUNT_KEY --share-name myshare --path mydir/myfile.txt
  optionalParameters:
