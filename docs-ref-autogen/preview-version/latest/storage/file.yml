- uid: az_storage_file_upload
  name: az storage file upload
  summary: |-
    Upload a local file to a file share.
  description: |-
    Upload a local file to a path in a file share. The parent directory must already exist.
  status: Preview
  isPreview: true
  sourceType: Core
  syntax: >-
    az storage file upload [--account-key]
                           [--account-name]
                           [--client-request-id]
                           [--content-cache-control]
                           [--content-disposition]
                           [--content-encoding]
                           [--content-language]
                           [--content-type]
                           [--metadata]
                           [--path]
                           [--sas-token]
                           [--share-name]
                           [--source]
                           [--timeout]
                           [--url]
  examples:
  - summary: |-
      Upload a file
    syntax: az storage file upload --account-name mystorageaccount --account-key $ACCOUNT_KEY --share-name myshare --path mydir/myfile.txt --source ./myfile.txt
  optionalParameters:
  - name: --account-key
    summary: |-
      Storage account key.
  - name: --account-name
    summary: |-
      Storage account name. Used with the share name and file path when --url is not given.
  - name: --client-request-id
    summary: |-
      An opaque, globally-unique, client-generated string identifier for the request.
  - name: --content-cache-control
    summary: |-
      The cache control of the file.
  - name: --content-disposition
    summary: |-
      The content disposition of the file.
  - name: --content-encoding
    summary: |-
      The content encoding of the file.
  - name: --content-language
    summary: |-
      The content language of the file.
  - name: --content-type
    summary: |-
      The content type of the file.
  - name: --metadata
    summary: |-
      Metadata in space-separated key=value pairs.
  - name: --path
    summary: |-
      The destination file path within the share, e.g. dir/file.txt. The directory must exist; an existing file is replaced.
  - name: --sas-token
    summary: |-
      A shared access signature. Alternative to --account-key.
  - name: --share-name
    summary: |-
      The share name.
  - name: --source
    summary: |-
      Path of the local file to upload.
  - name: --timeout
    summary: |-
      The timeout parameter is expressed in seconds.
  - name: --url
    summary: |-
      The file URL. Alternative to --account-name, --share-name and --path.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
