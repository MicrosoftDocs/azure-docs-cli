### YamlMime:AzureCLIGroup
uid: az_storage_directory
name: az storage directory
summary: |-
  Manage directories in Azure file shares.
status: Preview
isPreview: true
sourceType: Core
directCommands:
- uid: az_storage_directory_create
  name: az storage directory create
  summary: |-
    Create a directory in a file share.
  description: |-
    Create a directory in a file share. Nested paths such as `parent/child` are supported, but the parent directory must already exist.
  status: Preview
  isPreview: true
  sourceType: Core
  syntax: >-
    az storage directory create [--account-key]
                                [--account-name]
                                [--client-request-id]
                                [--metadata]
                                [--name]
                                [--sas-token]
                                [--share-name]
                                [--timeout]
                                [--url]
  examples:
  - summary: |-
      Create a directory
    syntax: az storage directory create --account-name mystorageaccount --account-key $ACCOUNT_KEY --share-name myshare --name mydir
  - summary: |-
      Create a nested directory
    syntax: az storage directory create --account-name mystorageaccount --account-key $ACCOUNT_KEY --share-name myshare --name mydir/child
  optionalParameters:
  - name: --account-key
    summary: |-
      Storage account key.
  - name: --account-name
    summary: |-
      Storage account name. Used with the share name and directory path when --url is not given.
  - name: --client-request-id
    summary: |-
      An opaque, globally-unique, client-generated string identifier for the request.
  - name: --metadata
    summary: |-
      Metadata in space-separated key=value pairs.
  - name: --name
    summary: |-
      The directory path within the share, e.g. parent/child. The parent must exist.
  - name: --sas-token
    summary: |-
      A shared access signature. Alternative to --account-key.
  - name: --share-name
    summary: |-
      The share name.
  - name: --timeout
    summary: |-
      The timeout parameter is expressed in seconds.
  - name: --url
    summary: |-
      The directory URL. Alternative to --account-name, --share-name and --name.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_storage_directory_delete
  name: az storage directory delete
  summary: |-
    Delete an empty directory.
  description: |-
    Delete a directory from a file share. The directory must be empty.
  status: Preview
  isPreview: true
  sourceType: Core
  syntax: >-
    az storage directory delete [--account-key]
                                [--account-name]
                                [--client-request-id]
                                [--name]
                                [--sas-token]
                                [--share-name]
                                [--timeout]
                                [--url]
  examples:
  - summary: |-
      Delete a directory
    syntax: az storage directory delete --account-name mystorageaccount --account-key $ACCOUNT_KEY --share-name myshare --name mydir
  optionalParameters:
  - name: --account-key
    summary: |-
      Storage account key.
  - name: --account-name
    summary: |-
      Storage account name. Used with the share name and directory path when --url is not given.
  - name: --client-request-id
    summary: |-
      An opaque, globally-unique, client-generated string identifier for the request.
  - name: --name
    summary: |-
      The directory path within the share, e.g. parent/child. The directory must be empty.
  - name: --sas-token
    summary: |-
      A shared access signature. Alternative to --account-key.
  - name: --share-name
    summary: |-
      The share name.
  - name: --timeout
    summary: |-
      The timeout parameter is expressed in seconds.
  - name: --url
    summary: |-
      The directory URL. Alternative to --account-name, --share-name and --name.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_storage_directory_show
  name: az storage directory show
  summary: |-
    Show the properties of a directory.
  description: |-
    Get the properties and metadata of a directory in a file share.
  status: Preview
  isPreview: true
  sourceType: Core
  syntax: >-
    az storage directory show [--account-key]
                              [--account-name]
                              [--client-request-id]
                              [--name]
                              [--sas-token]
                              [--share-name]
                              [--snapshot]
                              [--timeout]
                              [--url]
  examples:
  - summary: |-
      Show a directory
    syntax: az storage directory show --account-name mystorageaccount --account-key $ACCOUNT_KEY --share-name myshare --name mydir
  optionalParameters:
  - name: --account-key
    summary: |-
      Storage account key.
  - name: --account-name
    summary: |-
      Storage account name. Used with the share name and directory path when --url is not given.
  - name: --client-request-id
    summary: |-
      An opaque, globally-unique, client-generated string identifier for the request.
  - name: --name
    summary: |-
      The directory path within the share, e.g. parent/child.
  - name: --sas-token
    summary: |-
      A shared access signature. Alternative to --account-key.
  - name: --share-name
    summary: |-
      The share name.
  - name: --snapshot
    summary: |-
      The share snapshot to query.
  - name: --timeout
    summary: |-
      The timeout parameter is expressed in seconds.
  - name: --url
    summary: |-
      The directory URL. Alternative to --account-name, --share-name and --name.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
commands:
- az_storage_directory_create
- az_storage_directory_delete
- az_storage_directory_show
metadata:
  description: Manage directories in Azure file shares.
