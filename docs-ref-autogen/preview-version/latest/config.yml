### YamlMime:AzureCLIGroup
uid: az_config
name: az config
summary: |-
  Manage local Azure CLI configuration settings and preferences.
status: GA
sourceType: Core
directCommands:
- uid: az_config_delete
  name: az config delete
  summary: |-
    Delete a configuration value.
  description: |-
    Remove a configuration setting by key. Once deleted, the setting reverts to its default value (if one exists). Unknown keys are rejected unless --force is specified.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/config/index.md
  syntax: >-
    az config delete --key
                     [--force]
  examples:
  - summary: |-
      Delete a configuration setting
    syntax: az config delete --key custom.mykey
  - summary: |-
      Force delete without validation
    syntax: az config delete --key custom.mykey --force
  requiredParameters:
  - isRequired: true
    name: --key
    summary: |-
      Configuration key in dot notation.
  optionalParameters:
  - name: --force
    summary: |-
      Allow unknown keys.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: plain
    acceptedValues: json, plain
    summary: |-
      Output format.
- uid: az_config_get
  name: az config get
  summary: |-
    Retrieve a configuration value.
  description: |-
    Get the current value of a configuration setting by key. Configuration keys use dot notation (e.g., output.format, core.debug). If the key is not found, an error is displayed.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/config/index.md
  syntax: >-
    az config get --key
                  [--json]
  examples:
  - summary: |-
      Get output format setting
    syntax: az config get --key output.format
  - summary: |-
      Get output as JSON
    syntax: az config get --key output.format --json
  requiredParameters:
  - isRequired: true
    name: --key
    summary: |-
      Configuration key in dot notation.
  optionalParameters:
  - name: --json
    summary: |-
      Output as JSON.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: plain
    acceptedValues: json, plain
    summary: |-
      Output format.
- uid: az_config_info
  name: az config info
  summary: |-
    Display information about valid configuration keys.
  description: |-
    Show metadata about available configuration keys including their descriptions, default values, and allowed value constraints. Use --keys-only to show only valid key names.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/config/index.md
  syntax: az config info [--keys-only]
  examples:
  - summary: |-
      Display configuration schema
    syntax: az config info
  - summary: |-
      Display only valid configuration key names
    syntax: az config info --keys-only
  optionalParameters:
  - name: --keys-only
    summary: |-
      Return only valid keys.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: plain
    acceptedValues: json, plain
    summary: |-
      Output format.
- uid: az_config_list
  name: az config list
  summary: |-
    List all configuration settings.
  description: |-
    Display all current configuration values. By default, only explicitly-set values are shown. Use --all to include default values. Output can be formatted as JSON for scripting.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/config/index.md
  syntax: >-
    az config list [--all]
                   [--json]
  examples:
  - summary: |-
      List current configuration values
    syntax: az config list
  - summary: |-
      List all configuration including defaults
    syntax: az config list --all
  - summary: |-
      List configuration as JSON
    syntax: az config list --json
  optionalParameters:
  - name: --all
    summary: |-
      Include default values.
  - name: --json
    summary: |-
      Output as JSON.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: plain
    acceptedValues: json, plain
    summary: |-
      Output format.
- uid: az_config_set
  name: az config set
  summary: |-
    Set or update a configuration value.
  description: |-
    Set a configuration value using dot notation keys. If the key already exists, it will be updated. Unknown keys are rejected unless --force is specified.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/config/index.md
  syntax: >-
    az config set --key
                  --value
                  [--force]
  examples:
  - summary: |-
      Set output format to JSON
    syntax: az config set --key output.format --value json
  - summary: |-
      Set a custom configuration key with force flag
    syntax: az config set --key custom.mykey --value myvalue --force
  requiredParameters:
  - isRequired: true
    name: --key
    summary: |-
      Configuration key in dot notation.
  - isRequired: true
    name: --value
    summary: |-
      Configuration value.
  optionalParameters:
  - name: --force
    summary: |-
      Allow unknown keys.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: plain
    acceptedValues: json, plain
    summary: |-
      Output format.
commands:
- az_config_delete
- az_config_get
- az_config_info
- az_config_list
- az_config_set
metadata:
  ms.date: 08/07/2026
  description: Manage local Azure CLI configuration settings and preferences.
