### YamlMime:AzureCLIGroup
uid: az_config
name: az config
summary: |-
  Manage local Azure CLI configuration settings and preferences.
status: Preview
isPreview: true
sourceType: Core
directCommands:
- uid: az_config_delete
  name: az config delete
  summary: |-
    Delete a configuration value.
  description: |-
    Remove a configuration setting by key. Once deleted, the setting reverts to its default value (if one exists). Unknown keys are rejected unless --force is specified.
  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/config/index.md
  syntax: >-
    az config delete --key
                     [--force]
  examples:
  - summary: |-
      Delete a configuration setting
    syntax: az config delete --key custom.mykey
  - summary: |-
      Force delete without validation
    syntax: az config delete --key custom.mykey --force
  requiredParameters:
  - isRequired: true
    name: --key
    summary: |-
      Configuration key in dot notation.
  optionalParameters:
  - name: --force
    summary: |-
      Allow unknown keys.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_config_get
  name: az config get
  summary: |-
    Retrieve a configuration value.
  description: |-
    Get the current value of a configuration setting by key. Configuration keys use dot notation (e.g., clients.cli.output.format, core.logging.level). If the key is not found, an error is displayed.
  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/config/index.md
  syntax: az config get --key
  examples:
  - summary: |-
      Get output format setting
    syntax: az config get --key clients.cli.output.format
  - summary: |-
      Get output as JSON
    syntax: az config get --key clients.cli.output.format --output json
  - summary: |-
      Get output as a table
    syntax: az config get --key clients.cli.output.format --output table
  - summary: |-
      Query the configuration value
    syntax: az config get --key clients.cli.output.format --query "value"
  requiredParameters:
  - isRequired: true
    name: --key
    summary: |-
      Configuration key in dot notation.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_config_info
  name: az config info
  summary: |-
    Display information about valid configuration keys.
  description: |-
    Show metadata about available configuration keys including their descriptions, default values, and allowed value constraints. Use --keys-only to show only valid key names.
  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/config/index.md
  syntax: az config info [--keys-only]
  examples:
  - summary: |-
      Display configuration schema
    syntax: az config info
  - summary: |-
      Display only valid configuration key names
    syntax: az config info --keys-only
  - summary: |-
      Display configuration schema as a table
    syntax: az config info --output table
  optionalParameters:
  - name: --keys-only
    summary: |-
      Return only valid keys.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_config_list
  name: az config list
  summary: |-
    List all configuration settings.
  description: |-
    Display all current configuration values. By default, only explicitly-set values are shown. Use --all to include default values. Standard output formats such as JSON, table, TSV, and YAML are supported.
  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/config/index.md
  syntax: az config list [--all]
  examples:
  - summary: |-
      List current configuration values
    syntax: az config list
  - summary: |-
      List all configuration including defaults
    syntax: az config list --all
  - summary: |-
      List configuration as JSON
    syntax: az config list --output json
  - summary: |-
      List configuration as a table
    syntax: az config list --output table
  optionalParameters:
  - name: --all
    summary: |-
      Include default values.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_config_set
  name: az config set
  summary: |-
    Set or update a configuration value.
  description: |-
    Set a configuration value using dot notation keys. If the key already exists, it will be updated. Unknown keys are rejected unless --force is specified.
  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/config/index.md
  syntax: >-
    az config set --key
                  --value
                  [--force]
  examples:
  - summary: |-
      Set output format to JSON
    syntax: az config set --key clients.cli.output.format --value json
  - summary: |-
      Set a custom configuration key with force flag
    syntax: az config set --key custom.mykey --value myvalue --force
  requiredParameters:
  - isRequired: true
    name: --key
    summary: |-
      Configuration key in dot notation.
  - isRequired: true
    name: --value
    summary: |-
      Configuration value.
  optionalParameters:
  - name: --force
    summary: |-
      Allow unknown keys.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
commands:
- az_config_delete
- az_config_get
- az_config_info
- az_config_list
- az_config_set
metadata:
  ms.date: 10/06/2026
  description: Manage local Azure CLI configuration settings and preferences.
