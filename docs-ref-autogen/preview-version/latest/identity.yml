### YamlMime:AzureCLIGroup
uid: az_identity
name: az identity
summary: |-
  Manage Azure user-assigned managed identities.
status: GA
sourceType: Core
directCommands:
- uid: az_identity_create
  name: az identity create
  summary: |-
    Create a user-assigned managed identity.
  description: |-
    Create a user-assigned managed identity in the specified subscription and resource group. If `--location` is omitted, the resource group's location is used.
  status: GA
  sourceType: Core
  syntax: >-
    az identity create --name
                       --resource-group
                       [--acquire-policy-token]
                       [--change-reference]
                       [--isolation-scope {None, Regional}]
                       [--location]
                       [--resource-restriction]
                       [--subscription]
                       [--tags]
  examples:
  - summary: |-
      Create an identity
    syntax: az identity create --name myIdentity --resource-group myResourceGroup
  - summary: |-
      Create an identity with regional assignment restrictions
    syntax: az identity create --name myIdentity --resource-group myResourceGroup --isolation-scope Regional
  - summary: |-
      Create an identity with resource assignment restrictions
    syntax: az identity create --name myIdentity --resource-group myResourceGroup --resource-restriction '{"providers":["Microsoft.Compute"]}'
  requiredParameters:
  - isRequired: true
    name: --name
    summary: |-
      The name of the identity resource.
  - isRequired: true
    name: --resource-group
    summary: |-
      Name of resource group.
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
  - name: --isolation-scope
    acceptedValues: None, Regional
    summary: |-
      Enum to configure regional restrictions on identity assignment, as necessary.
  - name: --location
    summary: |-
      The geo-location where the resource lives. When not specified, the location of the resource group will be used.
  - name: --resource-restriction
    summary: |-
      Restrictions on which resource providers this identity can be assigned to.
  - name: --subscription
    summary: |-
      Name or ID of subscription.
  - name: --tags
    summary: |-
      Resource tags.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: plain
    acceptedValues: json, plain
    summary: |-
      Output format.
- uid: az_identity_delete
  name: az identity delete
  summary: |-
    Delete a user-assigned managed identity.
  description: |-
    Delete a user-assigned managed identity by name and resource group, or by one or more full Azure resource IDs.
  status: GA
  sourceType: Core
  syntax: >-
    az identity delete [--acquire-policy-token]
                       [--change-reference]
                       [--ids]
                       [--name]
                       [--resource-group]
                       [--subscription]
  examples:
  - summary: |-
      Delete an identity by name
    syntax: az identity delete --name myIdentity --resource-group myResourceGroup
  - summary: |-
      Delete identities by resource ID
    syntax: az identity delete --ids /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/myResourceGroup/providers/Microsoft.ManagedIdentity/userAssignedIdentities/myIdentity
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
  - name: --ids
    summary: |-
      One or more resource IDs. Provide either --ids or other Resource Id arguments.
  - name: --name
    summary: |-
      The name of the identity resource.
  - name: --resource-group
    summary: |-
      Name of resource group.
  - name: --subscription
    summary: |-
      Name or ID of subscription.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: plain
    acceptedValues: json, plain
    summary: |-
      Output format.
- uid: az_identity_list
  name: az identity list
  summary: |-
    List user-assigned managed identities.
  description: |-
    List user-assigned managed identities in the current subscription or in a specific resource group.
  status: GA
  sourceType: Core
  syntax: >-
    az identity list [--max-items]
                     [--next-token]
                     [--resource-group]
                     [--subscription]
  examples:
  - summary: |-
      List identities in a resource group
    syntax: az identity list --resource-group myResourceGroup
  - summary: |-
      List identities in the current subscription
    syntax: az identity list
  optionalParameters:
  - name: --max-items
    summary: |-
      Total number of items to return in the command's output.
  - name: --next-token
    summary: |-
      Token to specify where to start paginating.
  - name: --resource-group
    summary: |-
      Name of resource group.
  - name: --subscription
    summary: |-
      Name or ID of subscription.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: plain
    acceptedValues: json, plain
    summary: |-
      Output format.
- uid: az_identity_show
  name: az identity show
  summary: |-
    Show a user-assigned managed identity.
  description: |-
    Get a user-assigned managed identity by name and resource group, or by its full Azure resource ID.
  status: GA
  sourceType: Core
  syntax: >-
    az identity show [--ids]
                     [--name]
                     [--resource-group]
                     [--subscription]
  examples:
  - summary: |-
      Show an identity by name
    syntax: az identity show --name myIdentity --resource-group myResourceGroup
  - summary: |-
      Show an identity by resource ID
    syntax: az identity show --ids /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/myResourceGroup/providers/Microsoft.ManagedIdentity/userAssignedIdentities/myIdentity
  optionalParameters:
  - name: --ids
    summary: |-
      One or more resource IDs. Provide either --ids or other Resource Id arguments.
  - name: --name
    summary: |-
      The name of the identity resource.
  - name: --resource-group
    summary: |-
      Name of resource group.
  - name: --subscription
    summary: |-
      Name or ID of subscription.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: plain
    acceptedValues: json, plain
    summary: |-
      Output format.
- uid: az_identity_update
  name: az identity update
  summary: |-
    Update a user-assigned managed identity.
  description: |-
    Update tags, identity isolation scope, resource assignment restrictions, or generic properties on a user-assigned managed identity.
  status: GA
  sourceType: Core
  syntax: >-
    az identity update [--acquire-policy-token]
                       [--add]
                       [--change-reference]
                       [--force-string {0, 1, f, false, n, no, t, true, y, yes}]
                       [--ids]
                       [--isolation-scope {None, Regional}]
                       [--name]
                       [--remove]
                       [--resource-group]
                       [--resource-restriction]
                       [--set]
                       [--subscription]
                       [--tags]
  examples:
  - summary: |-
      Update an identity's isolation scope
    syntax: az identity update --name myIdentity --resource-group myResourceGroup --isolation-scope None
  - summary: |-
      Update an identity by resource ID
    syntax: az identity update --ids /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/myResourceGroup/providers/Microsoft.ManagedIdentity/userAssignedIdentities/myIdentity --tags env=prod
  - summary: |-
      Update resource assignment restrictions
    syntax: az identity update --name myIdentity --resource-group myResourceGroup --resource-restriction '{"providers":["Microsoft.Storage"]}' --isolation-scope Regional
  optionalParameters:
  - name: --acquire-policy-token
    summary: |-
      Acquiring an Azure Policy token automatically for this resource operation.
  - name: --add
    summary: |-
      Add an object to a list of objects by specifying a path and key value pairs.
  - name: --change-reference
    summary: |-
      The related change reference ID for this resource operation.
  - name: --force-string
    acceptedValues: 0, 1, f, false, n, no, t, true, y, yes
    summary: |-
      When using 'set' or 'add', preserve string literals instead of attempting to convert to JSON.
  - name: --ids
    summary: |-
      One or more resource IDs. Provide either --ids or other Resource Id arguments.
  - name: --isolation-scope
    acceptedValues: None, Regional
    summary: |-
      Enum to configure regional restrictions on identity assignment, as necessary.
  - name: --name
    summary: |-
      The name of the identity resource.
  - name: --remove
    summary: |-
      Remove a property or an element from a list.
  - name: --resource-group
    summary: |-
      Name of resource group.
  - name: --resource-restriction
    summary: |-
      Restrictions on which resource providers this identity can be assigned to.
  - name: --set
    summary: |-
      Update an object by specifying a property path and value to set.
  - name: --subscription
    summary: |-
      Name or ID of subscription.
  - name: --tags
    summary: |-
      Resource tags.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: plain
    acceptedValues: json, plain
    summary: |-
      Output format.
commands:
- az_identity_create
- az_identity_delete
- az_identity_list
- az_identity_show
- az_identity_update
metadata:
  description: Manage Azure user-assigned managed identities.
