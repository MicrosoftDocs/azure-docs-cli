### YamlMime:AzureCLIGroup
uid: az_profile
name: az profile
summary: |-
  Manage saved Azure authentication profiles.
status: GA
sourceType: Core
directCommands:
- uid: az_profile_list
  name: az profile list
  summary: |-
    List all saved profiles, indicating which one is active.
  description: |-
    List every saved authentication profile, marking the currently active one. Each entry shows the profile name, tenant, subscription, cloud, and authentication method.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/profile/index.md
  syntax: az profile list
  examples:
  - summary: |-
      List all saved profiles
    syntax: az profile list
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: plain
    acceptedValues: json, plain
    summary: |-
      Output format.
- uid: az_profile_remove
  name: az profile remove
  summary: |-
    Remove a saved profile.
  description: |-
    Delete a saved profile by name. If the removed profile was active, the active pointer is cleared with no fallback.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/profile/index.md
  syntax: az profile remove --name
  examples:
  - summary: |-
      Remove a profile
    syntax: az profile remove --name staging
  requiredParameters:
  - isRequired: true
    name: --name
    summary: |-
      The name of the profile to remove.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: plain
    acceptedValues: json, plain
    summary: |-
      Output format.
- uid: az_profile_set
  name: az profile set
  summary: |-
    Set the active profile persistently.
  description: |-
    Set the active profile persistently. The named profile must already exist. Setting the active profile performs no re-authentication; it only changes which profile subsequent commands use.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/profile/index.md
  syntax: az profile set --name
  examples:
  - summary: |-
      Set the active profile
    syntax: az profile set --name dev
  requiredParameters:
  - isRequired: true
    name: --name
    summary: |-
      The name of the profile to activate.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: plain
    acceptedValues: json, plain
    summary: |-
      Output format.
- uid: az_profile_show
  name: az profile show
  summary: |-
    Show the full details of a single profile, or the active profile.
  description: |-
    Show the full details of a saved profile by name, or use --active to show the currently active profile. Specify either a profile name or --active, not both.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/profile/index.md
  syntax: >-
    az profile show [--active]
                    [--name]
  examples:
  - summary: |-
      Show a profile by name
    syntax: az profile show production
  - summary: |-
      Show the active profile
    syntax: az profile show --active
  optionalParameters:
  - name: --active
    summary: |-
      Show the active profile. Cannot be used together with the profile name.
  - name: --name
    summary: |-
      The name of the profile to show.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: plain
    acceptedValues: json, plain
    summary: |-
      Output format.
commands:
- az_profile_list
- az_profile_remove
- az_profile_set
- az_profile_show
metadata:
  ms.date: 07/02/2026
  description: Manage saved Azure authentication profiles.
