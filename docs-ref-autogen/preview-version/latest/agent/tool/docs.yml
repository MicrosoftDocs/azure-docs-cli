### YamlMime:AzureCLIGroup
uid: az_agent_tool_docs
name: az agent tool docs
summary: |-
  Inspect command-help metadata or rebuild the local catalog used by the Agent.
status: Preview
isPreview: true
sourceType: Core
directCommands:
- uid: az_agent_tool_docs_generate
  name: az agent tool docs generate
  summary: |-
    Rebuild the local help catalog used by AI recovery and command-help lookups.
  description: |-
    `az agent tool docs generate` rebuilds the local help catalog from the currently discoverable bundled and installed extensions. It uses the CLI's extension version selection and registry pins, then publishes validated catalog files under `~/.azclips/agent/help/`. On success, the command returns JSON with `generated: true` and the number of discovered commands. It does not call a model or query Azure resources.
  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/agent/index.md
  syntax: az agent tool docs generate
  examples:
  - summary: |-
      Rebuild the help catalog
    syntax: az agent tool docs generate
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_agent_tool_docs_list
  name: az agent tool docs list
  summary: |-
    List discoverable commands from the local help catalog.
  description: |-
    `az agent tool docs list` shares the local catalog reader used by the Agent and returns a JSON index of all known commands. Missing, stale, or corrupt catalog files are regenerated on demand. External AI tools use this metadata to discover commands before proposing plans.
  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/agent/index.md
  syntax: az agent tool docs list
  examples:
  - summary: |-
      List all known commands
    syntax: az agent tool docs list
  - summary: |-
      Rebuild the local help catalog
    syntax: az agent tool docs generate
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_agent_tool_docs_show
  name: az agent tool docs show
  summary: |-
    Look up a command's metadata from the local help catalog.
  description: |-
    `az agent tool docs show` shares the local catalog reader used by the Agent. The required `--name` argument selects a command whose full metadata is returned as JSON, including parameters, aliases, required flags, and extension owner. Missing, stale, or corrupt catalog files are regenerated on demand. External AI tools use this metadata to validate command syntax before proposing plans, avoiding hallucinated flags. Use `az agent tool docs list` to list all known commands.
  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/agent/index.md
  syntax: az agent tool docs show --name
  examples:
  - summary: |-
      Look up metadata for a specific command
    syntax: az agent tool docs show --name "vm create"
  - summary: |-
      Rebuild the local help catalog
    syntax: az agent tool docs generate
  requiredParameters:
  - isRequired: true
    name: --name
    summary: |-
      Command name to look up (e.g. 'vm create').
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
commands:
- az_agent_tool_docs_generate
- az_agent_tool_docs_list
- az_agent_tool_docs_show
metadata:
  ms.date: 11/09/2026
  description: Inspect command-help metadata or rebuild the local catalog used by the Agent.
