### YamlMime:AzureCLIGroup
uid: az_agent_tool_env
name: az agent tool env
summary: |-
  Inspect the current CLI environment for external AI-tool integration.
status: Preview
isPreview: true
sourceType: Core
directCommands:
- uid: az_agent_tool_env_show
  name: az agent tool env show
  summary: |-
    Return a JSON snapshot of the current CLI environment (azclips version, auth context, subscription, tenant, shell, working directory).
  description: |-
    `az agent tool env show` returns the same environment snapshot the internal agent gathers before proposing a plan. Fields include azclips version, OS, active subscription and tenant IDs, current working directory, and shell. Intended for external AI tools (Copilot CLI skills, Claude Code) that need to reason about the user's Azure context without spawning a full agent conversation.
  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/agent/index.md
  syntax: az agent tool env show
  examples:
  - summary: |-
      Capture the current environment
    syntax: az agent tool env show
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
commands:
- az_agent_tool_env_show
metadata:
  ms.date: 11/09/2026
  description: Inspect the current CLI environment for external AI-tool integration.
