### YamlMime:AzureCLIGroup
uid: az_agent_tool_help
name: az agent tool help
summary: |-
  Look up command metadata, list discoverable commands, or use generate to rebuild the local help catalog.
status: Preview
isPreview: true
sourceType: Core
directCommands:
- uid: az_agent_tool_help_generate
  name: az agent tool help generate
  summary: |-
    Rebuild the local help catalog used by AI recovery and command-help lookups.
  description: |-
    `az agent tool help generate` rebuilds the local help catalog from the currently discoverable bundled and installed extensions. It uses the CLI's extension version selection and registry pins, then publishes validated catalog files under `~/.azclips/agent/help/`. On success, the command returns JSON with `generated: true` and the number of discovered commands. It does not call a model or query Azure resources.
  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/agent/index.md
  syntax: az agent tool help generate
  examples:
  - summary: |-
      Rebuild the help catalog
    syntax: az agent tool help generate
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
commands:
- az_agent_tool_help_generate
metadata:
  ms.date: 07/07/2026
  description: Look up command metadata, list discoverable commands, or use generate to rebuild the local help catalog.
