### YamlMime:AzureCLIGroup
uid: az_agent_tool
name: az agent tool
summary: |-
  Agent internal tools exposed as commands for external AI-tool integration.
status: Preview
isPreview: true
sourceType: Core
directCommands:
- uid: az_agent_tool_env
  name: az agent tool env
  summary: |-
    Return a JSON snapshot of the current CLI environment (azclips version, auth context, subscription, tenant, shell, working directory).
  description: |-
    `az agent tool env` returns the same environment snapshot the internal agent gathers before proposing a plan. Fields include azclips version, OS, active subscription and tenant IDs, current working directory, and shell. Intended for external AI tools (Copilot CLI skills, Claude Code) that need to reason about the user's Azure context without spawning a full agent conversation.
  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/agent/index.md
  syntax: az agent tool env
  examples:
  - summary: |-
      Capture the current environment
    syntax: az agent tool env
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_agent_tool_help
  name: az agent tool help
  summary: |-
    Look up command metadata, list discoverable commands, or use generate to rebuild the local help catalog.
  description: |-
    `az agent tool help` shares the local catalog reader used by the agent. With `--name`, it returns full metadata for the specified command (parameters, aliases, required flags, extension owner). Without `--name`, it lists every command the agent knows about. Missing, stale, or corrupt catalog files are regenerated on demand. The `generate` subcommand rebuilds the catalog directly. External AI tools use this metadata to validate command syntax before proposing plans, avoiding hallucinated flags.
  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/agent/index.md
  syntax: az agent tool help [--name]
  examples:
  - summary: |-
      List all known commands
    syntax: az agent tool help
  - summary: |-
      Look up metadata for a specific command
    syntax: az agent tool help --name "vm create"
  - summary: |-
      Rebuild the local catalog
    syntax: az agent tool help generate
  optionalParameters:
  - name: --name
    summary: |-
      Command name to look up (e.g. 'vm create'). Omit to list all known commands.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
