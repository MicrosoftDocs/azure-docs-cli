### YamlMime:AzureCLIGroup
uid: az_disk
name: az disk
summary: |-
  Manage Azure managed disks.
status: GA
sourceType: Core
directCommands:
- uid: az_disk_list
  name: az disk list
  summary: |-
    List managed disks in a resource group.
  description: |-
    Return all managed disks that live in the specified resource group, including each disk's name, size (GB), SKU tier, and attachment state. Use this command for inventory, capacity planning, or to identify orphaned disks before cleanup.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/disk/index.md
  syntax: >-
    az disk list --resource-group
                 [--profile]
                 [--subscription-id]
  examples:
  - summary: |-
      List disks in a resource group
    syntax: az disk list --resource-group myrg34 --subscription-id 00000000-0000-0000-0000-000000000000
  - summary: |-
      List using shell variables
    syntax: az disk list --resource-group $rg --subscription-id $subId
  requiredParameters:
  - isRequired: true
    name: --resource-group
    summary: |-
      The resource group name.
  optionalParameters:
  - name: --profile
    summary: |-
      Use the named profile for this command (overrides the active profile).
  - name: --subscription-id
    summary: |-
      Azure Subscription Id. Defaults to the active profile's subscription.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: plain
    acceptedValues: json, plain
    summary: |-
      Output format.
commands:
- az_disk_list
metadata:
  ms.date: 06/24/2026
  description: Manage Azure managed disks.
