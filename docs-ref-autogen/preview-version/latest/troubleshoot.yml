### YamlMime:AzureCLIGroup
uid: az_troubleshoot
name: az troubleshoot
summary: |-
  Analyze saved command failures with AI.
status: Preview
isPreview: true
sourceType: Core
directCommands:
- uid: az_troubleshoot_analyze
  name: az troubleshoot analyze
  summary: |-
    Analyze a saved command failure with AI.
  description: |-
    Diagnose a saved failure using the same AI flow as automatic recovery. Without --id, select this terminal's latest saved failure, falling back to the global latest. Use an exact --id to select another record. The default style is oneshot. --style overrides agent.recovery.style for this invocation only.
  status: Preview
  isPreview: true
  sourceType: Core
  syntax: >-
    az troubleshoot analyze [--id]
                            [--style {oneshot, interactive}]
  examples:
  - summary: |-
      Analyze this terminal's latest saved failure
    syntax: az troubleshoot analyze
  - summary: |-
      Select a failure
    syntax: az troubleshoot analyze --id $failureId
  - summary: |-
      Use an interactive session for this analysis
    syntax: az troubleshoot analyze --id $failureId --style interactive
  optionalParameters:
  - name: --id
    summary: |-
      Analyze this exact saved failure. Omit to select the latest saved failure in this terminal, then the global latest.
  - name: --style
    acceptedValues: oneshot, interactive
    summary: |-
      Override agent.recovery.style for this analysis only.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_troubleshoot_list
  name: az troubleshoot list
  summary: |-
    List saved command failures locally.
  description: |-
    List saved failures without AI. Output has id, command, and errorDetail fields, sorted by numeric PID ascending, then time and counter descending. Error detail is single-line and limited to 200 characters; use az troubleshoot show to read the complete error. It does not change or clean up history.
  status: Preview
  isPreview: true
  sourceType: Core
  syntax: az troubleshoot list
  examples:
  - summary: |-
      List saved failures
    syntax: az troubleshoot list --output table
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_troubleshoot_show
  name: az troubleshoot show
  summary: |-
    Show the complete saved command and error locally.
  description: |-
    Read one saved failure by its exact ID without AI. Output has id, command, and errorDetail fields. Unlike list, show preserves the full original command and error text. It does not change or clean up history.
  status: Preview
  isPreview: true
  sourceType: Core
  syntax: az troubleshoot show --id
  examples:
  - summary: |-
      Show the complete failure
    syntax: az troubleshoot show --id $failureId --output table
  - summary: |-
      Read the saved error with a query
    syntax: az troubleshoot show --id $failureId --output json --query errorDetail
  requiredParameters:
  - isRequired: true
    name: --id
    summary: |-
      Show this exact saved failure locally, including the complete command and error detail.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
commands:
- az_troubleshoot_analyze
- az_troubleshoot_list
- az_troubleshoot_show
metadata:
  description: Analyze saved command failures with AI.
