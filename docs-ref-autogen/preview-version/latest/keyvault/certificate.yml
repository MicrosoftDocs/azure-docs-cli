- uid: az_keyvault_certificate_set-attributes
  name: az keyvault certificate set-attributes
  summary: |-
    Update supplied certificate attributes, tags or policy.
  description: |-
    Preserve omitted attributes and explicit false. At least one change is required. `--policy`/`--policy-file` accepts classic CLI or REST field names and updates the name-wide policy; `--version` applies only to attribute changes. Policy is sent before attributes; the requests are not transactional. Policy-only update reads the latest certificate afterward. Requires certificates/update and certificates/get for that follow-up read. Dates are supported through January 2038.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/keyvault/index.md
  syntax: >-
    az keyvault certificate set-attributes --name
                                           [--enabled]
                                           [--expires]
                                           [--not-before]
                                           [--policy]
                                           [--policy-file]
                                           [--profile]
                                           [--tags]
                                           [--vault-name]
                                           [--vault-url]
                                           [--version]
  examples:
  - summary: |-
      Disable a certificate
    syntax: az keyvault certificate set-attributes --vault-name myvault --name app-tls --enabled false
  - summary: |-
      Update policy
    syntax: az keyvault certificate set-attributes --vault-name myvault --name app-tls --policy '{"x509_certificate_properties":{"validity_in_months":12}}'
  requiredParameters:
  - isRequired: true
    name: --name
    summary: |-
      certificate name.
  optionalParameters:
  - name: --enabled
    summary: |-
      Whether the certificate is enabled: true or false.
  - name: --expires
    summary: |-
      Expiration timestamp in UTC.
  - name: --not-before
    summary: |-
      Not-before timestamp in UTC.
  - name: --policy
    summary: |-
      Certificate policy JSON using classic CLI or REST field names; @file is supported.
  - name: --policy-file
    summary: |-
      UTF-8 JSON policy file. Use instead of policy JSON.
  - name: --profile
    summary: |-
      Use the named connection profile.
  - name: --tags
    summary: |-
      Tags in NAME=VALUE form.
  - name: --vault-name
    summary: |-
      Azure public-cloud vault name.
  - name: --vault-url
    summary: |-
      Root HTTPS vault URL. Use instead of vault name.
  - name: --version
    summary: |-
      certificate version. Omit for latest.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_keyvault_certificate_show
  name: az keyvault certificate show
  summary: |-
    Read a public certificate and metadata.
  description: |-
    Get the latest certificate or an explicit `--version`. Requires certificates/get. Returns public bytes, policy, attributes and references. Does not follow backing secret/key references or export a private key.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/keyvault/index.md
  syntax: >-
    az keyvault certificate show --name
                                 [--profile]
                                 [--vault-name]
                                 [--vault-url]
                                 [--version]
  examples:
  - summary: |-
      Show latest
    syntax: az keyvault certificate show --vault-name myvault --name app-tls
  requiredParameters:
  - isRequired: true
    name: --name
    summary: |-
      certificate name.
  optionalParameters:
  - name: --profile
    summary: |-
      Use the named connection profile.
  - name: --vault-name
    summary: |-
      Azure public-cloud vault name.
  - name: --vault-url
    summary: |-
      Root HTTPS vault URL. Use instead of vault name.
  - name: --version
    summary: |-
      certificate version. Omit for latest.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
