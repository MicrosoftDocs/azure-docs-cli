### YamlMime:AzureCLIGroup
uid: az_keyvault_secret
name: az keyvault secret
summary: |-
  Manage Key Vault secrets.
status: Preview
isPreview: true
sourceType: Core
directCommands:
- uid: az_keyvault_secret_delete
  name: az keyvault secret delete
  summary: |-
    Delete all versions of a secret without purging it.
  description: |-
    Delete the named secret and all versions. Requires secrets/delete permission and explicit `--yes` confirmation. Output retains recovery metadata where returned by the service. The command never purges or bypasses purge protection. Recovery is not exposed in the CLI. A retained soft-deleted name cannot simply be reused as a new secret.
  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/keyvault/index.md
  syntax: >-
    az keyvault secret delete --name
                              [--profile]
                              [--vault-name]
                              [--vault-url]
                              [--yes]
  examples:
  - summary: |-
      Confirm deletion
    syntax: az keyvault secret delete --vault-name myvault --name app-password --yes
  requiredParameters:
  - isRequired: true
    name: --name
    summary: |-
      secret name.
  optionalParameters:
  - name: --profile
    summary: |-
      Use the named connection profile.
  - name: --vault-name
    summary: |-
      Azure public-cloud vault name.
  - name: --vault-url
    summary: |-
      Root HTTPS vault URL. Use instead of vault name.
  - name: --yes
    summary: |-
      Confirm deletion of all secret versions.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_keyvault_secret_list
  name: az keyvault secret list
  summary: |-
    List secret metadata across all pages.
  description: |-
    List base secret identifiers and attributes without retrieving values. Requires secrets/list permission. `--maxresults` sets the page size between 1 and 25, not the total result limit. Continuation requests stay within the selected vault.
  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/keyvault/index.md
  syntax: >-
    az keyvault secret list [--maxresults]
                            [--profile]
                            [--vault-name]
                            [--vault-url]
  examples:
  - summary: |-
      List secrets
    syntax: az keyvault secret list --vault-name myvault
  optionalParameters:
  - name: --maxresults
    summary: |-
      Page size from 1 to 25. All pages are returned.
  - name: --profile
    summary: |-
      Use the named connection profile.
  - name: --vault-name
    summary: |-
      Azure public-cloud vault name.
  - name: --vault-url
    summary: |-
      Root HTTPS vault URL. Use instead of vault name.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
