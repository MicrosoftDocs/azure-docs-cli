    az keyvault secret list-versions --name
                                     [--maxresults]
                                     [--profile]
                                     [--vault-name]
                                     [--vault-url]
  examples:
  - summary: |-
      List versions
    syntax: az keyvault secret list-versions --vault-name myvault --name app-password
  requiredParameters:
  - isRequired: true
    name: --name
    summary: |-
      secret name.
  optionalParameters:
  - name: --maxresults
    summary: |-
      Page size from 1 to 25. All pages are returned.
  - name: --profile
    summary: |-
      Use the named connection profile.
  - name: --vault-name
    summary: |-
      Azure public-cloud vault name.
  - name: --vault-url
    summary: |-
      Root HTTPS vault URL. Use instead of vault name.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_keyvault_secret_set
  name: az keyvault secret set
  summary: |-
    Set a secret or create a new version.
  description: |-
    Set a UTF-8 secret using exactly one of `--file` or `--value`. Prefer a protected file to avoid putting the value in shell history or process arguments. File contents, including trailing newlines, are preserved. Values must not exceed 25 KiB. Requires secrets/set permission. The response contains metadata, not the value. No vault is created.
  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/keyvault/index.md
  syntax: >-
    az keyvault secret set --name
                           [--content-type]
                           [--enabled]
                           [--expires]
                           [--file]
                           [--not-before]
                           [--profile]
                           [--tags]
                           [--value]
                           [--vault-name]
                           [--vault-url]
  examples:
  - summary: |-
      Set from a file
    syntax: az keyvault secret set --vault-name myvault --name app-password --file ./secret.txt
  - summary: |-
      Set with attributes
    syntax: az keyvault secret set --vault-name myvault --name app-password --file ./secret.txt --enabled false --expires 2027-01-01T00:00:00Z --tags owner=app
  requiredParameters:
  - isRequired: true
    name: --name
    summary: |-
      secret name.
  optionalParameters:
  - name: --content-type
    summary: |-
      Secret content type.
  - name: --enabled
    summary: |-
      Whether the secret is enabled: true or false.
  - name: --expires
    summary: |-
      Expiration timestamp in UTC.
  - name: --file
    summary: |-
      UTF-8 secret file; contents are preserved including newlines.
  - name: --not-before
    summary: |-
      Not-before timestamp in UTC.
  - name: --profile
    summary: |-
      Use the named connection profile.
  - name: --tags
    summary: |-
      Tags in NAME=VALUE form.
  - name: --value
    summary: |-
      Secret value. Prefer --file to avoid shell history.
  - name: --vault-name
    summary: |-
      Azure public-cloud vault name.
  - name: --vault-url
    summary: |-
      Root HTTPS vault URL. Use instead of vault name.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_keyvault_secret_set-attributes
  name: az keyvault secret set-attributes
  summary: |-
    Update secret attributes without changing its value.
  description: |-
    Update the latest or specified version's enabled state, expiration, not-before time, content type or tags. Supply at least one update. Omitted properties remain unchanged; explicit `--enabled false` is preserved. Requires secrets/set permission. Tags supplied here replace the existing tag collection. Output contains metadata only. Use `set` to create a new secret value/version.
  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/keyvault/index.md
  syntax: >-
    az keyvault secret set-attributes --name
                                      [--content-type]
                                      [--enabled]
                                      [--expires]
                                      [--not-before]
                                      [--profile]
                                      [--tags]
                                      [--vault-name]
                                      [--vault-url]
                                      [--version]
  examples:
  - summary: |-
      Disable a secret
    syntax: az keyvault secret set-attributes --vault-name myvault --name app-password --enabled false
  - summary: |-
      Update expiry
    syntax: az keyvault secret set-attributes --vault-name myvault --name app-password --expires 2027-01-01T00:00:00Z
  requiredParameters:
  - isRequired: true
    name: --name
    summary: |-
      secret name.
  optionalParameters:
  - name: --content-type
    summary: |-
      Secret content type.
  - name: --enabled
    summary: |-
      Whether the secret is enabled: true or false.
  - name: --expires
    summary: |-
      Expiration timestamp in UTC.
  - name: --not-before
    summary: |-
      Not-before timestamp in UTC.
  - name: --profile
    summary: |-
      Use the named connection profile.
  - name: --tags
    summary: |-
      Tags in NAME=VALUE form.
  - name: --vault-name
    summary: |-
      Azure public-cloud vault name.
  - name: --vault-url
    summary: |-
      Root HTTPS vault URL. Use instead of vault name.
  - name: --version
    summary: |-
      secret version. Omit for latest.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_keyvault_secret_show
  name: az keyvault secret show
  summary: |-
    Retrieve secret metadata or explicitly retrieve its value.
  description: |-
    Get the latest version, or select one with `--version`. Requires secrets/get permission. Output has no secret-value property unless `--as-plain-text` is supplied; that option returns the value directly. Plaintext output can be captured by the terminal or calling process, so use it only when needed.
  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/keyvault/index.md
  syntax: >-
    az keyvault secret show --name
                            [--as-plain-text]
                            [--profile]
                            [--vault-name]
                            [--vault-url]
                            [--version]
  examples:
  - summary: |-
      Get metadata
    syntax: az keyvault secret show --vault-name myvault --name app-password
  - summary: |-
      Retrieve a value explicitly
    syntax: az keyvault secret show --vault-name myvault --name app-password --as-plain-text
  requiredParameters:
  - isRequired: true
    name: --name
    summary: |-
      secret name.
  optionalParameters:
  - name: --as-plain-text
    summary: |-
      Explicitly return the plaintext secret value.
  - name: --profile
    summary: |-
      Use the named connection profile.
  - name: --vault-name
    summary: |-
      Azure public-cloud vault name.
  - name: --vault-url
    summary: |-
      Root HTTPS vault URL. Use instead of vault name.
  - name: --version
    summary: |-
      secret version. Omit for latest.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
