  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_deployment_mg_create
  name: az deployment mg create
  summary: |-
    Create a management-group deployment.
  description: |-
    Create a management group scoped deployment. The deployment is validated first using `Incremental` mode, then submitted using the selected deployment mode. Supply one template source: `--template-file` (a local ARM JSON or Bicep template), `--template-uri` (a remote ARM JSON template URL), or `--template-spec-id` (the resource id of a Template Spec version). A `.bicepparam` file supplied with `--parameters-file` can provide its own template reference instead. Bicep templates and `.bicepparam` files require the Bicep CLI for local compilation. `--management-group-id` (required) is the management group to deploy to, `--location` (required) is where the deployment metadata is stored, and `--name` (required) is the deployment name. Parameters can be supplied with `--parameters-file`, `--parameters-uri`, or repeatable inline `--parameter` values (KEY=VALUE, a JSON object, or a JSON parameters file path, optionally prefixed with `@`). Inline values override matching keys from a local parameters file. `--parameters-uri` cannot be combined with `--parameters-file` or `--parameter`. `--query-string` requires `--template-uri` and applies only to that template link; include any required SAS token directly in `--parameters-uri`. `--mode` selects the actual deployment mode, `Incremental` (default) or `Complete`; ARM determines whether the mode is supported at this scope. Validation before deployment always uses `Incremental` and does not validate `Complete` mode. `--validation-level` accepts `Template`, `Provider`, or `ProviderNoRbac`; when omitted, ARM applies its default. The command waits for the deployment to finish and returns the final deployment result.
  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/deployment/index.md
  syntax: >-
    az deployment mg create --location
                            --management-group-id
                            --name
                            [--mode {Incremental, Complete}]
                            [--parameter]
                            [--parameters-file]
                            [--parameters-uri]
                            [--profile]
                            [--query-string]
                            [--template-file]
                            [--template-spec-id]
                            [--template-uri]
                            [--validation-level {Template, Provider, ProviderNoRbac}]
  examples:
  - summary: |-
      Deploy a local Bicep template with inline parameters
    syntax: az deployment mg create --management-group-id myManagementGroup --location eastus --name myDeployment --template-file ./main.bicep --parameter environment=prod
  - summary: |-
      Deploy a remote ARM template with a remote parameters file
    syntax: az deployment mg create --management-group-id myManagementGroup --location eastus --name myDeployment --template-uri https://example.com/azuredeploy.json --parameters-uri https://example.com/azuredeploy.parameters.json
  requiredParameters:
  - isRequired: true
    name: --location
    summary: |-
      The location to store the deployment data.
  - isRequired: true
    name: --management-group-id
    summary: |-
      The management group id.
  - isRequired: true
    name: --name
    summary: |-
      The name of the deployment.
  optionalParameters:
  - name: --mode
    acceptedValues: Incremental, Complete
    summary: |-
      The mode sent to ARM for the actual deployment: Incremental (default) or Complete. Validation before deployment always uses Incremental.
  - name: --parameter
    summary: |-
      Deployment parameter(s) (repeatable): KEY=VALUE, a raw JSON object, or a path to a JSON parameters file (optionally prefixed with '@'). Values are parsed as JSON when possible (count=3 a number, flag=true a bool), else treated as strings; quote to force a string (e.g. zip="01234"). Overlay same-named keys from a parameters file. Cannot be combined with parameters-uri.
  - name: --parameters-file
    summary: |-
      The path to a local ARM JSON or .bicepparam parameters file. A .bicepparam file can supply its own template and requires the Bicep CLI. Cannot be combined with --parameters-uri.
  - name: --parameters-uri
    summary: |-
      The URI of a remote ARM JSON parameters file, including any required SAS token. Cannot be combined with --parameters-file or --parameter.
  - name: --profile
    summary: |-
      Use the named profile for this command (overrides the active profile).
  - name: --query-string
    summary: |-
      A query string or SAS token for --template-uri only. Requires --template-uri; does not modify --parameters-uri. A leading '?' or '&' is removed.
  - name: --template-file
    summary: |-
      The path to a local ARM JSON or Bicep template. Bicep files require the Bicep CLI for local compilation.
  - name: --template-spec-id
    summary: |-
      The resource id of a Template Spec version. Use instead of another template source.
  - name: --template-uri
    summary: |-
      The URI of a remote ARM JSON template. Supply one template source unless --parameters-file is a .bicepparam file that supplies its own template.
  - name: --validation-level
    acceptedValues: Template, Provider, ProviderNoRbac
    summary: |-
      The validation level sent to ARM. When omitted, ARM applies its default.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
