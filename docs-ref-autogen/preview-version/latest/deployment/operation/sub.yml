### YamlMime:AzureCLIGroup
uid: az_deployment_operation_sub
name: az deployment operation sub
summary: |-
  Manage deployment operations at subscription scope.
status: Preview
isPreview: true
sourceType: Core
directCommands:
- uid: az_deployment_operation_sub_list
  name: az deployment operation sub list
  summary: |-
    List deployment operations at subscription scope.
  description: |-
    List every operation of a subscription-scoped Azure Resource Manager deployment, mirroring `az deployment operation sub list`. `--name` (required, alias `-n`) is the deployment name and `--subscription-id` (optional) selects the subscription, defaulting to the active profile's subscription. Each operation reports its provisioning operation and state, timestamp, duration, status code and message, target resource, and the captured HTTP request and response. All result pages are retrieved and returned as a single array.
  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/agent-command-restructure/src/CLI/Help/Docs/deployment/index.md
  syntax: >-
    az deployment operation sub list --name
                                     [--profile]
                                     [--subscription-id]
  examples:
  - summary: |-
      List the operations of a subscription-scoped deployment
    syntax: az deployment operation sub list --name myDeployment
  - summary: |-
      List operations in an explicit subscription
    syntax: az deployment operation sub list -n myDeployment --subscription-id 00000000-0000-0000-0000-000000000000
  requiredParameters:
  - isRequired: true
    name: --name -n
    summary: |-
      The deployment name.
  optionalParameters:
  - name: --profile
    summary: |-
      Use the named profile for this command (overrides the active profile).
  - name: --subscription-id
    summary: |-
      Azure Subscription Id. Defaults to the active profile's subscription.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_deployment_operation_sub_show
  name: az deployment operation sub show
  summary: |-
    Show a deployment operation at subscription scope.
  description: |-
    Get one or more operations of a subscription-scoped Azure Resource Manager deployment, mirroring `az deployment operation sub show`. `--name` (required, alias `-n`) is the deployment name and `--operation-ids` (required) is a space-separated list of operation ids to retrieve. Each id is fetched individually and the results are returned as a single array. Operation ids come from `az deployment operation sub list`. `--subscription-id` (optional) selects the subscription, defaulting to the active profile's subscription.
  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/agent-command-restructure/src/CLI/Help/Docs/deployment/index.md
  syntax: >-
    az deployment operation sub show --name
                                     --operation-ids
                                     [--profile]
                                     [--subscription-id]
  examples:
  - summary: |-
      Show a single operation of a subscription-scoped deployment
    syntax: az deployment operation sub show --name myDeployment --operation-ids 0123456789012345678
  - summary: |-
      Show several operations at once
    syntax: az deployment operation sub show -n myDeployment --operation-ids 0123456789012345678 9876543210987654321
  requiredParameters:
  - isRequired: true
    name: --name -n
    summary: |-
      The deployment name.
  - isRequired: true
    name: --operation-ids
    summary: |-
      A space-separated list of operation ids to show.
  optionalParameters:
  - name: --profile
    summary: |-
      Use the named profile for this command (overrides the active profile).
  - name: --subscription-id
    summary: |-
      Azure Subscription Id. Defaults to the active profile's subscription.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
commands:
- az_deployment_operation_sub_list
- az_deployment_operation_sub_show
metadata:
  ms.date: 10/21/2026
  description: Manage deployment operations at subscription scope.
