### YamlMime:AzureCLIGroup
uid: az_deployment_operation_tenant
name: az deployment operation tenant
summary: |-
  Manage deployment operations at tenant scope.
status: Preview
isPreview: true
sourceType: Core
directCommands:
- uid: az_deployment_operation_tenant_list
  name: az deployment operation tenant list
  summary: |-
    List deployment operations at tenant scope.
  description: |-
    List every operation of a tenant-scoped Azure Resource Manager deployment, mirroring `az deployment operation tenant list`. `--name` (required, alias `-n`) is the deployment name. Each operation reports its provisioning operation and state, timestamp, duration, status code and message, target resource, and the captured HTTP request and response. All result pages are retrieved and returned as a single array.
  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/deployment/index.md
  syntax: >-
    az deployment operation tenant list --name
                                        [--profile]
  examples:
  - summary: |-
      List the operations of a tenant-scoped deployment
    syntax: az deployment operation tenant list --name myDeployment
  - summary: |-
      List operations using the short flag
    syntax: az deployment operation tenant list -n myDeployment
  requiredParameters:
  - isRequired: true
    name: --name
    summary: |-
      The deployment name.
  optionalParameters:
  - name: --profile
    summary: |-
      Use the named profile for this command (overrides the active profile).
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_deployment_operation_tenant_show
  name: az deployment operation tenant show
  summary: |-
    Show a deployment operation at tenant scope.
  description: |-
    Get one or more operations of a tenant-scoped Azure Resource Manager deployment, mirroring `az deployment operation tenant show`. `--name` (required, alias `-n`) is the deployment name and `--operation-ids` (required) is a space-separated list of operation ids to retrieve. Each id is fetched individually and the results are returned as a single array. Operation ids come from `az deployment operation tenant list`.
  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/deployment/index.md
  syntax: >-
    az deployment operation tenant show --name
                                        --operation-ids
                                        [--profile]
  examples:
  - summary: |-
      Show a single operation of a tenant-scoped deployment
    syntax: az deployment operation tenant show --name myDeployment --operation-ids 0123456789012345678
  - summary: |-
      Show several operations at once
    syntax: az deployment operation tenant show -n myDeployment --operation-ids 0123456789012345678 9876543210987654321
  requiredParameters:
  - isRequired: true
    name: --name
    summary: |-
      The deployment name.
  - isRequired: true
    name: --operation-ids
    summary: |-
      A space-separated list of operation ids to show.
  optionalParameters:
  - name: --profile
    summary: |-
      Use the named profile for this command (overrides the active profile).
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
commands:
- az_deployment_operation_tenant_list
- az_deployment_operation_tenant_show
metadata:
  ms.date: 10/21/2026
  description: Manage deployment operations at tenant scope.
