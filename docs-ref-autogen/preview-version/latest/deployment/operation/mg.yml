### YamlMime:AzureCLIGroup
uid: az_deployment_operation_mg
name: az deployment operation mg
summary: |-
  Manage deployment operations at management group scope.
status: Preview
isPreview: true
sourceType: Core
directCommands:
- uid: az_deployment_operation_mg_list
  name: az deployment operation mg list
  summary: |-
    List deployment operations at management group scope.
  description: |-
    List every operation of a management-group-scoped Azure Resource Manager deployment, mirroring `az deployment operation mg list`. `--management-group-id` (required, alias `-m`) is the management group that contains the deployment and `--name` (required, alias `-n`) is the deployment name. Each operation reports its provisioning operation and state, timestamp, duration, status code and message, target resource, and the captured HTTP request and response. All result pages are retrieved and returned as a single array.
  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/deployment/index.md
  syntax: >-
    az deployment operation mg list --management-group-id
                                    --name
                                    [--profile]
  examples:
  - summary: |-
      List the operations of a management-group-scoped deployment
    syntax: az deployment operation mg list --management-group-id myManagementGroup --name myDeployment
  - summary: |-
      List operations using short flags
    syntax: az deployment operation mg list -m myManagementGroup -n myDeployment
  requiredParameters:
  - isRequired: true
    name: --management-group-id
    summary: |-
      The management group id.
  - isRequired: true
    name: --name
    summary: |-
      The deployment name.
  optionalParameters:
  - name: --profile
    summary: |-
      Use the named profile for this command (overrides the active profile).
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_deployment_operation_mg_show
  name: az deployment operation mg show
  summary: |-
    Show a deployment operation at management group scope.
  description: |-
    Get one or more operations of a management-group-scoped Azure Resource Manager deployment, mirroring `az deployment operation mg show`. `--management-group-id` (required, alias `-m`) is the management group that contains the deployment, `--name` (required, alias `-n`) is the deployment name, and `--operation-ids` (required) is a space-separated list of operation ids to retrieve. Each id is fetched individually and the results are returned as a single array. Operation ids come from `az deployment operation mg list`.
  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/deployment/index.md
  syntax: >-
    az deployment operation mg show --management-group-id
                                    --name
                                    --operation-ids
                                    [--profile]
  examples:
  - summary: |-
      Show a single operation of a management-group-scoped deployment
    syntax: az deployment operation mg show --management-group-id myManagementGroup --name myDeployment --operation-ids 0123456789012345678
  - summary: |-
      Show several operations at once
    syntax: az deployment operation mg show -m myManagementGroup -n myDeployment --operation-ids 0123456789012345678 9876543210987654321
  requiredParameters:
  - isRequired: true
    name: --management-group-id
    summary: |-
      The management group id.
  - isRequired: true
    name: --name
    summary: |-
      The deployment name.
  - isRequired: true
    name: --operation-ids
    summary: |-
      A space-separated list of operation ids to show.
  optionalParameters:
  - name: --profile
    summary: |-
      Use the named profile for this command (overrides the active profile).
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
commands:
- az_deployment_operation_mg_list
- az_deployment_operation_mg_show
metadata:
  ms.date: 10/21/2026
  description: Manage deployment operations at management group scope.
