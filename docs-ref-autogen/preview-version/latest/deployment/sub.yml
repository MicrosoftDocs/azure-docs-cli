### YamlMime:AzureCLIGroup
uid: az_deployment_sub
name: az deployment sub
summary: |-
  Manage Azure Resource Manager deployments scoped to a subscription.
status: Preview
isPreview: true
sourceType: Core
directCommands:
- uid: az_deployment_sub_cancel
  name: az deployment sub cancel
  summary: |-
    Cancel a running subscription deployment.
  description: |-
    Cancel a currently running Azure Resource Manager deployment scoped to a subscription. A deployment can only be cancelled while its provisioning state is `Accepted` or `Running`; once cancelled the state becomes `Canceled` and any resources the deployment already created remain and must be cleaned up separately. Cancelling a deployment that has already reached a terminal state fails with `DeploymentCannotBeCancelled`. The command prints nothing on success; the subscription defaults to the active profile's subscription unless `--subscription-id` is given.
  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/deployment/index.md
  syntax: >-
    az deployment sub cancel --name
                             [--profile]
                             [--subscription-id]
  examples:
  - summary: |-
      Cancel a running deployment
    syntax: az deployment sub cancel --name myDeployment
  - summary: |-
      Cancel a running deployment in a specific subscription
    syntax: az deployment sub cancel --name myDeployment --subscription-id 00000000-0000-0000-0000-000000000000
  requiredParameters:
  - isRequired: true
    name: --name
    summary: |-
      The name of the deployment to cancel.
  optionalParameters:
  - name: --profile
    summary: |-
      Use the named profile for this command (overrides the active profile).
  - name: --subscription-id
    summary: |-
      Azure Subscription Id. Defaults to the active profile's subscription.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_deployment_sub_create
  name: az deployment sub create
  summary: |-
    Create a subscription scoped deployment from an ARM or Bicep template.
  description: |-
    Create (start) a subscription scoped deployment, mirroring `az deployment sub create`. The template is supplied with exactly one of `--template-file` (a local ARM or Bicep template deployed inline), `--template-uri` (a remote ARM template URL), or `--template-spec-id` (the resource id of a Template Spec version). A `.bicepparam` file given to `--parameters-file` can supply the template on its own. Bicep files are compiled with the Bicep CLI, which must be installed. `--name` (optional) is the deployment name, derived from the template file or URI name when omitted, or generated if no valid name can be derived; `--location` (required) is the region where the deployment metadata is stored; `--mode` (optional) is the deployment mode, `Incremental` (default) or `Complete`; `--subscription-id` (optional) selects the subscription. Template parameters can be supplied with `--parameters-file` (a local JSON or `.bicepparam` parameters file), `--parameters-uri` (a remote parameters file URL), and/or one or more repeatable inline `--parameter KEY=VALUE` pairs; inline parameter values are parsed as JSON when possible (for example `count=3` becomes a number and `flag=true` becomes a bool) and otherwise treated as strings, quote a value to force a string (for example `zip="01234"`). Inline parameters overlay same-named keys from a parameters file and cannot be combined with `--parameters-uri`. `--query-string` is a SAS token or other query string sent on the template link; it requires `--template-uri`, a leading `?` or `&` is removed, and it is not added to `--parameters-uri`. `--validation-level` sets the validation level, one of `Template`, `Provider`, or `ProviderNoRbac`. The command waits for the deployment long-running operation to finish and returns the final deployment result.
  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/deployment/index.md
  syntax: >-
    az deployment sub create --location
                             [--mode {Incremental, Complete}]
                             [--name]
                             [--parameter]
                             [--parameters-file]
                             [--parameters-uri]
                             [--profile]
                             [--query-string]
                             [--subscription-id]
                             [--template-file]
                             [--template-spec-id]
                             [--template-uri]
                             [--validation-level {Template, Provider, ProviderNoRbac}]
  examples:
  - summary: |-
      Deploy a local Bicep template that creates a resource group
    syntax: az deployment sub create --location eastus --name myDeployment --mode Incremental --template-file ./main.bicep --parameter resourceGroupName=myResourceGroup
  - summary: |-
      Deploy a local ARM template with a local parameters file
    syntax: az deployment sub create --location eastus --name myDeployment --mode Incremental --template-file ./azuredeploy.json --parameters-file ./azuredeploy.parameters.json
  - summary: |-
      Deploy a remote ARM template with a remote parameters file
    syntax: az deployment sub create --location eastus --name myDeployment --mode Incremental --template-uri https://example.com/azuredeploy.json --parameters-uri https://example.com/azuredeploy.parameters.json --subscription-id 00000000-0000-0000-0000-000000000000
  - summary: |-
      Deploy a Template Spec at the Template validation level
    syntax: az deployment sub create --location eastus --name myDeployment --mode Incremental --template-spec-id /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/myResourceGroup/providers/Microsoft.Resources/templateSpecs/myTemplateSpec/versions/1.0 --validation-level Template
  requiredParameters:
  - isRequired: true
    name: --location -l
    summary: |-
      The location to store the deployment metadata.
  optionalParameters:
  - name: --mode
    acceptedValues: Incremental, Complete
    summary: |-
      The mode that is used to deploy resources.
  - name: --name
    summary: |-
      The name of the deployment.
  - name: --parameter -p
    summary: |-
      Deployment parameter(s) (repeatable): KEY=VALUE, a raw JSON object, or a path to a JSON parameters file (optionally prefixed with '@'). Values are parsed as JSON when possible (count=3 a number, flag=true a bool), else treated as strings; quote to force a string (e.g. zip="01234"). Overlay same-named keys from a parameters file. Cannot be combined with parameters-uri.
  - name: --parameters-file
    summary: |-
      The path to a local ARM JSON or .bicepparam parameters file. A .bicepparam file can supply its own template and requires the Bicep CLI. Cannot be combined with --parameters-uri.
  - name: --parameters-uri
    summary: |-
      The URI of a parameters file.
  - name: --profile
    summary: |-
      Use the named profile for this command (overrides the active profile).
  - name: --query-string
    summary: |-
      The query string (such as a SAS token) to use with the template URI.
  - name: --subscription-id
    summary: |-
      Azure Subscription Id. Defaults to the active profile's subscription.
  - name: --template-file
    summary: |-
      The path to a local ARM JSON or Bicep template. Bicep files require the Bicep CLI for local compilation.
  - name: --template-spec-id
    summary: |-
      The resource id of a Template Spec to deploy.
  - name: --template-uri
    summary: |-
      The URI of the ARM template to deploy.
  - name: --validation-level
    acceptedValues: Template, Provider, ProviderNoRbac
    summary: |-
      The validation level of the deployment.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_deployment_sub_delete
  name: az deployment sub delete
  summary: |-
    Delete a subscription deployment from the deployment history.
  description: |-
    Delete an Azure Resource Manager deployment scoped to a subscription. This removes the deployment record and its associated deployment operations from the deployment history; it does **not** delete the resources the deployment created, such as resource groups. A deployment that is currently running cannot be deleted -- cancel it with `az deployment sub cancel` first, or wait for it to reach a terminal state. The delete is a long-running operation and the command waits for it to finish. Deleting a deployment name that does not exist succeeds silently, because ARM answers the same `204 No Content` in both cases. The command prints nothing on success; the subscription defaults to the active profile's subscription unless `--subscription-id` is given.
  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/deployment/index.md
  syntax: >-
    az deployment sub delete --name
                             [--profile]
                             [--subscription-id]
  examples:
  - summary: |-
      Delete a deployment from the history
    syntax: az deployment sub delete --name myDeployment
  - summary: |-
      Delete a deployment in a specific subscription
    syntax: az deployment sub delete --name myDeployment --subscription-id 00000000-0000-0000-0000-000000000000
  requiredParameters:
  - isRequired: true
    name: --name
    summary: |-
      The name of the deployment to delete.
  optionalParameters:
  - name: --profile
    summary: |-
      Use the named profile for this command (overrides the active profile).
  - name: --subscription-id
    summary: |-
      Azure Subscription Id. Defaults to the active profile's subscription.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_deployment_sub_export
  name: az deployment sub export
  summary: |-
    Export the template used for a subscription deployment.
  description: |-
    Export the Azure Resource Manager template that a subscription scoped deployment was created from, and print it to stdout as JSON. The command is read-only: it never creates or modifies resources. Azure Resource Manager returns the template exactly as it was submitted, with parameters and variables left unresolved, so the output can be fed straight back into `az deployment sub create --template-file`. Exporting a deployment that does not exist fails with `DeploymentNotFound`. The subscription defaults to the active profile's subscription unless `--subscription-id` is given.
  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/deployment/index.md
  syntax: >-
    az deployment sub export --name
                             [--profile]
                             [--subscription-id]
  examples:
  - summary: |-
      Export a deployment's template
    syntax: az deployment sub export --name myDeployment
  - summary: |-
      Save the exported template to a file
    syntax: az deployment sub export --name myDeployment > myDeployment.json
  - summary: |-
      Export a deployment's template from a specific subscription
    syntax: az deployment sub export --name myDeployment --subscription-id 00000000-0000-0000-0000-000000000000
  requiredParameters:
  - isRequired: true
    name: --name
    summary: |-
      The name of the deployment whose template to export.
  optionalParameters:
  - name: --profile
    summary: |-
      Use the named profile for this command (overrides the active profile).
  - name: --subscription-id
    summary: |-
      Azure Subscription Id. Defaults to the active profile's subscription.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_deployment_sub_list
