- uid: az_deployment_sub_validate
  name: az deployment sub validate
  summary: |-
    Validate whether a subscription scoped deployment template would be accepted, without deploying it.
  description: |-
    Validate a subscription scoped deployment, mirroring `az deployment sub validate`. Validate is read-only: it asks Azure Resource Manager whether a template is syntactically correct and would be accepted, without creating or modifying any resources. Unlike `az deployment sub what-if`, it reports whether the template is valid rather than predicting the individual resource changes. The template is supplied with exactly one of `--template-file` (a local ARM or Bicep template evaluated inline), `--template-uri` (a remote ARM template URL), or `--template-spec-id` (the resource id of a Template Spec version). A `.bicepparam` file given to `--parameters-file` can supply the template on its own. Bicep files are compiled with the Bicep CLI, which must be installed. `--name` (optional) is the deployment name, derived from the template file or URI name when omitted, or generated if no valid name can be derived; `--location` (required) is the region where the deployment metadata is stored; `--mode` (optional) is the deployment mode, `Incremental` (default) or `Complete`; `--subscription-id` (optional) selects the subscription. Template parameters can be supplied with `--parameters-file` (a local JSON or `.bicepparam` parameters file), `--parameters-uri` (a remote parameters file URL), and/or one or more repeatable inline `--parameter KEY=VALUE` pairs; inline parameter values are parsed as JSON when possible (for example `count=3` becomes a number and `flag=true` becomes a bool) and otherwise treated as strings, quote a value to force a string (for example `zip="01234"`). Inline parameters overlay same-named keys from a parameters file and cannot be combined with `--parameters-uri`. `--query-string` is a SAS token or other query string sent on the template link; it requires `--template-uri`, a leading `?` or `&` is removed, and it is not added to `--parameters-uri`. `--validation-level` sets the validation level, one of `Template`, `Provider`, or `ProviderNoRbac`. When the template is valid the command returns the validation result; when it is not, the command fails with the Azure Resource Manager error.
  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/deployment/index.md
  syntax: >-
    az deployment sub validate --location
                               [--mode {Incremental, Complete}]
                               [--name]
                               [--parameter]
                               [--parameters-file]
                               [--parameters-uri]
                               [--profile]
                               [--query-string]
                               [--subscription-id]
                               [--template-file]
                               [--template-spec-id]
                               [--template-uri]
                               [--validation-level {Template, Provider, ProviderNoRbac}]
  examples:
  - summary: |-
      Validate a local Bicep template with inline parameters
    syntax: az deployment sub validate --location eastus --name myDeployment --mode Incremental --template-file ./main.bicep --parameter resourceGroupName=myResourceGroup
  - summary: |-
      Validate a remote ARM template with a remote parameters file
    syntax: az deployment sub validate --location eastus --name myDeployment --mode Incremental --template-uri https://example.com/azuredeploy.json --parameters-uri https://example.com/azuredeploy.parameters.json --subscription-id 00000000-0000-0000-0000-000000000000
  - summary: |-
      Validate a Template Spec at the Template validation level
    syntax: az deployment sub validate --location eastus --name myDeployment --mode Incremental --template-spec-id /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/myResourceGroup/providers/Microsoft.Resources/templateSpecs/myTemplateSpec/versions/1.0 --validation-level Template
  requiredParameters:
  - isRequired: true
    name: --location -l
    summary: |-
      The location to store the deployment metadata.
  optionalParameters:
  - name: --mode
    acceptedValues: Incremental, Complete
    summary: |-
      The mode that is used to deploy resources.
  - name: --name
    summary: |-
      The name of the deployment.
  - name: --parameter -p
    summary: |-
      Deployment parameter(s) (repeatable): KEY=VALUE, a raw JSON object, or a path to a JSON parameters file (optionally prefixed with '@'). Values are parsed as JSON when possible (count=3 a number, flag=true a bool), else treated as strings; quote to force a string (e.g. zip="01234"). Overlay same-named keys from a parameters file. Cannot be combined with parameters-uri.
  - name: --parameters-file
    summary: |-
      The path to a local ARM JSON or .bicepparam parameters file. A .bicepparam file can supply its own template and requires the Bicep CLI. Cannot be combined with --parameters-uri.
  - name: --parameters-uri
    summary: |-
      The URI of a parameters file.
  - name: --profile
    summary: |-
      Use the named profile for this command (overrides the active profile).
  - name: --query-string
    summary: |-
      The query string (such as a SAS token) to use with the template URI.
  - name: --subscription-id
    summary: |-
      Azure Subscription Id. Defaults to the active profile's subscription.
  - name: --template-file
    summary: |-
      The path to a local ARM JSON or Bicep template. Bicep files require the Bicep CLI for local compilation.
  - name: --template-spec-id
    summary: |-
      The resource id of a Template Spec to validate.
  - name: --template-uri
    summary: |-
      The URI of the ARM template to validate.
  - name: --validation-level
    acceptedValues: Template, Provider, ProviderNoRbac
    summary: |-
      The validation level of the deployment.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
