### YamlMime:AzureCLIGroup
uid: az_deployment_tenant
name: az deployment tenant
summary: |-
  Manage ARM deployments at tenant scope.
status: Preview
isPreview: true
sourceType: Core
directCommands:
- uid: az_deployment_tenant_cancel
  name: az deployment tenant cancel
  summary: |-
    Cancel a running tenant deployment.
  description: |-
    Cancels a tenant deployment whose provisioning state is `Accepted` or `Running`. Resources the deployment already created are left in place. Azure Resource Manager rejects the request, and the command fails, when the deployment is no longer running.
  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/deployment/index.md
  syntax: >-
    az deployment tenant cancel --name
                                [--profile]
  examples:
  - summary: |-
      Cancel a running deployment
    syntax: az deployment tenant cancel --name myDeployment
  requiredParameters:
  - isRequired: true
    name: --name
    summary: |-
      The name of the deployment.
  optionalParameters:
  - name: --profile
    summary: |-
      Use the named profile for this command (overrides the active profile).
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_deployment_tenant_create
  name: az deployment tenant create
  summary: |-
    Create a tenant deployment.
  description: |-
    Create a tenant scoped deployment. The deployment is validated first, then submitted; both requests use `Incremental` mode, the only mode at tenant scope. Supply one template source: `--template-file` (a local ARM JSON or Bicep template), `--template-uri` (a remote ARM JSON template URL), or `--template-spec-id` (the resource id of a Template Spec version). A `.bicepparam` file supplied with `--parameters-file` can provide its own template reference instead. Bicep templates and `.bicepparam` files require the Bicep CLI for local compilation. `--location` (required) is where the deployment metadata is stored, and `--name` is the deployment name; when omitted, a generated GUID is used. Parameters can be supplied with `--parameters-file`, `--parameters-uri`, or repeatable inline `--parameter` values (KEY=VALUE, a JSON object, or a JSON parameters file path, optionally prefixed with `@`). Inline values override matching keys from a local parameters file. `--parameters-uri` cannot be combined with `--parameters-file` or `--parameter`. `--query-string` requires `--template-uri` and applies only to that template link. `--validation-level` accepts `Template`, `Provider`, or `ProviderNoRbac`; when omitted, ARM applies its default. A validation error stops the command before anything is deployed. By default the command waits for the deployment to finish and returns the final deployment result. With `--no-wait`, it returns the deployment's initial state as soon as the deployment is submitted; use `az deployment tenant show` or `az deployment tenant wait` to follow it.
  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/deployment/index.md
  syntax: >-
    az deployment tenant create --location
                                [--name]
                                [--no-wait]
                                [--parameter]
                                [--parameters-file]
                                [--parameters-uri]
                                [--profile]
                                [--query-string]
                                [--template-file]
                                [--template-spec-id]
                                [--template-uri]
                                [--validation-level {Template, Provider, ProviderNoRbac}]
  examples:
  - summary: |-
      Deploy a local Bicep template with inline parameters
    syntax: az deployment tenant create --location eastus --name myDeployment --template-file ./main.bicep --parameter environment=prod
  - summary: |-
      Deploy a remote ARM template with a remote parameters file
    syntax: az deployment tenant create --location eastus --name myDeployment --template-uri https://example.com/azuredeploy.json --parameters-uri https://example.com/azuredeploy.parameters.json
  - summary: |-
      Submit a deployment without waiting for it to finish
    syntax: az deployment tenant create --location eastus --name myDeployment --template-file ./main.bicep --no-wait
  requiredParameters:
  - isRequired: true
    name: --location
    summary: |-
      The location to store the deployment data.
  optionalParameters:
  - name: --name
    summary: |-
      The name of the deployment. Defaults to a generated GUID when omitted.
  - name: --no-wait
    summary: |-
      Return once the deployment is submitted and output its initial state, instead of waiting for it to finish. Validation still runs first.
  - name: --parameter
    summary: |-
      Deployment parameter(s) (repeatable): KEY=VALUE, a raw JSON object, or a path to a JSON parameters file (optionally prefixed with '@'). Values are parsed as JSON when possible (count=3 a number, flag=true a bool), else treated as strings; quote to force a string (e.g. zip="01234"). Overlay same-named keys from a parameters file. Cannot be combined with parameters-uri.
  - name: --parameters-file
    summary: |-
      The path to a local ARM JSON or .bicepparam parameters file. A .bicepparam file can supply its own template and requires the Bicep CLI. Cannot be combined with --parameters-uri.
  - name: --parameters-uri
    summary: |-
      The URI of a remote ARM JSON parameters file, including any required SAS token. Cannot be combined with --parameters-file or --parameter.
  - name: --profile
    summary: |-
      Use the named profile for this command (overrides the active profile).
  - name: --query-string
    summary: |-
      A query string or SAS token for --template-uri only. Requires --template-uri; does not modify --parameters-uri. A leading '?' or '&' is removed.
  - name: --template-file
    summary: |-
      The path to a local ARM JSON or Bicep template. Bicep files require the Bicep CLI for local compilation.
  - name: --template-spec-id
    summary: |-
      The resource id of a Template Spec version. Use instead of another template source.
  - name: --template-uri
    summary: |-
      The URI of a remote ARM JSON template. Supply one template source unless --parameters-file is a .bicepparam file that supplies its own template.
  - name: --validation-level
    acceptedValues: Template, Provider, ProviderNoRbac
    summary: |-
      The validation level sent to ARM. When omitted, ARM applies its default.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_deployment_tenant_delete
