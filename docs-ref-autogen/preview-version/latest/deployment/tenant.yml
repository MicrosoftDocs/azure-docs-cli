  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/deployment/index.md
  syntax: >-
    az deployment tenant validate --location
                                  [--name]
                                  [--parameter]
                                  [--parameters-file]
                                  [--parameters-uri]
                                  [--profile]
                                  [--query-string]
                                  [--template-file]
                                  [--template-spec-id]
                                  [--template-uri]
                                  [--validation-level {Template, Provider, ProviderNoRbac}]
  examples:
  - summary: |-
      Validate a local Bicep template
    syntax: az deployment tenant validate --location eastus --name myDeployment --template-file ./main.bicep --parameter environment=prod
