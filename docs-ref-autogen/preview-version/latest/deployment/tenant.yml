- uid: az_deployment_tenant_wait
  name: az deployment tenant wait
  summary: |-
    Wait until a tenant deployment reaches a condition.
  description: |-
    Gets the tenant deployment every `--interval` seconds (default 30) until the requested condition holds, then returns without output. Supply at least one condition. `--created` and `--updated` wait for the provisioning state `Succeeded`; a missing deployment keeps `--created` waiting but fails `--updated`. `--deleted` waits until the deployment no longer exists. `--exists` waits until the deployment can be read, whatever its provisioning state. `--custom` waits until a JMESPath expression evaluated against the deployment's ARM JSON is true, for example `properties.provisioningState=='Canceled'`. Except with `--exists`, the command fails as soon as the deployment's provisioning state is `Failed`. If the condition does not hold within `--timeout` seconds (default 3600), the command fails.
  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/deployment/index.md
  syntax: >-
    az deployment tenant wait --name
                              [--created]
                              [--custom]
                              [--deleted]
                              [--exists]
                              [--interval]
                              [--profile]
                              [--timeout]
                              [--updated]
  examples:
  - summary: |-
      Wait for a deployment to succeed
    syntax: az deployment tenant wait --name myDeployment --created
  - summary: |-
      Wait for a canceled deployment, polling every 10 seconds
    syntax: az deployment tenant wait --name myDeployment --custom "properties.provisioningState=='Canceled'" --interval 10
  - summary: |-
      Wait for a deployment to be deleted
    syntax: az deployment tenant wait --name myDeployment --deleted --timeout 600
  requiredParameters:
  - isRequired: true
    name: --name
    summary: |-
      The name of the deployment.
  optionalParameters:
  - name: --created
    summary: |-
      Wait until the deployment's provisioningState is Succeeded. A missing deployment keeps waiting.
  - name: --custom
    summary: |-
      Wait until this JMESPath condition is true for the deployment's ARM JSON, for example "properties.provisioningState=='Canceled'".
  - name: --deleted
    summary: |-
      Wait until the deployment is deleted.
  - name: --exists
    summary: |-
      Wait until the deployment exists, whatever its provisioningState.
  - name: --interval
    summary: |-
      Polling interval in seconds. Default: 30.
  - name: --profile
    summary: |-
      Use the named profile for this command (overrides the active profile).
  - name: --timeout
    summary: |-
      Maximum wait in seconds. Default: 3600.
  - name: --updated
    summary: |-
      Wait until the deployment's provisioningState is Succeeded. A missing deployment is an error.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
- uid: az_deployment_tenant_what-if
  name: az deployment tenant what-if
  summary: |-
    Preview changes from a tenant deployment.
  description: |-
    Run a tenant scoped what-if operation. What-if is read-only: it predicts the set of changes (Create, Modify, Delete, Deploy, NoChange, Ignore) a template would make without creating or modifying any resources. Takes the same template, parameter, `--location`, and `--validation-level` inputs as `az deployment tenant create`, and always uses `Incremental` mode. `--result-format` selects how much detail the predicted changes carry, `FullResourcePayloads` (default) or `ResourceIdOnly`. The command waits for the what-if operation to finish and returns the what-if result; if the operation fails, the command reports the error and exits non-zero.
  status: Preview
  isPreview: true
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/deployment/index.md
  syntax: >-
    az deployment tenant what-if --location
                                 [--name]
                                 [--parameter]
                                 [--parameters-file]
                                 [--parameters-uri]
                                 [--profile]
                                 [--query-string]
                                 [--result-format {FullResourcePayloads, ResourceIdOnly}]
                                 [--template-file]
                                 [--template-spec-id]
                                 [--template-uri]
                                 [--validation-level {Template, Provider, ProviderNoRbac}]
  examples:
  - summary: |-
      Preview a local Bicep template
    syntax: az deployment tenant what-if --location eastus --name myDeployment --template-file ./main.bicep --parameter environment=prod
  - summary: |-
      Preview resource IDs only
    syntax: az deployment tenant what-if --location eastus --name myDeployment --template-file ./main.bicep --result-format ResourceIdOnly
  requiredParameters:
  - isRequired: true
    name: --location
    summary: |-
      The location to store the deployment data.
  optionalParameters:
  - name: --name
    summary: |-
      The name of the deployment. Defaults to a generated GUID when omitted.
  - name: --parameter
    summary: |-
      Deployment parameter(s) (repeatable): KEY=VALUE, a raw JSON object, or a path to a JSON parameters file (optionally prefixed with '@'). Values are parsed as JSON when possible (count=3 a number, flag=true a bool), else treated as strings; quote to force a string (e.g. zip="01234"). Overlay same-named keys from a parameters file. Cannot be combined with parameters-uri.
  - name: --parameters-file
    summary: |-
      The path to a local ARM JSON or .bicepparam parameters file. A .bicepparam file can supply its own template and requires the Bicep CLI. Cannot be combined with --parameters-uri.
  - name: --parameters-uri
    summary: |-
      The URI of a remote ARM JSON parameters file, including any required SAS token. Cannot be combined with --parameters-file or --parameter.
  - name: --profile
    summary: |-
      Use the named profile for this command (overrides the active profile).
  - name: --query-string
    summary: |-
      A query string or SAS token for --template-uri only. Requires --template-uri; does not modify --parameters-uri. A leading '?' or '&' is removed.
  - name: --result-format
    acceptedValues: FullResourcePayloads, ResourceIdOnly
    summary: |-
      The format of the what-if results. FullResourcePayloads (default) or ResourceIdOnly.
  - name: --template-file
    summary: |-
      The path to a local ARM JSON or Bicep template. Bicep files require the Bicep CLI for local compilation.
  - name: --template-spec-id
    summary: |-
      The resource id of a Template Spec version. Use instead of another template source.
  - name: --template-uri
    summary: |-
      The URI of a remote ARM JSON template. Supply one template source unless --parameters-file is a .bicepparam file that supplies its own template.
  - name: --validation-level
    acceptedValues: Template, Provider, ProviderNoRbac
    summary: |-
      The validation level sent to ARM. When omitted, ARM applies its default.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h -help -? --?
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: json
    acceptedValues: json, jsonc, table, tsv, yaml, yamlc
    summary: |-
      Output format.
  - name: --query
    summary: |-
      JMESPath query string to filter/project the command result before rendering.
