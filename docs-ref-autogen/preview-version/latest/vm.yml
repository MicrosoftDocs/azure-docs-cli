### YamlMime:AzureCLIGroup
uid: az_vm
name: az vm
summary: |-
  Manage Azure virtual machines.
status: GA
sourceType: Core
directCommands:
- uid: az_vm_create
  name: az vm create
  summary: |-
    Create a virtual machine and its supporting network resources.
  description: |-
    Provision an Azure virtual machine in the specified resource group along with the supporting virtual network, subnet, network security group, and network interface in a single orchestrated call. The VM size, administrator credentials, and target location must all be provided. Resource names supplied for `--virtual-network-name`, `--network-security-group-name`, and `--network-interface-name` are created if they do not already exist in the resource group.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/vm/index.md
  syntax: >-
    az vm create --admin-password
                 --admin-username
                 --location
                 --name
                 --network-interface-name
                 --network-security-group-name
                 --resource-group
                 --virtual-network-name
                 --vm-size
                 [--address-prefixes]
                 [--profile]
                 [--rule-accesses]
                 [--rule-destination-address-prefixes]
                 [--rule-destination-port-ranges]
                 [--rule-directions]
                 [--rule-names]
                 [--rule-priorities]
                 [--rule-protocols]
                 [--rule-source-address-prefixes]
                 [--rule-source-port-ranges]
                 [--subnet-address-prefixes]
                 [--subnet-names]
                 [--subscription-id]
  examples:
  - summary: |-
      Create a Linux VM in East US
    syntax: az vm create --name myvm --resource-group myrg --location eastus --vm-size Standard_D2s_v5 --admin-username azureuser --admin-password 'P@ssw0rd123!' --network-interface-name myvm-nic --virtual-network-name myvm-vnet --network-security-group-name myvm-nsg --subscription-id 00000000-0000-0000-0000-000000000000
  - summary: |-
      Create using shell variables for credentials
    syntax: az vm create --name $vmName --resource-group $rg --location eastus --vm-size Standard_D2s_v5 --admin-username $adminUser --admin-password $adminPwd --network-interface-name $vmName-nic --virtual-network-name $vmName-vnet --network-security-group-name $vmName-nsg --subscription-id $subId
  requiredParameters:
  - isRequired: true
    name: --admin-password
    summary: |-
      The administrator password.
    groupName: Authentication Arguments
  - isRequired: true
    name: --admin-username
    summary: |-
      The administrator username.
    groupName: Authentication Arguments
  - isRequired: true
    name: --location
    summary: |-
      Location for all resources.
  - isRequired: true
    name: --name
    summary: |-
      The name of the virtual machine.
  - isRequired: true
    name: --network-interface-name
    summary: |-
      The network interface name to create.
    groupName: Network Arguments
  - isRequired: true
    name: --network-security-group-name
    summary: |-
      The network security group name to create.
    groupName: Network Arguments
  - isRequired: true
    name: --resource-group
    summary: |-
      The resource group name.
    valueFrom: az group list
  - isRequired: true
    name: --virtual-network-name
    summary: |-
      The virtual network name to create.
    groupName: Network Arguments
  - isRequired: true
    name: --vm-size
    summary: |-
      The size of the virtual machine.
  optionalParameters:
  - name: --address-prefixes
    summary: |-
      Address prefixes for the virtual network.
    groupName: Network Arguments
  - name: --profile
    summary: |-
      Use the named profile for this command (overrides the active profile).
  - name: --rule-accesses
    summary: |-
      Access types (Allow/Deny) of the security rules.
    groupName: Network Arguments
  - name: --rule-destination-address-prefixes
    summary: |-
      Destination address prefixes of the security rules.
    groupName: Network Arguments
  - name: --rule-destination-port-ranges
    summary: |-
      Destination port ranges of the security rules.
    groupName: Network Arguments
  - name: --rule-directions
    summary: |-
      Directions of the security rules.
    groupName: Network Arguments
  - name: --rule-names
    summary: |-
      Names of the security rules.
    groupName: Network Arguments
  - name: --rule-priorities
    summary: |-
      Priorities of the security rules.
    groupName: Network Arguments
  - name: --rule-protocols
    summary: |-
      Protocols of the security rules.
    groupName: Network Arguments
  - name: --rule-source-address-prefixes
    summary: |-
      Source address prefixes of the security rules.
    groupName: Network Arguments
  - name: --rule-source-port-ranges
    summary: |-
      Source port ranges of the security rules.
    groupName: Network Arguments
  - name: --subnet-address-prefixes
    summary: |-
      Address prefixes for each subnet.
    groupName: Network Arguments
  - name: --subnet-names
    summary: |-
      Names of the subnets.
    groupName: Network Arguments
  - name: --subscription-id
    summary: |-
      Azure Subscription Id. Defaults to the active profile's subscription.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: plain
    acceptedValues: json, plain
    summary: |-
      Output format.
- uid: az_vm_delete
  name: az vm delete
  summary: |-
    Delete a virtual machine.
  description: |-
    Remove the specified virtual machine from its resource group. The command deletes only the VM resource — attached disks, network interfaces, and the resource group itself are preserved and must be cleaned up separately if no longer required.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/vm/index.md
  syntax: >-
    az vm delete --name
                 --resource-group
                 [--profile]
                 [--subscription-id]
  examples:
  - summary: |-
      Delete a virtual machine
    syntax: az vm delete --name myvm --resource-group myrg --subscription-id 00000000-0000-0000-0000-000000000000
  - summary: |-
      Delete using shell variables
    syntax: az vm delete --name $vmName --resource-group $rg --subscription-id $subId
  requiredParameters:
  - isRequired: true
    name: --name
    summary: |-
      The name of the virtual machine.
  - isRequired: true
    name: --resource-group
    summary: |-
      The resource group name.
  optionalParameters:
  - name: --profile
    summary: |-
      Use the named profile for this command (overrides the active profile).
  - name: --subscription-id
    summary: |-
      Azure Subscription Id. Defaults to the active profile's subscription.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: plain
    acceptedValues: json, plain
    summary: |-
      Output format.
- uid: az_vm_list
  name: az vm list
  summary: |-
    List virtual machines in a resource group.
  description: |-
    Return a list of virtual machines that live in the specified resource group, including each machine's name, size, location, and provisioning state. Use this command for inventory, audits, or before bulk operations such as start, stop, or delete.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/vm/index.md
  syntax: >-
    az vm list --resource-group
               [--profile]
               [--subscription-id]
  examples:
  - summary: |-
      List VMs in a resource group
    syntax: az vm list --resource-group myrg --subscription-id 00000000-0000-0000-0000-000000000000
  - summary: |-
      List using shell variables
    syntax: az vm list --resource-group $rg --subscription-id $subId
  requiredParameters:
  - isRequired: true
    name: --resource-group
    summary: |-
      The resource group name.
  optionalParameters:
  - name: --profile
    summary: |-
      Use the named profile for this command (overrides the active profile).
  - name: --subscription-id
    summary: |-
      Azure Subscription Id. Defaults to the active profile's subscription.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: plain
    acceptedValues: json, plain
    summary: |-
      Output format.
- uid: az_vm_show
  name: az vm show
  summary: |-
    Show details for a virtual machine.
  description: |-
    Retrieve the full property bag for the specified virtual machine, including hardware profile, OS profile, network interfaces, and provisioning state. Use this command to confirm a VM was created correctly or to inspect its current configuration.
  status: GA
  sourceType: Core
  editLink: https://github.com/Azure/azclips/blob/main/src/CLI/Help/Docs/vm/index.md
  syntax: >-
    az vm show --name
               --resource-group
               [--profile]
               [--subscription-id]
  examples:
  - summary: |-
      Show a virtual machine by name
    syntax: az vm show --name myvm --resource-group myrg --subscription-id 00000000-0000-0000-0000-000000000000
  - summary: |-
      Show using shell variables
    syntax: az vm show --name $vmName --resource-group $rg --subscription-id $subId
  requiredParameters:
  - isRequired: true
    name: --name
    summary: |-
      The name of the virtual machine.
  - isRequired: true
    name: --resource-group
    summary: |-
      The resource group name.
  optionalParameters:
  - name: --profile
    summary: |-
      Use the named profile for this command (overrides the active profile).
  - name: --subscription-id
    summary: |-
      Azure Subscription Id. Defaults to the active profile's subscription.
  globalParameters:
  - name: --debug
    summary: |-
      Increase logging verbosity to show all debug logs.
  - name: --help -h
    summary: |-
      Show help for the command or group and exit.
  - name: --no-cache
    summary: |-
      Bypass the extension discovery cache and reload extensions from disk.
  - name: --output -o
    defaultValue: plain
    acceptedValues: json, plain
    summary: |-
      Output format.
